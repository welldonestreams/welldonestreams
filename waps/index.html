/* ---------------- RUNNER ---------------- */
function startDrill(ch,n=20,only=null){
  let pool = only==="sjt" ? SJT.slice() : (ch? allCards().filter(q=>String(q.ch)===String(ch)) : allCards().filter(q=>q.ch!=="sjt"));
  pool=prepareQuestions(shuffle(pool).slice(0,n));
  session={mode:"run",kind:"drill",list:pool,i:0,answers:[],start:Date.now(),ch};
  render();
}
function startMock(){
  let list=[];
  Object.keys(CH).forEach(c=>{ list=list.concat(shuffle(KNOWN.filter(q=>String(q.ch)===c)).slice(0,4)) });
  list=list.concat(shuffle(SJT).slice(0,20));
  list=prepareQuestions(shuffle(list));
  session={mode:"run",kind:"mock",list,i:0,answers:[],start:Date.now(),ends:Date.now()+120*60000};
  render();
  tick();
}
function startStudy(mode){
  const now=Date.now();
  if(mode==="flagged"){
    const full=BANK.concat(S.custom||[]);
    const fl=full.filter(q=>isFlagged(q.id));
    if(!fl.length){ toast("Nothing flagged — tap ☆ on a question to add it"); return; }
    session={mode:"run",kind:"drill",list:prepareQuestions(shuffle(fl)),i:0,answers:[],start:Date.now()};
    render(); return;
  }
  let pool=allCards().filter(q=>{const c=S.cards[q.id];return !c||c.due<=now});
  if(mode==="ahead") pool=shuffle(allCards()).slice(0,20);
  if(mode==="weakest"){
    const seen=allCards().filter(q=>{const c=S.cards[q.id];return c&&c.n>0});
    const unseen=allCards().filter(q=>{const c=S.cards[q.id];return !c||c.n===0});
    seen.sort((p,q)=>{const cp=S.cards[p.id],cq=S.cards[q.id];return (cp.r/(cp.r+cp.w))-(cq.r/(cq.r+cq.w));});
    pool=seen.concat(shuffle(unseen));
  }
  pool=prepareQuestions(pool.slice(0,20));
  session={mode:"run",kind:"srs",list:pool,i:0,answers:[],start:Date.now()};
  render();
}
function startRead(ch, only){
  let pool = only==="sjt" ? SJT.slice()
           : (ch? BANK.filter(q=>String(q.ch)===String(ch)) : BANK.concat(S.custom||[]));
  pool=prepareQuestions(pool);
  session={mode:"run",kind:"read",list:pool,i:0,answers:[],start:Date.now(),ch};
  render();
}
function tick(){
  if(!session||session.kind!=="mock"||session.mode!=="run")return;
  const el=$("#timer"); if(!el)return;
  const left=session.ends-Date.now();
  if(left<=0){ submitMock(); return }
  const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  el.textContent=`${m}:${String(s).padStart(2,"0")}`;
  el.classList.toggle("low",left<10*60000);
  clearTimeout(window._tk); window._tk=setTimeout(tick,500);
}
function renderRun(){
  const s=session, q=s.list[s.i]; if(!q) return "<p>Done</p>";
  const a=s.answers[s.i];
  const isMock=s.kind==="mock", isLearning=s.kind==="drill"||s.kind==="srs";
  const locked=a!==undefined&&isLearning;
  const pct=Math.round(s.i/s.list.length*100);
  if(s.kind==="read"){
    return `
  <div class="qhead">
    <div class="l"><span class="tag">${q.ch==="sjt"?"Scenario":("CH "+q.ch)}</span><span>${esc(chName(q.ch))}</span></div>
    <div class="l"><span>${s.i+1} / ${s.list.length}</span><button class="btn ghost" style="min-height:32px;padding:4px 10px;font-size:12px" data-run="flag">${isFlagged(q.id)?"★ Flagged":"☆ Flag"}</button><button class="btn ghost" style="min-height:32px;padding:4px 10px;font-size:12px" data-run="quit">Exit</button></div>
  </div>
  <div class="progressline"><i style="width:${pct}%"></i></div>
  <p class="qtext">${esc(q.q)}</p>
  <div class="opts">
    ${q.o.map((o,idx)=>`<div class="opt locked ${idx===q.a?"correct":""}"><span class="k">${"ABCD"[idx]}</span><span>${esc(o)}</span></div>`).join("")}
  </div>
  <div class="explain"><b>Why</b>${esc(q.why||"")}<div class="ref">${esc(q.ref||"")}</div></div>
  <div class="qfoot">
    <button class="btn" data-run="prev" ${s.i===0?"disabled":""}>Prev</button>
    <button class="btn primary" data-run="next">${s.i===s.list.length-1?"Done":"Next"}</button>
  </div>`;
  }
  return `
  <div class="qhead">
    <div class="l">
      ${isMock?`<span class="tag">Mock</span><span class="timer" id="timer">--:--</span>`
              :`<span class="tag">${q.ch==="sjt"?"Scenario":("CH "+q.ch)}</span>`}
      <span>${esc(isMock?(q.ch==="sjt"?"Scenario":chName(q.ch)):chName(q.ch))}</span>
    </div>
    <div class="l"><span>${s.i+1} / ${s.list.length}</span>
      <button class="btn ghost" style="min-height:32px;padding:4px 10px;font-size:12px" data-run="flag">${isFlagged(q.id)?"★ Flagged":"☆ Flag"}</button>
      <button class="btn ghost" style="min-height:32px;padding:4px 10px;font-size:12px" data-run="quit">Exit</button></div>
  </div>
  <div class="progressline"><i style="width:${pct}%"></i></div>
  <p class="qtext">${esc(q.q)}</p>
  <div class="opts">
    ${q.o.map((o,idx)=>{
      let cls="opt";
      if(isMock&&idx===a) cls+=" selected";
      if(locked){ cls+=" locked"; if(idx===q.a) cls+=" correct"; else if(idx===a) cls+=" wrong"; }
      return `<button class="${cls}" data-ans="${idx}" ${locked?"disabled":""}>
        <span class="k">${"ABCD"[idx]}</span><span>${esc(o)}</span></button>`;
    }).join("")}
  </div>
  ${locked ? `<div class="explain"><b>Why</b>${esc(q.why||"")}
      <div class="ref">${esc(q.ref||"")}</div></div>` : ""}
  <div class="qfoot">
    <span class="hint">${isMock?(a===undefined?"Choose an answer; you can change it before moving on.":"Answer saved. Tap another choice to change it."):(locked?`${a===q.a?"Correct":"Missed — answer was "+"ABCD"[q.a]}`:"")}</span>
    <button class="btn ${locked||isMock?"primary":""}" data-run="next" ${(!locked&&!isMock)?"disabled":""}>
      ${s.i===s.list.length-1?(isMock?"Submit exam":"Finish"):"Next"}</button>
  </div>`;
}
function answer(idx){
  const s=session; if(!s||s.mode!=="run")return;
  const q=s.list[s.i];
  if(s.kind==="drill"||s.kind==="srs"){
    if(s.answers[s.i]!==undefined)return;
    s.answers[s.i]=idx;
    const c=cardOf(q.id); c.n++; if(idx===q.a)c.r++;else c.w++;
    const rating = idx===q.a?3:1;
    c.e = Math.max(1.3,(c.e||2.5) + (0.1-(5-rating)*0.08));
    c.i = rating<3 ? 0 : ((c.i||0)===0?1:Math.round((c.i||1)*(c.e||2.5)));
    c.due = Date.now() + (rating<3? (6*3600e3) : (c.i*864e5));
    c.last=Date.now();
    markStudyDay(); save();
  } else {
    s.answers[s.i]=idx;
  }
  render();
  if(session.kind==="mock") tick();
}
function nextQ(){
  const s=session; if(!s)return;
  if(s.i<s.list.length-1){ s.i++; render(); if(s.kind==="mock")tick(); }
  else { if(s.kind==="read"){ session=null; setView("read"); } else finishRun(); }
}
function finishRun(){
  const s=session;
  if(s.kind==="srs"){
    const correct=s.answers.filter((a,i)=>a===s.list[i].a).length;
    S.hist.push({t:Date.now(),mode:"srs",correct,total:s.list.length,pts:0});
    save(); session={mode:"result",kind:"srs",correct,total:s.list.length,list:s.list,answers:s.answers,pts:0};
    render(); return;
  }
  const correct=s.answers.filter((a,i)=>a===s.list[i].a).length;
  const pts=s.kind==="mock"? correct*1.25 : correct;
  S.hist.push({t:Date.now(),mode:s.kind,correct,total:s.list.length,pts});
  markStudyDay(); save();
  session={mode:"result",kind:s.kind,correct,total:s.list.length,list:s.list,answers:s.answers,pts};
  render();
}
function submitMock(){
  const s=session;
  const blank=s.list.filter((q,i)=>s.answers[i]===undefined).length;
  if(blank && !confirm(`${blank} item${blank>1?"s":""} still unanswered and will be scored wrong. Submit anyway?`)) return;
  finishRun();
}
function renderResult(){
  const s=session;
  const wrong=s.list.map((q,i)=>[q,s.answers[i]]).filter(([q,a])=>a!==q.a);
  const pct=Math.round(s.correct/s.total*100);
  const col=pct>=80?"var(--good)":pct>=60?"var(--acc)":"var(--bad)";
  return `<h1>${s.kind==="mock"?"Mock score":s.kind==="srs"?"Study session":"Drill complete"}</h1>
  <p class="sub">${s.correct} of ${s.total} correct</p>
  <div class="hero">
    <div class="panel readiness">
      <div class="big num" style="color:${col}">${s.kind==="mock"?s.pts.toFixed(2):pct}<small>${s.kind==="mock"?" / 100 pts":"% correct"}</small></div>
      <div class="bar" style="margin-top:14px"><i style="width:${s.kind==="mock"?s.pts:pct}%;background:${col}"></i></div>
      ${s.kind==="mock"?`<p class="hint" style="margin:12px 0 0">A real PFE score is out of 100 and feeds your weighted WAPS promotion score. There is no pass/fail line.</p>`:""}
    </div>
    <div class="grid">
      <div class="panel"><div class="metric num">${wrong.length}</div><small class="hint">to review</small></div>
      <div class="panel"><div class="metric num">${readiness()}</div><small class="hint">overall readiness</small></div>
    </div>
  </div>
  <div class="row" style="margin-top:16px;gap:10px;flex-wrap:wrap">
    <button class="btn primary" data-nav="home">Done</button>
    ${wrong.length?`<button class="btn" data-run="againwrong">Drill the ${wrong.length} I missed</button>`:""}
    <button class="btn ghost" data-go="mock">New mock</button>
  </div>
  ${wrong.length?`<h2>Review</h2>${wrong.map(([q,a])=>`
    <div class="review">
      <div style="font-size:14px;margin-bottom:8px">${esc(q.q)}</div>
      <div class="rr ${a===q.a?"ok":"no"}">Your answer: ${a===undefined?"skipped":"ABCD"[a]}. ${esc(q.o[a]||"—")}</div>
      <div class="rr ok">Correct: ${"ABCD"[q.a]}. ${esc(q.o[q.a])}</div>
      ${q.why?`<div class="explain" style="margin-top:10px"><b>Why</b>${esc(q.why)}<div class="ref">${esc(q.ref||"")}</div></div>`:""}
    </div>`).join("")}`:""}`;
}

/* ---------------- bind ---------------- */
function bind(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
    const ch=b.dataset.ch;
    if(ch){startDrill(ch,20);return}
    setView(b.dataset.nav);
  });
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setView(b.dataset.go));
  document.querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>startDrill(b.dataset.drill,20));
  document.querySelectorAll("[data-mixed]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.mixed; startDrill(null,20,v==="sjt"?"sjt":null)});
  document.querySelectorAll("[data-study]").forEach(b=>b.onclick=()=>{
    const mode=b.dataset.study; if(mode==="due"&&studyKey()===0){toast("Nothing due — study ahead instead");return}
    startStudy(mode)});
  document.querySelectorAll("[data-mock]").forEach(b=>b.onclick=()=>startMock());
  document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>startRead(null,b.dataset.read==="sjt"?"sjt":null));
  document.querySelectorAll("[data-read-ch]").forEach(b=>b.onclick=()=>startRead(b.dataset.readCh));
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>answer(+b.dataset.ans));
  document.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.run;
    if(a==="next")nextQ();
    else if(a==="prev"){ if(session&&session.i>0){session.i--;render();} }
    else if(a==="flag"){ if(session&&session.list[session.i]) toggleFlag(session.list[session.i].id); }
    else if(a==="quit"){ session=null; render(); }
    else if(a==="againwrong"){
      const wrong=session.list.filter((q,i)=>session.answers[i]!==q.a);
      session={mode:"run",kind:"drill",list:shuffle(wrong),i:0,answers:[],start:Date.now()};
      render();
    }
  });
  document.querySelectorAll("[data-data]").forEach(b=>b.onclick=()=>dataAction(b.dataset.data));
  document.querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>profileAction(b.dataset.profile));
  const fi=$("#fileIn"); if(fi) fi.onchange=e=>{
    const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{try{const p=JSON.parse(rd.result); S=p; save(); render(); toast("Progress imported")}catch(err){toast("Bad file")}};
    rd.readAsText(f);
  };
}
function dataAction(a){
  if(a==="export"){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const el=document.createElement("a");
    el.href=url; el.download="pfe-progress-"+(profile.replace(/[^\w-]+/g,"_")||"default")+"-"+today()+".json"; el.click(); URL.revokeObjectURL(url);
    toast("Exported");
  }
  else if(a==="import"){ $("#fileIn").click() }
  else if(a==="reset"){
    if(confirm("Clear all answers, scheduling, and history?")){
      S={cards:{},hist:[],custom:S.custom,days:[],goal:20,flagged:S.flagged||[]}; save(); render(); toast("Progress reset")}
  }
  else if(a==="add"){
    try{
      const arr=JSON.parse($("#addJson").value);
      if(!Array.isArray(arr))throw 0;
      let n=0; arr.forEach((q,i)=>{
        if(!q.q||!Array.isArray(q.o)||q.o.length<2||typeof q.a!=="number")return;
        S.custom.push({id:"c"+(Date.now()+i),ch:q.ch??"sjt",q:q.q,o:q.o,a:q.a,why:q.why||"",ref:q.ref||"Custom"});
        n++;
      });
      save(); render(); toast(n+" added");
    }catch(e){toast("Invalid JSON")}
  }
  else if(a==="cloze"){
    const txt=$("#clozeIn").value.trim();
    if(!txt){toast("Paste some text first");return}
    const sents=txt.replace(/\s+/g," ").split(/(?<=[.:;])\s+(?=[A-Z(])/).filter(s=>s.length>=90&&s.length<=320);
    const made=[];
    sents.forEach(s=>{
      const nums=s.match(/\b\d{1,4}(?:\.\d+)?\s?(?:percent|%|days|years|months|hours|minutes|points|feet)?\b/g);
      let ans=null;
      if(nums&&nums.length) ans=nums[0];
      if(!ans) ans=null;
      if(!ans)return;
      made.push({ch:"sjt",q:s.replace(ans,"____"),o:[ans,"—","—","—"],a:0,
        why:"Recall of the exact figure from the source sentence.",ref:"Pasted source"});
    });
    $("#clozeOut").innerHTML = made.length
      ? `<p class="hint">${made.length} candidate cards. The distractors are placeholders — edit them into plausible wrong answers before adding, or they'll be too easy.</p>
         <textarea rows="7" id="clozeJson">${esc(JSON.stringify(made,null,1))}</textarea>`
      : `<p class="hint">No sentences with a clean numeric anchor found.</p>`;
  }
}

/* ---------------- keys ---------------- */
document.addEventListener("keydown",e=>{
  if(!session||session.mode!=="run")return;
  if(session.kind!=="read" && ["1","2","3","4"].includes(e.key)){ answer(+e.key-1) }
  if(session.kind==="read"){
    if(e.key==="ArrowRight") nextQ();
    else if(e.key==="ArrowLeft"){ if(session.i>0){session.i--;render();} }
  }
  if(e.key==="Enter"||e.key===" "){ e.preventDefault();
    if(session.kind==="read"||session.kind==="mock"||session.answers[session.i]!==undefined) nextQ() }
  if(e.key==="Escape"){ session=null; render() }
});

/* ---------------- boot ---------------- */
if(!listProfiles().length){writeProfiles(["default"]); if(profile!=="default"){profile="default"; localStorage.setItem("pfe_trainer_profile","default"); S=load("default");}}
if(!S.days) S.days=[];
const countEl=document.getElementById("bankCount");
if(countEl) countEl.textContent=`${KNOWN.length} knowledge · ${SJT.length} scenarios`;
renderProfile();
const plEl=document.getElementById("profileLabel"); if(plEl) plEl.addEventListener("click",()=>setView("data"));
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("/waps/sw.js").catch(()=>{}));
}
render();
</script>
</body>
</html>
