ts and colonels, which performance feedback is the only one required?","o":["The mid-term assessment","The end-of-reporting-period assessment","The initial performance feedback assessment","Both the initial and mid-term assessments"],"a":2,"why":"For CMSgts and colonels the initial PFA is the only feedback required."},{"id":"exp-8-008","ch":8,"ref":"AFH 1, 8.4","q":"For Airman Basic, Airman, and Airman First Class with less than 20 months TAFMS, after the initial feedback, a mid-term session is conducted every how many days?","o":["90 days","120 days","60 days","180 days"],"a":3,"why":"A mid-term session is conducted every 180 days until a report or change of reporting official."},{"id":"exp-8-009","ch":8,"ref":"AFH 1, 8.5","q":"Performance evaluations are what type of information and must be marked, protected, and accessed accordingly?","o":["Controlled Unclassified Information","Classified information","Privacy Act information","For Official Use Only information"],"a":0,"why":"Evaluations are CUI forms that must be marked, protected, and accessed accordingly."},{"id":"exp-8-010","ch":8,"ref":"AFH 1, 8.7","q":"Which form is the Department of the Air Force Letter of Evaluation?","o":["DAF Form 78","DAF Form 77","DAF Form 475","DAF Form 709"],"a":1,"why":"DAF Form 77 is the Letter of Evaluation (LOE)."},{"id":"exp-8-011","ch":8,"ref":"AFH 1, 8.7","q":"What determines the appropriate performance report form used for a ratee?","o":["The ratee's total active federal military service","The rater's grade","The ratee's grade or projected grade on the static close-out date","The type of unit to which the ratee is assigned"],"a":2,"why":"The ratee's grade or projected grade on the static close-out date determines the report form."},{"id":"exp-8-012","ch":8,"ref":"AFH 1, 8.8","q":"The record review of an Airman's history of sex-related offenses is conducted by whom, and may it be delegated?","o":["The unit commander; it may be delegated to the first sergeant","The military personnel flight; it may be delegated","The senior rater; it may be delegated to the rater","The immediate commander at the lowest unit level; it may not be delegated"],"a":3,"why":"The immediate commander at the lowest unit level conducts the review and it is not delegated."},{"id":"exp-8-013","ch":8,"ref":"AFH 1, 8.9","q":"How many performance statements must be included in each section of a completed evaluation?","o":["At least one","At least two","Exactly three","One per rating factor"],"a":0,"why":"Include at least one performance statement in each section of the evaluation."},{"id":"exp-8-014","ch":8,"ref":"AFH 1, 8.9","q":"An adverse action excludes which type of conviction?","o":["Any plea of guilty","Motor vehicle violations that do not require a court appearance","Any finding of guilt","A plea of no contest (nolo contendere)"],"a":1,"why":"Adverse actions exclude motor-vehicle convictions that do not require a court appearance."},{"id":"exp-8-015","ch":8,"ref":"AFH 1, 8.9","q":"If endorsed, a waiver of the mandatory requirement to document civilian convictions is forwarded to which authority?","o":["The group commander","The wing commander","The major command commander or authorized final approval authority","The Secretary of the Air Force"],"a":2,"why":"Endorsed waivers route to the MAJCOM commander or authorized final approval authority."},{"id":"exp-8-016","ch":8,"ref":"AFH 1, 8.10","q":"Second-term and career Airmen with less than 19 years of TAFMS receive selective reenlistment consideration within how many months of their original expiration of term of service?","o":["15 months","12 months","10 months","13 months"],"a":3,"why":"Second-term and career Airmen with less than 19 years TAFMS are considered within 13 months."},{"id":"exp-8-017","ch":8,"ref":"AFH 1, 8.11","q":"A non-selectee must submit an appeal to the military personnel flight within how many calendar days of rendering the appeal intent?","o":["10 calendar days","3 calendar days","15 calendar days","30 calendar days"],"a":0,"why":"The appeal must be submitted to the MPF within 10 calendar days of rendering appeal intent."},{"id":"exp-8-018","ch":8,"ref":"AFH 1, 8.11","q":"The appeal authority for second-term and career Airmen who will complete at least 16 but fewer than 20 years of TAFMS on their expiration of term of service is whom?","o":["The group commander","The Secretary of the Air Force","The wing commander","The major command commander"],"a":1,"why":"For 16 to fewer than 20 years TAFMS the appeal authority is the Secretary of the Air Force."},{"id":"exp-8-019","ch":8,"ref":"AFH 1, 8.13","q":"Approval of Career Job Reservations for constrained AFSCs is made at what level?","o":["Wing commander","Squadron commander","Group commander or equivalent","Major command commander"],"a":2,"why":"CJR approvals are made at the group commander level or equivalent."},{"id":"exp-8-020","ch":8,"ref":"AFH 1, 8.14","q":"Voluntary enlistment extensions for all Airmen are limited to a maximum of how many months per enlistment?","o":["24 months","36 months","60 months","48 months"],"a":3,"why":"Voluntary extensions are limited to a maximum of 48 months per enlistment."},{"id":"exp-8-021","ch":8,"ref":"AFH 1, 8.15","q":"Selective Retention Bonus Zone C applies to Airmen reenlisting between what years of service?","o":["10 and 14 years","6 and 10 years","17 months and 6 years","18 and 20 years"],"a":0,"why":"Zone C applies to Airmen reenlisting between 10 and 14 years."},{"id":"exp-8-022","ch":8,"ref":"AFH 1, 8.15","q":"What is the maximum Selective Retention Bonus per zone?","o":["$50,000","$100,000","$75,000","$90,000"],"a":1,"why":"The maximum SRB per zone is $100,000."},{"id":"exp-8-023","ch":8,"ref":"AFH 1, 8.19","q":"The Korean Defense Service Medal recognizes military service in the Republic of Korea and surrounding waters after which date?","o":["27 December 1991","24 March 1999","28 July 1954","11 September 2001"],"a":2,"why":"The Korean Defense Service Meda exp-9-004","ch":9,"ref":"AFH 1, 9.3","q":"An individual may not receive more than one promotion under any combination of promotion programs within what period?","o":["A 6-month period","An 18-month period","A 24-month period","A 12-month period"],"a":3,"why":"No more than one promotion is allowed within a 12-month period."},{"id":"exp-9-005","ch":9,"ref":"AFH 1, 9.3","q":"Under WAPS, NCOs and SNCOs compete and test in the control Air Force Specialty Code held on what date?","o":["The promotion eligibility cutoff date","The date of rank","The date of birth","The first day of the test cycle"],"a":0,"why":"Members compete in the CAFSC held on the promotion eligibility cutoff date."},{"id":"exp-9-006","ch":9,"ref":"AFH 1, 9.3","q":"What does the Specialty Knowledge Test (SKT) cover?","o":["A wide range of USAF knowledge","Air Force Specialty Code broad technical knowledge","Military and supervisory knowledge","Leadership and management principles"],"a":1,"why":"The SKT covers AFSC broad technical knowledge."},{"id":"exp-9-007","ch":9,"ref":"AFH 1, 9.3","q":"The in-system supplemental promotion process is typically processed on what basis?","o":["Weekly","Quarterly","Monthly","Annually"],"a":2,"why":"In-system supplemental action is typically processed on a monthly basis."},{"id":"exp-9-008","ch":9,"ref":"AFH 1, 9.3","q":"Senior Noncommissioned Officer promotions are accomplished via what method?","o":["Weighted testing only","Commander selection only","A combination of testing and commander ranking","A central board"],"a":3,"why":"SNCO promotions are accomplished via a central board."},{"id":"exp-9-009","ch":9,"ref":"AFH 1, 9.5","q":"Airmen initially enlisting for six years are promoted from Airman Basic to Airman First Class upon completion of technical training or how many weeks of technical training after basic military training, whichever occurs first?","o":["20 weeks","12 weeks","16 weeks","24 weeks"],"a":0,"why":"Six-year enlistees are promoted upon completing technical training or 20 weeks after BMT."},{"id":"exp-9-010","ch":9,"ref":"AFH 1, 9.5","q":"Promotion eligibility to Senior Airman requires 36 months of time in service and 20 months of time in grade, or how many months of time in grade, whichever occurs first?","o":["24 months","28 months","30 months","32 months"],"a":1,"why":"Senior Airman eligibility is 36 months TIS and 20 months TIG or 28 months TIG, whichever is first."},{"id":"exp-9-011","ch":9,"ref":"AFH 1, 9.5","q":"What is the promotion eligibility cutoff date for promotion to Staff Sergeant?","o":["31 January","30 September","31 March","31 July"],"a":2,"why":"The PECD for Staff Sergeant is 31 March."},{"id":"exp-9-012","ch":9,"ref":"AFH 1, 9.5","q":"What is the promotion eligibility cutoff date for promotion to Master Sergeant?","o":["31 January","30 September","31 March","30 November"],"a":3,"why":"The PECD for Master Sergeant is 30 November."},{"id":"exp-9-013","ch":9,"ref":"AFH 1, 9.5","q":"What is the promotion eligibility cutoff date for promotion to Senior Master Sergeant?","o":["30 September","31 March","31 January","30 November"],"a":0,"why":"The PECD for Senior Master Sergeant is 30 September."},{"id":"exp-9-014","ch":9,"ref":"AFH 1, 9.6","q":"Master Sergeant and Senior Master Sergeant selects with more than 18 years TAFMS sign a Promotion Statement of Understanding within how many duty days after selections are confirmed?","o":["30 duty days","10 duty days","5 duty days","15 duty days"],"a":1,"why":"Selects sign the Promotion Statement of Understanding within 10 duty days."},{"id":"exp-9-015","ch":9,"ref":"AFH 1, 9.6","q":"What active duty service commitment do Master Sergeant and Senior Master Sergeant selects incur from the effective date of promotion?","o":["A three-year active duty service commitment","A one-year active duty service commitment","A two-year active duty service commitment","A four-year active duty service commitment"],"a":2,"why":"MSgt and SMSgt selects incur a two-year ADSC from the effective date of promotion."},{"id":"exp-9-016","ch":9,"ref":"AFH 1, 9.6","q":"Failure to withdraw an existing retirement application within 10 duty days of presentation of the Promotion Statement of Understanding results in what?","o":["An automatic reenlistment","A reduction in grade","A delay in the promotion effective date","Removal from the selection list"],"a":3,"why":"Failure to withdraw a retirement application within 10 duty days results in removal from the selection list."},{"id":"exp-9-017","ch":9,"ref":"AFH 1, 9.7","q":"A supplemental selectee assigned a promotion sequence number of .9 indicates what?","o":["An increment previously announced","An unannounced future increment","A promotion held for one year","A below-the-zone promotion"],"a":0,"why":"A .9 sequence number indicates an increment previously announced; .5 indicates an unannounced future increment."},{"id":"exp-9-018","ch":9,"ref":"AFH 1, 9.8","q":"Which item must a declination letter for promotion include?","o":["Only the promotion cycle","Name, social security number, promotion cycle, and promotion sequence number if selected","Only a statement declining the promotion","The member's unit and duty title"],"a":1,"why":"The declination letter must include name, SSN, cycle, and sequence number (if selected)."},{"id":"exp-9-019","ch":9,"ref":"AFH 1, 9.9","q":"Which of the following is a reason an Airman may be considered ineligible for promotion?","o":["Completion of enlisted PME","A recommendation from the commander","Approved retirement","Meeting the required skill level"],"a":2,"why":"Approved retirement is among the listed reasons for promotion ineligibility."},{"id":"exp-9-020","ch":9,"ref":"AFH 1, 9.11","q":"A conviction for enlisted promotion test compromise can result in which penalties?","o":["A letter of counseling","Forfeiture of one month's pay","A 15-day suspension from duty","Dishonorable discharge, forfeiture of all pay and allowances, and confinement for up to two years"],"a":3,"why":"Conviction can result in dishonorable discharge, forfeiture of all pay and allowances, and up to two years confinement."},{"id":"exp-9-021","ch":9,"ref":"AFH 1, 9.13","q":"Senior Master Sergeants being considered for promotion to Chief Master Sergeant compete in what?","o":["The chief enlisted manager code of the control AFSC held as of the PECD","The superintendent level of their control AFSC","Their reporting identifier only","All AFSCs combined"],"a":0,"why":"SMSgts compete for CMSgt in the CEM code of the control AFSC held as of the PECD."},{"id":"exp-9-022","ch":9,"ref":"AFH 1, 9.15","q":"Which organization produces all USAF enlisted promotion tests?","o":["Air Force Personnel Center","Air Education and Training Command, Studies and Analysis Squadron, Airman Advancement Section","Air University","The Barnes Center for Enlisted Education"],"a":1,"why":"AETC Studies and Analysis Squadron, Airman Advancement Section, produces all enlisted promotion tests."},{"id":"exp-9-023","ch":9,"ref":"AFH 1, 9.16","q":"What are the study references for the Promotion Fitness Examination?","o":["Career Development Courses","Technical orders and manuals","Grade-specific Enlisted Promotion Study Guides derived from AFH 1","Specialty Knowledge Test reference lists"],"a":2,"why":"PFE study references are grade-specific Enlisted Promotion Study Guides derived from AFH 1."},{"id":"exp-9-024","ch":9,"ref":"AFH 1, 9.17","q":"What minimum score is required for an Airman testing on the PFE only?","o":["40","50","90","45"],"a":3,"why":"For PFE-only testing, a minimum score of 45 is required."},{"id":"exp-9-025","ch":9,"ref":"AFH 1, 9.19","q":"The president of a promotion evaluation board is always what rank?","o":["A General Officer","A Chief Master Sergeant","A Colonel","A Major General only"],"a":0,"why":"The board president is always a General Officer."},{"id":"exp-11-001","ch":11,"ref":"AFH 1, 11.2","q":"In what year did the USAF launch the Air Force Portal?","o":["2000","1995","2005","2010"],"a":0,"why":"The Air Force Portal was launched in 2000."},{"id":"exp-11-002","ch":11,"ref":"AFH 1, 11.2","q":"Through the Air Force Portal, users have access to which of the following?","o":["The Army Career Tracker","Assignment Management System","The Navy Standard Integrated Personnel System","The Marine Corps Manpower System"],"a":1,"why":"The portal provides access to the Assignment Management System among other applications."},{"id":"exp-11-003","ch":11,"ref":"AFH 1, 11.3","q":"Under the Transition Assistance Program, the Capstone component must be completed no later than how many days prior to separation, retirement, or release from active duty?","o":["365 days","180 days","90 days","30 days"],"a":2,"why":"Capstone must be completed no later than 90 days prior to separation."},{"id":"exp-11-004","ch":11,"ref":"AFH 1, 11.3","q":"The Air Force Volunteer Excellence Award is an award at what level?","o":["Major command commander","Wing commander","Squadron commander","Chief of Staff of the Air Force"],"a":3,"why":"The VEA is a Chief of Staff of the Air Force level award."},{"id":"exp-11-005","ch":11,"ref":"AFH 1, 11.3","q":"The Military Family Life Counselor Program provides what type of counseling?","o":["Non-medical, short-term, solution-focused counseling","Long-term clinical therapy","Medical treatment","Crisis-only intervention"],"a":0,"why":"MFLCs provide confidential, non-medical, short-term, solution-focused counseling."},{"id":"exp-11-006","ch":11,"ref":"AFH 1, 11.3","q":"Air Force Families Forever provides long-term case management and support for whom?","o":["Active duty families during deployment","Surviving family members of deceased Airmen and Guardians","Retirees and their spouses","Newly assigned families"],"a":1,"why":"Air Force Families Forever supports surviving family members of deceased Airmen and Guardians."},{"id":"exp-11-007","ch":11,"ref":"AFH 1, 11.3","q":"Which publication provides more information about the Voting Assistance Program?","o":["DAFI 36-3003","DAFMAN 36-2806","DAFI 36-3107","AFI 1-1"],"a":2,"why":"Voting Assistance Program guidance is in DAFI 36-3107."},{"id":"exp-11-008","ch":11,"ref":"AFH 1, 11.3","q":"Casualty Assistance Representatives assist in meeting timelines such as delivering notifications within how many hours of a casualty?","o":["24 hours","48 hours","72 hours","12 hours"],"a":3,"why":"CARs help deliver notifications within 12 hours of a casualty."},{"id":"exp-11-009","ch":11,"ref":"AFH 1, 11.3","q":"Through the Record of Emergency Data, Airmen determine beneficiaries of Death Gratuity and Arrears of Pay, and designate whom?","o":["The Person Authorized to Direct Disposition","The primary next of kin","The legal next of kin","The unit commander"],"a":0,"why":"The RED designates beneficiaries of Death Gratuity, Arrears of Pay, and the PADD."},{"id":"exp-11-010","ch":11,"ref":"AFH 1, 11.3","q":"When directed by the installation commander, emergency assistance is provided through which center?","o":["The Military and Family Readiness Center","The Emergency Family Assistance Center","The Airman and Family Readiness Center","The Family Support Center"],"a":1,"why":"Emergency assistance is provided through the Emergency Family Assistance Center."},{"id":"exp-11-011","ch":11,"ref":"AFH 1, 11.5","q":"Failure to produce a family care plan within 60 days of discussion with the commander may result in what?","o":["Automatic promotion","A transfer of duty station","Disciplinary action or administrative separation","A reduction in force"],"a":2,"why":"Failure to produce a family care plan within 60 days may result in disciplinary action or administrative separation."},{"id":"exp-11-012","ch":11,"ref":"AFH 1, 11.5","q":"Duty deferments to assist members in developing family care plans are offered primarily for what period?","o":["A one-month period","A six-month period","A one-year period","A four-month period"],"a":3,"why":"Duty deferments are primarily for a four-month period."},{"id":"exp-11-013","ch":11,"ref":"AFH 1, 11.6","q":"VA disability compensation is paid on a scale graduated from 10 percent to 100 percent in increments of what?","o":["10 percent","5 percent","15 percent","20 percent"],"a":0,"why":"The benefit is graduated from 10 to 100 percent in 10-percent increments."},{"id":"exp-11-014","ch":11,"ref":"AFH 1, 11.6","q":"The Yellow Ribbon GI Education Enhancement Program is a provision of which law?","o":["The Montgomery GI Bill Act","Public Law 110-252, Post-9/11 Veterans Educational Assistance Act of 2008","The Servicemen's Readjustment Act of 1944","The Reserve Educational Assistance Act"],"a":1,"why":"Yellow Ribbon is a provision of the Post-9/11 Veterans Educational Assistance Act of 2008."},{"id":"exp-11-015","ch":11,"ref":"AFH 1, 11.6","q":"Dependency and Indemnity Compensation is what type of benefit?","o":["A taxable monetary benefit","A one-time lump sum","A tax-free monetary benefit","A loan program"],"a":2,"why":"DIC is a tax-free monetary benefit to eligible survivors."},{"id":"exp-11-016","ch":11,"ref":"AFH 1, 11.7","q":"What are the primary TRICARE health care options offered to eligible beneficiaries?","o":["TRICARE For Life and TRICARE Reserve Select","TRICARE Young Adult and TRICARE Retired Reserve","TRICARE Dental and TRICARE Pharmacy","TRICARE Prime and TRICARE Select"],"a":3,"why":"The primary options are TRICARE Prime and TRICARE Select."},{"id":"exp-11-017","ch":11,"ref":"AFH 1, 11.7","q":"How many dental plans does TRICARE offer?","o":["Three","Two","Four","Five"],"a":0,"why":"TRICARE offers three dental plans, each with its own contractor."},{"id":"exp-11-018","ch":11,"ref":"AFH 1, 11.8","q":"Officers are eligible to retire with 20 years of TAFMS and how many years of total active federal commissioned service?","o":["5 years","10 years","15 years","20 years"],"a":1,"why":"Officers must have 20 years TAFMS and 10 years of commissioned service to retire."},{"id":"exp-11-019","ch":11,"ref":"AFH 1, 11.8","q":"A retirement application can typically be submitted through myFSS up to 12 months, but no less than how many months, before the desired retirement date?","o":["6 months","2 months","4 months","8 months"],"a":2,"why":"Applications may be submitted up to 12 months but no less than 4 months before the retirement date."},{"id":"exp-11-020","ch":11,"ref":"AFH 1, 11.8","q":"Under the Blended Retirement System, DoD begins matching contributions up to an additional four percent of base pay after how long?","o":["60 days of service","1 year of service","5 years of service","2 years of service"],"a":3,"why":"Matching contributions up to 4 percent begin after 2 years of service."},{"id":"exp-11-021","ch":11,"ref":"AFH 1, 11.9","q":"A Survivor Benefit Plan base amount can be the full monthly retired pay or a portion of retired pay down to what amount?","o":["$300","$500","$1,000","$100"],"a":0,"why":"The base amount can be full retired pay or a portion down to $300."},{"id":"exp-11-022","ch":11,"ref":"AFH 1, 11.9","q":"A Survivor Benefit Plan participant has a one-year window to terminate coverage between which anniversaries following the date of beginning receipt of retired pay?","o":["The first and second anniversary","The second and third anniversary","The third and fourth anniversary","The fifth and sixth anniversary"],"a":1,"why":"Termination is allowed between the second and third anniversary after retired pay begins."},{"id":"exp-11-023","ch":11,"ref":"AFH 1, 11.10","q":"The American Red Cross provides financial assistance under partnership agreements with which Air Force aid society?","o":["Air Force Enlisted Village","Air Force Association","Air Force Aid Society","Air Force Sergeants Association"],"a":2,"why":"The Red Cross partners with the Air Force Aid Society among other relief societies."},{"id":"exp-11-024","ch":11,"ref":"AFH 1, 11.11","q":"Under the We Are All Recruiters program, applicants are defined as individuals within what age range?","o":["18 to 24","17 to 27","21 to 35","17 to 39"],"a":3,"why":"Applicants are defined as individuals within the age range of 17 to 39."},{"id":"exp-11-025","ch":11,"ref":"AFH 1, 11.11","q":"Which form is used to request participation in a We Are All Recruiters event?","o":["AFRS Form 10","DAF Form 988","AF Form 357","DAF Form 77"],"a":0,"why":"The WEAR form is AFRS Form 10."},{"id":"exp-12-001","ch":12,"ref":"AFH 1, 12.1","q":"AFH 1 compares 'fiscal fitness' to physical fitness as equally important to overall well-being. Which two key aspects of individual financial responsibility does it identify?","o":["establishing a personal budget and effectively managing one's debt","maximizing credit card rewards and filing taxes early","investing in real estate and building an emergency fund","reducing TSP contributions and increasing allowances"],"a":0,"why":"AFH 1 lists a personal budget and effective debt management as the two key aspects of individual financial responsibility."},{"id":"exp-12-002","ch":12,"ref":"AFH 1, 12.1","q":"AFH 1 defines official government travel as travel under official orders while performing duties pertaining to official government assignments, such as which of the following?","o":["convalescent leave and environmental morale leave","temporary duty (TDY) and permanent change of station (PCS)","retirement and separation travel","permissive TDY and house-hunting trips"],"a":1,"why":"AFH 1 lists temporary duty (TDY) and permanent change of station (PCS) as examples of official government travel."},{"id":"exp-12-003","ch":12,"ref":"AFH 1, 12.2","q":"Under federal law, the 1 January annual military pay raise automatically matches private-sector wage increases as measured by which economic indicator from the previous year?","o":["Consumer Price Index","Gross Domestic Product","Employment Cost Index","Producer Price Index"],"a":2,"why":"AFH 1 states the annual pay raise matches private-sector wage increases measured by the Employment Cost Index for the previous year."},{"id":"exp-12-004","ch":12,"ref":"AFH 1, 12.2","q":"Which of the following may result in a negative military pay date adjustment?","o":["frequent PCS moves and temporary duty assignments","completion of professional military education","early promotion to the next grade","absence without leave, desertion, and sickness or injury due to personal misconduct"],"a":3,"why":"AFH 1 notes periods of AWOL, desertion, and sickness or injury due to personal misconduct may produce negative pay date adjustments."},{"id":"exp-12-005","ch":12,"ref":"AFH 1, 12.3","q":"The Leave and Earnings Statement is formally titled which form?","o":["DFAS Form 702","DD Form 200","AF Form 1768","DD Form 1351-2"],"a":0,"why":"The LES is DFAS Form 702, the Defense Finance and Accounting Service Military Leave and Earnings Statement."},{"id":"exp-12-006","ch":12,"ref":"AFH 1, 12.3","q":"Although they fluctuate from month to month, pay processing cutoff dates generally occur around which days for the mid-month and end-of-month paydays?","o":["the 1st and the 15th","the 6th and the 20th","the 5th and the 25th","the 10th and the 28th"],"a":1,"why":"AFH 1 states cutoff dates generally occur around the 6th (mid-month) and the 20th (end-of-month)."},{"id":"exp-12-007","ch":12,"ref":"AFH 1, 12.4","q":"Junior grade enlisted members assigned to single-type government quarters who are required to eat in government dining facilities are charged what amount for their meals?","o":["the full commercial meal price, billed monthly","no charge while they receive BAS","the discounted meal rate, deducted from their pay","the discounted meal rate, paid in cash weekly"],"a":2,"why":"Such members receive BAS but are charged the discounted meal rate, which is deducted from their pay."},{"id":"exp-12-008","ch":12,"ref":"AFH 1, 12.4","q":"Members residing in privatized quarters on a USAF installation are entitled to which housing allowance?","o":["overseas housing allowance","family separation housing","no housing allowance","basic allowance for housing"],"a":3,"why":"AFH 1 states members in privatized quarters are entitled to basic allowance for housing."},{"id":"exp-12-009","ch":12,"ref":"AFH 1, 12.4","q":"What is the purpose of family separation housing?","o":["to pay a member for added housing expenses resulting from enforced separation from dependents","to reimburse moving costs when dependents relocate","to offset higher overseas utility costs","to fund temporary lodging during a PCS"],"a":0,"why":"Family separation housing pays a member for added housing expenses from enforced separation from dependents."},{"id":"exp-12-010","ch":12,"ref":"AFH 1, 12.5","q":"Clothing replacement allowance-basic is paid annually during which period of RegAF status?","o":["during the first 6 months only","between the 6th and 36th month","after 36 months","between the 12th and 24th month"],"a":1,"why":"Clothing replacement allowance-basic is paid annually between the 6th and 36th month of RegAF status."},{"id":"exp-12-011","ch":12,"ref":"AFH 1, 12.6","q":"Family separation allowance-restricted applies under which condition?","o":["the member is on temporary duty for fewer than 30 days","dependents relocate to the permanent duty station","transportation of dependents is not authorized at government expense and dependents do not live near the permanent duty station","the member is assigned to government quarters"],"a":2,"why":"FSA-restricted applies when dependent transportation is not authorized and dependents do not live in the vicinity of the duty station."},{"id":"exp-12-012","ch":12,"ref":"AFH 1, 12.7","q":"Which allowances may be authorized by the Department of Defense at certain overseas locations?","o":["basic allowance for subsistence and CONUS cost-of-living allowance","dislocation allowance and family separation allowance","clothing replacement allowance and CONUS cost-of-living allowance","temporary lodging allowance and cost-of-living allowance"],"a":3,"why":"AFH 1 lists temporary lodging allowance and cost-of-living allowance as allowances authorized at certain overseas locations."},{"id":"exp-12-013","ch":12,"ref":"AFH 1, 12.9","q":"Service members do not pay federal or state taxes on which two allowances?","o":["basic allowance for housing and basic allowance for subsistence","dislocation allowance and family separation allowance","per diem and temporary lodging expense","special duty assignment pay and imminent danger pay"],"a":0,"why":"BAH and BAS are tax-free, significantly increasing members' purchasing power."},{"id":"exp-12-014","ch":12,"ref":"AFH 1, 12.11","q":"Which of the following is an example of special and incentive pay listed in AFH 1?","o":["basic allowance for subsistence","hazardous duty incentive pay","family separation allowance","overseas housing allowance"],"a":1,"why":"Hazardous duty incentive pay is one of the special and incentive pays AFH 1 lists."},{"id":"exp-12-015","ch":12,"ref":"AFH 1, 12.12","q":"Federal Insurance Contributions Act taxes withheld from military basic pay fund which two programs?","o":["Social Security and unemployment insurance","Medicare and Medicaid","Social Security and Medicare","Social Security and the Armed Forces Retirement Home"],"a":2,"why":"FICA withholds Social Security and Medicare taxes from covered members' basic pay."},{"id":"exp-12-016","ch":12,"ref":"AFH 1, 12.12","q":"The monthly Armed Forces Retirement Home deduction from the pay of regular enlisted members is set at what maximum amount?","o":["$5","$10","$50","$1"],"a":3,"why":"AFRH deductions are up to a maximum of $1, set by the Secretary of Defense after consulting with the AFRH board."},{"id":"exp-12-017","ch":12,"ref":"AFH 1, 12.13","q":"To allow sufficient processing time, allotments should be requested how far before the desired month?","o":["30 days","5 business days","60 days","10 days"],"a":0,"why":"Allotments should be requested 30 days before the desired month."},{"id":"exp-12-018","ch":12,"ref":"AFH 1, 12.13","q":"Under family SGLI, each dependent child is covered at what amount at no cost to the member?","o":["$50,000","$10,000","$100,000","$500,000"],"a":1,"why":"Each child is covered in the amount of $10,000 at no cost to the member, and may not be insured for less."},{"id":"exp-12-019","ch":12,"ref":"AFH 1, 12.13","q":"As of January 2023, what is the maximum TSP contribution amount for deferred and Roth contributions?","o":["$20,500","$19,500","$22,500","$26,000"],"a":2,"why":"The maximum TSP contribution is $22,500 for deferred and Roth contributions as of January 2023."},{"id":"exp-12-020","ch":12,"ref":"AFH 1, 12.14","q":"After a financial complaint is forwarded to a member's immediate commander, commanders attempt to respond within how many days?","o":["30 days","5 days","45 days","15 days"],"a":3,"why":"Commanders will attempt to respond to financial complaints within 15 days."},{"id":"exp-12-021","ch":12,"ref":"AFH 1, 12.16","q":"A PCS advance payment is an advance of up to how much of a member's basic pay?","o":["three months","one month","six months","twelve months"],"a":0,"why":"A PCS advance is an advance of up to three months of basic pay, less mandatory deductions and debts."},{"id":"exp-12-022","ch":12,"ref":"AFH 1, 12.16","q":"When authorized, how many privately owned vehicles may a member ship at government expense on a PCS to, from, or between overseas locations?","o":["two","one","three","unlimited"],"a":1,"why":"Members may ship one privately owned vehicle at government expense when ordered overseas."},{"id":"exp-12-023","ch":12,"ref":"AFH 1, 12.18","q":"The per diem allowance helps defray the cost of which items?","o":["transportation and lodging only","meals and rental vehicles only","quarters, meals, and certain incidentals","quarters and passports"],"a":2,"why":"Per diem defrays the cost of quarters, meals, and certain incidentals."},{"id":"exp-12-024","ch":12,"ref":"AFH 1, 12.19","q":"When a GTCC account reaches 61 days past due, what action does the travel card vendor take?","o":["suspends the account and requires the member to contact the APC","charges the first late fee","submits the account to DFAS for salary-offset processing","sends a due process letter and impending salary offset procedures to the cardholder"],"a":3,"why":"At 61 days past due the vendor sends a due process letter advising intent to submit the account for salary offset."},{"id":"exp-12-025","ch":12,"ref":"AFH 1, 12.19","q":"GTCC accounts how many days past due are considered in charged off status, regardless of whether salary-offset payments are still being made?","o":["181 days","96 days","61 days","120 days"],"a":0,"why":"Accounts 181 days past due are considered charged off regardless of ongoing salary-offset payments."},{"id":"exp-14-001","ch":14,"ref":"AFH 1, 14.1","q":"According to AFH 1, what reduces trust in a group faster than anything else?","o":["members saying one thing within the group and something else outside the group","leaders failing to delegate tasks","teams lacking formal meetings","members disagreeing openly in meetings"],"a":0,"why":"AFH 1 cites that saying one thing in the group and another outside it reduces trust fastest."},{"id":"exp-14-002","ch":14,"ref":"AFH 1, 14.1","q":"When a team member demonstrates 'all-starring' behavior, attempting to outshine others to gain attention or credibility, what may they be experiencing?","o":["a lack of training","a power struggle","an excess of enthusiasm","a mentorship opportunity"],"a":1,"why":"All-starring behavior may indicate a power struggle; leaders should reemphasize each member's roles."},{"id":"exp-14-003","ch":14,"ref":"AFH 1, 14.2","q":"What are the four stages of team building that teams most often experience, in order?","o":["forming, norming, storming, performing","storming, forming, norming, performing","forming, storming, norming, performing","performing, norming, storming, forming"],"a":2,"why":"The four stages are forming, storming, norming, and performing."},{"id":"exp-14-004","ch":14,"ref":"AFH 1, 14.2","q":"Which team-building stage is probably the most difficult, when members realize the task is harder than expected and argue about what actions to take?","o":["forming","norming","performing","storming"],"a":3,"why":"Storming is probably the most difficult stage as members resist the team and argue about actions."},{"id":"exp-14-005","ch":14,"ref":"AFH 1, 14.2","q":"In which team-building stage does the team become an effective, cohesive, and productive unit that can diagnose and solve problems?","o":["performing","forming","storming","norming"],"a":0,"why":"In the performing stage the team is an effective, cohesive, and productive unit."},{"id":"exp-14-006","ch":14,"ref":"AFH 1, 14.3","q":"Positive conflict results in which of the following?","o":["barriers to cooperation and degraded morale","addressing problems for a solution, greater understanding, and enhanced communication","increased absenteeism and turnover","avoidance of all disagreements"],"a":1,"why":"Positive conflict addresses problems for a solution, greater understanding, and enhanced communication."},{"id":"exp-14-007","ch":14,"ref":"AFH 1, 14.4","q":"When communication problems occur in the workplace, what does AFH 1 identify as the real crux of the problem?","o":["lack of technology","too few meetings","miscommunication","poor handwriting"],"a":2,"why":"The real crux of communication problems is more likely miscommunication."},{"id":"exp-14-008","ch":14,"ref":"AFH 1, 14.4","q":"Conflict arising from individual differences such as goals, objectives, perceptions, values, and personalities falls under which source of conflict?","o":["structural factors","communication factors","organizational factors","personal behavior factors"],"a":3,"why":"Personal behavior factors stem from individual differences like goals, objectives, perceptions, values, and personalities."},{"id":"exp-14-009","ch":14,"ref":"AFH 1, 14.5","q":"Which conflict-management style attempts to overwhelm an opponent with formal authority, threats, or the use of power?","o":["competing (forcing)","collaborating","accommodating","avoiding"],"a":0,"why":"Competing (forcing) uses formal authority, threats, or power to overwhelm an opponent."},{"id":"exp-14-010","ch":14,"ref":"AFH 1, 14.5","q":"Which conflict-management style is low in assertiveness and high in cooperativeness, often consisting of giving in to another person's wishes?","o":["competing","accommodating","compromising","avoiding"],"a":1,"why":"Accommodating is low assertiveness/high cooperativeness and often means giving in to another's wishes."},{"id":"exp-14-011","ch":14,"ref":"AFH 1, 14.6","q":"AFH 1 defines a military leader as which of the following?","o":["a person who administers budgets and schedules","a person who enforces regulations through punishment","a person who directs a military force or unit, or one who has commanding authority or influence","a person elected by subordinates to represent them"],"a":2,"why":"A military leader directs a military force or unit, or has commanding authority or influence."},{"id":"exp-14-012","ch":14,"ref":"AFH 1, 14.7","q":"Warren Bennis labeled which three primary behavioral characteristics of leaders?","o":["administrate, maintain, and control","plan, organize, and direct","command, discipline, and reward","motivate, develop, and inspire"],"a":3,"why":"Bennis labeled the three primary leader characteristics as motivate, develop, and inspire."},{"id":"exp-14-013","ch":14,"ref":"AFH 1, 14.7","q":"The motivation model developed by Warren Bennis echoes whose theory on the road to self-actualization?","o":["Abraham Maslow's Hierarchy of Needs","Kenneth Thomas's conflict styles","Ken Blanchard's Points of Power","John Maxwell's laws of leadership"],"a":0,"why":"Bennis's model echoes Abraham Maslow's Hierarchy of Needs toward self-actualization."},{"id":"exp-14-014","ch":14,"ref":"AFH 1, 14.8","q":"Which of the following is an organization that tailors membership based on rank, as noted in AFH 1?","o":["squadron booster club","Top III","event planning committee","professional development seminar"],"a":1,"why":"Top III, along with the Junior Enlisted Airmen Council, 5/6 Council, and Chiefs' Group, tailors membership by rank."},{"id":"exp-14-015","ch":14,"ref":"AFH 1, 14.11","q":"In the M-E-N-T-O-R-I-N-G model, which element requires mentors to help proteges establish Specific, Measurable, Achievable, Realistic, and Time-bound goals?","o":["Teach","Organize","Goal-Set","Inspire"],"a":2,"why":"Goal-Set requires helping proteges establish short- and long-term SMART goals."},{"id":"exp-14-016","ch":14,"ref":"AFH 1, 14.13","q":"Which type of counseling may follow crisis counseling and often involves agencies such as legal services, religious affairs, or an alcohol and drug counselor?","o":["directive counseling","professional growth counseling","performance counseling","referral counseling"],"a":3,"why":"Referral counseling often involves agencies like legal services or an alcohol and drug counselor."},{"id":"exp-14-017","ch":14,"ref":"AFH 1, 14.14","q":"The combined counseling approach blends directive and nondirective methods by emphasizing which responsibility of the Airman?","o":["planning and decision-making","following orders without question","self-discipline and punishment","reporting to the chain of command"],"a":0,"why":"The combined approach emphasizes the Airman's planning and decision-making responsibilities."},{"id":"exp-14-018","ch":14,"ref":"AFH 1, 14.15","q":"When possible, a counseling session should aim to last how long?","o":["no more than 15 minutes","less than one hour","two to three hours","a full duty day"],"a":1,"why":"Aim for the counseling session to last less than one hour and be prepared to schedule a second session."},{"id":"exp-14-019","ch":14,"ref":"AFH 1, 14.17","q":"How does AFH 1 define vision?","o":["a detailed annual budget and schedule","a list of rules and regulations","helping people believe they can accomplish goals in the anticipation of a better future","a chain of command directive"],"a":2,"why":"Vision is helping people believe they can accomplish goals in anticipation of a better future."},{"id":"exp-14-020","ch":14,"ref":"AFH 1, 14.18","q":"To be of realistic value, a vision must be which of the following?","o":["vague, flexible, and aspirational","urgent, immediate, and short-term","popular, simple, and emotional","logical, deductive, and plausible"],"a":3,"why":"A vision must be logical, deductive, and plausible to be of realistic value."},{"id":"exp-14-021","ch":14,"ref":"AFH 1, 14.19","q":"Which three qualities help leaders gain respect and credibility and positively influence others?","o":["self-awareness, cultural awareness, and empathy","charisma, competence, and courage","flexibility, transparency, and resilience","vision, values, and credibility"],"a":0,"why":"Self-awareness, cultural awareness, and empathy help leaders gain respect and credibility."},{"id":"exp-14-022","ch":14,"ref":"AFH 1, 14.23","q":"Knowledge power is about having expertise in an area and is often evidenced by which of the following?","o":["holding a position title printed on a business card","having certain degrees or certifications indicating special training","friendship and cultivated relationships","strength of character and passion"],"a":1,"why":"Knowledge power is often evidenced by degrees or certifications indicating special training."},{"id":"exp-14-023","ch":14,"ref":"AFH 1, 14.25","q":"How do laissez-faire leaders view the development and needs of their subordinates?","o":["as their top priority","as a shared responsibility","as someone else's concern","as a financial investment"],"a":2,"why":"Laissez-faire leaders view subordinate development and needs as someone else's concern."},{"id":"exp-14-024","ch":14,"ref":"AFH 1, 14.26","q":"The degree to which which three values are present in leaders directly relates to the organization's effectiveness?","o":["courage, competence, and charisma","flexibility, resilience, and transparency","compassion, credibility, and accountability","trust, loyalty, and integrity"],"a":3,"why":"The values of trust, loyalty, and integrity directly relate to organizational effectiveness."},{"id":"exp-14-025","ch":14,"ref":"AFH 1, 14.29","q":"According to AFH 1, stereotypes regarding age, experience, background, or perspective are detrimental to organizations because they do what?","o":["ignore individual strengths and contributions and exploit generalized characteristics","improve unit cohesion and morale","encourage diversity of thought","streamline decision-making"],"a":0,"why":"Stereotypes ignore individual strengths and contributions and exploit generalized characteristics."},{"id":"exp-15-001","ch":15,"ref":"AFH 1, 15.1","q":"How does AFH 1 define accountability?","o":["demonstrating reliability and honesty and taking responsibility for the behaviors of self and team","completing assigned tasks on time","following orders without question","managing resources efficiently"],"a":0,"why":"Accountability is demonstrating reliability and honesty and taking responsibility for self and team behaviors."},{"id":"exp-15-002","ch":15,"ref":"AFH 1, 15.1","q":"In surveys of USAF members, accountability has been consistently rated as what?","o":["the least important competency for promotion","the most important foundational competency for success in a USAF career","important only for senior leaders","a competency unrelated to career success"],"a":1,"why":"Accountability is consistently rated the most important foundational competency for USAF career success."},{"id":"exp-15-003","ch":15,"ref":"AFH 1, 15.1","q":"Taking personal responsibility, as described in AFH 1, requires which three elements?","o":["courage, discipline, and obedience","communication, teamwork, and leadership","understanding the significance of failing to act, self-efficacy, and autonomy","vision, values, and credibility"],"a":2,"why":"Personal responsibility requires understanding significance, self-efficacy (competence), and autonomy (personal control)."},{"id":"exp-15-004","ch":15,"ref":"AFH 1, 15.2","q":"A fixed mindset refers to which belief?","o":["that abilities can be fundamentally improved through effort","that past mistakes do not define who you are","that challenges are needed to develop and grow","that a person's intelligence and personal qualities are mostly permanent and cannot be changed much"],"a":3,"why":"Fixed mindset is the belief that intelligence and other personal qualities are mostly permanent."},{"id":"exp-15-005","ch":15,"ref":"AFH 1, 15.3","q":"AFH 1 compares self-control to a muscle, noting that it does what with heavy use?","o":["gets depleted","grows stronger immediately","stays constant","becomes automatic"],"a":0,"why":"Like a muscle, self-control is limited and gets depleted with heavy use."},{"id":"exp-15-006","ch":15,"ref":"AFH 1, 15.3","q":"Studies have found that deliberate daily practice to inhibit an urge for as little as how long can meaningfully improve impulse control?","o":["two days","two weeks","two months","two years"],"a":1,"why":"Even two weeks of deliberate daily practice can meaningfully improve impulse control."},{"id":"exp-15-007","ch":15,"ref":"AFH 1, 15.4","q":"Which of the following is an example of cognitive reappraisal given in AFH 1?","o":["blaming others for a negative event","denying that a stressful event occurred","viewing a heart attack as a 'wake up call' to change one's lifestyle","avoiding all future risks after a setback"],"a":2,"why":"Viewing a heart attack as a wake-up call to modify one's lifestyle exemplifies cognitive reappraisal."},{"id":"exp-15-008","ch":15,"ref":"AFH 1, 15.5","q":"Which of the following is listed by AFH 1 as a skill within effective communication as a foundational competency?","o":["memorizing regulations verbatim","calculating budgets accurately","operating office equipment","voicing differing opinions on contentious issues without triggering a defensive response"],"a":3,"why":"Effective communication includes voicing differing opinions without triggering a defensive response."},{"id":"exp-15-009","ch":15,"ref":"AFH 1, 15.6","q":"The Department of Defense broadly defines strategic communication as a process of purposefully using communication for what intent?","o":["advancing national interests and objectives through synchronized integration of information","marketing USAF recruiting campaigns","standardizing military terminology","training Airmen in public speaking"],"a":0,"why":"Strategic communication advances national interests and objectives through synchronized integration of information."},{"id":"exp-15-010","ch":15,"ref":"AFH 1, 15.7","q":"What does AFH 1 identify as the foundation of all public communications?","o":["speed","truth","format","volume"],"a":1,"why":"Truth is the foundation of all public communications, in terms of credibility and capability."},{"id":"exp-15-011","ch":15,"ref":"AFH 1, 15.8","q":"According to AFI 1-1, the purpose of Public Affairs operations is to communicate what kind of information about USAF activities?","o":["classified operational details","internal personnel records","timely, accurate, and useful information","budgetary projections"],"a":2,"why":"PA communicates timely, accurate, and useful information to DoD, the USAF, and audiences."},{"id":"exp-15-012","ch":15,"ref":"AFH 1, 15.10","q":"Which reference standardizes terminology used within the Department of Defense, other federal agencies, and among the United States and its allies?","o":["AF Form 1768, Staff Summary Sheet","DAFH 33-337, The Tongue and Quill","DAFI 36-2906, Personal Financial Responsibility","JP 1-02, DoD Dictionary of Military and Associated Terms"],"a":3,"why":"JP 1-02 standardizes DoD terminology used among the United States and its allies."},{"id":"exp-15-013","ch":15,"ref":"AFH 1, 15.11","q":"The International Civil Aviation Organization phonetic alphabet was adopted by the U.S. Armed Forces in which year?","o":["1956","1947","1969","1986"],"a":0,"why":"The phonetic alphabet was adopted by the U.S. Armed Forces in 1956."},{"id":"exp-15-014","ch":15,"ref":"AFH 1, 15.13","q":"According to AFH 1, what is the most important aspect of good communication?","o":["delivery","preparation","gestures","vocabulary"],"a":1,"why":"Preparation is the most important aspect, and sometimes the best-spent time, in good communication."},{"id":"exp-15-015","ch":15,"ref":"AFH 1, 15.14","q":"The FOCUS principle of 'focused' means addressing which of the following?","o":["only the most controversial parts","as many topics as possible","the issue, the whole issue, and nothing but the issue","the audience's unrelated concerns"],"a":2,"why":"Focused means address the issue, the whole issue, and nothing but the issue."},{"id":"exp-15-016","ch":15,"ref":"AFH 1, 15.15","q":"What is the first of the seven steps for effective communication?","o":["research your topic","support your ideas","organize and outline","analyze purpose and audience"],"a":3,"why":"Step 1 of the seven steps is to analyze purpose and audience."},{"id":"exp-15-017","ch":15,"ref":"AFH 1, 15.16","q":"All job interviews are designed with which one goal in mind?","o":["to find the right person for the right job","to fill vacancies as quickly as possible","to eliminate the most candidates","to test public speaking ability"],"a":0,"why":"All job interviews aim to find the right person for the right job."},{"id":"exp-15-018","ch":15,"ref":"AFH 1, 15.17","q":"Meetings can be used for which of the following purposes?","o":["disciplining subordinates","sharing information, solving problems, planning, brainstorming, or motivating","issuing punitive actions","conducting fitness assessments"],"a":1,"why":"Meetings can share information, solve problems, plan, brainstorm, or motivate."},{"id":"exp-15-019","ch":15,"ref":"AFH 1, 15.19","q":"Official memorandums are used to conduct official business outside the government with vendors or contractors when which format is not appropriate?","o":["the point paper","the staff study","the personal letter","the talking paper"],"a":2,"why":"Official memorandums are used with vendors/contractors when the personal letter is not appropriate."},{"id":"exp-15-020","ch":15,"ref":"AFH 1, 15.21","q":"Which USAF paper is slightly more detailed than the point paper and provides notes for a presenter during planned oral presentations?","o":["bullet background paper","background paper","position paper","talking paper"],"a":3,"why":"The talking paper is slightly more detailed than the point paper and provides presenter notes."},{"id":"exp-15-021","ch":15,"ref":"AFH 1, 15.25","q":"Which delivery format requires every word spoken to be absolutely perfect?","o":["manuscript","impromptu","prepared","extemporaneous"],"a":0,"why":"A manuscript briefing requires every word spoken to be absolutely perfect."},{"id":"exp-15-022","ch":15,"ref":"AFH 1, 15.26","q":"Which method of instruction is most often used in the USAF?","o":["the briefing","the teaching lecture","the formal speech","the staff study"],"a":1,"why":"The teaching lecture is the method of instruction most often used in the USAF."},{"id":"exp-15-023","ch":15,"ref":"AFH 1, 15.28","q":"People can listen how much faster than the normal spoken rate of 120 words per minute?","o":["twice as fast","at the same rate","four to five times faster","half as fast"],"a":2,"why":"People can listen four to five times faster than the normal spoken rate of 120 words a minute."},{"id":"exp-15-024","ch":15,"ref":"AFH 1, 15.31","q":"What distinguishes listening from hearing?","o":["listening is purely physiological","hearing requires interpretation","they are the same process","listening involves paying attention to and giving consideration to what is heard"],"a":3,"why":"Listening involves paying attention to and considering what is heard, unlike mere hearing."},{"id":"exp-15-025","ch":15,"ref":"AFH 1, 15.33","q":"Which technologies are vital for identity management in Department of Defense messaging security?","o":["public key infrastructure and common access cards","biometric scanners and smart badges","passwords and personal identification numbers","firewalls and antivirus software"],"a":0,"why":"PKI and common access cards are vital for messaging identity management."},{"id":"exp-17-001","ch":17,"ref":"AFH 1, 17.1","q":"The DAF Emergency Management (EM) Program was developed to ensure the readiness of forces to do which of the following?","o":["Save lives; minimize the loss or degradation of resources; and continue, sustain, and restore operational capability in all-hazards threat environments","Deploy forces rapidly to any theater of operation worldwide","Conduct offensive operations against weapons of mass destruction targets","Establish permanent civil-defense shelters at every installation"],"a":0,"why":"17.1 states the EM Program ensures readiness to save lives, minimize loss or degradation of resources, and continue, sustain, and restore operational capability in all-hazards environments."},{"id":"exp-17-002","ch":17,"ref":"AFH 1, 17.2","q":"The ancillary mission of the DAF EM Program supports which of the following?","o":["Offensive cyber operations and electronic warfare programs","Homeland defense, civil and host nation authorities, antiterrorism programs, and the countering weapons of mass destruction enterprise","Foreign military sales and security cooperation agreements","Humanitarian aid distribution and refugee resettlement programs"],"a":1,"why":"17.2 states the ancillary mission supports homeland defense, civil and host nation authorities, antiterrorism programs, and the countering WMD enterprise."},{"id":"exp-17-003","ch":17,"ref":"AFH 1, 17.2","q":"The DAF EM Program accomplishes its missions through the seven pillars of EM preparedness. Which of the following is one of those pillars?","o":["Force Development","Logistics Integration","Risk Management","Personnel Accountability"],"a":2,"why":"17.2 lists Risk Management, Planning Framework, Common Core Capabilities, Capability Evaluation and Validation, Program Management Reviews, Capability Investment Strategy, and Adaptation via Information as the seven pillars."},{"id":"exp-17-004","ch":17,"ref":"AFH 1, 17.2","q":"Which EM mission area 'provides the capabilities necessary to protect the installation against all threats, hazards, and manmade or natural disasters'?","o":["Prevention","Response","Mitigation","Protection"],"a":3,"why":"17.2 defines Protection as providing the capabilities necessary to protect the installation against all threats, hazards, and disasters."},{"id":"exp-17-005","ch":17,"ref":"AFH 1, 17.2","q":"Which of the following personnel are examples of emergency responders rather than first responders?","o":["Mortuary affairs personnel","Fire and Emergency Services personnel","Security forces personnel","Medical personnel"],"a":0,"why":"17.2 lists mortuary affairs personnel among emergency responders, while first responders include Fire and Emergency Services, medical, and security forces."},{"id":"exp-17-006","ch":17,"ref":"AFH 1, 17.2","q":"Which of the following is an example of a Specialized and Support Team formed from existing installation and unit personnel?","o":["Crisis Action Team","Hydrazine Response Team","Emergency Operations Center","Command Post"],"a":1,"why":"17.2 lists the Hydrazine Response Team among Specialized and Support Teams, which are formed from existing installation and unit personnel."},{"id":"exp-17-007","ch":17,"ref":"AFH 1, 17.2","q":"Which Disaster Response Force element is a full-time, 24/7 command and control node directly responsible to the commander(s)?","o":["Control Centers","Incident Commander","Command Post","Emergency Operations Center"],"a":2,"why":"17.2 describes the Command Post as a full-time, 24/7 Command and Control node directly responsible to commander(s)."},{"id":"exp-17-008","ch":17,"ref":"AFH 1, 17.2","q":"What is the role of Control Centers during emergency operations?","o":["Direct all incident operations at the incident site","Assess the situation and determine mission priorities for the installation commander","Provide emergency communications, alarm, sensor, and video monitoring","Provide expertise and resource support to the EOC director and serve as the command and control node for units tasked in the Installation Emergency Management Plan"],"a":3,"why":"17.2 states Control Centers provide expertise and resource support to the EOC director and serve as the C2 node for units tasked in the Installation Emergency Management Plan."},{"id":"exp-17-009","ch":17,"ref":"AFH 1, 17.4","q":"Which of the following is classified as a natural disaster?","o":["Earthquakes","Hazardous materials release","Nuclear power plant failures","Active shooters"],"a":0,"why":"17.4 lists earthquakes among natural disasters; hazardous materials release and nuclear power plant failures are technological, and active shooters are man-made hazards."},{"id":"exp-17-010","ch":17,"ref":"AFH 1, 17.4","q":"An active shooter incident is an example of which type of hazard?","o":["Natural disaster","Man-made hazard","Technological hazard","Meteorological hazard"],"a":1,"why":"17.4 lists active shooters among man-made hazards."},{"id":"exp-17-011","ch":17,"ref":"AFH 1, 17.4","q":"Chemical agents are categorized according to their physiological effects. Which list correctly identifies those categories?","o":["Bacteria, viruses, fungi, and toxins","Blast, thermal, ionizing, and ballistic","Lung damaging (choking), blister, blood, incapacitating, and nerve agents","Solid, liquid, aerosolized, and gaseous"],"a":2,"why":"17.4 categorizes chemical agents as lung damaging (choking), blister, blood, incapacitating, and nerve agents."},{"id":"exp-17-012","ch":17,"ref":"AFH 1, 17.4","q":"Biological agents may be found and disseminated in which forms?","o":["Vapors, mists, or gases only","Solid metals or alloys","Ultraviolet light or radio waves","Liquid droplets, aerosols, or dry powders"],"a":3,"why":"17.4 states biological agents may be found as liquid droplets, aerosols, or dry powders."},{"id":"exp-17-013","ch":17,"ref":"AFH 1, 17.4","q":"Which of the following are primary concerns of a nuclear detonation?","o":["Blast/shock, thermal radiation (heat), ionizing radiation, and ballistic debris","Choking, blister, blood, and nerve effects","Fungi, toxins, viruses, and bacteria","Vapor inhalation and oxygen displacement"],"a":0,"why":"17.4 lists blast/shock, thermal radiation (heat), ionizing radiation, and ballistic debris as primary concerns of a nuclear detonation."},{"id":"exp-17-014","ch":17,"ref":"AFH 1, 17.4","q":"Most toxic industrial materials present which type of hazard?","o":["A radiation hazard that produces ions in body tissue","A vapor (inhalation) hazard and may reduce the oxygen concentration below that required to support life","A biological hazard with an incubation period","An electromagnetic pulse hazard"],"a":1,"why":"17.4 states most toxic industrial materials present a vapor (inhalation) hazard and may reduce oxygen concentration below that required to support life."},{"id":"exp-17-015","ch":17,"ref":"AFH 1, 17.6","q":"Which alarm condition indicates that an attack is not probable, normal wartime conditions apply, and personnel should resume operations and continue recovery actions?","o":["Alarm Yellow","Alarm Red","Alarm Green","Alarm Black"],"a":2,"why":"17.6 lists Alarm Green as attack not probable, MOPP 0, normal wartime conditions, resume operations, and continue recovery actions."},{"id":"exp-17-016","ch":17,"ref":"AFH 1, 17.6","q":"Which alarm condition is declared when attack is probable in less than 30 minutes?","o":["Alarm Green","Alarm Red/Blue","Alarm Black","Alarm Yellow"],"a":3,"why":"17.6 lists Alarm Yellow as attack probable in less than 30 minutes."},{"id":"exp-17-017","ch":17,"ref":"AFH 1, 17.6","q":"Which alarm condition indicates the attack is over and CBRN contamination and/or UXO hazards are suspected or present?","o":["Alarm Black","Alarm Green","Alarm Yellow","All Clear"],"a":0,"why":"17.6 lists Alarm Black as attack over with CBRN contamination and/or UXO hazards suspected or present."},{"id":"exp-17-018","ch":17,"ref":"AFH 1, 17.6","q":"What does the 'All Clear' announcement indicate?","o":["An attack is imminent or in progress","The immediate disaster or threat has ended","An active shooter incident is in progress","CBRN contamination is suspected or present"],"a":1,"why":"17.6 states the All Clear announcement indicates the immediate disaster or threat has ended."},{"id":"exp-17-019","ch":17,"ref":"AFH 1, 17.7","q":"Who determines the initial MOPP level for an installation?","o":["The Crisis Action Team","The CBRN Control Center","The installation commander","The Incident Commander"],"a":2,"why":"17.7 states the installation commander determines the initial MOPP level based on MOPP condition analysis."},{"id":"exp-17-020","ch":17,"ref":"AFH 1, 17.7","q":"What is Split MOPP?","o":["A method of wearing only the overgarment without the mask","A directive to alternate MOPP levels every hour","A procedure to declare the entire installation contaminated","A tactic that divides an installation or operating location into two or more CBRN zones"],"a":3,"why":"17.7 defines Split MOPP as a tactic to divide an installation or operating location into two or more CBRN zones."},{"id":"exp-17-021","ch":17,"ref":"AFH 1, 17.8","q":"What is the best immediate protective equipment against chemical agents, regardless of agent type, concentration, or method of attack?","o":["The ground crew ensemble","The protective shelter","The collective protection system","The chemical reconnaissance vehicle"],"a":0,"why":"17.8 states the ground crew ensemble is the best immediate protective equipment against chemical agents."},{"id":"exp-17-022","ch":17,"ref":"AFH 1, 17.8","q":"At which MOPP level is all individual protective equipment—field gear, overgarment, footwear, mask/hood, and handwear—worn?","o":["MOPP Level Zero","MOPP Level Four","MOPP Level One","MOPP Level Two"],"a":1,"why":"Table 17.1 shows MOPP Level Four requires wearing field gear, overgarment, footwear, mask/hood, and handwear (carry: N/A)."},{"id":"exp-17-023","ch":17,"ref":"AFH 1, 17.9","q":"How does a Collective Protection System (COLPRO) protect personnel from CBRN agents?","o":["It issues each occupant a ground crew ensemble","It decontaminates personnel before they exit the facility","It uses an overpressure system to keep threat agents outside, allowing occupants to work or rest without wearing protective gear","It seals the facility using barrier material and plastic sheeting"],"a":2,"why":"17.9 states COLPRO uses an overpressure system to keep threat agents outside so occupants can work or rest without protective gear."},{"id":"exp-17-024","ch":17,"ref":"AFH 1, 17.10","q":"When covering vehicles and equipment that cannot be placed under overhead cover, how many layers of barrier material should be used when possible?","o":["One layer on all surfaces","Three layers on the tops","Four layers on the sides only","Two layers on the tops of vehicles and equipment"],"a":3,"why":"17.10 states to use two layers of barrier material to cover the tops of vehicles and equipment when possible, and at least one layer if overhead cover is unavailable."},{"id":"exp-17-025","ch":17,"ref":"AFH 1, 17.13","q":"For decontamination, what concentration of chlorine solution is authorized for equipment and for skin?","o":["5-percent for equipment and 0.5-percent for skin","0.5-percent for equipment and 5-percent for skin","10-percent for equipment and 1-percent for skin","1-percent for equipment and 10-percent for skin"],"a":0,"why":"17.13 states 5-percent chlorine solution for equipment and 0.5-percent for skin decontamination, used only after consultation with CBRN Defense Specialists."},{"id":"exp-18-001","ch":18,"ref":"AFH 1, 18.1","q":"What is the stated purpose of security?","o":["To eliminate all risk from base operations","To never permit the enemy to acquire an unexpected advantage","To reduce the number of security forces personnel required","To ensure every Airman is armed at all times"],"a":1,"why":"18.1 states the purpose of security is to never permit the enemy to acquire an unexpected advantage."},{"id":"exp-18-002","ch":18,"ref":"AFH 1, 18.2","q":"Which list identifies threat actors of concern to integrated defense?","o":["Weather, terrain, and geological hazards","Contractors, vendors, and local businesses","Terrorists, insiders, criminals, foreign intelligence, and security services","Aircraft, vehicles, and equipment failures"],"a":2,"why":"18.2 lists terrorists, insiders, criminals, foreign intelligence, and security services as threat actors."},{"id":"exp-18-003","ch":18,"ref":"AFH 1, 18.2","q":"Integrated defense is described as what type of program?","o":["A security forces-only program","A headquarters-level program","A contractor-run program","An 'All Airmen' program"],"a":3,"why":"18.2 states integrated defense is an 'All Airmen' program."},{"id":"exp-18-004","ch":18,"ref":"AFH 1, 18.2","q":"What is the base perimeter?","o":["The physical boundary of the installation","A line delineating surface area for coordination between adjacent units","The area outside the base vulnerable to standoff weapons","The area of concern around an air base"],"a":0,"why":"18.2 defines the base perimeter as the physical boundary of the installation."},{"id":"exp-18-005","ch":18,"ref":"AFH 1, 18.3","q":"Commanders execute integrated defense with the objective of achieving how many desired effects?","o":["Five","Nine","Seven","Twelve"],"a":1,"why":"18.3 states commanders execute integrated defense to achieve nine desired effects."},{"id":"exp-18-006","ch":18,"ref":"AFH 1, 18.3","q":"Which integrated defense effect is achieved through active community policing, boundary and internal circulation control, controlled area marking, and prudent physical security measures?","o":["Detect","Delay","Deter","Defend"],"a":2,"why":"18.3 describes Deter as achieved through active community policing, circulation control, controlled area marking, and physical security measures."},{"id":"exp-18-007","ch":18,"ref":"AFH 1, 18.3","q":"Which integrated defense effect involves applying effective command and control and developing and exercising Comprehensive Emergency Management Plan 10-2?","o":["Anticipate","Warn","Assess","Recover"],"a":3,"why":"18.3 describes Recover as applying effective command and control and developing/exercising CEMP 10-2."},{"id":"exp-18-008","ch":18,"ref":"AFH 1, 18.6","q":"Loss, theft, destruction, damage, misuse, or compromise of which protection-level resource would result in unacceptable mission degradation to the strategic capability of the United States?","o":["Protection Level 1","Protection Level 2","Protection Level 3","Protection Level 4"],"a":0,"why":"18.6 assigns PL1 to resources whose loss would cause unacceptable mission degradation or catastrophic consequences for the nation."},{"id":"exp-18-009","ch":18,"ref":"AFH 1, 18.6","q":"Which of the following is an example of a Protection Level 1 resource?","o":["Nonnuclear alert forces","Aircraft designated to transport the U.S. President","Fuels and liquid oxygen storage areas","Non-launch-critical space launch systems"],"a":1,"why":"18.6 lists aircraft designated to transport the U.S. President among PL1 examples."},{"id":"exp-18-010","ch":18,"ref":"AFH 1, 18.6","q":"Which protection level is assigned when loss or compromise would result in mission degradation (rather than significant degradation) to U.S. warfighting capability?","o":["Protection Level 1","Protection Level 2","Protection Level 3","Protection Level 4"],"a":2,"why":"18.6 assigns PL3 to resources whose loss would cause mission degradation; PL2 is significant degradation and PL1 unacceptable degradation."},{"id":"exp-18-011","ch":18,"ref":"AFH 1, 18.7","q":"What is the purpose of operations security?","o":["To physically secure installation perimeters","To manage security clearances for all personnel","To prevent damage to computers and information systems","To reduce the vulnerability of USAF missions by eliminating or reducing successful adversary collection and exploitation of critical information"],"a":3,"why":"18.7 states OPSEC reduces mission vulnerability by eliminating or reducing adversary collection and exploitation of critical information."},{"id":"exp-18-012","ch":18,"ref":"AFH 1, 18.8","q":"Which operations security indicator characteristic refers to observable activities and operational trends that reveal critical information?","o":["Signatures","Associations","Profiles","Contrasts"],"a":0,"why":"18.8 defines signatures as observable activities and operational trends that reveal critical information."},{"id":"exp-18-013","ch":18,"ref":"AFH 1, 18.8","q":"Which operations security indicator characteristic refers to when and for how long an indicator is observed?","o":["Associations","Exposure","Profiles","Signatures"],"a":1,"why":"18.8 defines exposure as when and for how long an indicator is observed."},{"id":"exp-18-014","ch":18,"ref":"AFH 1, 18.9","q":"Information protection consists of which core security disciplines?","o":["Physical, operational, and cyber security","Antiterrorism, OPSEC, and COMSEC","Personnel, industrial, and information security","Law enforcement, counterintelligence, and HUMINT"],"a":2,"why":"18.9 lists personnel, industrial, and information security as the core security disciplines of information protection."},{"id":"exp-18-015","ch":18,"ref":"AFH 1, 18.11","q":"What are the three most common markings on a classified document?","o":["Cover sheets, tabs, and stickers","Date of origin, title, and page number","Downgrading instructions, declassification instructions, and distribution list","Banner lines, portion markings, and the classification authority block"],"a":3,"why":"18.11 lists banner lines, portion markings, and the classification authority block as the three most common markings."},{"id":"exp-18-016","ch":18,"ref":"AFH 1, 18.11","q":"Which cover sheet is used to cover Secret information outside of storage?","o":["SF 704","SF 701","SF 703","SF 705"],"a":0,"why":"18.11 assigns SF 703 to Top Secret, SF 704 to Secret, and SF 705 to Confidential cover sheets."},{"id":"exp-18-017","ch":18,"ref":"AFH 1, 18.12","q":"Which security incident involves failure to comply with requirements that cannot reasonably be expected to, and does not, result in loss or compromise of classified information?","o":["Violation","Infraction","Compromise","Loss"],"a":1,"why":"18.12 defines an infraction as noncompliance that does not result in loss or compromise of classified information."},{"id":"exp-18-018","ch":18,"ref":"AFH 1, 18.12","q":"Which term describes records containing classified information that cannot be physically located or accounted for?","o":["Compromise","Infraction","Loss","Violation"],"a":2,"why":"18.12 defines loss as records that cannot be physically located or accounted for."},{"id":"exp-18-019","ch":18,"ref":"AFH 1, 18.12","q":"If classified information appears in the public media, what must DoD personnel avoid doing?","o":["Reporting the matter to the appropriate authority","Discussing it with cleared personnel who have a need to know","Continuing to safeguard related classified material","Making any statement or comment that confirms the accuracy of or verifies the information"],"a":3,"why":"18.12 prohibits confirming the accuracy of, or verifying, classified information that appears in public media."},{"id":"exp-18-020","ch":18,"ref":"AFH 1, 18.14","q":"What authority grants, denies, and revokes security clearance eligibility using the DoD adjudicative guidelines and the whole person concept?","o":["The Department of Defense Central Adjudication Facility","The installation commander","The Air Force Office of Special Investigations","The security manager"],"a":0,"why":"18.14 designates the DoD Central Adjudication Facility as the authority to grant, deny, and revoke eligibility using the 13 guidelines and the whole person concept."},{"id":"exp-18-021","ch":18,"ref":"AFH 1, 18.15","q":"The Privacy Act prohibits disclosure of information from a system of records without what?","o":["A court order","The written consent of the subject individual","A routine use determination","An official need to know"],"a":1,"why":"18.15 prohibits disclosure from a system of records without the written consent of the subject individual."},{"id":"exp-18-022","ch":18,"ref":"AFH 1, 18.17","q":"When are USAF personnel required to complete Information Assurance Awareness training?","o":["Only upon initial enlistment","Every two years","Prior to system access and annually thereafter","Only when deploying"],"a":2,"why":"18.17 requires Information Assurance Awareness training prior to system access and annually thereafter."},{"id":"exp-18-023","ch":18,"ref":"AFH 1, 18.22","q":"What is cryptosecurity?","o":["Physical measures to safeguard COMSEC material from unauthorized access","Measures to protect transmissions from interception by means other than cryptanalysis","Protection from compromising emanations within an inspectable space","A component of communications security resulting from the provision and proper use of technically sound cryptosystems"],"a":3,"why":"18.22 defines cryptosecurity as a COMSEC component resulting from the provision and proper use of technically sound cryptosystems."},{"id":"exp-18-024","ch":18,"ref":"AFH 1, 18.24","q":"At the strategic level, who is responsible for ensuring the timely collection, processing, analysis, production, and dissemination of intelligence concerning terrorist activities?","o":["The Deputy Chief of Staff for Intelligence, Surveillance, Reconnaissance, and Cyber Effects Operations (HAF/A2/6)","The installation commander","The Air Force Office of Special Investigations","The Chief of Staff of the Air Force"],"a":0,"why":"18.24 assigns this responsibility to the Deputy Chief of Staff for ISR and Cyber Effects Operations (HAF/A2/6) and the Director for ISR and Operations."},{"id":"exp-18-025","ch":18,"ref":"AFH 1, 18.30","q":"What is subversion?","o":["Obtaining or delivering national defense information to injure the United States","Acts inciting DoD military or civilian personnel to violate laws, disobey lawful orders, or disrupt military activities to impair loyalty, morale, or discipline","Willfully injuring or destroying national defense material, premises, or utilities","Calculated unlawful violence to coerce or intimidate governments or societies"],"a":1,"why":"18.30 defines subversion as acts inciting DoD personnel to violate laws, disobey orders, or disrupt activities to impair loyalty, morale, or discipline."},{"id":"exp-19-001","ch":19,"ref":"AFH 1, 19.1","q":"Which list correctly identifies the USAF core values?","o":["Honor, Courage, and Commitment","Loyalty, Duty, Respect, Selfless Service, Honor, Integrity, and Personal Courage","Integrity First, Service Before Self, and Excellence In All We Do","Duty, Honor, and Country"],"a":2,"why":"19.1 lists Integrity First, Service Before Self, and Excellence In All We Do as the USAF core values."},{"id":"exp-19-002","ch":19,"ref":"AFH 1, 19.1","q":"What does AFI 1-1 state about the standards expected of USAF members?","o":["Members are held to the same standards as federal civilian employees","Standards apply only while on duty","Standards are advisory rather than enforceable","Members must adhere to higher standards than those expected in civilian life"],"a":3,"why":"19.1 states AFI 1-1 requires members to adhere to higher standards than those expected in civilian life."},{"id":"exp-19-003","ch":19,"ref":"AFH 1, 19.2","q":"What are DAF Policy Directives (DAFPDs)?","o":["Orders of the Secretary of the Air Force that contain directive policy statements guiding DAF implementation","Publications that generally instruct readers on 'how to' perform tasks","Informational publications whose compliance is expected but not mandatory","Headquarters operating instructions governing mission directives"],"a":0,"why":"19.2 defines DAFPDs as orders of the Secretary of the Air Force containing directive policy statements that guide DAF implementation."},{"id":"exp-19-004","ch":19,"ref":"AFH 1, 19.2","q":"A DAFMAN, AFMAN, or SPFMAN may be either of which of the following?","o":["A directive policy statement or an operating instruction","An extension of a DAFI, AFI, or SPFI providing detailed procedure, or an alternative to a DAFI, AFI, or SPFI","A mission directive or a manpower standard","A nondirective pamphlet or a tactics document"],"a":1,"why":"19.2 states manuals may be an extension of a DAFI/AFI/SPFI providing detailed procedure and technical guidance, or an alternative to one."},{"id":"exp-19-005","ch":19,"ref":"AFH 1, 19.2","q":"According to Table 19.1, which publication series number corresponds to Security?","o":["10","51","31","71"],"a":2,"why":"Table 19.1 assigns series number 31 to Security."},{"id":"exp-19-006","ch":19,"ref":"AFH 1, 19.3","q":"What is the purpose of General Orders?","o":["To define the USAF core values","To establish publication series numbers","To direct risk management procedures","To provide clear and concise guidance tailored to maintaining good order and discipline in the deployed setting"],"a":3,"why":"19.3 states General Orders provide clear, concise guidance tailored to maintaining good order and discipline in the deployed setting."},{"id":"exp-19-007","ch":19,"ref":"AFH 1, 19.4","q":"How must USAF standards be applied and enforced?","o":["Uniformly known, consistently applied, and non-selectively enforced","Only when convenient for the unit","At the discretion of individual supervisors","Primarily during deployments"],"a":0,"why":"19.4 states USAF standards must be uniformly known, consistently applied, and non-selectively enforced."},{"id":"exp-19-008","ch":19,"ref":"AFH 1, 19.5","q":"How does the Department of Defense define the law of war?","o":["The standing rules of engagement approved by the President","The treaties and customary international law binding on the United States that regulate the resort to armed force and the conduct of hostilities","The six articles of the Code of Conduct","The Uniform Code of Military Justice"],"a":1,"why":"19.5 defines the law of war as the treaties and customary international law binding on the United States regulating the resort to armed force, conduct of hostilities, and related matters."},{"id":"exp-19-009","ch":19,"ref":"AFH 1, 19.5","q":"Which directive requires each military department to implement effective programs that ensure law of war observance and prevent violations?","o":["AFI 1-1","AFI 71-101","DoDD 2311.01","DoDM 5200.01"],"a":2,"why":"19.5 states DoDD 2311.01, Department of Defense Law of War Program, requires each military department to implement effective law of war programs."},{"id":"exp-19-010","ch":19,"ref":"AFH 1, 19.5","q":"Under which provision of the U.S. Constitution are U.S. treaty obligations the 'supreme law of the land'?","o":["Article one","Article two","The Tenth Amendment","Article six"],"a":3,"why":"19.5 states Article six of the U.S. Constitution declares treaty obligations the 'supreme law of the land'."},{"id":"exp-19-011","ch":19,"ref":"AFH 1, 19.6","q":"Which action may military necessity NOT authorize under any circumstances?","o":["The taking of hostages","Attacks on military objectives","Destruction of enemy lines of communication","Neutralization of enemy headquarters"],"a":0,"why":"19.6 states military necessity may not authorize actions prohibited by the law of war, such as murder of prisoners of war, ill treatment, or taking of hostages."},{"id":"exp-19-012","ch":19,"ref":"AFH
