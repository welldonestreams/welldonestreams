1, 19.6","q":"Once an enemy combatant is placed hors de combat through severe wounds or capture, what does the principle of humanity require?","o":["The combatant must be immediately repatriated","No military purpose is served by continuing to attack him or her","The combatant may still be used as a human shield","The combatant must be treated as a military objective"],"a":1,"why":"19.6 states that once a combatant is hors de combat, no military purpose is served by continuing to attack him or her."},{"id":"exp-19-013","ch":19,"ref":"AFH 1, 19.6","q":"Under the principle of distinction, what is a fundamental violation of the law of war?","o":["Use of ruses and lawful deceptions","Attacks on military objectives","Employment of voluntary or involuntary human shields to protect military objectives","Separating civilians from military objectives"],"a":2,"why":"19.6 states employment of human shields to protect military objectives is a fundamental violation of the principle of distinction."},{"id":"exp-19-014","ch":19,"ref":"AFH 1, 19.6","q":"Which conduct does the law-of-war principle of honor NOT forbid?","o":["Killing or wounding the enemy by resort to perfidy","Misusing certain signs","Fighting in the enemy's uniform","The use of ruses and other lawful deceptions"],"a":3,"why":"19.6 states honor forbids perfidy, misusing signs, and fighting in the enemy's uniform, but does not forbid ruses and lawful deceptions."},{"id":"exp-19-015","ch":19,"ref":"AFH 1, 19.7","q":"How many separate international treaties make up the Geneva Conventions of 1949?","o":["Four","Two","Three","Six"],"a":0,"why":"19.7 states the Geneva Conventions of 1949 consist of four separate international treaties."},{"id":"exp-19-016","ch":19,"ref":"AFH 1, 19.7","q":"Which of the following is a characteristic of a lawful combatant?","o":["Is exempt from capture and detention","Carries arms openly","May hide among the civilian population","Is immune from all domestic law"],"a":1,"why":"19.7 states a combatant wears fixed distinctive emblems/uniforms, carries arms openly, and conducts operations according to the law of war."},{"id":"exp-19-017","ch":19,"ref":"AFH 1, 19.8","q":"Which of the following is a protected object under the law of war?","o":["Enemy military aircraft in hostile airspace","Enemy headquarters buildings","Hospital ships","Lines of communication"],"a":2,"why":"19.8 lists military and civilian hospital ships among protected objects; if used for military purposes, they may lose that status."},{"id":"exp-19-018","ch":19,"ref":"AFH 1, 19.8","q":"Enemy military aircraft may be attacked and destroyed under the law of war UNLESS they are where?","o":["Over their own territory","Escorting military medical aircraft","Carrying only nonmilitary cargo","In neutral airspace or territory"],"a":3,"why":"19.8 states enemy military aircraft may be attacked and destroyed unless in neutral airspace or territory."},{"id":"exp-19-019","ch":19,"ref":"AFH 1, 19.9","q":"How may members be prosecuted for law of war violations?","o":["By courts-martial under the Uniform Code of Military Justice or through an international military tribunal","Only by the commander's nonjudicial punishment","Only through civilian federal courts","Through administrative discharge only"],"a":0,"why":"19.9 states members may be prosecuted by courts-martial under the UCMJ or through an international military tribunal for law of war violations."},{"id":"exp-19-020","ch":19,"ref":"AFH 1, 19.10","q":"Who approves and who issues the standing rules of engagement?","o":["Approved by Congress; issued by the Secretary of the Air Force","Approved by the U.S. President and Secretary of Defense; issued by the Chairman of the Joint Chiefs of Staff","Approved by the combatant commander; issued by the installation commander","Approved by the United Nations; issued by the Department of State"],"a":1,"why":"19.10 states the standing ROE are approved by the U.S. President and Secretary of Defense and issued by the Chairman of the Joint Chiefs of Staff."},{"id":"exp-19-021","ch":19,"ref":"AFH 1, 19.10","q":"In self-defense under the rules of engagement, what does necessity focus on?","o":["The rank of the individual using force","The availability of backup forces","Whether the individual perceives that a hostile act has occurred or hostile intent is being demonstrated","The cost of the response compared to the threat"],"a":2,"why":"19.10 states necessity focuses on the threat perceived by the individual—whether a hostile act has occurred or hostile intent is demonstrated."},{"id":"exp-19-022","ch":19,"ref":"AFH 1, 19.11","q":"Are violations of the Code of Conduct criminally punishable?","o":["Yes, every violation is automatically a court-martial offense","No, the Code of Conduct carries no consequences whatsoever","Yes, but only during armed conflict","Not per se, but actions that also violate the UCMJ may subject members to disciplinary action"],"a":3,"why":"19.11 states Code of Conduct violations are not criminally punishable per se, but actions that also violate the UCMJ may subject members to discipline."},{"id":"exp-19-023","ch":19,"ref":"AFH 1, 19.12","q":"Who first published the Code of Conduct, and when?","o":["President Dwight D. Eisenhower on 17 August 1955","President Ronald W. Reagan in March 1988","President Harry S. Truman in 1949","President John F. Kennedy in 1961"],"a":0,"why":"19.12 states President Dwight D. Eisenhower first published the Code of Conduct on 17 August 1955."},{"id":"exp-19-024","ch":19,"ref":"AFH 1, 19.12","q":"Under Code of Conduct Article II, what is a member in command prohibited from doing?","o":["Retreating when outnumbered","Surrendering the members of the command while they still have the means to resist","Ordering defensive measures","Conserving ammunition"],"a":1,"why":"Article II states: 'If in command, I will never surrender the members of my command while they still have the means to resist.'"},{"id":"exp-19-025","ch":19,"ref":"AFH 1, 19.12","q":"Under Code of Conduct Article V, beyond name, rank, service number, and date of birth, what must a prisoner of war do when questioned?","o":["Answer every question truthfully and completely","Provide a personal history statement","Evade answering further questions to the utmost of his or her ability","Sign a confession if asked"],"a":2,"why":"Article V requires a POW to give name, rank, service number, and date of birth, and to evade answering further questions to the utmost of his or her ability."},{"id":"exp-20-001","ch":20,"ref":"AFH 1, 20.4","q":"Which qualification must a person hold (or be able to attain) to serve as an IG inspector, per AFH 1?","o":["A security clearance commensurate with the duties required","A prior assignment with the Air Force Office of Special Investigations","At least one year as a unit first sergeant","Certification as a trained mediator"],"a":0,"why":"IG inspectors must be able to attain and hold a security clearance commensurate with their duties."},{"id":"exp-20-002","ch":20,"ref":"AFH 1, 20.4","q":"What prior experience must nuclear surety inspection inspectors have before assignment as a nuclear inspector?","o":["A rated aircrew background","Completion of the Inspector General Training Course","Nuclear experience or experience applicable to current systems in the respective MAJCOM","A minimum of four years in security forces"],"a":2,"why":"Nuclear surety inspection inspectors must have prior nuclear experience or experience applicable to current systems in the respective MAJCOM."},{"id":"exp-20-003","ch":20,"ref":"AFH 1, 20.10","q":"A commander's inherent authority and responsibility includes placing lawful restriction on which of the following?","o":["Voting in local elections","Engaging in dissident and protest activities","Attending off-duty religious services","Corresponding privately with family members"],"a":1,"why":"Commanders may lawfully restrict dissident and protest activities to ensure the mission is performed."},{"id":"exp-20-004","ch":20,"ref":"AFH 1, 20.11","q":"Who is responsible for issuing public statements on official USAF matters?","o":["Any member with a social media account","The base legal office","The Inspector General","Cognizant unit or installation commanders and their public affairs representatives"],"a":3,"why":"Per AFI 1-1, issuance of public statements on official USAF matters belongs to commanders and their public affairs representatives."},{"id":"exp-20-005","ch":20,"ref":"AFH 1, 20.11","q":"Before releasing any proposed statement, text, or imagery to the public, where must a member's review and clearance start?","o":["With the wing commander","With the security manager","With the legal office","With public affairs"],"a":3,"why":"Each member must obtain review and clearance starting with public affairs before public release."},{"id":"exp-20-006","ch":20,"ref":"AFH 1, 20.12","q":"According to AFI 1-1, leaders at all levels must balance which two constitutional considerations regarding religion?","o":["Free speech and free press","Due process and equal protection","Free exercise of religion and the prohibition against governmental establishment of religion","Freedom of assembly and freedom of petition"],"a":2,"why":"Leaders must balance their own free exercise of religion with the prohibition against government establishment of religion."},{"id":"exp-20-007","ch":20,"ref":"AFH 1, 20.14","q":"What driving-privilege consequence applies for operating a motor vehicle while impaired at a blood alcohol concentration of 0.08 percent or greater?","o":["A written warning","A one-year driving privilege suspension","A 30-day suspension","Mandatory enrollment in ADAPT only"],"a":1,"why":"There is a one-year driving privilege suspension for driving under the influence at a BAC of 0.08 or greater."},{"id":"exp-20-008","ch":20,"ref":"AFH 1, 20.15","q":"According to DAFMAN 44-197, which best describes drug abuse?","o":["The wrongful use, possession, distribution, or introduction onto a military installation of a controlled substance or intoxicating substance other than alcohol","Any use of alcohol by a member under age 30","Occasional off-duty consumption of over-the-counter cold medicine","The lawful use of prescription drugs as directed by a physician"],"a":0,"why":"DAFMAN 44-197 defines drug abuse as wrongful use, possession, distribution, or introduction of controlled/other intoxicating substances."},{"id":"exp-20-009","ch":20,"ref":"AFH 1, 20.15","q":"What is recommended for all patients diagnosed with a substance use disorder and entered into ADAPT?","o":["Immediate administrative separation","Permanent reassignment to a non-deployable unit","Reduction in grade","Limited duty, indicating the patient is not worldwide qualified"],"a":3,"why":"All ADAPT-enrolled patients diagnosed with a substance use disorder will be recommended for limited duty."},{"id":"exp-20-010","ch":20,"ref":"AFH 1, 20.15","q":"When must a unit commander refer a service member for a substance use assessment?","o":["Only after a court-martial conviction","Only when the member self-identifies","When substance use or misuse is suspected to be a contributing factor in any misconduct","Whenever a member receives a negative performance report"],"a":2,"why":"Unit commanders refer all members for assessment when substance use/misuse is suspected as a contributing factor in any misconduct."},{"id":"exp-20-011","ch":20,"ref":"AFH 1, 20.17","q":"Why does AFH 1 state that maintaining professional relationships is more critical in the military than in civilian organizations?","o":["Because military pay is generally higher","Because the mission requires absolute confidence in command and unhesitating adherence to orders that may result in injury or death","Because military members work longer hours","Because civilians are not bound by the UCMJ"],"a":1,"why":"The military mission demands absolute confidence in command and adherence to orders even when they entail hardship, injury, or death."},{"id":"exp-20-012","ch":20,"ref":"AFH 1, 20.17","q":"In a fraternization relationship between an officer and an enlisted member, how is disciplinary responsibility allocated?","o":["The officer is held primarily responsible under Article 134; the enlisted member may face discipline under Article 92","Both are charged equally under Article 134","Only the enlisted member is disciplined","Neither is disciplined if the relationship was consensual"],"a":0,"why":"The officer is primarily responsible under Article 134; an enlisted member in consensual fraternization faces Article 92 discipline."},{"id":"exp-20-013","ch":20,"ref":"AFH 1, 20.18","q":"What is the Air Force Sexual Harassment/Unlawful Discrimination (24-hour) Hotline number?","o":["1-800-342-9647","1-800-273-8255","1-800-QUIT-NOW","1-888-231-4058"],"a":3,"why":"The 24-hour sexual harassment/unlawful discrimination hotline is 1-888-231-4058."},{"id":"exp-20-014","ch":20,"ref":"AFH 1, 20.19","q":"Which best describes bullying under the Air Force Equal Opportunity Program?","o":["Conduct directed only at new Airmen during in-processing","Acts of aggression with a nexus to military service intended to harm a member physically or psychologically, without a proper military or governmental purpose","Any corrective physical training directed by a supervisor","A disagreement between peers about work methods"],"a":1,"why":"Bullying is aggression with a military-service nexus intended to harm, lacking a proper military or governmental purpose."},{"id":"exp-20-015","ch":20,"ref":"AFH 1, 20.19","q":"Retaliation is prohibited by which UCMJ article?","o":["Article 92","Article 134","Article 132","Article 15"],"a":2,"why":"Retaliation is prohibited by Article 132, UCMJ."},{"id":"exp-20-016","ch":20,"ref":"AFH 1, 20.20","q":"Which is true of the military informal Equal Opportunity complaint process?","o":["There is no time limit for filing and no requirement for commander approval before accepting informal complaints","It must be completed within 30 days","It requires a Staff Judge Advocate legal sufficiency review first","It can only be initiated in writing"],"a":0,"why":"Informal military EO complaints have no time limit and require no commander approval to accept."},{"id":"exp-20-017","ch":20,"ref":"AFH 1, 20.20","q":"In the military formal EO complaint clarification process, what standard of evidence is used to determine whether unlawful discrimination occurred?","o":["Beyond a reasonable doubt","Clear and convincing evidence","Probable cause","A preponderance of the evidence"],"a":3,"why":"Complaint clarification determines whether a preponderance of evidence demonstrates unlawful discrimination occurred."},{"id":"exp-20-018","ch":20,"ref":"AFH 1, 20.21","q":"A civilian formal EO complaint must be filed with the Equal Opportunity director or designee within how many days of receiving notice of the right to file?","o":["45 calendar days","15 calendar days","30 calendar days","60 calendar days"],"a":1,"why":"The complaint must be filed within 15 calendar days of receiving the notice of right to file a formal complaint."},{"id":"exp-20-019","ch":20,"ref":"AFH 1, 20.21","q":"Which law prohibits genetic information discrimination in any aspect of employment?","o":["The Privacy Act of 1974","Title VII of the Civil Rights Act","The Genetic Information Nondiscrimination Act of 2008","The Military Whistleblower's Protection Act"],"a":2,"why":"Title II of Public Law 110-233, the Genetic Information Nondiscrimination Act of 2008, prohibits genetic information discrimination in employment."},{"id":"exp-20-020","ch":20,"ref":"AFH 1, 20.22","q":"Who is the single point of contact at an installation for sexual assault awareness, prevention, and response?","o":["The installation Sexual Assault Response Coordinator (SARC)","The first sergeant","The Staff Judge Advocate","The Victims' Counsel"],"a":0,"why":"The installation SARC is the single point of contact overseeing sexual assault awareness, prevention, and response."},{"id":"exp-20-021","ch":20,"ref":"AFH 1, 20.22","q":"Under AFH 1, in which situation is there NO consent to sexual conduct?","o":["When the parties are married","When one party is in uniform","When the parties have a previous relationship","When the person is sleeping or incapacitated, such as by alcohol, drugs, or mental incapacity"],"a":3,"why":"There is no consent where the person is sleeping or incapacitated due to age, alcohol/drugs, or mental incapacity."},{"id":"exp-20-022","ch":20,"ref":"AFH 1, 20.23","q":"Who may receive a restricted report of sexual assault?","o":["First sergeants and commanders","Only SARCs, SAPR VAs, VVAs, and healthcare personnel","Any supervisor in the victim's chain of command","Chaplains and legal assistance attorneys"],"a":1,"why":"Only SARCs, SAPR VAs, VVAs, and healthcare personnel may receive restricted reports."},{"id":"exp-20-023","ch":20,"ref":"AFH 1, 20.23","q":"Which statement about converting sexual assault reporting options is correct?","o":["A victim may convert an unrestricted report to a restricted report at any time","Both options may be converted freely","A victim may convert a restricted report to an unrestricted report, but not the reverse","Neither option may ever be converted"],"a":2,"why":"A victim may convert restricted to unrestricted at any time, but may not change from unrestricted to restricted."},{"id":"exp-20-024","ch":20,"ref":"AFH 1, 20.25","q":"How does the letter of reprimand differ between officers and enlisted personnel regarding the UIF?","o":["It is mandatory for officers to file in the UIF; commanders may elect to file it for enlisted personnel","It is mandatory for all grades","It is optional for officers but mandatory for enlisted","It may never be filed in a UIF"],"a":0,"why":"Letters of reprimand are mandatory for UIF filing for officers, while commanders may elect to file them for enlisted."},{"id":"exp-20-025","ch":20,"ref":"AFH 1, 20.28","q":"Under what conditions may a service be characterized as under other than honorable conditions?","o":["Whenever a member separates at expiration of term of service","Only if the member is offered an administrative discharge board, or a discharge is unconditionally requested in lieu of trial by court-martial","Whenever the member has any negative counseling entries","Whenever the member requests it in writing"],"a":1,"why":"UOTHC can be given only if an administrative discharge board is offered or the discharge is requested in lieu of court-martial."},{"id":"exp-22-001","ch":22,"ref":"AFH 1, 22.2","q":"What is the maximum supervision ratio for a Fitness Assessment Cell (FAC) augmentee overseeing Airmen during a physical fitness assessment?","o":["12 Airmen for every one FAC augmentee","20 Airmen for every one FAC augmentee","8 Airmen for every one FAC augmentee","15 Airmen for every one FAC augmentee"],"a":0,"why":"FAC augmentees supervise Airmen conducting PFA components at a ratio of no more than 12 Airmen per augmentee."},{"id":"exp-22-002","ch":22,"ref":"AFH 1, 22.2","q":"What happens if a Physical Training Leader's fitness assessment score drops below 75.0 or becomes noncurrent?","o":["They must retest within 30 days","They are automatically promoted out of the role","Their certification is voided","Nothing; the score is advisory only"],"a":2,"why":"A PTL must maintain a 75.0 or higher score; if it drops below 75.0 or becomes noncurrent, certification is voided."},{"id":"exp-22-003","ch":22,"ref":"AFH 1, 22.2","q":"What must an individual complete to become a certified Physical Training Leader?","o":["A college exercise science degree","Hands-on Basic Life Support training (or equivalent), CPR/AED training, and fitness assessment procedures","A passing score on the AFOQT","The Airman Leadership School course"],"a":1,"why":"PTL certification requires Hands-on BLS training (or equivalent), CPR/AED training, and fitness assessment procedures."},{"id":"exp-22-004","ch":22,"ref":"AFH 1, 22.2","q":"What is the Unit Fitness Program Manager's primary liaison role?","o":["Liaison between the medical group and the wing safety office","Liaison between the base gym and contractors","Liaison between the first sergeant and the commander","Liaison between the unit commander, the FAC, and the Fitness Program Manager"],"a":3,"why":"The UFPM serves as liaison between the unit commander, FAC, and the Fitness Program Manager."},{"id":"exp-22-005","ch":22,"ref":"AFH 1, 22.2","q":"Which statement about documenting fitness assessment results is correct?","o":["Use of the DAF Form 4446 is mandatory; locally-produced scorecards cannot be used","Locally-produced scorecards are acceptable substitutes","Results are documented verbally only","Only myFitness entries are required; no paper form is needed"],"a":0,"why":"The DAF Form 4446 is mandatory for documenting results; locally-produced scorecards cannot be used."},{"id":"exp-22-006","ch":22,"ref":"AFH 1, 22.5","q":"When administering Body Composition Assessments, what restriction applies to Body Composition Managers?","o":["They may only assess members at their own rank","They must be SNCOs","They may only assess members of the same gender","They must hold a medical credential"],"a":2,"why":"BCMs administer BCAs within the unit and only assess members of the same gender."},{"id":"exp-22-007","ch":22,"ref":"AFH 1, 22.5","q":"Enrollment in the formal self-directed Body Composition Improvement Program is considered what?","o":["A routine administrative step","The first failure to meet the BCP standard","An automatic separation recommendation","A medical exemption"],"a":1,"why":"Enrollment in the formal self-directed BCIP is considered the first failure to meet the BCP standard."},{"id":"exp-22-008","ch":22,"ref":"AFH 1, 22.7","q":"When will an Airman who scores at or above 90 in all three components retest for a fitness assessment level of Excellent?","o":["Within 90 days","Within six months","Within 30 days","Within 12 months"],"a":3,"why":"If all three applicable components are scored at or above 90, the individual retests within 12 months."},{"id":"exp-22-009","ch":22,"ref":"AFH 1, 22.7","q":"Within how many days must an Airman who scores Unsatisfactory on the fitness assessment retest?","o":["90 days","180 days","60 days","365 days"],"a":0,"why":"An Unsatisfactory result (composite at or below 74.9 or missed component minimum) requires retest within 90 days."},{"id":"exp-22-010","ch":22,"ref":"AFH 1, 22.8","q":"What must a member have on file prior to deployment regarding fitness?","o":["A body composition waiver","A signed PTL recommendation","A current fitness score","A completed FSQ only"],"a":2,"why":"Members must have a current fitness score on file prior to deployment."},{"id":"exp-22-011","ch":22,"ref":"AFH 1, 22.9","q":"How does AFH 1 define muscular strength?","o":["The ability to execute repeated contractions over time","The maximum force generated by a specific muscle or muscle group","The ability to move a joint freely without pain","The rate at which muscles recover between sets"],"a":1,"why":"Muscular strength is the maximum force generated by a specific muscle or muscle group."},{"id":"exp-22-012","ch":22,"ref":"AFH 1, 22.10","q":"How long should stretches be held, and how many times should each be repeated?","o":["5 to 10 seconds, repeated once","60 to 90 seconds, repeated twice","15 seconds, repeated five times","10 to 30 seconds, repeated three to four times"],"a":3,"why":"Hold stretches 10 to 30 seconds and repeat each stretch three to four times."},{"id":"exp-22-013","ch":22,"ref":"AFH 1, 22.10","q":"What is the minimum recommended recovery period between workouts for the same muscle groups?","o":["48 hours","24 hours","12 hours","72 hours"],"a":0,"why":"Allow at least a 48-hour recovery period between workouts for the same muscle groups."},{"id":"exp-22-014","ch":22,"ref":"AFH 1, 22.10","q":"According to the Principle of Regularity, how many workouts per week are best for optimal gains?","o":["One","Five","Three","Seven"],"a":2,"why":"Establishing a routine of three workouts per week is best for optimal gains."},{"id":"exp-22-015","ch":22,"ref":"AFH 1, 22.11","q":"What are the estimated daily calorie ranges for adult women and adult men, respectively?","o":["2,000-3,000 for women and 1,600-2,400 for men","1,600-2,400 for women and 2,000-3,000 for men","1,200-1,800 for women and 2,500-3,500 for men","1,800-2,200 for women and 2,200-2,800 for men"],"a":1,"why":"Estimated calorie needs range from 1,600-2,400 per day for women and 2,000-3,000 for men."},{"id":"exp-22-016","ch":22,"ref":"AFH 1, 22.12","q":"How quickly can carbohydrates be digested and turned into readily available energy?","o":["Within 5 minutes","Within 2 hours","Within 4 hours","Within 30 to 60 minutes"],"a":3,"why":"Carbohydrates can be digested relatively quickly and available as energy within 30 to 60 minutes."},{"id":"exp-22-017","ch":22,"ref":"AFH 1, 22.14","q":"How many calories per gram do proteins and fats provide, respectively?","o":["Proteins provide four and fats provide nine","Proteins provide nine and fats provide four","Both provide four","Both provide nine"],"a":0,"why":"Proteins provide four calories per gram and fats provide nine calories per gram."},{"id":"exp-22-018","ch":22,"ref":"AFH 1, 22.14","q":"What share of daily calories should saturated fats make up?","o":["20 to 35 percent","Exactly 15 percent","Less than 10 percent","Less than 30 percent"],"a":2,"why":"Saturated fats should make up less than 10 percent of daily calories."},{"id":"exp-22-019","ch":22,"ref":"AFH 1, 22.15","q":"What daily sodium limit is recommended for 'at-risk' groups such as those with high blood pressure, diabetes, or kidney disease?","o":["2,300 milligrams","About 1,500 milligrams","3,400 milligrams","1,000 milligrams"],"a":1,"why":"At-risk groups should limit sodium intake to about 1,500 milligrams per day."},{"id":"exp-22-020","ch":22,"ref":"AFH 1, 22.16","q":"Which statement about dietary supplements is correct?","o":["The FDA tests all supplements before sale","Supplements are always safe in any dose","Proprietary blends list exact ingredient amounts","The FDA does not test supplements before they are sold"],"a":3,"why":"The FDA does not test supplements before they are sold, so look for third-party verification."},{"id":"exp-22-021","ch":22,"ref":"AFH 1, 22.17","q":"Consuming roughly how much caffeine at one time can result in 'caffeine intoxication'?","o":["400-500 milligrams","100 milligrams","750-1,000 milligrams","1,500 milligrams"],"a":0,"why":"Consuming large doses of roughly 400-500 milligrams of caffeine at one time can cause caffeine intoxication."},{"id":"exp-22-022","ch":22,"ref":"AFH 1, 22.17","q":"What are the standard serving sizes for beer, wine, and 80 proof distilled spirits?","o":["16 ounces, 8 ounces, and 3 ounces","8 ounces, 4 ounces, and 1 ounce","12 ounces, 5 ounces, and 1.5 ounces","12 ounces, 6 ounces, and 2 ounces"],"a":2,"why":"Serving sizes are 12 ounces for beer, five ounces for wine, and 1.5 ounces for 80 proof spirits."},{"id":"exp-22-023","ch":22,"ref":"AFH 1, 22.20","q":"Approximately how many deaths per year is tobacco smoke estimated to cause?","o":["150,000","480,000","1 million","75,000"],"a":1,"why":"Tobacco smoke is estimated to cause 480,000 deaths per year."},{"id":"exp-22-024","ch":22,"ref":"AFH 1, 22.25","q":"What is a line of duty determination?","o":["A fitness score entered into myFitness","A medical waiver for a fitness component","A commander's referral to ADAPT","A finding made after an investigation into the circumstances of a member's illness, injury, disease, or death"],"a":3,"why":"A line of duty determination is a finding made after investigating the circumstances of a member's illness, injury, disease, or death."},{"id":"exp-22-025","ch":22,"ref":"AFH 1, 22.36","q":"What does the ACE model for suicide prevention stand for?","o":["Ask, Care, and Escort","Assess, Counsel, and Engage","Alert, Contact, and Escort","Acknowledge, Comfort, and Evaluate"],"a":0,"why":"ACE stands for Ask, Care, and Escort."},{"id":"exp-24-001","ch":24,"ref":"AFH 1, 24.1","q":"As stated in AFI 1-1, what do military customs and courtesies reflect?","o":["The unique nature of our profession and guide significant aspects of our behavior","The personal preferences of individual commanders","Temporary trends in military culture","Only ceremonial traditions with no bearing on daily behavior"],"a":0,"why":"Customs and courtesies reflect the unique nature of the profession and guide significant aspects of behavior."},{"id":"exp-24-002","ch":24,"ref":"AFH 1, 24.4","q":"Which items does AFH 1 list as ways the United States and the USAF are represented through symbolism?","o":["Buildings, roads, and fences","Vehicles and aircraft tail numbers","The United States flag and its colors, songs, official seals, and other nationally recognized objects","Uniforms and headgear only"],"a":2,"why":"Symbols include the U.S. flag and its colors, songs, official seals, and other nationally recognized objects."},{"id":"exp-24-003","ch":24,"ref":"AFH 1, 24.5","q":"Outdoors during the national anthem, when does a uniformed Airman render and hold the salute?","o":["At the halfway point of the anthem until it ends","At the first note and held until the last note of music","Only during the final verse","Only if a flag is visibly displayed"],"a":1,"why":"Outdoors, uniformed Airmen salute at the first note and hold the salute until the last note."},{"id":"exp-24-004","ch":24,"ref":"AFH 1, 24.7","q":"What three elements make up the crest portion of the DAF Coat of Arms?","o":["The shield, the stars, and the numerals","The thunderbolt, the wings, and the flame","The sphere, the star, and the diamonds","The eagle, the wreath, and the cloud form"],"a":3,"why":"The crest consists of the eagle, wreath, and cloud form."},{"id":"exp-24-005","ch":24,"ref":"AFH 1, 24.10","q":"Which titles of the United States Code pertain to proper display and respect for the flag?","o":["Title 4, Title 10, and Title 36","Title 1, Title 2, and Title 3","Title 18, Title 28, and Title 50","Title 5, Title 31, and Title 42"],"a":0,"why":"Title 4, Title 10, and Title 36 USC pertain to flag display and respect."},{"id":"exp-24-006","ch":24,"ref":"AFH 1, 24.11","q":"When was the American flag born, and which body determined its design?","o":["July 4, 1776, by the Continental Congress","September 17, 1787, by the Constitutional Convention","June 14, 1777, by the Second Continental Congress","January 1, 1789, by the First Congress"],"a":2,"why":"Born June 14, 1777, the Second Continental Congress determined the flag would be 13 stripes and 13 stars."},{"id":"exp-24-007","ch":24,"ref":"AFH 1, 24.12","q":"What are the dimensions of the garrison flag, and when is it flown?","o":["3 feet by 4 feet, flown daily","20 feet by 38 feet, flown on holidays and special occasions","5 feet by 9 feet 6 inches, flown in inclement weather","8 feet 11 3/8 inches by 17 feet, flown at reveille"],"a":1,"why":"The garrison flag is 20 by 38 feet and is flown on holidays and special occasions."},{"id":"exp-24-008","ch":24,"ref":"AFH 1, 24.13","q":"How is the flag displayed on Memorial Day?","o":["At full staff all day","Not displayed at all","At half-staff all day","At half-staff until noon"],"a":3,"why":"The flag is displayed at half-staff until noon on Memorial Day."},{"id":"exp-24-009","ch":24,"ref":"AFH 1, 24.14","q":"When the flag is displayed vertically from a building, where must the union be placed?","o":["Uppermost and to the flag's own right (the observer's left)","Uppermost and to the observer's right","At the bottom, centered","At the top center with no side preference"],"a":0,"why":"Displayed vertically, the union is uppermost and to the flag's own right, the observer's left."},{"id":"exp-24-010","ch":24,"ref":"AFH 1, 24.15","q":"Under what single condition may the United States flag be displayed with the union down?","o":["During a parade","At a funeral","As a signal of dire distress in instances of extreme danger to life or property","When lowered at retreat"],"a":2,"why":"The flag may be displayed union down only as a signal of dire distress in extreme danger."},{"id":"exp-24-011","ch":24,"ref":"AFH 1, 24.17","q":"Which individual is defined as a distinguished visitor (DV)?","o":["Any member with more than 20 years of service","A General or Flag Officer","Any senior NCO","Any retired service member"],"a":1,"why":"A DV may be a General/Flag Officer, a government official of BG-equivalent rank or higher, a foreign officer/civilian so designated, or a commander-designated visitor."},{"id":"exp-24-012","ch":24,"ref":"AFH 1, 24.18","q":"When walking, riding, or sitting, where is the senior person given the position of honor?","o":["On the left of the junior","In front of the junior","Behind the junior","On the right of the junior"],"a":3,"why":"The senior person takes the position of honor on the right; the junior takes the senior's left."},{"id":"exp-24-013","ch":24,"ref":"AFH 1, 24.19","q":"How may chaplains be addressed?","o":["As Chaplain or by their ecclesiastical title","Only as Sir or Ma'am","By their grade only","By their last name only"],"a":0,"why":"Chaplains may be addressed as Chaplain or by their ecclesiastical title."},{"id":"exp-24-014","ch":24,"ref":"AFH 1, 24.20","q":"When are salutes rendered indoors?","o":["Whenever two members meet","During all formal events","Only for formal reporting","Whenever indoors and in uniform"],"a":2,"why":"Salutes are not rendered indoors except for formal reporting."},{"id":"exp-24-015","ch":24,"ref":"AFH 1, 24.20","q":"What should an individual carrying articles in both hands do when a salute is impractical?","o":["Drop the items and salute","Nod or offer a verbal greeting","Ignore the other member","Salute with the left hand"],"a":1,"why":"If both hands are occupied and a salute is impractical, nod or offer a verbal greeting."},{"id":"exp-24-016","ch":24,"ref":"AFH 1, 24.21","q":"Which is listed as an official military ceremony in AFH 1?","o":["A unit potluck dinner","A retirement party at a civilian venue","An office holiday gift exchange","Changes and assumptions of command"],"a":3,"why":"Official ceremonies include changes and assumptions of command, promotions, retirements, and funerals, among others."},{"id":"exp-24-017","ch":24,"ref":"AFH 1, 24.23","q":"For whom are full honors reserved during ceremonies such as parades and honor cordons?","o":["Statutory appointees and General or Flag Officers, foreign dignitaries, and occasions promoting international good will","All retired personnel","All SNCOs","Any distinguished visitor without exception"],"a":0,"why":"Full honors are reserved for statutory appointees, General/Flag Officers, foreign dignitaries, and international good-will occasions."},{"id":"exp-24-018","ch":24,"ref":"AFH 1, 24.23","q":"When should a decoration ceremony be conducted after a decoration is approved?","o":["At the next commander's call regardless of timing","Within one year","At the earliest possible date","Only during the member's retirement ceremony"],"a":2,"why":"Decoration ceremonies are conducted at the earliest possible date after approval of the decoration."},{"id":"exp-24-019","ch":24,"ref":"AFH 1, 24.24","q":"When reciting an oath, what may be omitted if desired?","o":["The member's name","The words 'so help me God'","The phrase 'support and defend'","The rank designation"],"a":1,"why":"If desired, the words 'so help me God' may be omitted."},{"id":"exp-24-020","ch":24,"ref":"AFH 1, 24.24","q":"According to the Enlisted Oath, an enlisted member agrees to obey the orders of whom?","o":["Only the immediate supervisor","The installation commander only","Congress","The President of the United States and the officers appointed over them"],"a":3,"why":"The Enlisted Oath commits members to obey the orders of the President and the officers appointed over them."},{"id":"exp-24-021","ch":24,"ref":"AFH 1, 24.26","q":"What does the playing of reveille signal?","o":["The start of the official duty day","The end of the official duty day","The start of a retreat parade","Lights out"],"a":0,"why":"Reveille signals the start of the official duty day."},{"id":"exp-24-022","ch":24,"ref":"AFH 1, 24.29","q":"Who are known as the 'keepers of the sword' for the Order of the Sword?","o":["The base honor guard commander and the protocol officer","The wing commander and the command chief","The Chief Master Sergeant of the Air Force and MAJCOM command chiefs","The Secretary of the Air Force and the Chief of Staff"],"a":2,"why":"The CMSAF and MAJCOM command chiefs are the keepers of the sword."},{"id":"exp-24-023","ch":24,"ref":"AFH 1, 24.30","q":"The flight formation is composed of at least two, but no more than how many, elements?","o":["Six","Four","Eight","Ten"],"a":1,"why":"The flight formation is composed of at least two but no more than four elements."},{"id":"exp-24-024","ch":24,"ref":"AFH 1, 24.31","q":"What are the two parts of a drill command?","o":["The order and the response","The signal and the movement","The call and the reply","The preparatory command and the command of execution"],"a":3,"why":"A drill command usually has two parts: the preparatory command and the command of execution."},{"id":"exp-24-025","ch":24,"ref":"AFH 1, 24.33","q":"What are the four positions of rest?","o":["Parade rest, at ease, rest, and fall out","Attention, parade rest, at ease, and rest","Fall in, attention, rest, and fall out","Parade rest, stand fast, at ease, and rest"],"a":0,"why":"The four positions of rest are parade rest, at ease, rest, and fall out."},{"id":"exp-sjt-001","ch":"sjt","type":"sjt","ref":"AFH 1, 9.11","q":"Two promotion-eligible Airmen tell you they plan to form a two-person study group to quiz each other on the WAPS study guide. What is the MOST effective action?","o":["Explain that group study (two or more people) for promotion testing is strictly prohibited, and direct each Airman to individual self-study","Encourage the group, since studying together builds teamwork and morale","Allow it as long as they study off-duty and off-installation","Join the group yourself to keep the discussion professional"],"a":0,"why":"AFH 1, 9.11 states that group study (two or more people) for the purposes of enlisted promotion testing is strictly prohibited to protect test integrity. The correct action enforces that prohibition and redirects to individual study."},{"id":"exp-sjt-002","ch":"sjt","type":"sjt","ref":"AFH 1, 1.2","q":"A senior Airman regularly tells junior Airmen that the Air Force is 'just a job' and that they should do the bare minimum and leave on time. Which response is the LEAST effective?","o":["Correct the mindset privately and reinforce the higher calling and standards of the profession of arms","Ignore the comments because the Airman still completes his assigned tasks","Mentor the juniors on the oath, duty, and higher standard they accepted","Address the attitude through the chain if it continues to affect the team"],"a":1,"why":"AFH 1, 1.2 teaches that no profession asks more of its members than the profession of arms and that Airmen accept a sacred trust and a higher standard. Ignoring commentary that reduces service to 'just a job' fails to uphold that standard and lets the corrosive attitude spread."},{"id":"exp-sjt-003","ch":"sjt","type":"sjt","ref":"AFH 1, 1.3.1","q":"A coworker asks you to initial his training record for a required task he has not actually completed, promising he will 'do it later.' What is the MOST effective action?","o":["Sign it but write 'not verified' next to your initials","Sign it to spare him paperwork and quietly remind him to finish","Decline to sign, explain that certifying uncompleted training is dishonest, and encourage him to complete the training properly","Report him to the commander immediately without speaking to him first"],"a":2,"why":"AFH 1, 1.3.1 lists honesty as the hallmark of integrity: public servants must conscientiously and accurately report findings and keep their word unquestionable. Certifying training that did not occur is a false report; the honest action is to refuse and correct the record."},{"id":"exp-sjt-004","ch":"sjt","type":"sjt","ref":"AFH 1, 1.3.3","q":"An Airman routinely skips his individual professional development, saying he is 'too busy' and will catch up later. Which response is the LEAST effective?","o":["Hold him accountable and set a realistic catch-up plan","Explain that Excellence In All We Do requires continuous self-development","Challenge him to treat development as a personal obligation","Accept the excuse indefinitely because the mission comes first"],"a":3,"why":"AFH 1, 1.3.3 directs Airmen to continuously advance their craft, complete developmental education, and diligently maintain job skills, knowledge, and personal readiness. Accepting an open-ended excuse abandons the standard of continuous improvement."},{"id":"exp-sjt-005","ch":"sjt","type":"sjt","ref":"AFH 1, 1.4.1","q":"You are weighing whether to bend a reporting rule to make your section look better before an inspection. Which approach is the MOST effective way to evaluate the decision?","o":["Apply the 'network test' - ask how the decision would look if aired on the news or social media - and reject the option if it fails","Ask only whether the action is technically legal","Follow whatever the most senior person in the section prefers","Assume it is acceptable because others in the unit do it"],"a":0,"why":"AFH 1, 1.4.1 describes the network test: asking how a decision would look if broadcast on the news or social media. If the answer brings shame or discredit, the decision fails the test; legality alone is not the ethical standard."},{"id":"exp-sjt-006","ch":"sjt","type":"sjt","ref":"AFH 1, 1.5","q":"A quiet Airman on your team is struggling with a personal issue and falling behind, and a peer says to leave him alone so he will 'figure it out.' What is the MOST effective action?","o":["Remove him from the team so he does not slow the mission","Check in with him, connect him to appropriate support, and help carry the load while he recovers","Leave him alone as advised to build self-reliance","Tell the rest of the team to ignore his situation"],"a":1,"why":"The Airman's Creed commits every Airman to never leave an Airman behind, and the wingman ethos requires caring for fellow Airmen. Reaching out, connecting him to support, and sharing the load honor that commitment."},{"id":"exp-sjt-007","ch":"sjt","type":"sjt","ref":"AFH 1, 9.12","q":"A promotion-eligible Airman reports that the study references for his career field are still not locally available less than 60 days before his scheduled test. What is the MOST effective action?","o":["Tell him to study harder with whatever is on hand","Reassure him the references are not really needed","Advise him to ask the unit WAPS monitor to order the references and, if still unavailable, request a delay in testing","Suggest he borrow a peer's personal notes"],"a":2,"why":"AFH 1, 9.12 requires promotion-eligible Airmen to have access to reference materials at least 60 days before the scheduled test date and authorizes a request for a delay if they do not; Airmen may ask the unit WAPS monitor to order material not locally available."},{"id":"exp-sjt-008","ch":"sjt","type":"sjt","ref":"AFH 1, 9.9","q":"An Airman misses his scheduled promotion test with no valid reason and no prior coordination. What is the LEAST effective response?","o":["Recognize he may be ineligible and cannot test or be considered this cycle","Verify the facts and address any valid reason through the proper channel","Counsel him on the individual responsibility to appear for scheduled testing","Tell him it does not matter and he can simply test next week at his convenience"],"a":3,"why":"AFH 1, 9.9 lists failure to appear for scheduled testing without a valid reason as a basis for promotion ineligibility: the individual cannot test, cannot be considered if already tested, and a projected promotion is canceled. Treating it as inconsequential is inaccurate and ineffective."},{"id":"exp-sjt-009","ch":"sjt","type":"sjt","ref":"AFH 1, 12.14","q":"An Airman confides that he has stopped paying a court-ordered child support obligation out of frustration with his former spouse. What is the MOST effective action?","o":["Advise him that members must comply with court-ordered financial support and that failure can lead to administrative or disciplinary action, and encourage him to resolve it","Tell him it is a private family matter with no military consequences","Advise him to ignore it until a complaint is filed","Suggest he separate from the Air Force to avoid garnishment"],"a":0,"why":"AFH 1, 12.14 requires members to comply with the financial support provisions of a court order or written support agreement, and states that failure to pay debts or support dependents can lead to administrative or disciplinary action."},{"id":"exp-sjt-010","ch":"sjt","type":"sjt","ref":"AFH 1, 12.17","q":"Two weeks after returning from TDY, you realize you have not filed your travel voucher. What is the MOST effective action?","o":["Wait until month's end to batch it with other paperwork","File the voucher promptly in DTS, since travelers are responsible for filing within five business days of return","Ask a coworker to file it for you informally","Skip it because the trip was short"],"a":1,"why":"AFH 1, 12.17 requires travelers to file a travel voucher within five business days of returning to the permanent duty station. Prompt filing satisfies that obligation and avoids false-claim liability."},{"id":"exp-sjt-011","ch":"sjt","type":"sjt","ref":"AFH 1, 12.19","q":"An Airman uses his government travel charge card to buy personal groceries while not in official travel status. Which response is the LEAST effective?","o":["Counsel him that the GTCC is for official travel status only and misuse may result in disciplinary action","Report the misuse through the chain as appropriate","Ignore it because the cardholder pays his own bill anyway","Ensure he understands the reimbursement and split-disbursement requirements"],"a":2,"why":"AFH 1, 12.19 states the cardholder will only use the GTCC while in official travel status and that misuse is subject to administrative or disciplinary action. Ignoring misuse tolerates abuse of government resources."},{"id":"exp-sjt-012","ch":"sjt","type":"sjt","ref":"AFH 1, 12.31","q":"You observe a coworker routinely taking government supplies home for personal use. What is the MOST effective action?","o":["Do nothing because the items are inexpensive","Join in so you are not seen as a snitch","Post about it anonymously on social media","Report the fraud, waste, or abuse to an appropriate supervisor, commander, or IG with factual, specific information"],"a":3,"why":"AFH 1, 12.31 imposes a duty to promptly report fraud, waste, and abuse to an appropriate supervisor, commander, or IG, and requires disclosures to be factual, unbiased, and specific, resolved at the lowest possible level."},{"id":"exp-sjt-013","ch":"sjt","type":"sjt","ref":"AFH 1, 14.2","q":"Your newly formed team is in the storming stage: members are arguing about the approach and resisting each other's ideas. What is the MOST effective action?","o":["Recognize this as a normal stage, keep members focused on understanding one another, and guide them toward shared norms","Disband the team because the conflict means it is failing","Let the loudest member decide to end the arguments","Report the conflict to the commander for discipline"],"a":0,"why":"AFH 1, 14.2 describes storming as a normal, often inevitable stage in which members begin to understand one another before establishing norms in the norming stage. A leader guides the team through it rather than disbanding or punishing."},{"id":"exp-sjt-014","ch":"sjt","type":"sjt","ref":"AFH 1, 14.5","q":"A recurring conflict between two Airmen over task ownership is escalating. Which approach is the LEAST effective for resolving it?","o":["Use the collaborating style to satisfy both sides through honest discussion","Use the avoiding style - remain neutral and let the situation 'work itself out'","Use the compromising style so both parties give something up","Weigh the who, the stakes, and the situation before choosing an approach"],"a":1,"why":"AFH 1, 14.5 notes the avoiding style can result in an escalation of a situation by allowing it to go unresolved. For an escalating conflict, avoiding is the least effective; a more assertive, cooperative approach is warranted."},{"id":"exp-sjt-015","ch":"sjt","type":"sjt","ref":"AFH 1, 14.19","q":"Before counseling an Airman from a very different cultural background about a performance issue, what is the MOST effective preparation?","o":["Assume your own values and perspective are the standard and apply them without adjustment","Avoid the conversation to prevent any chance of offense","Reflect on your own values and biases and consider how the Airman's background may influence perspectives and actions","Ask the Airman's peers to counsel him instead"],"a":2,"why":"AFH 1, 14.19 names self-awareness and cultural awareness as qualities that build credibility: leaders must be aware of their own values and biases and of how cultural differences may influence perspectives and actions before counseling."},{"id":"exp-sjt-016","ch":"sjt","type":"sjt","ref":"AFH 1, 14.23","q":"A peer supervisor consistently gives the best assignments and recognition to a subordinate who is also his close personal friend, and other Airmen resent it. What is the LEAST effective response?","o":["Recognize that perceived favoritism can have negative effects on the organization","Address the appearance of favoritism through the chain","Ensure assignments are based on merit rather than personal relationships","Continue the practice because friendship is a legitimate basis for relationship power"],"a":3,"why":"AFH 1, 14.23 warns that relationship power built on preferential treatment or reciprocity can produce perceived favoritism with negative effects on the organization. Continuing the practice ignores that warning."},{"id":"exp-sjt-017","ch":"sjt","type":"sjt","ref":"AFH 1, 14.25","q":"A new NCOIC rarely makes decisions, is often absent from the work center, and treats Airmen's development as someone else's concern. Which leadership behavior does this describe, and why is it the LEAST effective?","o":["Laissez-faire - it abandons responsibilities and remains indifferent to important issues","Transformational leadership - it inspires the mission","Management by exception-active - it monitors subordinates closely","Contingent rewards - it sets goals and rewards performance"],"a":0,"why":"AFH 1, 14.25 defines laissez-faire leaders as viewing subordinate development as someone else's concern, abandoning responsibilities, remaining indifferent to important issues, and being hesitant to make decisions - a passive, least-effective behavior."},{"id":"exp-sjt-018","ch":"sjt","type":"sjt","ref":"AFH 1, 14.26","q":"Your team's project failed because you gave unclear guidance, and in the after-action review Airmen blame each other. What is the MOST effective action?","o":["Let the Airmen sort out the blame among themselves","Take responsibility for the unclear guidance, treat the failure as a learning tool, and focus the team on improving","Blame the timeline and higher headquarters to protect your credibility","Skip the review to avoid damaging morale"],"a":1,"why":"AFH 1, 14.26 holds that effective leaders treat failure as one of the greatest learning tools and that a leader's credibility depends on taking responsibility for their own actions and those of their Airmen."},{"id":"exp-sjt-019","ch":"sjt","type":"sjt","ref":"AFH 1, 14.29","q":"A supervisor assumes an older Airman cannot learn a new software system and assigns him only menial tasks despite his expressed interest. What is the MOST effective action?","o":["Agree that older Airmen are less adaptable and keep the assignment as is","Move the Airman to another section to avoid the issue","Recognize the assumption as a stereotype and evaluate the Airman on individual strengths and contributions","Reassign the software task to a younger Airman without discussion"],"a":2,"why":"AFH 1, 14.29 states that stereotypes regarding age, experience, background, or perspective are detrimental because they ignore individual strengths and contributions. The correct action rejects the stereotype and judges the Airman as an individual."},{"id":"exp-sjt-020","ch":"sjt","type":"sjt","ref":"AFH 1, 14.31","q":"A shop has adopted a norm in which 'good enough for government work' is accepted and corners are routinely cut. Which action is the LEAST effective?","o":["Recognize it as a negative norm that undermines quality and pride","Model and reinforce positive norms of quality and customer satisfaction","Address the underlying reasons for the behavior through the chain","Accept the norm because it saves time and the mission still gets done"],"a":3,"why":"AFH 1, 14.31 states that the saying 'it's good enough for government work' is a negative norm the USAF cannot accept. Accepting it perpetuates a norm that sanctions low productivity and poor quality."},{"id":"exp-sjt-021","ch":"sjt","type":"sjt","ref":"AFH 1, 17.6","q":"You hear a three-to-five-minute wavering tone over the installation warning system. What is the MOST effective action?","o":["Be alert, execute security measures, follow instructions, and account for personnel","Treat it as a test and continue working","Evacuate to the nearest parking lot and wait","Call the command post to ask what the tone means before acting"],"a":0,"why":"AFH 1, 17.6 identifies the three-to-five-minute wavering tone as indicating an attack or hostile act is imminent or in progress; individual actions are to be alert, execute security measures, follow instructions, and account for personnel."},{"id":"exp-sjt-022","ch":"sjt","type":"sjt","ref":"AFH 1, 17.11","q":"You come upon a vehicle incident with a possible hazardous material release and visible fumes. What is the MOST effective action?","o":["Move close to identify the exact material before doing anything else","Alert others, report to security forces or fire and emergency services, stay uphill and upwind, avoid inhaling fumes, and evacuate if rescue or containment is impractical","Touch the materials to check for leaks","Stand downwind to keep the scene in view until help arrives"],"a":1,"why":"AFH 1, 17.11 directs personnel who witness an incident to alert others, report it, stay uphill and upwind, avoid inhaling fumes, smoke, or vapors, avoid handling materials, and evacuate the area if rescue or containment is impractical."},{"id":"exp-sjt-023","ch":"sjt","type":"sjt","ref":"AFH 1, 17.16","q":"You suspect you were exposed to a hazardous material during a task this morning. What is the MOST effective action?","o":["Wait a few days to see whether symptoms develop","Mention it casually to a coworker","Report the suspected exposure to supervision as soon as practical, not to exceed 24 hours","Avoid reporting it to protect your medical readiness record"],"a":2,"why":"AFH 1, 17.16 requires individuals to report personal injury, property damage, and any suspected exposure to hazardous materials as soon as practical, but not to exceed 24 hours."},{"id":"exp-sjt-024","ch":"sjt","type":"sjt","ref":"AFH 1, 17.22","q":"During an operation, the most junior Airman calls 'Knock-it-off' after spotting a developing hazard, but a senior NCO insists the operation continue. What is the MOST effective action?","o":["Continue, since rank overrides the junior Airman's concern","Let the senior NCO decide after the fact","Document the junior Airman's action as insubordination","Halt and stabilize the operation, since all Airmen regardless of rank may call Knock-it-off and it cannot be overridden by command authority"],"a":3,"why":"AFH 1, 17.22 states all Airmen, regardless of rank, are empowered to use Knock-it-off or Timeout without fear of repercussions, and that the call immediately halts actions and cannot be overridden by command authority."},{"id":"exp-sjt-025","ch":"sjt","type":"sjt","ref":"AFH 1, 17.18","q":"A new work task with no governing technical order is being introduced into your shop. As the supervisor, what is the MOST effective action before it begins?","o":["Determine where people may be injured or equipment damaged and use a job safety analysis to evaluate the task before any operation begins","Let Airmen identify hazards as they go","Rely on the Airmen's common sense","Start the task and correct problems as they arise"],"a":0,"why":"AFH 1, 17.18 requires supervisors, before any operation begins, to determine where people may be injured or equipment damaged, and to use a job safety analysis to evaluate tasks not governed by a technical order or other definitive guidance."},{"id":"exp-sjt-026","ch":"sjt","type":"sjt","ref":"AFH 1, 18.11","q":"At the end of the duty day, you are responsible for the area where classified information is used. What is the MOST effective action?","o":["Rely on the last person out to secure everything","Check the area and record the end-of-day security check on the SF 701 Activity Security Checklist","Skip the check because the vault has an alarm","Do a visual scan but document nothing"],"a":1,"why":"AFH 1, 18.10 requires the SF 701, Activity Security Checklist, to record end-of-day security checks and states it is required for any area where classified information is used or stored."},{"id":"exp-sjt-027","ch":"sjt","type":"sjt","ref":"AFH 1, 18.12","q":"A reporter asks you about classified information that has already appeared on a public internet site. What is the MOST effective action?","o":["Confirm the accuracy of the information since it is already public","Explain what the information means in your own words","Refuse to confirm or comment on the information and report the contact per DoD guidance","Tell the reporter to file a FOIA request, then discuss the details"],"a":2,"why":"AFH 1, 18.12 states that if classified information appears in public media, personnel must not make any statement or comment that confirms its accuracy or verifies it, and must report the matter without discussing it with unauthorized persons."},{"id":"exp-sjt-028","ch":"sjt","type":"sjt","ref":"AFH 1, 18.14","q":"A coworker with a security clearance shows signs of severe financial distress and mentions compulsive gambling. As his supervisor, what is the MOST effective action?","o":["Ignore it because finances are a private matter","Wait until an incident occurs before acting","Advise the Airman to hide the problem from his clearance forms","Report the condition through the chain, since unfavorable conditions bearing on trustworthiness and clearance eligibility must be reported"],"a":3,"why":"AFH 1, 18.14 requires commanders and supervisors to continually observe subordinates and immediately report any unfavorable conduct or conditions bearing on trustworthiness and eligibility to occupy a sensitive position; financial overextension and gambling are listed concerns."},{"id":"exp-sjt-029","ch":"sjt","type":"sjt","ref":"AFH 1, 18.18","q":"An Airman spends most of his duty hours running an outside business on his government computer. Which response is the LEAST effective?","o":["Allow it, because limited personal use is authorized without limit","Counsel him that personal use must be of reasonable duration and frequency, approved, and not adversely affect official duties","Enforce the standard and address the duty-performance impact","Remind him that use must not reflect adversely on the Air Force"],"a":0,"why":"AFH 1, 18.18 limits personal use of government hardware and software to reasonable duration and frequency, requires approval, and bars use that adversely affects duty performance or reflects adversely on the Air Force. Assuming unlimited personal use is the least effective response."},{"id":"exp-sjt-030","ch":"sjt","type":"sjt","ref":"AFH 1, 18.21","q":"While TDY, you need to process sensitive unclassified government information, and the only available computer is a hotel business center. What is the MOST effective action?","o":["Use the hotel business center since it is convenient","Do not use the public computing facility; use only approved government systems or methods","Use the public computer but delete the files afterward","Email the information to your personal account to work on it"],"a":1,"why":"AFH 1, 18.21 prohibits using public computing facilities or services, such as hotel business centers, to process government-owned unclassified, sensitive, or classified information."},{"id":"exp-sjt-031","ch":"sjt","type":"sjt","ref":"AFH 1, 18.31","q":"A foreign national you met socially repeatedly asks detailed questions about your unit's activities and offers gifts. What is the MOST effective action?","o":["Answer generally to be polite since no specifics were exchanged","Accept a small gift but keep the conversation vague","Report the contact to AFOSI promptly, since reportable contacts must be reported","Ignore it and hope the person stops contacting you"],"a":2,"why":"AFH 1, 18.31 requires individuals with reportable contacts to report them to AFOSI, and cites a request by anyone for illegal or unauthorized access to controlled information as a reportable contact."},{"id":"exp-sjt-032","ch":"sjt","type":"sjt","ref":"AFH 1, 19.6","q":"While planning a strike, you notice the proposed target includes a school that is not being used for any military purpose. What is the MOST effective action?","o":["Proceed, since the object is within the target area","Attack it anyway to send a message","Leave the decision to whoever drafted the plan without comment","Recognize that civilian objects are protected from attack and raise the concern through the chain"],"a":3,"why":"AFH 1, 19.6 (distinction) requires that military force be directed only against military objectives and protects civilian objects such as schools from attack. The correct action honors that principle and raises the concern."},{"id":"exp-sjt-033","ch":"sjt","type":"sjt","ref":"AFH 1, 19.9","q":"You witness a member of an allied force commit what appears to be a law-of-war violation. What is the MOST effective action?","o":["Promptly report the suspected violation to your immediate commander or proper authority","Stay silent because the individual is not in your chain of command","Confront the individual in front of others","Document it privately but take no further action"],"a":0,"why":"AFH 1, 19.9 requires personnel who suspect a law-of-war violation to promptly report it to their immediate commander or proper authority, and explicitly includes violations by allies among those that must be reported."},{"id":"exp-sjt-034","ch":"sjt","type":"sjt","ref":"AFH 1, 19.12","q":"You are captured and being questioned. What is the MOST appropriate response regarding the information you provide?","o":["Cooperate fully to improve your treatment","Provide your name, rank, service number, and date of birth, and evade answering further questions to the utmost of your ability","Refuse to provide even your name and rank","Make a deal to trade information for special favors"],"a":1,"why":"AFH 1, 19.12 (Code of Conduct, Article V) requires a prisoner of war to give name, rank, service number, and date of birth, and to evade answering further questions to the utmost, making no statements disloyal or harmful."},{"id":"exp-sjt-035","ch":"sjt","type":"sjt","ref":"AFH 1, 20.7","q":"A self-assessment communicator asks your shop to report compliance on a requirement your shop currently cannot meet. What is the MOST effective action?","o":["Report what you believe leadership wants to hear","Mark it compliant now and fix it quietly later","Accurately report non-compliance and the constraints preventing compliance","Skip the report to avoid highlighting the gap"],"a":2,"why":"AFH 1, 20.7 states the purpose of self-assessment is to report what is true, not what leaders are believed to expect, and that Airmen must report non-compliance and the constraints preventing compliance."},{"id":"exp-sjt-036","ch":"sjt","type":"sjt","ref":"AFH 1, 20.11","q":"An Airman wants to post photos and a description of a recent mission on his personal social media. What is the MOST effective action?","o":["Post it, since it is his personal account","Post it but label it 'unofficial' in the caption","Ask a civilian friend to post it for him","Obtain the necessary review and clearance, starting with public affairs, before releasing any imagery or text"],"a":3,"why":"AFH 1, 20.11 requires members to obtain review and clearance, starting with public affairs, before releasing any proposed statement, text, or imagery to the public, including digital products loaded on unrestricted websites."},{"id":"exp-sjt-037","ch":"sjt","type":"sjt","ref":"AFH 1, 20.13","q":"An Airman asks whether he may wear his uniform while speaking at a partisan political rally. Which response is the LEAST accurate?","o":["He may wear the uniform as long as he does not speak on behalf of a candidate","He may not wear his uniform at a political event or while making a public political speech","He may not participate in partisan rallies or campaign speeches even out of uniform","He may still vote and voice personal opinions not represented as those of the Air Force"],"a":0,"why":"AFH 1, 20.13 prohibits members from wearing the uniform at a political event or while making a public political speech, and from participating in partisan rallies or campaign speeches even out of uniform. Claiming the uniform is allowed so long as the Airman does not speak for a candidate is the least accurate."},{"id":"exp-sjt-038","ch":"sjt","type":"sjt","ref":"AFH 1, 20.16","q":"An Airman who is not under investigation voluntarily tells you he has been misusing a controlled substance and wants help. What is the MOST effective action?","o":["Recommend immediate administrative separation to set an example","Support his self-identification for assessment and treatment, since voluntary self-identification cannot be used against him in UCMJ or discharge characterization actions","Tell him to keep it secret to avoid trouble","Punish him yourself on the spot"],"a":1,"why":"AFH 1, 20.16 encourages self-identification and states commanders may not use voluntary self-identification against a member in an action under the UCMJ or when determining the appropriate characterization of service."},{"id":"exp-sjt-039","ch":"sjt","type":"sjt","ref":"AFH 1, 20.19","q":"Some Airmen plan an informal 'initiation' ritual for new members that involves physically risky and humiliating activities. What is the MOST effective action?","o":["Allow it, since it builds camaraderie and new members consent","Permit it as long as no one is physically injured","Stop the activity and explain that hazing is prohibited in all circumstances, including off-duty and unofficial settings","Attend to supervise and keep it 'safe'"],"a":2,"why":"AFH 1, 20.19 defines hazing and states it is prohibited in all circumstances and environments, including off-duty or 'unofficial' unit functions, and that consent of the victim does not make it acceptable."},{"id":"exp-sjt-040","ch":"sjt","type":"sjt","ref":"AFH 1, 22.19","q":"A few Airmen routinely smoke just outside the building entrance, a few feet from the door and air intake. What is the MOST effective action?","o":["Allow it, since they are outside","Move them only when an inspector is visiting","Tell them to smoke inside to avoid being seen","Enforce the designated tobacco use areas, which must be at least 50 feet from building entrances and air intake ducts"],"a":3,"why":"AFH 1, 22.19 requires tobacco use to occur only in designated areas and sets a minimum distance of at least 50 feet from building entrances and air intake ducts."}];
const CH = {
  1:"Professionalism",5:"Military Organization & Command",7:"Enlisted Force Development",
  8:"Assessments & Recognition",9:"Enlisted Promotions",11:"Personnel Programs & Benefits",
  12:"Finance, Manpower & Resources",14:"Developing Others",15:"Developing Self",
  17:"Emergency Management",18:"Security",19:"Standards of Conduct",
  20:"Enforcing Military Standards",22:"Fitness & Readiness",24:"Military Customs & Courtesies"
};
const KNOWN = BANK.filter(b=>b.ch!=="sjt");
const SJT = BANK.filter(b=>b.ch==="sjt");
const KEY="pfe_trainer_v1";
const PROFILES_KEY="pfe_trainer_profiles";

/* ---------------- profiles & state ---------------- */
function listProfiles(){try{const a=JSON.parse(localStorage.getItem(PROFILES_KEY));return Array.isArray(a)?a:[]}catch(e){return []}}
function writeProfiles(a){localStorage.setItem(PROFILES_KEY,JSON.stringify(a))}
function activeProfile(){const n=localStorage.getItem("pfe_trainer_profile"); if(n)return n; const pl=listProfiles(); return pl[0]||"default";}
function keyOf(name){return KEY+":"+name}
let profile=activeProfile();
let S=load(profile);
function load(name){
  try{const raw=localStorage.getItem(keyOf(name)); if(raw){const p=JSON.parse(raw); p.cards=p.cards||{}; p.hist=p.hist||[]; p.custom=p.custom||[]; p.days=p.days||[]; p.flagged=p.flagged||[]; return p;}}catch(e){}
  return {cards:{},hist:[],custom:[],days:[],goal:20,flagged:[]};
}
function save(){localStorage.setItem(keyOf(profile),JSON.stringify(S))}
function setProfile(name){
  const pl=listProfiles(); if(!pl.includes(name)){pl.push(name);writeProfiles(pl);}
  localStorage.setItem("pfe_trainer_profile",name); profile=name; S=load(name); render(); toast("Profile: "+name);
}
function renameProfile(from,to){
  const pl=listProfiles(); if(to===from||pl.includes(to)){toast(to===from?"Same name":"Name already used");return;}
  const i=pl.indexOf(from); if(i<0)return; pl[i]=to; writeProfiles(pl);
  localStorage.setItem(keyOf(to),localStorage.getItem(keyOf(from))||JSON.stringify(load(from))); localStorage.removeItem(keyOf(from));
  if(profile===from){localStorage.setItem("pfe_trainer_profile",to); profile=to;}
  render(); toast("Renamed to "+to);
}
function deleteProfile(name){
  const pl=listProfiles(); if(pl.length<=1){toast("Keep at least one profile");return;}
  const i=pl.indexOf(name); if(i<0)return; pl.splice(i,1); writeProfiles(pl); localStorage.removeItem(keyOf(name));
  if(profile===name){profile=pl[0]; localStorage.setItem("pfe_trainer_profile",profile); S=load(profile);}
  render(); toast("Deleted "+name);
}
function renderProfile(){
  const el=document.getElementById("profileLabel"); if(el) el.textContent="▣ "+profile;
  const sel=document.getElementById("profileSelect");
  if(sel) sel.innerHTML=listProfiles().map(n=>`<option value="${esc(n)}" ${n===profile?"selected":""}>${esc(n)}</option>`).join("");
}
function profileAction(a){
  if(a==="use"){const sel=document.getElementById("profileSelect"); if(sel&&sel.value)setProfile(sel.value);}
  else if(a==="new"){const n=(prompt("Profile name for this person:","")||"").trim(); if(!n)return; if(listProfiles().includes(n)){toast("Name already used");return;} setProfile(n);}
  else if(a==="rename"){const n=(document.getElementById("profileName").value||"").trim(); if(!n)return toast("Enter a name"); renameProfile(profile,n);}
  else if(a==="delete"){if(confirm('Delete profile "'+profile+'" and its progress?'))deleteProfile(profile);}
}
function allCards(){ return KNOWN.concat(S.custom||[]) }
function cardOf(id){ if(!S.cards[id]) S.cards[id]={e:2.5,i:0,due:0,n:0,r:0,w:0}; return S.cards[id] }
function isFlagged(id){ return (S.flagged||[]).includes(id) }
function toggleFlag(id){ S.flagged=S.flagged||[]; const i=S.flagged.indexOf(id); if(i>=0)S.flagged.splice(i,1); else S.flagged.push(id); save(); render(); }

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepareQuestion(q){
  const order=shuffle(q.o.map((_,i)=>i));
  return {...q,o:order.map(i=>q.o[i]),a:order.indexOf(q.a)};
}
function prepareQuestions(items){return items.map(prepareQuestion)}
function today(){return new Date().toISOString().slice(0,10)}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1900)}
function chName(c){return CH[c]||"Scenario"}

function chapterStats(){
  const cards=allCards(); const out={};
  Object.keys(CH).forEach(c=>{out[c]={seen:0,total:0,r:0,w:0,acc:0,score:0}});
  cards.forEach(q=>{const o=out[q.ch]; if(!o)return; o.total++; const c=S.cards[q.id];
    if(c&&c.n>0){o.seen++; o.r+=c.r; o.w+=c.w}});
  Object.keys(out).forEach(c=>{const o=out[c]; const t=o.r+o.w; o.acc=t?o.r/t:0;
    o.score=o.total?o.acc*(0.4+0.6*Math.min(1,o.seen/o.total)):0});
  return out;
}
function readiness(){
  const st=chapterStats(); const ks=Object.keys(st);
  const mean=ks.reduce((s,c)=>s+st[c].score,0)/ks.length;
  return Math.round(mean*100);
}
function readinessLabel(v){
  if(v>=78)return["Strong","var(--good)"]; if(v>=60)return["On track","var(--acc)"];
  if(v>=38)return["Building","var(--warn)"]; return["Not ready","var(--bad)"];
}
function studyKey(){ // per-card due count
  const now=Date.now(); return allCards().filter(q=>{const c=S.cards[q.id];return !c||c.due<=now}).length;
}
function markStudyDay(){const d=today(); if(!S.days.includes(d)){S.days.push(d); if(S.days.length>400)S.days=S.days.slice(-400)}}
function streak(){
  const set=new Set(S.days); let n=0; const d=new Date();
  for(let i=0;i<400;i++){const k=new Date(d.getTime()-i*864e5).toISOString().slice(0,10);
    if(set.has(k))n++; else if(i>0)break;}
  return n;
}

/* ---------------- router ---------------- */
let view="home", session=null;
const NAVS=[["home","Today","1"],["drill","Drill","2"],["study","Study","3"],["read","Read","4"],["mock","Mock PFE","5"],["stats","Stats","6"],["data","Data","7"]];
function nav(html){return html}
function setView(v){view=v;session=null;render();window.scrollTo(0,0)}
function renderNav(){
  const SHORT={home:"Today",drill:"Drill",study:"Study",read:"Read",mock:"Mock",stats:"Stats",data:"Data"};
  const ICO={home:"◧",drill:"✎",study:"↻",read:"❏",mock:"⏱",stats:"▤",data:"⚙"};
  $("#nav").innerHTML=NAVS.map(([k,l,n])=>`<button data-nav="${k}" class="${view===k?"on":""}">${l}<span class="k">${n}</span></button>`).join("");
  $("#mob").innerHTML=NAVS.map(([k,l])=>`<button data-nav="${k}" class="${view===k?"on":""}">
     <span class="ico">${ICO[k]}</span>${SHORT[k]}</button>`).join("");
}
function render(){
  renderNav();
  const v=$("#view");
  if(session && session.mode==="run") v.innerHTML=renderRun();
  else if(session && session.mode==="result") v.innerHTML=renderResult();
  else v.innerHTML = ({home:vHome,drill:vDrill,study:vStudy,read:vRead,mock:vMock,stats:vStats,data:vData})[view]();
  bind();
  renderProfile();
}

/* ---------------- HOME ---------------- */
function vHome(){
  const r=readiness(), [lbl,col]=readinessLabel(r), st=chapterStats();
  const due=studyKey(), sk=streak();
  const lastMock=S.hist.filter(h=>h.mode==="mock").slice(-1)[0];
  const weakest=Object.keys(st).map(c=>[c,st[c]]).filter(([c,o])=>o.total)
    .sort((a,b)=>a[1].score-b[1].score)[0];
  return `
  <h1>Today</h1>
  <p class="sub">SSgt PFE prep · 80-item format: 60 AFH 1 knowledge + 20 situational judgment, 1.25 points each. Built from the latest published SSgt WAPS catalog; verify your cycle when the 27E5 catalog releases.</p>

  <div class="hero">
    <div class="panel readiness">
      <div class="spread" style="align-items:flex-start">
        <div>
          <div class="big num">${r}<small>/100</small></div>
          <div style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:${col};margin-top:6px">${lbl}</div>
        </div>
        <div style="text-align:right">
          <div class="metric num">${sk}<small>day streak</small></div>
        </div>
      </div>
      <div class="bar" style="margin-top:14px"><i style="width:${r}%;background:${col}"></i></div>
      <p class="hint" style="margin:12px 0 0">Readiness = per-chapter accuracy weighted by how much of that chapter you've actually covered. It only moves when you answer new items.</p>
    </div>
    <div class="grid">
      <div class="panel spread">
        <div><div class="metric num">${due}</div><small class="hint">cards due now</small></div>
        <button class="btn primary" data-go="study">Review</button>
      </div>
      <div class="panel">
        <div class="spread" style="margin-bottom:10px">
          <span class="hint" style="letter-spacing:.07em;text-transform:uppercase;font-size:11px">Weakest chapter</span>
          ${weakest?`<span class="mini">${Math.round(weakest[1].acc*100)}%</span>`:""}
        </div>
        ${weakest?`<div style="font-size:14px;margin-bottom:12px">${esc(chName(weakest[0]))}</div>
        <button class="btn" style="width:100%" data-drill="${weakest[0]}">Drill chapter ${weakest[0]}</button>`
        :`<div class="hint">Answer a few questions to find your weak spots.</div>`}
      </div>
