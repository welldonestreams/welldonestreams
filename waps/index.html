<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Free, unofficial WAPS SSgt PFE practice with sourced AFH 1 questions, mock exams, spaced repetition, and progress tracking.">
<link rel="manifest" href="/waps/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PFE Trainer — WAPS SSgt</title>
<style>
:root{
  --bg:#0d0f11; --panel:#15181b; --panel2:#1a1e22; --line:#252b31;
  --ink:#e9e7e2; --muted:#8d949b; --dim:#656d75;
  --acc:#e0a03c; --acc-dim:#3a2c15;
  --good:#57a06e; --bad:#c4553f; --warn:#c98a2e;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-wrap:pretty}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh}
.rail{width:214px;flex:0 0 214px;border-right:1px solid var(--line);padding:18px 12px;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{padding:2px 10px 16px}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand span{display:block;font-size:11px;color:var(--dim);font-family:var(--mono);
  letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  color:var(--muted);font-size:14px;text-align:left;width:100%}
.nav button:hover{background:var(--panel);color:var(--ink)}
.nav button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--acc)}
.nav .k{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto}
.railfoot{margin-top:auto;padding:10px;font-size:11px;color:var(--dim);line-height:1.5}
main{flex:1;min-width:0;padding:22px 26px 90px;max-width:1080px}
.mobile{display:none}

/* ---------- generic ---------- */
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
  margin:26px 0 10px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;
  font-size:14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:#333c44}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#1a1206;font-weight:600}
.btn.primary:hover{background:#eaa943}
.btn.ghost{background:transparent}
.btn.danger{color:#e08b78;border-color:#3a2622}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
  padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--acc);background:var(--acc-dim);padding:2px 7px;border-radius:4px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.readiness{padding:18px}
.readiness .big{font-family:var(--mono);font-size:52px;line-height:1;letter-spacing:-.04em}
.readiness .big small{font-size:18px;color:var(--dim);margin-left:2px}
.bar{height:6px;background:#22282e;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
.metric{font-family:var(--mono);font-size:22px}
.metric small{font-size:11px;color:var(--dim);display:block;font-family:var(--sans);letter-spacing:.06em;text-transform:uppercase}

table.ch{width:100%;border-collapse:collapse;font-size:13px}
table.ch th{text-align:left;font-weight:500;color:var(--dim);font-size:11px;text-transform:uppercase;
  letter-spacing:.07em;padding:0 8px 8px;border-bottom:1px solid var(--line)}
table.ch td{padding:9px 8px;border-bottom:1px solid #1b2025;vertical-align:middle}
table.ch tr:hover td{background:#12161a}
table.ch td.n{width:34px;font-family:var(--mono);color:var(--dim)}
table.ch td.a{width:120px}
table.ch td.c{width:78px;text-align:right;font-family:var(--mono);color:var(--muted)}
td .bar{height:5px}
.mini{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* ---------- question ---------- */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:12px;color:var(--dim)}
.qhead .l{display:flex;align-items:center;gap:10px;font-family:var(--mono);letter-spacing:.04em}
.qtext{font-size:19px;line-height:1.45;margin:0 0 18px;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 14px;
  font-size:15px;line-height:1.4;min-height:52px}
.opt:hover:not(.locked){border-color:#39424a;background:var(--panel2)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--dim);width:16px;flex:0 0 16px;padding-top:2px}
.opt.correct{border-color:var(--good);background:#14201a}
.opt.correct .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:#201512}
.opt.wrong .k{color:var(--bad)}
.opt.selected{border-color:var(--acc);background:var(--acc-dim)}
.opt.selected .k{color:var(--acc)}
.opt.locked{cursor:default}
.explain{margin-top:14px;border-left:2px solid var(--acc);padding:2px 0 2px 14px;font-size:14px;color:#c9c6bf}
.explain b{color:var(--acc);font-weight:600;display:block;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:4px;font-family:var(--mono)}
.ref{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.progressline{height:3px;background:#1e2429;border-radius:2px;overflow:hidden;margin-bottom:18px}
.progressline i{display:block;height:100%;background:var(--acc)}
.timer{font-family:var(--mono);font-size:15px}
.timer.low{color:var(--bad)}

/* ---------- results ---------- */
.score{font-family:var(--mono);font-size:64px;line-height:1;letter-spacing:-.045em}
.score small{font-size:16px;color:var(--dim)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1b2025;font-size:14px}
.kv span:last-child{font-family:var(--mono);color:var(--ink)}
.review{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--panel)}
.review .rr{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.review .ok{color:var(--good)}.review .no{color:var(--bad)}

/* ---------- misc ---------- */
textarea,input{background:#0f1215;border:1px solid var(--line);border-radius:8px;color:var(--ink);
  padding:11px 12px;font:14px/1.5 var(--mono);width:100%;resize:vertical}
label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px;
  text-transform:uppercase;letter-spacing:.07em}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
select{background:#0f1215;border:1px solid var(--line);border-radius:8px;color:var(--ink);
  padding:10px 12px;font:14px var(--sans);min-height:44px;width:100%}
.hint{font-size:12px;color:var(--dim);line-height:1.5}
.histrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1b2025;font-size:13px}
.histrow .bar{flex:1}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13px;z-index:99;
  box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media(max-width:820px){
  .rail{display:none}
  main{padding:16px 14px 92px;max-width:none}
  .hero{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr 1fr}
  .qtext{font-size:17px}
  .readiness .big{font-size:44px}
  .mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0f1215;
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
  .mobile button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;color:var(--dim);padding:7px 2px;border-radius:8px;letter-spacing:.03em}
  .mobile button.on{color:var(--acc)}
  .mobile .ico{font-size:15px;line-height:1}
  table.ch td.a{width:80px}
  table.ch td.c{width:64px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="rail">
    <div class="brand"><b>PFE Trainer</b><span>WAPS · SSgt Prep</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot">
      <span id="bankCount">Loading question bank…</span><br>
      <span id="profileLabel" style="color:var(--acc);cursor:pointer"></span><br>
      Offline-ready · saved on this device<br>
      <span style="color:var(--dim)">Unofficial · Source: AFH 1</span>
    </div>
  </aside>
  <main id="view"></main>
  <nav class="mobile" id="mob"></nav>
</div>
<div class="toast" id="toast"></div>
<script>
const BANK = [{"id":"1-1","ch":1,"ref":"AFH 1, 1.3","q":"Which list correctly states the Air Force core values?","o":["Integrity First, Service Before Self, Excellence in All We Do","Integrity First, Service Before Self, Excellence Always","Duty, Honor, Country","Mission First, People Always, Excellence in All We Do"],"a":0,"why":"The three core values are Integrity First, Service Before Self, and Excellence in All We Do — the universal standard used to evaluate the ethical climate of all USAF organizations."},{"id":"1-2","ch":1,"ref":"AFH 1, 1.4","q":"AFH 1 distinguishes values from ethics. How does it define ethics?","o":["The systematic reflection of moral values that enables us to live and act according to our beliefs","A written code of punishable offenses under the UCMJ","The personal opinion of a commander applied to a situation","The set of customs enforced by the First Sergeant"],"a":0,"why":"Moral values describe what we hold to be right and wrong; ethics is the systematic reflection of those values enabling us to live and act according to our beliefs."},{"id":"1-3","ch":1,"ref":"AFH 1, 1.4.1","q":"What is an ethical dilemma?","o":["A situation where you are forced to choose between at least two alternatives","Any situation requiring a commander's decision","A violation of the UCMJ that carries punitive action","A disagreement between two Airmen about standards"],"a":0,"why":"An ethical dilemma is a situation where one is forced to choose between at least two alternatives. It is not automatically a legal violation."},{"id":"1-4","ch":1,"ref":"AFH 1, 1.4.1","q":"Which three items are identified as the general causes or sources of ethical dilemmas?","o":["Uncertainty, competing values, and potential harm","Greed, laziness, and dishonesty","Rank, authority, and seniority","Time pressure, fatigue, and resources"],"a":0,"why":"The three general causes are uncertainty, competing values, and potential harm."},{"id":"1-5","ch":1,"ref":"AFH 1, 1.4.1","q":"Uncertainty as a source of ethical dilemmas results from which of the following?","o":["Not having all the facts, not having enough experience, or not having a clearly established policy","Having too many competing regulations to read","A commander who refuses to issue guidance","Operating in a deployed environment"],"a":0,"why":"Uncertainty results from not having all the facts, not having enough experience, or not having a clearly established policy, procedure, or rule to follow."},{"id":"1-6","ch":1,"ref":"AFH 1, 1.5","q":"Who presented the Airman's Creed to the Air Force, and in what year?","o":["General T. Michael Moseley, 18th Chief of Staff, in 2007","General David Flosi, 20th Chief of Staff, in 2024","Secretary of the Air Force, in 1999","General Henry H. Arnold, in 1947"],"a":0,"why":"General T. Michael Moseley, 18th Air Force Chief of Staff, presented the creed in 2007 to reinvigorate the Total Force and build a warrior ethos."},{"id":"1-7","ch":1,"ref":"AFH 1, 1.4","q":"Which regulation establishes the basic ethical principles and guidelines that must be followed by every government employee?","o":["Title 5, CFR, Part 2635, Standards of Ethical Conduct for Employees of the Executive Branch","DoDD 7045.14","DAFMAN 36-2806","AFH 1, Chapter 19"],"a":0,"why":"Title 5, CFR, Part 2635 establishes the basic ethical principles and guidelines that every government employee must follow."},{"id":"5-1","ch":5,"ref":"AFH 1, 5.15","q":"How long is the Chief of Staff of the Air Force appointed for, and by whom?","o":["Four years, appointed by the President with the advice and consent of the Senate","Two years, appointed by the Secretary of Defense","Four years, elected by the Air Staff","Indefinitely, appointed by the Secretary of the Air Force"],"a":0,"why":"The CSAF is a USAF General Officer appointed for four years by the U.S. President, by and with the advice and consent of the Senate."},{"id":"5-2","ch":5,"ref":"AFH 1, 5.14","q":"Who is the head of the Department of the Air Force, and to whom is that position subject?","o":["The Secretary of the Air Force, subject to the authority, control, and direction of the Secretary of Defense","The Chief of Staff of the Air Force, subject to the President","The Secretary of Defense, subject to Congress","The Vice Chief of Staff, subject to the CSAF"],"a":0,"why":"The SecAF is the head of the Department of the Air Force and is subject to the authority, control, and direction of the Secretary of Defense."},{"id":"5-3","ch":5,"ref":"AFH 1, 5.15","q":"What is a Component MAJCOM (C-MAJCOM)?","o":["The type of MAJCOM that is the USAF Component to a unified combatant command","A MAJCOM that has been placed in reserve status","A MAJCOM made up only of civilian employees","A MAJCOM that reports directly to the Secretary of the Air Force"],"a":0,"why":"A C-MAJCOM is the type of MAJCOM that serves as the USAF Component to a unified combatant command."},{"id":"5-4","ch":5,"ref":"AFH 1, 5.16","q":"How is a Numbered Air Force (NAF) described?","o":["An administrative level of command directly under a MAJCOM","The lowest level of command in the USAF","A joint command led by another service","A command equivalent to a wing"],"a":0,"why":"The NAF is an administrative level of command directly under a MAJCOM."},{"id":"5-5","ch":5,"ref":"AFH 1, 5.16","q":"What is the minimum adjusted population a wing will have?","o":["At least 1,000 (750 for Air National Guard and Air Force Reserve Command)","At least 500 for all components","At least 2,500","At least 1,500 with no component exception"],"a":0,"why":"Wings have a minimum adjusted population of at least 1,000 — 750 for ANG and AFRC — including manpower authorizations, students, and a percentage of contractor workforces."},{"id":"5-6","ch":5,"ref":"AFH 1, 5.15","q":"Where is Air Combat Command (ACC) headquartered, and when was it activated as a MAJCOM?","o":["Joint Base Langley-Eustis, Virginia; 1 June 1992","Scott Air Force Base, Illinois; 1 June 1992","Barksdale Air Force Base, Louisiana; 7 August 2009","Wright-Patterson Air Force Base, Ohio; 1 July 1992"],"a":0,"why":"ACC was activated as a MAJCOM on 1 June 1992 and is headquartered at Joint Base Langley-Eustis, Virginia."},{"id":"5-7","ch":5,"ref":"AFH 1, 5.15","q":"Air Force Materiel Command (AFMC) is headquartered at which location?","o":["Wright-Patterson Air Force Base, Ohio","Robins Air Force Base, Georgia","Hurlburt Field, Florida","Ramstein Air Base, Germany"],"a":0,"why":"AFMC was activated as a MAJCOM on 1 July 1992 and is headquartered at Wright-Patterson AFB, Ohio."},{"id":"5-8","ch":5,"ref":"AFH 1, 5.15","q":"Air Mobility Command (AMC) is headquartered at which installation?","o":["Scott Air Force Base, Illinois","Joint Base Pearl Harbor-Hickam, Hawaii","Joint Base San Antonio-Randolph, Texas","Joint Base Langley-Eustis, Virginia"],"a":0,"why":"AMC was activated as a MAJCOM on 1 June 1992 and is headquartered at Scott AFB, Illinois."},{"id":"7-1","ch":7,"ref":"AFH 1, 7.21","q":"Which four areas make up the Airman Leadership School (ALS) curriculum?","o":["Mission, leadership, problem solving, and USAF culture","Mission, discipline, drill, and heritage","Leadership, management, doctrine, and joint operations","Mission, fitness, customs, and finance"],"a":0,"why":"The ALS curriculum includes (1) mission, (2) leadership, (3) problem solving, and (4) USAF culture."},{"id":"7-2","ch":7,"ref":"AFH 1, 7.21","q":"The NCO Distance Learning course consists of which three course modules?","o":["Course foundation, leadership and management, and operational Airman","Mission, doctrine, and joint warfighting","Self-awareness, followership, and supervision","Foundation, culture, and fitness"],"a":0,"why":"The NCO-DL course consists of three modules: course foundation, leadership and management, and operational Airman."},{"id":"7-3","ch":7,"ref":"AFH 1, 7.21","q":"Which statement about EPME Distance Learning Course (DLC) completion is correct?","o":["DLC completion is no longer a prerequisite for resident attendance, effective 26 April 2018","DLC completion has always been required before resident attendance","DLC completion is required only for the Chief Leadership Course","DLC completion is required only for Air National Guard members"],"a":0,"why":"EPME Distance Learning Courses completion is no longer a prerequisite for resident attendance effective 26 April 2018."},{"id":"7-4","ch":7,"ref":"AFH 1, 7.22","q":"Enlisted Joint PME (EJPME) II is focused on preparing which members?","o":["E-7 through E-9 for senior leadership roles in joint assignments","E-4 through E-6 for their first supervisory role","E-1 through E-3 for upgrade training","Civilian employees only"],"a":0,"why":"EJPME II is focused on preparing E-7/E-9 enlisted members for their senior leadership roles in joint assignments."},{"id":"7-5","ch":7,"ref":"AFH 1, 7.22","q":"What must students do before enrolling in EJPME?","o":["Complete rank-required service enlisted PME","Complete an associate degree","Obtain a joint duty assignment","Complete the Chief Leadership Course"],"a":0,"why":"Students must complete rank-required service enlisted PME before enrolling in EJPME."},{"id":"7-6","ch":7,"ref":"AFH 1, 7.21","q":"In what year were enlisted PME schools established across the USAF?","o":["1955","1947","1971","1963"],"a":0,"why":"In 1955, enlisted PME schools were established across the USAF to give NCOs the leadership and management training needed for day-to-day mission execution."},{"id":"7-7","ch":7,"ref":"AFH 1, 7.21","q":"Which statement about collegiate credit for enlisted PME is correct?","o":["With the exception of the Chief Leadership Course, Airmen are awarded CCAF credit, which is accredited through Air University by SACSCOC","No enlisted PME course awards collegiate credit","Only the Chief Leadership Course awards collegiate credit","Credit is awarded only after promotion to MSgt"],"a":0,"why":"Except for the Chief Leadership Course, Airmen earn collegiate credit through CCAF, accredited through Air University by the Southern Association of Colleges and Schools Commission on Colleges."},{"id":"8-1","ch":9,"ref":"AFH 1, 9.2","q":"What is the authorized average percentage of RegAF enlisted members in pay grades E-8 and E-9 in a fiscal year?","o":["No more than 2.5 percent and 1.25 percent, respectively","No more than 3.0 percent each","No more than 1.25 percent and 2.5 percent, respectively","No more than 5 percent each"],"a":0,"why":"The authorized average of RegAF enlisted members in E-8 and E-9 in a fiscal year may not be more than 2.5 percent and 1.25 percent, respectively."},{"id":"8-2","ch":8,"ref":"AFH 1, 8.21","q":"The Combat Action Medal is awarded to military members in which grades?","o":["E-1 through O-6 who actively participated in ground or air combat on or after 11 September 2001","E-1 through E-9 only","O-1 through O-6 only","All grades with no restriction"],"a":0,"why":"The Combat Action Medal is awarded to grades E-1 through O-6 who actively participated in ground or air combat on or after 11 September 2001."},{"id":"8-3","ch":8,"ref":"AFH 1, 8.20","q":"The Gallant Unit Citation was approved by the Secretary of the Air Force in which year?","o":["March 2004","September 2001","June 1992","August 2009"],"a":0,"why":"The Gallant Unit Citation was approved by the SecAF in March 2004 for extraordinary heroism in action against an armed enemy on or after 11 September 2001."},{"id":"8-4","ch":8,"ref":"AFH 1, 8.19","q":"The Afghanistan Campaign Medal recognizes service during which period?","o":["11 September 2001 to 31 August 2021","9 March 2003 to 31 December 2011","11 September 2001 to a future date to be determined","24 March 1999 to 31 December 2013"],"a":0,"why":"Established 29 November 2004, the Afghanistan Campaign Medal covers designated Afghanistan operations from 11 September 2001 to 31 August 2021."},{"id":"8-5","ch":8,"ref":"AFH 1, 8.21","q":"The Air Reserve Forces Meritorious Service Medal is awarded for what service?","o":["4 continuous years on or after 1 April 1965, or 3 continuous years on or after 1 July 1975","2 continuous years in any status","10 continuous years of reserve service","5 continuous years on or after 11 September 2001"],"a":0,"why":"It recognizes exemplary behavior, efficiency, and fidelity in enlisted status in the ANG and AFR for 4 continuous years (on/after 1 Apr 1965) or 3 continuous years (on/after 1 Jul 1975)."},{"id":"8-6","ch":8,"ref":"AFH 1, 8.18","q":"Which publication outlines the Department of the Air Force Military Awards and Decorations Program?","o":["DAFMAN 36-2806, Military Awards: Criteria and Procedures","DAFMAN 36-2664","AFH 1, Chapter 8","DoDD 7045.14"],"a":0,"why":"The program is outlined in DAFMAN 36-2806, Military Awards: Criteria and Procedures, which recognizes units, organizations, and individuals and fosters morale and esprit de corps."},{"id":"9-1","ch":9,"ref":"AFH 1, 9.12","q":"According to DAFMAN 36-2664, how far in advance of the scheduled test date must promotion eligible Airmen have access to reference materials?","o":["At least 60 days","At least 30 days","At least 90 days","At least 120 days"],"a":0,"why":"Promotion eligible Airmen must have access to reference materials at least 60 days before the scheduled test date."},{"id":"9-2","ch":9,"ref":"AFH 1, 9.11","q":"Which statement about group study for enlisted promotion testing is correct?","o":["Group study of two or more people for promotion testing purposes is strictly prohibited","Group study is permitted if led by an NCO","Group study is permitted off-duty only","Group study is encouraged by WAPS"],"a":0,"why":"Airmen must use a self-initiated program of individual study; group study (two or more people) for promotion testing is strictly prohibited."},{"id":"9-3","ch":9,"ref":"AFH 1, 9.11","q":"Enlisted personnel who violate promotion test prohibitions are subject to prosecution under which article of the UCMJ?","o":["Article 92","Article 134","Article 120","Article 15"],"a":0,"why":"Violators are subject to prosecution under Article 92 of the UCMJ for violating a lawful general regulation."},{"id":"9-4","ch":9,"ref":"AFH 1, 9.11","q":"Which of the following is prohibited under AFH 1's promotion testing rules?","o":["Sharing pretests, recalled test questions, personal study materials, highlighted references, or commercial study guides with others","Using official electronic study references on a government computer","Reviewing your DVR in PRDA","Taking leave to study"],"a":0,"why":"Sharing pretests or recalled questions, personal study materials, underlined or highlighted study references, and commercial study guides with other individuals is prohibited. Government computers may only be used to view official electronic references."},{"id":"9-5","ch":9,"ref":"AFH 1, 9.14","q":"What is the Data Verification Record (DVR)?","o":["The document used for promotion consideration and the most important tool to review for record completeness","A form used to request a test date change","A counseling form completed by the supervisor","The enlistment contract addendum for promotion"],"a":0,"why":"The DVR is the document utilized for promotion consideration and is the most important tool to review to ensure the promotion record is complete. It is reviewed in ARMS/PRDA."},{"id":"9-6","ch":9,"ref":"AFH 1, 9.13","q":"What is the promotion eligibility cutoff date (PECD)?","o":["The date promotion criteria are considered for promotion, used to determine eligibility and when selection folder data must be complete","The first day of the WAPS testing window","The date a member arrives at a new duty station","The date promotion results are released"],"a":0,"why":"The PECD determines promotion eligibility and is the cutoff for when selection folder contents and promotion evaluation brief data must be updated and complete."},{"id":"9-7","ch":9,"ref":"AFH 1, 9.10","q":"Which publication contains the Enlisted Promotions References and Requirements Catalog (EPRRC)?","o":["The EPRRC is the catalog that lists applicable study references Airmen must obtain for their cycle","It is AFH 1, Chapter 9, Attachment 2","It is the DVR generated in PRDA","It is DAFMAN 36-2664, Part Four"],"a":0,"why":"Eligible individuals must obtain all applicable study references as outlined in the EPRRC. The EPRRC is the WAPS catalog of study references for the cycle."},{"id":"9-8","ch":9,"ref":"AFH 1, 9.10","q":"A member who will be unavailable during the entire testing cycle must do what?","o":["Be prepared to test prior to departure, even if that is before the first day of the testing cycle","Request a waiver from AFPC after the cycle ends","Test during the supplemental cycle only","Transfer eligibility to the next promotion year"],"a":0,"why":"Members unavailable for the entire testing cycle must be prepared to test before they depart, even ahead of the official first day of the cycle."},{"id":"11-1","ch":11,"ref":"AFH 1, 11.8","q":"Under the Blended Retirement System (BRS), how is retired pay calculated?","o":["2.0% times years of service times the average of the highest 36 months of base pay","2.5% times years of service times final basic pay","2.0% times years of service times final basic pay","2.5% times years of service times the highest 36 months of base pay"],"a":0,"why":"BRS applies to members who entered on or after 1 January 2018: 2.0% × YOS × average of the highest 36 months of base pay, with full CPI inflation protection."},{"id":"11-2","ch":11,"ref":"AFH 1, 11.8","q":"Which retirement plan applies to members who entered service prior to 8 September 1980?","o":["Final Basic Pay — 2.5% times years of service times basic pay","High-3 — 2.5% times years of service times the highest 36 months","BRS — 2.0% times years of service times the high-36","REDUX only"],"a":0,"why":"The Final Basic Pay plan uses 2.5% × YOS × basic pay for members who entered service prior to 8 September 1980."},{"id":"11-3","ch":11,"ref":"AFH 1, 11.8","q":"A 30-year career is computed as 2% times 20 years plus 3.5% for the 10 years beyond 20. What is the maximum multiplier at 30 years?","o":["75%","70%","80%","100%"],"a":0,"why":"That computation results in a maximum of 75% of the retired pay base at 30 years; service beyond 30 years adds 2.5% per year, up to 100%."},{"id":"11-4","ch":11,"ref":"AFH 1, 11.3","q":"What are the maximum SGLI and FSGLI coverages described in AFH 1?","o":["SGLI up to $500,000; FSGLI up to $100,000 for spouse and $10,000 for dependent children","SGLI up to $400,000; FSGLI up to $50,000 for spouse","SGLI up to $500,000; FSGLI up to $25,000 for spouse","SGLI up to $250,000; FSGLI up to $100,000 for spouse"],"a":0,"why":"SGLI provides up to $500,000 in life insurance; FSGLI provides up to $100,000 for a spouse and $10,000 for dependent children."},{"id":"11-5","ch":11,"ref":"AFH 1, 11.8","q":"Enlisted members are eligible to retire with how much service?","o":["20 years of Total Active Federal Military Service, with no restrictions per DAFI 36-3203","15 years of TAFMS","18 years of active service with commander approval","20 years of total service including inactive time"],"a":0,"why":"Enlisted members are eligible to retire with 20 years of TAFMS and no restrictions per DAFI 36-3203, Service Retirements."},{"id":"11-6","ch":11,"ref":"AFH 1, 11.3","q":"Where are legal services performed on an installation?","o":["By the Office of the Staff Judge Advocate — not within Military & Family Readiness Centers","By the M&FRC legal assistance office","By the first sergeant","By the Inspector General"],"a":0,"why":"Legal services are not performed by or within M&FRCs; they are performed by the Office of the Staff Judge Advocate on the installation."},{"id":"11-7","ch":11,"ref":"AFH 1, 11.5","q":"When personal status or family circumstances change requiring a DAF Form 357, members must notify their commander or first sergeant within what timeframe?","o":["Immediately, or within 30 days (60 days for Selected Reserve)","Within 10 days for all components","Within 90 days","Within 45 days (15 days for Selected Reserve)"],"a":0,"why":"Members must notify their commander or first sergeant immediately, or within 30 days (60 days for Selected Reserve), if changes require completion of a DAF Form 357."},{"id":"11-8","ch":11,"ref":"AFH 1, 11.10","q":"What is the Red Cross toll free number for service members and families in the United States?","o":["1-800-733-2767","1-877-272-7337","1-800-342-9647","1-888-999-2767"],"a":0,"why":"AFH 1 lists the American Red Cross toll free number for service members and families in the U.S. as 1-800-733-2767."},{"id":"12-1","ch":12,"ref":"AFH 1, 12.27","q":"The DoD budget program operates on a fiscal year basis covering which period?","o":["1 October through the following 30 September","1 January through 31 December","1 July through 30 June","1 April through 31 March"],"a":0,"why":"The budget program operates on a fiscal year basis from 1 October through the following 30 September."},{"id":"12-2","ch":12,"ref":"AFH 1, 12.29","q":"The Future Years Defense Program (FYDP) is composed of how many major force programs?","o":["11 major force programs and over 3,600 active program elements","7 major force programs and 1,200 program elements","15 major force programs and 500 program elements","5 major force programs and 900 program elements"],"a":0,"why":"The FYDP is composed of 11 major force programs and over 3,600 active program elements used to categorize functional or organizational entities and their resources."},{"id":"12-3","ch":12,"ref":"AFH 1, 12.32","q":"Which form is required documentation for investigating the loss, damage, destruction, or theft of government property?","o":["DD Form 200, Financial Liability Investigation of Property Loss","DAF Form 357","SF 312","DD Form 1149"],"a":0,"why":"DD Form 200 documents the facts and circumstances of loss, damage, destruction, or theft and is required for financial liability investigations."},{"id":"12-4","ch":12,"ref":"AFH 1, 12.30","q":"Who appoints a property custodian?","o":["An accountable property officer, commander, or chief of staff agency","The unit first sergeant only","The base comptroller only","The member's supervisor"],"a":0,"why":"A property custodian is appointed by an accountable property officer, commander, or chief of staff agency and is directly responsible for physical custody, inventory, accounting, and reconciliation."},{"id":"12-5","ch":12,"ref":"AFH 1, 12.28","q":"USAF program execution is reviewed during budget execution reviews in which months?","o":["February, April (with the internal mid-year review), and July","January, June, and December","March, August, and November","October, January, and April"],"a":0,"why":"Program execution is reviewed in February, April (concurrent with the internal USAF mid-year review), and July."},{"id":"12-6","ch":12,"ref":"AFH 1, 12.30","q":"How should emergency work requests be requested and accomplished?","o":["By the quickest means possible, to include verbal or phone communication","Only through written DD Form 200 submission","Only through the unit's monthly work-order cycle","After the next budget execution review"],"a":0,"why":"Emergency work requests should be requested and accomplished by the quickest means possible, including verbal or phone communication."},{"id":"14-1","ch":14,"ref":"AFH 1, 14.25","q":"How is transformational leadership defined?","o":["A style of leadership defined by offering followers a vision and inspiring their mission","A style built on rank-based authority and compliance","A style focused solely on task proficiency","A style that trades rewards for performance"],"a":0,"why":"Transformational leadership is defined by the application of offering followers a vision and inspiring their mission."},{"id":"14-2","ch":14,"ref":"AFH 1, 14.25","q":"What is inspirational motivation?","o":["Leaders develop and articulate visions that paint an optimistic, enthusiastic, and inspiring picture of the future","Leaders reward followers who meet production goals","Leaders enforce standards through corrective action","Leaders delegate all vision-setting to subordinates"],"a":0,"why":"Inspirational motivation is when leaders develop and articulate visions that paint an optimistic and enthusiastic picture of the future that is appealing and inspiring to followers."},{"id":"14-3","ch":14,"ref":"AFH 1, 14.23","q":"What is task power?","o":["Power that stems from being good at a particular task and being able to help others with a process they are responsible for","Power granted by a commander's appointment letter","Power derived from controlling resources and budgets","Power earned through seniority and time in grade"],"a":0,"why":"Task power stems from being good at a particular task and being able to help others with a process or procedure they may be responsible for."},{"id":"14-4","ch":14,"ref":"AFH 1, 14.19","q":"Why does AFH 1 emphasize self-awareness in leaders?","o":["Self-aware leaders act consistently with their own values and are less likely to project their biases onto Airmen","Self-aware leaders are automatically promoted faster","Self-awareness replaces the need for feedback","Self-awareness is required for enlisted performance reports"],"a":0,"why":"Self-aware leaders are more likely to act consistently with their own values and actions and less likely to project their own biases onto Airmen."},{"id":"14-5","ch":14,"ref":"AFH 1, 14.26","q":"How does AFH 1 describe charisma?","o":["An energy emitted by leaders to inspire Airmen to perform a task when aspects of the mission are not intrinsically motivating","A personality trait that cannot be developed","The ability to enforce discipline without counseling","The authority to direct work by position alone"],"a":0,"why":"Charisma is an energy emitted by leaders to inspire Airmen to perform a task or objective when aspects of a mission are not intrinsically motivating or compelling."},{"id":"14-6","ch":14,"ref":"AFH 1, 14.26","q":"How do effective leaders view failure?","o":["As one of the greatest learning tools an organization has for achieving success","As something to be hidden from higher headquarters","As grounds for immediate removal from a position","As an unavoidable result of junior personnel"],"a":0,"why":"Leadership involves risks and rewards, and effective leaders realize failure is one of the greatest learning tools an organization has for achieving success."},{"id":"15-1","ch":15,"ref":"AFH 1, 15.31","q":"Critical listening is best described as the sum of which two elements?","o":["Informative listening and critical thinking","Empathic listening and note taking","Active listening and paraphrasing","Informative listening and nonverbal feedback"],"a":0,"why":"Critical listening is usually thought of as the sum of informative listening and critical thinking, because the listener is actively analyzing and evaluating the message."},{"id":"15-2","ch":15,"ref":"AFH 1, 15.31","q":"When is empathic listening most appropriate?","o":["When communication is emotional, or when the relationship matters as much as the message","When time is short and facts must be transmitted","When delivering formal briefings to senior leaders","When documenting a disciplinary action"],"a":0,"why":"Empathic listening is often useful when communication is emotional or when the relationship between speaker and listener is as important as the message — such as mentoring and counseling."},{"id":"15-3","ch":15,"ref":"AFH 1, 15.26","q":"Which type of speech often includes humor and wit, such as a speech to entertain at a dining-out?","o":["Entertaining speech","Informative speech","Persuasive speech","Ceremonial speech of instruction"],"a":0,"why":"Entertaining speeches often include humor and wit to entertain listeners, such as a speech to entertain at a dining-out."},{"id":"15-4","ch":15,"ref":"AFH 1, 15.28","q":"How does AFH 1 define gestures?","o":["The purposeful use of the hands, arms, shoulders, and head to reinforce what is being said","Unconscious movements that reveal nervousness","Any movement made while speaking","Hand movements used only in formal ceremonies"],"a":0,"why":"Gestures are the purposeful use of the hands, arms, shoulders, and head to reinforce what is being said. Purposeful body movement is free, yet deliberate."},{"id":"15-5","ch":15,"ref":"AFH 1, 15.28","q":"Purposeful, effective body movement during a speech is best described as which of the following?","o":["Free, yet deliberate movement","Constant motion to hold attention","Rigidly still posture","Movement timed to each sentence"],"a":0,"why":"AFH 1 describes purposeful, effective body movement as free, yet deliberate movement."},{"id":"17-1","ch":17,"ref":"AFH 1, 17.21","q":"What is Step 3 of the Five-Step Risk Management Process?","o":["Develop controls and make decisions","Identify the hazards","Assess the hazards","Supervise and review"],"a":0,"why":"Step 3 of the Five-Step Risk Management Process is to develop controls and make decisions."},{"id":"17-2","ch":17,"ref":"AFH 1, 17.21","q":"The risk assessment matrix associated with Step 2 forms a risk assessment for each hazard by combining which two factors?","o":["Probability of occurrence and severity","Cost and schedule","Frequency and duration","Manning and training"],"a":0,"why":"The risk assessment matrix combines the probability of occurrence with severity to form a risk assessment for each hazard."},{"id":"17-3","ch":17,"ref":"AFH 1, 17.20","q":"In-depth risk management planning is normally reserved for which situations?","o":["Complex operations and systems, and high priority or high visibility situations where hazards are not well understood or easily predictable","Routine daily tasks with known hazards","Any activity requiring a supervisor's signature","Only deployed operations"],"a":0,"why":"In-depth risk management is for complex operations and systems and high priority, high visibility situations where hazards are not well understood or easily predictable."},{"id":"17-4","ch":17,"ref":"AFH 1, 17.18","q":"A job safety analysis is used in which situation?","o":["To evaluate each work task not governed by a technical order or other definitive guidance, or when a new task or process is introduced","To evaluate tasks already covered by a technical order","Only after a mishap has occurred","Only for tasks performed by civilians"],"a":0,"why":"A job safety analysis evaluates tasks not governed by a TO or other definitive guidance, and when a new work task or process is introduced into the workplace."},{"id":"17-5","ch":17,"ref":"AFH 1, 17.19","q":"How often do the principles of risk management apply?","o":["24 hours a day, 7 days a week, 365 days a year, by all personnel for all on- and off-duty activities","Only during duty hours","Only during high-risk activities","Only when a supervisor directs"],"a":0,"why":"These principles are the cornerstones of effective risk management and apply 24/7/365 by all personnel for all on- and off-duty activities."},{"id":"17-6","ch":17,"ref":"AFH 1, 17.21","q":"What two actions make up Step 5 of the Risk Management Process?","o":["Supervising and monitoring the operation, and reviewing and evaluating to ensure risk and cost are in balance","Identifying hazards and assessing risks","Developing controls and making decisions","Implementing controls and re-briefing"],"a":0,"why":"Step 5 includes (1) supervising and monitoring the operation or activity and (2) reviewing and evaluating to ensure risk and cost are in balance."},{"id":"17-7","ch":17,"ref":"AFH 1, 17.21","q":"What must be established to ensure corrective or preventative action taken was effective?","o":["A feedback system","A mishap report","A risk assessment matrix","A safety bulletin board"],"a":0,"why":"A feedback system must ensure corrective or preventative action was effective and that newly discovered hazards are analyzed with follow-on corrective action."},{"id":"18-1","ch":18,"ref":"AFH 1, 18.11","q":"Before granting access to classified information, a person must have which three things?","o":["Security clearance eligibility, a signed SF 312, and a need-to-know","A CAC, a signed NDA, and a supervisor's approval","Security clearance eligibility, a badge, and an escort","Need-to-know, a briefing, and a background check"],"a":0,"why":"Access requires (1) security clearance eligibility, (2) a signed Standard Form 312, Classified Information Non-Disclosure Agreement, and (3) a need-to-know."},{"id":"18-2","ch":18,"ref":"AFH 1, 18.10","q":"Unauthorized disclosure of which level of classified information could reasonably be expected to cause exceptionally grave damage to national security?","o":["Top Secret","Secret","Confidential","Controlled Unclassified Information"],"a":0,"why":"Top Secret applies when unauthorized disclosure could reasonably be expected to cause exceptionally grave damage to national security."},{"id":"18-3","ch":18,"ref":"AFH 1, 18.10","q":"Unauthorized disclosure of Secret information could reasonably be expected to cause what?","o":["Serious damage to national security","Exceptionally grave damage to national security","Damage to national security","No damage to national security"],"a":0,"why":"Secret applies when unauthorized disclosure could reasonably be expected to cause serious damage; Confidential applies to damage."},{"id":"18-4","ch":18,"ref":"AFH 1, 18.11","q":"Which cover sheet is used for Top Secret information outside of storage?","o":["SF 703","SF 704","SF 705","SF 312"],"a":0,"why":"SF 703 is the Top Secret cover sheet, SF 704 the Secret cover sheet, and SF 705 the Confidential cover sheet. SF 312 is the non-disclosure agreement."},{"id":"18-5","ch":18,"ref":"AFH 1, 18.11","q":"To be authorized to derivatively classify information within DoD, personnel must meet which training requirements?","o":["Receive initial training before making derivative classification decisions and refresher training every year","Complete a single initial training course only","Receive refresher training every three years","Be a commissioned officer"],"a":0,"why":"All cleared DoD personnel are authorized to derivatively classify if they received initial training before making derivative classification decisions and refresher training every year."},{"id":"18-6","ch":18,"ref":"AFH 1, 18.12","q":"What is a compromise in the security context?","o":["A security incident (a violation) involving unauthorized disclosure of classified information to a person without valid clearance, access, or need to know","Any lost or misplaced document regardless of classification","A failed inspection of a classified storage area","An inadvertent public release of unclassified information"],"a":0,"why":"A compromise is a security violation in which there is unauthorized disclosure of classified information to persons without a valid clearance, authorized access, or need-to-know."},{"id":"18-7","ch":18,"ref":"AFH 1, 18.11","q":"An authorized person who removes classified material from storage must do what?","o":["Keep it under constant surveillance","Secure it in a locked desk drawer","Log the removal within 24 hours only","Notify the commander in writing before removal"],"a":0,"why":"An authorized person shall keep classified material removed from storage under constant surveillance."},{"id":"19-1","ch":19,"ref":"AFH 1, 19.12","q":"When questioned, what information is a prisoner of war required by the Geneva Conventions to give?","o":["Name, rank, service number, and date of birth","Name, unit, and mission","Name, rank, and home address","Name, rank, and names of fellow captives"],"a":0,"why":"When questioned, a POW is required by the Geneva Conventions and permitted by the UCMJ to give name, rank, service number, and date of birth."},{"id":"19-2","ch":19,"ref":"AFH 1, 19.12","q":"Under the Code of Conduct, what is required of the senior prisoner of war?","o":["Represent prisoners of war in matters of camp administration, health, welfare, and grievances","Approve all communications with captors","Assign work details to junior POWs","Determine punishments for camp infractions"],"a":0,"why":"The senior POW is required to represent POWs in matters of camp administration, health, welfare, and grievances."},{"id":"19-3","ch":19,"ref":"AFH 1, 19.12","q":"AFH 1 distinguishes capture from evasion. Capture occurs when which conditions exist?","o":["The member has no means to resist, evasion is impossible, and further fighting would lead to death with no significant loss to the enemy","The member is outnumbered and low on ammunition","The member is wounded and cannot walk","The member's unit has been ordered to withdraw"],"a":0,"why":"Capture occurs when a member has no means to resist, evasion is impossible, and further fighting would lead to death of the U.S. member with no significant loss to the enemy."},{"id":"19-4","ch":19,"ref":"AFH 1, 19.12","q":"A prisoner of war who voluntarily informs or collaborates with the captor is subject to what?","o":["Punishment under the UCMJ after repatriation as a traitor to the United States and fellow POWs","Immediate release by the captor","No consequence, since the Code of Conduct is not punitive","Administrative discharge only"],"a":0,"why":"A POW who voluntarily informs or collaborates with the captor is a traitor to the United States and fellow POWs, and after repatriation is subject to punishment under the UCMJ."},{"id":"19-5","ch":19,"ref":"AFH 1, 19.11","q":"AFH 1 describes the Code of Conduct as which of the following?","o":["A moral code providing a standard of conduct that all members are expected to measure up to","A punitive article of the UCMJ","An administrative instruction for deployed personnel","A treaty obligation under the Geneva Conventions"],"a":0,"why":"The Code of Conduct is a moral code designed to provide U.S. military personnel with a standard of conduct that all members are expected to measure up to."},{"id":"20-1","ch":20,"ref":"AFH 1, 20.21","q":"The Equal Opportunity office must complete the informal complaint process within how many calendar days of filing?","o":["30 calendar days, unless the complainant grants an extension not to exceed 60 additional days","45 calendar days with no extension","60 calendar days with a 30-day extension","10 calendar days with a 20-day extension"],"a":0,"why":"The EO office must complete the informal complaint process within 30 calendar days unless the complainant grants an extension not to exceed 60 additional calendar days."},{"id":"20-2","ch":20,"ref":"AFH 1, 20.21","q":"For a civilian formal EO complaint, initial contact must occur within how many calendar days of the alleged discriminatory matter?","o":["45 calendar days","30 calendar days","60 calendar days","180 calendar days"],"a":0,"why":"For the complaint to be processed at the formal stage, initial contact must be within 45 calendar days of the matter alleged to be discriminatory, or of the effective date of a personnel action."},{"id":"20-3","ch":20,"ref":"AFH 1, 20.21","q":"How long does the EO office have to make a determination to accept, dismiss, or partially dismiss a formal complaint so an investigation can be completed?","o":["180 calendar days from the date filed","90 calendar days from the date filed","45 calendar days from the date filed","365 calendar days from the date filed"],"a":0,"why":"The EO office must process formal complaints expeditiously and determine whether to accept, dismiss, or partially dismiss within 180 calendar days from the date filed."},{"id":"20-4","ch":20,"ref":"AFH 1, 20.17","q":"How does AFH 1 define fraternization?","o":["An unprofessional relationship between an officer and enlisted member specifically prohibited by Article 134, UCMJ","Any personal relationship between two members of different ranks","A relationship between a supervisor and a subordinate","Dating within the same unit"],"a":0,"why":"Fraternization is an unprofessional relationship between an officer and enlisted member specifically prohibited by Article 134, UCMJ."},{"id":"20-5","ch":20,"ref":"AFH 1, 20.20","q":"Formal complaints of sexual harassment are referred to which agency for an independent investigation?","o":["Security forces, pursuant to 10 USC § 1561","The Equal Opportunity office","The Inspector General","The servicing legal office"],"a":0,"why":"Formal complaints of sexual harassment are referred to security forces for an independent investigation pursuant to 10 USC § 1561."},{"id":"20-6","ch":20,"ref":"AFH 1, 20.22","q":"Who is the Victims' Counsel?","o":["A military attorney authorized to provide independent legal representation to eligible victims of sexual assault, sexual misconduct, stalking, and similar crimes","A civilian advocate assigned by the SARC","The squadron first sergeant","A paralegal in the legal office"],"a":0,"why":"The Victims' Counsel is a military attorney authorized to provide independent legal representation to eligible victims."},{"id":"20-7","ch":20,"ref":"AFH 1, 20.22","q":"Sexual assault encompasses offenses prohibited by which UCMJ articles?","o":["Articles 120, 120b, and 80","Articles 92 and 134","Articles 128 and 128a","Articles 107 and 121"],"a":0,"why":"Sexual assault encompasses offenses prohibited by Articles 120, 120b, and 80, including rape, sexual assault, aggravated and abusive sexual contact, forcible sodomy, and attempts."},{"id":"22-1","ch":22,"ref":"AFH 1, 22.34","q":"Under DoDI 6490.08, mental health providers are required to disclose which information to commanders?","o":["Safety issues (suicidal or violent thoughts or self-injurious behavior) and fitness for duty issues","All counseling session notes","Any diagnosis of PTSD","Only information the member consents to release"],"a":0,"why":"Providers must disclose safety and fitness-for-duty issues to commanders; all other information is confidential."},{"id":"22-2","ch":22,"ref":"AFH 1, 22.40","q":"What are the Air Force Medical Service's four primary objectives?","o":["Promote and sustain a healthy and fit force, prevent illness and injury, restore health, and optimize human performance","Recruit, train, equip, and deploy medics","Treat, transport, document, and report","Prevent, protect, respond, and recover"],"a":0,"why":"The AFMS's four primary objectives are to promote and sustain a healthy and fit force, prevent illness and injury, restore health, and optimize human performance."},{"id":"22-3","ch":22,"ref":"AFH 1, 22.27","q":"How does AFH 1 describe psychological first aid?","o":["A way of reducing initial and ongoing stress by developing adaptive coping and recovery skills","A formal mental health diagnosis","A mandatory counseling session after deployment","A medical treatment administered only by providers"],"a":0,"why":"Psychological first aid reduces initial and ongoing stress by developing adaptive coping and recovery skills."},{"id":"22-4","ch":22,"ref":"AFH 1, 22.29","q":"Which of the following are listed as signs of physical stress?","o":["Frequent illness, headaches, high blood pressure, increased heart rate, physical exhaustion, sleep disturbances, or weight gain or loss","Only diagnosed medical conditions","Withdrawal from social activities and loss of interest","Increased motivation and focus"],"a":0,"why":"Physical stress can manifest as frequent illness, headaches, high blood pressure, increased heart rate, physical exhaustion, sleep disturbances, or weight change."},{"id":"22-5","ch":22,"ref":"AFH 1, 22.32","q":"The redeployment support timeline identifies activities at which junctures?","o":["Critical redeployment, recovery, reintegration, and reconstitution","Notification, deployment, tour, and return","Pre-deployment, mid-tour, and post-deployment","Train, deploy, employ, and redeploy"],"a":0,"why":"The redeployment support timeline identifies activities at the critical redeployment, recovery, reintegration, and reconstitution junctures."},{"id":"22-6","ch":22,"ref":"AFH 1, 22.32","q":"Which aspect of readiness does AFH 1 emphasize in the deployment cycle?","o":["Receiving continued support upon return from deployment","Completing pre-deployment training","Securing financial entitlements before departure","Arranging household goods shipment"],"a":0,"why":"While preparation, deployment, and post-deployment support are all important, receiving continued support upon return from deployment is an emphasized aspect of readiness."},{"id":"24-1","ch":24,"ref":"AFH 1, ch. 24 Drill Glossary","q":"In drill, what is an element?","o":["The basic formation; the smallest drill unit, comprised of at least 3 individuals, usually 8 to 12, one of whom is the element leader","A formation of exactly four individuals","A unit of two or more flights","The largest drill unit in a squadron"],"a":0,"why":"An element is the basic formation and smallest drill unit — at least 3 individuals, usually 8 to 12, one designated as the element leader."},{"id":"24-2","ch":24,"ref":"AFH 1, 24.35","q":"The three asymmetrical spires of the Air Force Memorial reach what heights?","o":["201, 231, and 270 feet","150, 200, and 250 feet","180, 220, and 260 feet","201, 251, and 301 feet"],"a":0,"why":"The star is centered at the base of the three asymmetrical spires reaching heights of 201, 231, and 270 feet."},{"id":"24-3","ch":24,"ref":"AFH 1, 24.35","q":"What is central to the Air Force Memorial and who created it?","o":["A 16-foot bronze Honor Guard Statue created by sculptor Zenos Frudakis","A 20-foot granite eagle created by Felix de Weldon","A 12-foot bronze airman created by James Earle Fraser","A 16-foot marble statue created by Daniel Chester French"],"a":0,"why":"Central to the Air Force Memorial is the 16-foot bronze Honor Guard Statue, created by sculptor Zenos Frudakis."},{"id":"24-4","ch":24,"ref":"AFH 1, 24.20","q":"Saluting recipients of the Medal of Honor is best described how?","o":["Encouraged as a matter of respect and courtesy, though not required by law or regulation, and rendered regardless of rank or status","Required by regulation for all military members in uniform","Required only when in uniform and of junior rank","Prohibited unless the recipient is in uniform"],"a":0,"why":"Although not required by law or military regulation, members of the uniformed services are encouraged to render salutes to Medal of Honor recipients as a matter of respect and courtesy, whether or not in uniform and regardless of rank or status."},{"id":"24-5","ch":24,"ref":"AFH 1, 24.34","q":"The Enlisted Heritage Hall was developed in which year, and from what original structure?","o":["1983, from a 1942 segregated dining facility","1971, from a 1947 aircraft hangar","1990, from a 1960 barracks","1983, from a 1955 classroom building"],"a":0,"why":"The 14,000 square foot Enlisted Heritage Hall was developed by the Air Force Senior NCO Academy in 1983 and was originally a 1942 segregated dining facility."},{"id":"24-6","ch":24,"ref":"AFH 1, ch. 24 Devices Glossary","q":"The Desert Storm device is awarded for support of operations during which period?","o":["17 January 1991 to 28 February 1991","2 August 1990 to 28 February 1991","11 September 2001 to 31 August 2021","24 March 1999 to 31 December 2013"],"a":0,"why":"The device is awarded for support of Desert Storm and Liberation of Kuwait in the Persian Gulf, Red Sea, Gulf of Aden, Iraq, Kuwait, Saudi Arabia, Oman, Bahrain, Qatar, and UAE, 17 Jan 91 to 28 Feb 91."},{"id":"sjt-1","ch":"sjt","type":"sjt","q":"You are a newly appointed supervisor. A SrA on your team is consistently late and has missed two mandatory training deadlines in the last month. He tells you privately that his spouse is deployed and he is struggling with childcare. What is the MOST effective action?","o":["Address the performance directly with him, connect him with Military & Family Readiness and the first sergeant for family support, and document a clear plan with follow-up dates","Say nothing to avoid adding stress and cover his absences yourself","Immediately initiate administrative paperwork to establish a pattern for separation","Announce the issue at the next squadron formation so the team understands the standard"],"a":0,"why":"Effective supervision corrects the standard while addressing the real cause. AFH 1 emphasizes knowing your Airmen, using support resources (M&FRC, first sergeant, Military & Family Life Counselors), and keeping documentation and follow-up on the standard.","ref":"AFH 1, 11.3; 14.22"},{"id":"sjt-2","ch":"sjt","type":"sjt","q":"During a high-tempo maintenance operation, you notice a troop bypassing a technical order step to save time. He says the expediter told him to 'just get it done.' What is the MOST effective action?","o":["Stop the task, apply risk management to the deviation, and notify the expediter and supervisor that TO compliance cannot be bypassed without proper authorization","Let it continue because the expediter has more experience","Document it in the shift log after the task is complete","Ask the troop to sign a statement that he chose to bypass the step"],"a":0,"why":"Risk management principles apply 24/7 and cannot be overridden by convenience or verbal direction. The correct action halts the unsafe practice, addresses the hazard, and elevates the deviation through the chain.","ref":"AFH 1, 17.19"},{"id":"sjt-3","ch":"sjt","type":"sjt","q":"A subordinate tells you in confidence that a coworker made a sexually explicit comment to her. She does not want to make a formal complaint. What is the MOST effective action?","o":["Explain her informal and formal options, connect her with the EO office and SARC as appropriate, and take immediate action to address the behavior and prevent reprisal","Promise complete confidentiality and take no further action","Tell her to handle it directly with the coworker as adults","Wait until she decides to file so you avoid overstepping"],"a":0,"why":"Commanders and supervisors must take immediate and appropriate action once aware of inappropriate behavior or allegations, and are encouraged to consult the EO office before acting. You cannot promise silence that leaves a hostile environment unaddressed.","ref":"AFH 1, 20.18"},{"id":"sjt-4","ch":"sjt","type":"sjt","q":"You discover a classified document left on a printer in an unsecured area. What is the MOST effective action?","o":["Secure the document immediately, maintain control of it, and report the security incident through the proper channel","Leave it but tell a coworker to watch the area","Photograph it for evidence and return it to the printer for the owner","Discard it in the shred bin and say nothing to avoid getting someone in trouble"],"a":0,"why":"Each individual is responsible for safeguarding classified information and reporting security incidents. The person with authorized possession must maintain control and keep classified material under constant surveillance.","ref":"AFH 1, 18.12"},{"id":"sjt-5","ch":"sjt","type":"sjt","q":"Your flight is tasked with a last-minute mission change. Two Airmen on the team are clearly burned out, and one admits to drinking more on weekends. What is the MOST effective action?","o":["Re-brief the task with risk management, redistribute the workload where possible, and connect the Airman with support resources while continuing to monitor","Tell them to push through because the mission comes first","Report the Airman to the commander for an alcohol incident","Ignore the signs until performance degrades"],"a":0,"why":"Airmen under stress are at elevated risk. AFH 1 calls for recognizing stress, restructuring work where possible, and using support resources — while still accomplishing the mission through sound risk management.","ref":"AFH 1, 22.30"},{"id":"sjt-6","ch":"sjt","type":"sjt","q":"A peer NCO asks you to share the questions you remember from last cycle's promotion test to help him study. What is the MOST effective action?","o":["Decline, explain that discussing or sharing recalled test content is prohibited under Article 92, and point him to the official study references","Share only the questions you are confident about","Share them but ask him not to tell anyone","Report him to the IG immediately without discussing it"],"a":0,"why":"Discussing promotion test content with anyone other than the TCO or TE, and sharing recalled questions or personal study materials, is prohibited and punishable under Article 92. The correct action is to refuse, inform, and redirect to official references.","ref":"AFH 1, 9.11"},{"id":"sjt-7","ch":"sjt","type":"sjt","q":"You are leading a team and a junior Airman proposes a process change that contradicts how your shop has always done it, but his data suggests it would reduce errors. What is the MOST effective action?","o":["Evaluate the data with him, test the change in a controlled way if feasible, and adopt it if it holds up while managing the change with the team","Reject it because he lacks experience and the current process works","Adopt it immediately to encourage initiative","Tell him to submit it through the suggestion program and drop it"],"a":0,"why":"AFH 1 stresses leaders who are flexible, listen to other points of view, and change course when things are not going well, while the people supporting a change must be motivated to support it.","ref":"AFH 1, 14.26"},{"id":"sjt-8","ch":"sjt","type":"sjt","q":"A subordinate's duty performance is strong but his fitness test is overdue and he keeps rescheduling. What is the MOST effective action?","o":["Counsel him on the standard and consequences, identify and remove the barrier, and set a firm date with follow-up","Let it go since his work performance is strong","Write him up immediately without a conversation","Report him to the first sergeant and let them handle it"],"a":0,"why":"Enforcing standards means addressing the deficiency early, understanding the barrier, and following up — not ignoring it because other performance is good, nor escalating before supervising.","ref":"AFH 1, 20.9"},{"id":"sjt-9","ch":"sjt","type":"sjt","q":"You are the senior person present when a vehicle mishap injures two Airmen. What is the MOST effective action?","o":["Render aid, secure the scene and account for personnel, then report through the chain and preserve information for the investigation","Begin interviewing witnesses to determine fault","Move the vehicle and clean the area before leadership arrives","Wait for security forces before doing anything"],"a":0,"why":"Immediate priorities are life safety, scene control, accountability, and notification. Determining fault is not the senior present member's role — preserving the scene supports the later investigation (DD Form 200 process for property).","ref":"AFH 1, 17.2"},{"id":"sjt-10","ch":"sjt","type":"sjt","q":"A subordinate comes to you saying he is having thoughts of self-harm. What is the MOST effective action?","o":["Stay with him, get him to immediate help through the chain and medical or mental health, and ensure he is not left alone","Keep it between the two of you to protect his privacy","Tell him to use the Employee Assistance Program on his own time","Wait to see if he brings it up again"],"a":0,"why":"The most important step is getting the individual the help they need if in distress. Safety and fitness-for-duty concerns are exactly what providers must disclose to commanders under DoDI 6490.08 — confidentiality does not extend to imminent risk.","ref":"AFH 1, 22.35"},{"id":"sjt-11","ch":"sjt","type":"sjt","q":"You are preparing a briefing for the group commander and your facts are incomplete. A peer offers to 'fill in the blanks' with numbers he thinks are close. What is the MOST effective action?","o":["State what is verified, clearly identify what is unknown or an estimate, and commit to providing confirmed data by a specific time","Use the peer's numbers since the briefing cannot slip","Omit the section entirely without explanation","Present the estimates as facts to avoid looking unprepared"],"a":0,"why":"AFH 1 frames the Code of Ethics around integrity and high standards of conduct. Presenting unverified data as fact is misrepresentation; labeling uncertainty and following up protects both the mission and your credibility.","ref":"AFH 1, 1.3.1"},{"id":"sjt-12","ch":"sjt","type":"sjt","q":"Two of your Airmen have an ongoing personal conflict that is starting to affect the shift. What is the MOST effective action?","o":["Meet with each individually to understand the issue, set clear behavioral expectations for the workplace, and monitor with follow-up","Order them to stop talking to each other entirely","Counsel both together and warn them of paperwork","Move one to another shift without discussion"],"a":0,"why":"AFH 1 emphasizes understanding another's position to develop a plan of action that works, appropriate professional relationships, and supervisors addressing inappropriate behavior early.","ref":"AFH 1, 14.22"},{"id":"sjt-13","ch":"sjt","type":"sjt","q":"You are assigned a task you have never done before, with a short suspense and no template. What is the MOST effective action?","o":["Identify who has done it before, ask for their guidance and any references, then build a draft early enough to get review","Wait for clearer guidance before starting","Build it from scratch without asking anyone so you own it","Delegate it to the most junior Airman on the team"],"a":0,"why":"Task power and effective development come from knowing who is good at what. Seeking references and early review, rather than guessing or stalling, is how you protect quality against a short suspense.","ref":"AFH 1, 14.23"},{"id":"sjt-14","ch":"sjt","type":"sjt","q":"You notice a coworker routinely leaving classified material on his desk overnight in a locked office. What is the MOST effective action?","o":["Correct it immediately, remind him of the storage requirement, and report it if it recurs","Ignore it because the office is locked","Report him anonymously without ever speaking to him","Move the material yourself and say nothing"],"a":0,"why":"Everyone who works with classified information is personally responsible for ensuring unauthorized persons do not gain access, and each individual must report security incidents. Secure it, correct it, and escalate if it repeats.","ref":"AFH 1, 18.10"},{"id":"sjt-15","ch":"sjt","type":"sjt","q":"Your team consistently hits its metrics but morale is low and two people have asked for transfers. What is the MOST effective action?","o":["Diagnose the cause through candid conversations and feedback, then adjust how work is led — a leader's success is reflected in the followers' morale and enthusiasm","Conclude that the metrics prove leadership is working","Increase production goals to distract from morale","Tell them transfers are a personal decision and take no action"],"a":0,"why":"AFH 1 states a leader's success is reflected in the efficiency, productivity, morale, and enthusiasm demonstrated by followers. Good metrics alongside attrition and low morale is a leadership signal, not a defense.","ref":"AFH 1, 14.26"},{"id":"sjt-16","ch":"sjt","type":"sjt","q":"You are the WAPS monitor's point of contact for your unit. An Airman asks you to hold his highlighted study guide in your office so 'nobody sees him studying.' What is the MOST effective action?","o":["Decline the arrangement — highlighted study references may not be shared and study materials cannot be stored or transferred on government systems — and direct him to official electronic references","Hold the materials since you are in a position of trust","Scan and email the guide to your personal account for him","Post the guide on a shared drive so everyone benefits"],"a":0,"why":"Sharing underlined or highlighted study reference material with other individuals is prohibited, and creating or storing personal study notes on government computers is prohibited. Government computers may only be used to view official electronic references.","ref":"AFH 1, 9.11"},{"id":"sjt-17","ch":"sjt","type":"sjt","q":"A senior NCO publicly corrects you in front of your Airmen in a way you believe was unwarranted. What is the MOST effective action?","o":["Address it privately with the senior NCO afterward, keep the correction in front of the Airmen professional, and take the substance seriously","Correct him back in front of the Airmen to protect your credibility","Complain to your peers about him","File an IG complaint immediately"],"a":0,"why":"Maintaining good order and professional relationships means handling the dispute privately while never undermining authority in front of Airmen. Self-aware leaders manage their own reactions rather than projecting them.","ref":"AFH 1, 20.17"},{"id":"sjt-18","ch":"sjt","type":"sjt","q":"You are asked to sign for a piece of equipment you have not physically inventoried, and the paperwork is due today. What is the MOST effective action?","o":["Inventory the items before signing, document any discrepancies, and inform the accountable property officer","Sign now and inventory later when you have time","Refuse the appointment and walk away from the responsibility","Sign and note 'not verified' in the comments block"],"a":0,"why":"A property custodian is directly responsible for physical custody, inventory, accounting, and reconciliation. Signing for property you have not verified creates liability under the financial liability investigation process (DD Form 200).","ref":"AFH 1, 12.30"},{"id":"sjt-19","ch":"sjt","type":"sjt","q":"Your team is preparing for an inspection and a junior Airman points out that a required record has been missing for months — something a previous supervisor let slide. What is the MOST effective action?","o":["Thank him, fix the record now, determine the root cause, and brief your leadership on the gap and the fix","Quietly recreate the record to look current","Blame the previous supervisor in the inspection debrief","Wait to see whether the inspector catches it"],"a":0,"why":"Integrity requires surfacing and correcting the deficiency rather than fabricating records. Effective leaders treat discovered faults as learning tools and address root cause — falsifying a record is a much larger problem than the original gap.","ref":"AFH 1, 1.3.1; 20.7"},{"id":"sjt-20","ch":"sjt","type":"sjt","q":"You are mentoring an Airman who wants to make rank but studies only the night before each mock test and scores poorly. What is the MOST effective action?","o":["Help him build a self-study plan with short daily sessions and spaced review, and track his progress with him","Tell him to study harder and check back in a month","Give him your notes from last cycle","Advise him that promotion is largely luck and quotas"],"a":0,"why":"Preparing for promotion testing is an individual responsibility requiring a self-initiated study plan. Spaced, consistent study beats cramming, and a mentor's job is to build the plan and follow up — not to hand over materials that cannot be shared.","ref":"AFH 1, 9.10"},{"id":"gen-1-001","ch":1,"ref":"AFH 1, 1.1","q":"Which four requirements frame professionalism within the USAF?","o":["Trust, loyalty, dignity, and personal commitment","Courage, discipline, teamwork, and readiness","Duty, honor, country, and competence","Integrity, service, excellence, and accountability"],"a":0,"why":"USAF professionalism is framed by trust, loyalty, dignity, and personal commitment."},{"id":"gen-1-002","ch":1,"ref":"AFH 1, 1.1","q":"According to AFH 1, what is at the root of professionalism?","o":["Technical competence","Respect","Personal ambition","Strict compliance"],"a":1,"why":"Respect is the root of professionalism and bonds each Airman's contribution to the mission."},{"id":"gen-1-003","ch":1,"ref":"AFH 1, 1.1","q":"Which description best characterizes the USAF as a Total Force?","o":["A combat force composed only of Regular Air Force members","A collection of independent components with separate values","A values-based, mission-focused, people-oriented force leveraging officer, enlisted, and civilian Airmen","A joint force administered by the military departments collectively"],"a":2,"why":"The Total Force leverages officer, enlisted, and civilian Airmen across components and is values-based, mission-focused, and people-oriented."},{"id":"gen-1-004","ch":1,"ref":"AFH 1, 1.1, Professional Obligation and Status","q":"Where should a military professional's primary focus be directed?","o":["Promotion and career progression","Pay and future assignments","Personal recognition for mission results","Devoted service to the nation"],"a":3,"why":"Professional focus must be on devoted service to the nation, not pay or the next assignment."},{"id":"gen-1-005","ch":1,"ref":"AFH 1, 1.1, People-Oriented","q":"What does AFH 1 identify as the USAF's most important resource?","o":["People","Technology","Time","Funding"],"a":0,"why":"The people-oriented principle states that people are the USAF's most important resource."},{"id":"gen-1-006","ch":1,"ref":"AFH 1, 1.2","q":"What distinguishes the profession of arms from other professions?","o":["Its members work under civilian supervision","Expertise in the justified application of lethal military force and willingness to make the ultimate sacrifice","Its members must possess a technical specialty","Responsibility for administering national policy"],"a":1,"why":"The profession is distinguished by expertise in the justified use of lethal military force and members' willingness to make the ultimate sacrifice."},{"id":"gen-1-007","ch":1,"ref":"AFH 1, 1.3, Virtues of Core Values","q":"What is the result of consistently practicing the virtues associated with the USAF core values?","o":["Formal recognition as an ethical leader","Freedom from ethical dilemmas","Habits of honorable thought and action that produce a USAF professional","Uniform decisions across every situation"],"a":2,"why":"Consistent practice produces habits of honorable thought and action, resulting in a USAF professional."},{"id":"gen-1-008","ch":1,"ref":"AFH 1, 1.3.1","q":"Which set contains the three virtues of Integrity First?","o":["Duty, loyalty, and respect","Mission, discipline, and teamwork","Valor, courage, and sacrifice","Honesty, courage, and accountability"],"a":3,"why":"Honesty, courage, and accountability are the virtues of Integrity First."},{"id":"gen-1-009","ch":1,"ref":"AFH 1, 1.3.1, Honesty","q":"What does honesty require Airmen to do when evaluating performance?","o":["Evaluate against standards and conscientiously and accurately report findings","Report only deficiencies that affect mission completion","Rely on personal judgment instead of published standards","Protect the unit's reputation when deciding what to report"],"a":0,"why":"Honesty requires evaluation against standards and conscientious, accurate reporting of findings."},{"id":"gen-1-010","ch":1,"ref":"AFH 1, 1.3.1, Courage","q":"Which action best demonstrates courage as described in AFH 1?","o":["Avoiding risk until fear is eliminated","Admitting a mistake despite possible personal consequences","Following a popular decision without objection","Waiting for others to challenge an improper practice"],"a":1,"why":"Courage is doing the right thing despite fear and includes taking necessary risks, making unpopular decisions, and admitting mistakes."},{"id":"gen-1-011","ch":1,"ref":"AFH 1, 1.3.1, Accountability","q":"Which behavior is central to accountability?","o":["Delegating responsibility for unfavorable outcomes","Limiting feedback to the formal chain of command","Maintaining transparency, seeking constructive feedback, and owning outcomes","Explaining why circumstances prevented success"],"a":2,"why":"Accountable individuals remain transparent, seek honest and constructive feedback, and own the outcomes of their actions and decisions."},{"id":"gen-1-012","ch":1,"ref":"AFH 1
