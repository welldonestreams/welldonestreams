ing."},{"id":"gen-22-019","ch":22,"ref":"AFH 1, 22.17","q":"What total daily water consumption is generally identified for women and men, respectively?","o":["2.7 liters for women and 3.7 liters for men","1.5 liters for women and 2.0 liters for men","3.7 liters for women and 2.7 liters for men","Six liters for each"],"a":0,"why":"General total daily consumption from water, beverages, and food is 2.7 liters for women and 3.7 liters for men."},{"id":"gen-22-020","ch":22,"ref":"AFH 1, 22.17","q":"What upper fluid-intake limits does AFH 1 suggest to reduce over-hydration risk?","o":["Two cups per hour and 16 cups per day","No more than 6 cups per hour and 48 cups per day","Eight cups per hour and 64 cups per day","No hourly limit if intake is water"],"a":1,"why":"AFH 1 advises limiting fluids to no more than six cups an hour and 48 cups a day."},{"id":"gen-22-021","ch":22,"ref":"AFH 1, 22.19","q":"What minimum distances apply to designated tobacco-use areas on USAF installations?","o":["25 feet from entrances and 50 feet from playgrounds","50 feet from entrances but no minimum from air intakes","At least 50 feet from building entrances and air intakes, and at least 100 feet from playgrounds","At least 100 feet from every building and 200 feet from playgrounds"],"a":2,"why":"Designated areas must be at least 50 feet from entrances and air intakes and 100 feet from playgrounds."},{"id":"gen-22-022","ch":22,"ref":"AFH 1, 22.22","q":"What is the consequence for a military member who ingests prohibited products containing or derived from hemp seed, hemp seed oil, or CBD?","o":["The member receives a fitness exemption","The conduct is permitted if the product was sold commercially","The conduct results only in nutrition counseling","Failure to comply violates Article 92, UCMJ"],"a":3,"why":"Ingestion is prohibited for readiness and drug-testing reasons; noncompliance violates Article 92, UCMJ."},{"id":"gen-22-023","ch":22,"ref":"AFH 1, 22.24","q":"Within what period must ADAPT program managers review medical records and documentation after notification?","o":["Within seven calendar days","Within 30 calendar days","Before the member's next performance report closes","Only after the commander requests a clinical review"],"a":0,"why":"ADAPT program managers conduct the required review within seven calendar days of notification."},{"id":"gen-22-024","ch":22,"ref":"AFH 1, 22.29","q":"Into which four categories do stress reactions typically fall?","o":["Personal, professional, family, and financial","Cognitive, emotional, behavioral, and physical","Acute, chronic, traumatic, and operational","Mental, physical, social, and spiritual"],"a":1,"why":"Stress reactions are categorized as cognitive, emotional, behavioral, and physical."},{"id":"gen-22-025","ch":22,"ref":"AFH 1, 22.37","q":"Which four wellness domains make up Comprehensive Airman Fitness?","o":["Readiness, resilience, recovery, and reconstitution","Cognitive, emotional, behavioral, and physical","Mental, physical, social, and spiritual","Awareness, adaptability, endurance, and communication"],"a":2,"why":"CAF is a holistic approach encompassing mental, physical, social, and spiritual wellness."},{"id":"gen-24-001","ch":24,"ref":"AFH 1, 24.2","q":"What is military protocol?","o":["An informal set of locally preferred social practices","A system used only for foreign diplomatic events","A drill manual governing formation movements","A code of traditional precedence, courtesy, and etiquette for military, diplomatic, official, and celebratory ceremonies"],"a":3,"why":"Military protocol applies traditional precedence, courtesy, and etiquette to official and ceremonial life."},{"id":"gen-24-002","ch":24,"ref":"AFH 1, 24.3","q":"What is the primary mission of today's base honor guard program?","o":["To provide professional military funeral honors for active members, retirees, and Air Force veterans","To conduct every installation promotion ceremony","To train only Security Forces members in drill","To support only ceremonies in the National Capital Region"],"a":0,"why":"The base honor guard's primary mission is professional funeral honors for active, retired, and veteran Air Force members."},{"id":"gen-24-003","ch":24,"ref":"AFH 1, 24.3","q":"At minimum, what funeral ceremony has public law provided for all veterans since January 2000?","o":["A firing party and military band","Folding and presentation of a U.S. flag and the playing of Taps","A full honor guard and caisson","A flyover and burial at a national cemetery"],"a":1,"why":"The statutory minimum includes folding the flag, presenting it to the family, and playing Taps."},{"id":"gen-24-004","ch":24,"ref":"AFH 1, 24.5","q":"On a USAF installation, what should a moving vehicle do when the national anthem or To the Colors begins?","o":["Continue at reduced speed until the music ends","Stop immediately in the traffic lane regardless of safety","Pull safely to the side and stop, when consistent with safety and mission requirements; occupants sit quietly","Only government vehicles must stop"],"a":2,"why":"Vehicles pull to the side and stop when safe and mission-compatible, and occupants remain seated quietly through the last note."},{"id":"gen-24-005","ch":24,"ref":"AFH 1, 24.5","q":"How should a uniformed military member without headgear act indoors during the national anthem?","o":["Salute regardless of headgear","Place the right hand over the heart","Face away from the music if no flag is displayed","Stand at attention without saluting"],"a":3,"why":"Indoors without headgear, a uniformed member stands at attention but does not salute."},{"id":"gen-24-006","ch":24,"ref":"AFH 1, 24.6","q":"At an outdoor event where the Pledge of Allegiance is rendered, what do military personnel in uniform do?","o":["Stand at attention, remain silent, face the flag, and salute","Recite the pledge while holding the salute","Stand at parade rest without saluting","Remove headgear and place the right hand over the heart"],"a":0,"why":"Uniformed personnel outdoors stand at attention, remain silent, face the flag, and salute."},{"id":"gen-24-007","ch":24,"ref":"AFH 1, 24.7","q":"What do the 13 white stars and the yellow numerals 1947 on the DAF Seal represent?","o":["The first 13 Air Force major commands and the year of the first flight","The original 13 colonies and the year the Department of the Air Force was established","The 13 original states and the year the USAF became a combatant command","The 13 stripes of the flag and the year the Air Corps was created"],"a":1,"why":"The stars represent the original colonies, and 1947 marks establishment of the Department of the Air Force."},{"id":"gen-24-008","ch":24,"ref":"AFH 1, 24.8","q":"What do the six sections of the stylized wings in the official Air Force Symbol represent?","o":["The six enlisted tiers","Six core values shared by the services","Air and space superiority, global attack, rapid global mobility, precision engagement, information superiority, and agile combat support","The six geographic combatant commands"],"a":2,"why":"The six wing sections symbolize six distinctive Air Force capabilities listed in AFH 1."},{"id":"gen-24-009","ch":24,"ref":"AFH 1, 24.8","q":"What do the five points of the star in the Air Force Symbol represent?","o":["The five military services existing in 1947","Five stages of aerospace power","Five Air Force core missions","RegAF, civilians, Guard, Reserve, and retirees"],"a":3,"why":"The five points represent the five components of the Air Force family: RegAF, civilians, Guard, Reserve, and retirees."},{"id":"gen-24-010","ch":24,"ref":"AFH 1, 24.9","q":"What is required when the Air Force song is played?","o":["Airmen stand at attention and may sing the lyrics","Airmen salute from the first note through the last","Only the official party stands","Airmen remain seated unless outdoors"],"a":0,"why":"Airmen stand at attention during the Air Force song, but they are allowed to sing."},{"id":"gen-24-011","ch":24,"ref":"AFH 1, 24.11","q":"Which statement about folding the United States flag is official policy?","o":["Each fold has an official meaning prescribed by DAFI 90-1202","There is no official meaning for the folds and no official flag-folding script","The 13 folds officially represent the original colonies","A narrative used by civic groups is required at military ceremonies"],"a":1,"why":"DAFI 90-1202 assigns neither official meanings to the folds nor an official folding script."},{"id":"gen-24-012","ch":24,"ref":"AFH 1, 24.12","q":"Which flag is used as an alternative to the installation flag during inclement weather?","o":["The 3-by-4-foot all-purpose rayon flag","The 20-by-38-foot garrison flag","The 5-foot-by-9-foot-6-inch all-purpose all-weather storm flag","The 4-foot-4-inch-by-5-foot-6-inch ceremonial flag"],"a":2,"why":"The lightweight nylon all-weather storm flag, 5 feet by 9 feet 6 inches, is the inclement-weather alternative."},{"id":"gen-24-013","ch":24,"ref":"AFH 1, 24.13","q":"When may the United States flag be displayed 24 hours a day?","o":["Only on federal holidays","Whenever the installation commander is present","Only if every other flag is lowered at sunset","When a patriotic effect is desired and the flag is properly illuminated during darkness"],"a":3,"why":"Continuous display is permitted for patriotic effect when the flag is illuminated during hours of darkness."},{"id":"gen-24-014","ch":24,"ref":"AFH 1, 24.14","q":"Where is the United States flag placed on a stage?","o":["On the flag's own right, which is the audience's left","On the audience's right regardless of other flags","At the center behind the speaker in every case","On the lowest staff so other flags remain visible"],"a":0,"why":"The U.S. flag occupies its own right; to an audience facing the stage, that is the audience's left."},{"id":"gen-24-015","ch":24,"ref":"AFH 1, 24.15","q":"When a United States flag passes in a procession, when does a uniformed member salute?","o":["Only while the flag is directly in front of the member","Six paces before it passes until it has passed six paces","From the first audible drumbeat until the procession ends","Three paces before it passes until the flag is out of sight"],"a":1,"why":"The salute begins six paces before the flag passes and is held until it is six paces beyond the member."},{"id":"gen-24-016","ch":24,"ref":"AFH 1, 24.16","q":"Which is the correct order of precedence for these service flags?","o":["Army, National Guard, Navy, Marine Corps, Coast Guard, Air Force, Space Force","National Guard, Army, Marine Corps, Navy, Air Force, Coast Guard, Space Force","National Guard, Army, Navy, Marine Corps, Coast Guard, Air Force, Space Force","Army, Navy, Marine Corps, National Guard, Coast Guard, Air Force, Space Force"],"a":2,"why":"Precedence follows service dates: National Guard, Army, Navy, Marine Corps, Coast Guard, Air Force, then Space Force."},{"id":"gen-24-017","ch":24,"ref":"AFH 1, 24.18","q":"How do military personnel enter and exit automobiles or small boats when rank determines the order?","o":["The senior enters first and exits last","The senior enters and exits first","Juniors enter and exit first","Juniors enter first; the senior enters last and exits first"],"a":3,"why":"Personnel enter in reverse rank order, placing the senior last to enter and first to exit."},{"id":"gen-24-018","ch":24,"ref":"AFH 1, 24.19","q":"How are retirees addressed in official records and correspondence?","o":["By their retired grade, except in matters related to civilian employment","By first and last name without grade","By their final duty title instead of grade","By retired grade only for the first year after retirement"],"a":0,"why":"Retirees retain their grade in official records and correspondence except when the matter concerns civilian employment."},{"id":"gen-24-019","ch":24,"ref":"AFH 1, 24.20","q":"When formally reporting to an officer indoors, where does the member halt before saluting and reporting?","o":["One pace from the doorway","Approximately two paces from the officer or desk","Six paces from the officer","At the position where the officer first makes eye contact"],"a":1,"why":"The reporting member marches to about two paces from the officer or desk, halts, salutes, and reports."},{"id":"gen-24-020","ch":24,"ref":"AFH 1, 24.20","q":"Who renders salutes when members are in formation or a work detail?","o":["Every member independently","Only commissioned officers in the group","The person in charge salutes for the formation or detail","No one may salute under either circumstance"],"a":2,"why":"Individuals do not salute independently; the person in charge acknowledges salutes for the formation or work detail."},{"id":"gen-24-021","ch":24,"ref":"AFH 1, 24.22","q":"How far in advance should planners aim to have event details completed so guests can plan?","o":["At least three duty days","Exactly one month","No earlier than invitations are issued","At least three weeks, or more"],"a":3,"why":"AFH 1 advises completing details at least three weeks ahead, with larger events beginning much earlier."},{"id":"gen-24-022","ch":24,"ref":"AFH 1, 24.23","q":"When is a promotion ceremony customarily held when the promotion takes effect on the first day of the month?","o":["On the last duty day before the effective date","On the first duty day after the effective date","Exactly one week before the effective date","Only during the next commander's call"],"a":0,"why":"Because most promotions take effect on the first, ceremonies are customarily held on the preceding last duty day."},{"id":"gen-24-023","ch":24,"ref":"AFH 1, 24.24","q":"Which rule applies when administering a reenlistment oath?","o":["The oath may be administered by video if both parties are in uniform","The reenlistee and administering officer must be physically collocated, and 'so help me God' may be omitted if desired","The words 'so help me God' are mandatory","Only the member's commander may administer the oath"],"a":1,"why":"The officer and reenlistee must be physically together; the closing religious phrase may be omitted."},{"id":"gen-24-024","ch":24,"ref":"AFH 1, 24.27","q":"What are the two purposes of the retreat ceremony?","o":["To start the duty day and raise the flag","To assemble the unit and announce the next day's schedule","To signal the end of the official duty day and pay respect to the United States flag","To lower the flag and dismiss only the honor guard"],"a":2,"why":"Retreat marks the end of the official duty day and serves as a ceremony of respect for the flag."},{"id":"gen-24-025","ch":24,"ref":"AFH 1, 24.28","q":"What is the key distinction between a dining-in and a dining-out?","o":["A dining-in is informal, while a dining-out is formal","A dining-out requires utility uniforms","A dining-in includes civilians but excludes spouses","A dining-in is for military members only; nonmilitary spouses, friends, and civilians may attend a dining-out"],"a":3,"why":"Both are formal, but attendance at a dining-in is limited to military members, while a dining-out may include civilian guests."},{"id":"gen-sjt-001","ch":"sjt","type":"sjt","ref":"AFH 1, 1.3.1","q":"Your section missed a monthly target because of a preventable scheduling error you made. The dashboard is due in an hour, and changing one entry would make the section appear compliant. What is the MOST effective action?","o":["Report the result accurately, acknowledge your error, and propose corrective action","Change the entry now and correct it quietly after the leadership meeting","Omit the target from the dashboard because the miss was preventable","Ask a subordinate to decide whether the entry should be changed"],"a":0,"why":"AFH 1, 1.3.1 identifies honesty and accountability as virtues of Integrity First: Airmen accurately report performance, maintain transparency, and own the outcomes of their decisions."},{"id":"gen-sjt-002","ch":"sjt","type":"sjt","ref":"AFH 1, 1.1","q":"Two equally qualified Airmen request the same desirable schedule. One is a longtime friend, while the other recently joined the flight. Which action is the LEAST effective?","o":["Apply the same mission-based criteria to both requests and explain the decision","Approve your friend's request because the established relationship makes the choice easier","Ask another leader to review the decision if your impartiality could reasonably be questioned","Explore whether an alternate schedule can meet both Airmen's needs without harming the mission"],"a":1,"why":"AFH 1, 1.1 requires fair and unbiased treatment and genuine dignity, fairness, and respect. Favoring a friend substitutes personal preference for impartial standards."},{"id":"gen-sjt-003","ch":"sjt","type":"sjt","ref":"AFH 1, 1.4","q":"A vendor whose contract you help monitor offers you an expensive dinner after a successful project. The vendor says no future business will be discussed. What is the MOST effective action?","o":["Accept because the project is complete and discuss only personal topics","Attend but pay for part of the meal after the vendor orders","Decline the offer and seek ethics guidance if any question remains","Send a junior Airman in your place so the relationship with the vendor remains strong"],"a":2,"why":"AFH 1, 1.4 states that public service is a public trust, warns against gifts from entities doing business with the agency, and requires conduct that avoids even the appearance of impropriety."},{"id":"gen-sjt-004","ch":"sjt","type":"sjt","ref":"AFH 1, 1.3.2","q":"You recommended a different course of action, but your commander selected a lawful plan you believe is less efficient. Which action is the LEAST effective?","o":["Clarify the commander's intent, then execute the decision professionally","Use the chain of command to offer new evidence if it materially changes the situation","Help your team understand the plan without pretending your earlier concerns never existed","Tell the team the plan is misguided and encourage them to delay it until the commander reconsiders"],"a":3,"why":"AFH 1, 1.3.2 explains that loyalty includes executing leaders' lawful decisions even when we disagree and offering alternatives most effectively through the chain of command."},{"id":"gen-sjt-005","ch":"sjt","type":"sjt","ref":"AFH 1, 1.3.3","q":"A reliable teammate is temporarily overwhelmed by two urgent tasks, while you have finished your own work early. What is the MOST effective action?","o":["Coordinate priorities and help carry the workload while preserving accountability for the tasks","Wait to see whether the teammate misses a deadline before offering assistance","Take over both tasks without telling the teammate or supervisor","Remind the teammate that everyone is responsible for carrying an equal share"],"a":0,"why":"AFH 1, 1.3.3 describes teamwork as giving one's best, motivating others, carrying one's own weight, and helping wingmen carry theirs when necessary."},{"id":"gen-sjt-006","ch":"sjt","type":"sjt","ref":"AFH 1, 1.3.1","q":"After approving a flawed schedule, you realize your decision caused avoidable overtime. Which response is the LEAST effective?","o":["Tell the affected team what happened and correct the schedule","Let the team assume the scheduling system caused the problem so confidence in you is preserved","Ask for constructive feedback on how to prevent a recurrence","Document the lesson and take ownership when briefing your supervisor"],"a":1,"why":"AFH 1, 1.3.1 requires accountable Airmen to maintain transparency, seek honest feedback, and own the outcomes of their actions and decisions. Concealing responsibility violates that principle."},{"id":"gen-sjt-007","ch":"sjt","type":"sjt","ref":"AFH 1, 9.10","q":"A promotion-eligible Airman will be away for the entire testing cycle on a scheduled mission. The departure date is approaching. What is the MOST effective action?","o":["Wait until the Airman returns and request supplemental consideration","Ask the unit to excuse the Airman from testing because the absence is mission-related","Coordinate for the Airman to test before departure if the correct test materials are available","Have the Airman test remotely while away using locally available study references"],"a":2,"why":"AFH 1, 9.10 says members unavailable for the entire testing cycle must be prepared to test before departure and may test early when the correct test booklets are available."},{"id":"gen-sjt-008","ch":"sjt","type":"sjt","ref":"AFH 1, 9.11","q":"A promotion-eligible coworker wants convenient access to personal flash cards during lunch. Which action is the LEAST effective?","o":["Keep the flash cards on a personally owned device authorized for personal use","Use the government computer only to view official electronic study references","Study the personal flash cards away from government information systems","Upload the personal flash cards to a government shared drive marked as private"],"a":3,"why":"AFH 1, 9.11 prohibits creating, storing, or transferring personal promotion-study notes on government computers; those systems may be used only to view official electronic study references."},{"id":"gen-sjt-009","ch":"sjt","type":"sjt","ref":"AFH 1, 9.14","q":"While reviewing your Data Verification Record, you find an incorrect award entry shortly before the promotion cutoff. What is the MOST effective action?","o":["Immediately contact the military personnel flight, provide supporting information, and verify the updated record afterward","Correct your local copy and retain it in case the board asks for evidence","Wait for the promotion results before raising the issue to avoid unnecessary work","Ask your supervisor to mention the award informally to board members"],"a":0,"why":"AFH 1, 9.14 requires eligible Airmen to review the DVR, immediately contact the military personnel flight about errors or omissions, and verify that corrections were completed accurately."},{"id":"gen-sjt-010","ch":"sjt","type":"sjt","ref":"AFH 1, 9.21","q":"A supervisor asks to see an Airman's promotion score notice to compare the shop's results. The Airman has not provided written consent. Which action is the LEAST effective?","o":["Use published promotion statistics for general comparison instead of the individual's notice","Give the notice to the supervisor because supervisors are responsible for professional development","Explain that the individual can retrieve and review the notice personally","Refer any authorized command review to the commander and limit use to notification or advisory counseling"],"a":1,"why":"AFH 1, 9.21 restricts promotion score notices to the individual and commander; supervisors are not authorized access, and scores require the Airman's written consent for disclosure."},{"id":"gen-sjt-011","ch":"sjt","type":"sjt","ref":"AFH 1, 14.1","q":"A quiet junior Airman privately identifies a recurring process weakness but fears being dismissed during the team meeting. What is the MOST effective action?","o":["Present the idea as your own so the team evaluates it without bias","Ask the Airman to wait until gaining more experience before challenging the process","Create space for the Airman to explain the concern, evaluate it on its merits, and protect respectful discussion","Keep the concern private unless the weakness causes a mission failure"],"a":2,"why":"AFH 1, 14.1 teaches that trust-based teams permit open, honest communication and allow members to take risks and share ideas without fear of being shut down or discounted."},{"id":"gen-sjt-012","ch":"sjt","type":"sjt","ref":"AFH 1, 14.5","q":"Two work centers disagree over access to a limited training resource, and both have legitimate mission needs. Which action is the LEAST effective?","o":["Bring both sides together to identify interests and explore a shared schedule","Use objective mission priorities to frame a solution both sides can support","Ask each side to explain constraints and search for a mutually beneficial option","Use rank to impose your preferred allocation before hearing either side's concerns"],"a":3,"why":"AFH 1, 14.5 describes collaboration as high in assertiveness and cooperation and aimed at satisfying both sides through honest discussion; forcing relies on authority or power with low cooperation."},{"id":"gen-sjt-013","ch":"sjt","type":"sjt","ref":"AFH 1, 14.13","q":"An Airman handles a difficult customer exceptionally well and prevents a mission delay. What is the MOST effective supervisory response?","o":["Provide specific positive feedback as close to the event as possible and connect it to future performance","Save the feedback for the next annual evaluation so it carries more weight","Praise the whole flight generally to avoid singling out one person","Say nothing unless the Airman asks how the interaction went"],"a":0,"why":"AFH 1, 14.13 states that successful counseling occurs as close to the event as possible and that leaders should use naturally occurring events to provide feedback, including for superior performance."},{"id":"gen-sjt-014","ch":"sjt","type":"sjt","ref":"AFH 1, 14.14","q":"An experienced Airman asks for help choosing between two realistic development paths. There is time for a thoughtful discussion. What is the MOST effective counseling approach?","o":["Select the path you would choose and direct the Airman to follow it","Listen, help the Airman clarify priorities and options, and support the Airman's own sound decision","Avoid discussing the decision so the Airman develops complete independence","Ask the Airman's peers to vote on which path is best"],"a":1,"why":"AFH 1, 14.14 prefers the nondirective approach for most counseling: the leader listens and helps the Airman explore and clarify the situation rather than supplying the solution."},{"id":"gen-sjt-015","ch":"sjt","type":"sjt","ref":"AFH 1, 14.15","q":"You must counsel an Airman about a pattern of missed suspense dates. Which action is the LEAST effective?","o":["State the purpose, discuss the issue, develop a realistic plan, and record it","Choose a setting with minimal interruptions and explain the meeting's purpose in advance","Conduct the discussion in a busy common area and end once you have listed the Airman's mistakes","Set a tentative follow-up before closing the session"],"a":2,"why":"AFH 1, 14.15 calls for an appropriate, distraction-free environment and four counseling components: state the purpose, discuss issues, develop a plan of action, and record the plan, with follow-up as appropriate."},{"id":"gen-sjt-016","ch":"sjt","type":"sjt","ref":"AFH 1, 14.9","q":"A high-performing Airman is unsure how current strengths connect to long-term career goals. What is the MOST effective action?","o":["Wait for the Airman to choose a goal independently before discussing development","Recommend the same career plan that worked for you","Focus only on the next promotion because long-range plans change frequently","Discuss performance, potential, goals, and development options, then continue mentoring as the plan evolves"],"a":3,"why":"AFH 1, 14.9 makes mentoring an ongoing leadership responsibility and directs supervisors to discuss performance, potential, professional development, personal goals, assignments, and long-range plans."},{"id":"gen-sjt-017","ch":"sjt","type":"sjt","ref":"AFH 1, 14.22","q":"Your reports show that output is acceptable, but Airmen mention equipment problems that never appear in formal metrics. What is the MOST effective action?","o":["Visit the work center, observe conditions firsthand, invite unresolved problems, and prioritize the issues that most affect success","Rely on the reports because direct observation could signal distrust","Tell Airmen to submit more metrics before you become involved","Address only problems that have already caused a missed mission"],"a":0,"why":"AFH 1, 14.22 advises leaders to get out from behind the desk, see conditions firsthand, search out problems, encourage people to raise them, and focus involvement on critical issues."},{"id":"gen-sjt-018","ch":"sjt","type":"sjt","ref":"AFH 1, 17.6","q":"An installation warning directs personnel to avoid a specific area and await protective-action instructions. A coworker thinks it is probably only an exercise. Which action is the LEAST effective?","o":["Follow the warning and monitor official channels for updated directions","Enter the restricted area briefly to determine whether the warning is real","Help nearby personnel understand the communicated protective action","Use the installation's mass-notification information rather than rumors"],"a":1,"why":"AFH 1, 17.6 requires personnel to respond to directions communicated through mass warning and notification systems when an incident is imminent or in progress."},{"id":"gen-sjt-019","ch":"sjt","type":"sjt","ref":"AFH 1, 17.9","q":"A nearby hazardous-material release is not yet fully characterized, and evacuation could move personnel toward the hazard. The installation directs shelter-in-place. What is the MOST effective action?","o":["Evacuate immediately using the shortest route, regardless of the direction of the release","Open windows so occupants can detect when the air clears","Shelter as directed, close windows and doors, turn off ventilation, and await official guidance","Send one person outside periodically to assess conditions"],"a":2,"why":"AFH 1, 17.9 explains that shelter-in-place may be required when the hazard is unknown or evacuation is dangerous and directs occupants to close windows and doors and turn off ventilation to prevent contamination."},{"id":"gen-sjt-020","ch":"sjt","type":"sjt","ref":"AFH 1, 17.12","q":"During an exercise, you observe several unidentified vehicles conducting suspicious surveillance near a controlled area. What is the MOST effective action?","o":["Post the observation in the unit group chat so others can identify the vehicles","Wait until the exercise ends to avoid distracting the control center","Report only the vehicle count because interpretations could be wrong","Immediately send a secure SALUTE report with size, activity, location, unit or identifying features, time, and equipment"],"a":3,"why":"AFH 1, 17.12 directs personnel who observe an attack or enemy movement to report it immediately through the chain using the secure SALUTE format."},{"id":"gen-sjt-021","ch":"sjt","type":"sjt","ref":"AFH 1, 17.16","q":"You find an exposed electrical conductor in a work area. You cannot safely eliminate the hazard immediately. What is the MOST effective action?","o":["Keep personnel away, promptly notify the supervisor or safety office, and submit a hazard report","Mention it at the next staff meeting if no one is injured","Cover it with an unapproved material and consider the hazard eliminated","Leave an anonymous note near the conductor without notifying an agency"],"a":0,"why":"AFH 1, 17.16 requires notification to the safety office, responsible supervisor, or local agency and submission of a hazard report when a hazard cannot be eliminated immediately."},{"id":"gen-sjt-022","ch":"sjt","type":"sjt","ref":"AFH 1, 17.19","q":"A time-sensitive task now carries more risk than the approved plan anticipated, and the remaining risk exceeds your authority to accept. Which action is the LEAST effective?","o":["Pause at a safe point and elevate the risk decision to the appropriate authority","Accept the additional risk yourself because stopping could make the section look unresponsive","Engage experienced personnel to identify lower-risk ways to meet the mission","Explain the changed hazard and available controls to the decision authority"],"a":1,"why":"AFH 1, 17.19 requires accepting no unnecessary risk and making risk decisions at the appropriate level; mission pressure does not expand an individual's risk-acceptance authority."},{"id":"gen-sjt-023","ch":"sjt","type":"sjt","ref":"AFH 1, 17.22","q":"While a planned outdoor task is underway, winds suddenly increase and begin moving unsecured equipment. What is the MOST effective action?","o":["Continue because the original deliberate risk assessment already approved the task","Wait for a formal written assessment before responding to the change","Reassess the changing situation in real time, apply immediate controls, and elevate if the residual risk requires it","Let each Airman independently decide whether the task remains safe"],"a":2,"why":"AFH 1, 17.22 describes real-time risk management as rapidly identifying and assessing hazards in a new or changing situation, selecting controls, and acting at the appropriate level."},{"id":"gen-sjt-024","ch":"sjt","type":"sjt","ref":"AFH 1, 18.8","q":"Several harmless-looking public posts from your unit, when combined, reveal a predictable surge schedule. Which action is the LEAST effective?","o":["Treat the pattern as a possible operations-security indicator and notify the proper program channel","Review which signatures and associations allowed the schedule to be inferred","Reduce or alter unnecessary indicators while preserving authorized communication","Leave the posts unchanged because no single post contains the complete schedule"],"a":3,"why":"AFH 1, 18.8 explains that adversaries can piece together friendly actions and open-source indicators through signatures, associations, and profiles to derive critical information."},{"id":"gen-sjt-025","ch":"sjt","type":"sjt","ref":"AFH 1, 18.11","q":"You receive Controlled Unclassified Information for an official task and need a teammate's help. What is the MOST effective action?","o":["Confirm the teammate's authorized need and use approved safeguarding and dissemination methods","Send it through a personal account because the information is not classified","Remove the CUI marking and share only the pages you think are relevant","Place it on an unrestricted shared drive so the teammate can retrieve it"],"a":0,"why":"AFH 1, 18.11 defines CUI as government information requiring safeguarding or dissemination controls and states that it must be protected under national policy."},{"id":"gen-sjt-026","ch":"sjt","type":"sjt","ref":"AFH 1, 18.12","q":"You find classified material unattended and outside proper control. Which action is the LEAST effective?","o":["Take custody of the material and safeguard it","Leave it in place and email the work center asking whoever owns it to retrieve it","Immediately notify your commander, supervisor, or security manager","Limit further access while the incident is addressed"],"a":1,"why":"AFH 1, 18.12 requires anyone finding classified material out of proper control to take custody, safeguard it, and immediately notify the commander, supervisor, or security manager."},{"id":"gen-sjt-027","ch":"sjt","type":"sjt","ref":"AFH 1, 18.15","q":"A colleague asks you for personal information from an official system of records to help plan a private recognition event. What is the MOST effective action?","o":["Provide only the fields that seem harmless","Share the information verbally so no record of disclosure is created","Decline unless disclosure is authorized by consent or an applicable Privacy Act provision, and use an authorized alternative","Export the record but ask the colleague to delete it after the event"],"a":2,"why":"AFH 1, 18.15 states that the Privacy Act generally prohibits disclosure from a system of records without the subject's written consent and governs federal use and dissemination of personal information."},{"id":"gen-sjt-028","ch":"sjt","type":"sjt","ref":"AFH 1, 18.20","q":"A mission team wants to use a personally purchased wireless tablet to process Department of Defense information during travel. Which action is the LEAST effective?","o":["Use only a device and connection method approved for processing the information","Verify documented approval and applicable user restrictions before use","Secure approved devices when they are not assigned or in use","Use the personal tablet temporarily because operational urgency outweighs the approval requirement"],"a":3,"why":"AFH 1, 18.20 requires approval of wireless systems, devices, applications, and connection methods before they process Department of Defense information."},{"id":"gen-sjt-029","ch":"sjt","type":"sjt","ref":"AFH 1, 18.27","q":"A package in the mailroom has no return address, oily stains, protruding wire, and an unusual odor. What is the MOST effective action?","o":["Do not open or cut it; report it immediately, control exposure, and identify who was present","Move it through the building to an office where a supervisor can inspect it","Cut one corner carefully to determine whether it contains a harmless spill","Return it through normal mail channels without documenting who handled it"],"a":0,"why":"AFH 1, 18.27 says never cut wrappings on a suspect package, report suspicious mail immediately, and make a list of personnel who were present when it was identified."},{"id":"gen-sjt-030","ch":"sjt","type":"sjt","ref":"AFH 1, 19.3","q":"While deployed, a general order prohibits an activity that is legal at home but conflicts with host-nation sensitivities. Which action is the LEAST effective?","o":["Comply and ensure your Airmen understand the restriction","Treat the restriction as optional because the activity is lawful in the United States","Ask the chain of command for clarification if the order's application is unclear","Explain that discipline and host-nation relations support the mission"],"a":1,"why":"AFH 1, 19.3 requires compliance with deployed general orders tailored to local laws, customs, and mission needs; strict compliance supports discipline, host-nation relations, and operations."},{"id":"gen-sjt-031","ch":"sjt","type":"sjt","ref":"AFH 1, 19.9","q":"During an operation, a leader gives a clearly illegal order to mistreat a protected detainee. What is the MOST effective action?","o":["Obey now and challenge the order only after the operation","Ask another Airman to carry it out so you are not personally involved","Refuse the clearly illegal order and promptly report the suspected law-of-war violation to proper authority","Remain silent unless the detainee submits a formal complaint"],"a":2,"why":"AFH 1, 19.9 states that the duty to comply with the law of war includes refusing clearly illegal orders and promptly reporting suspected violations to the commander or other proper authority."},{"id":"gen-sjt-032","ch":"sjt","type":"sjt","ref":"AFH 1, 19.10","q":"A hostile actor stops the threatening action and begins complying with clear directions. Which response is the LEAST effective under the self-defense principles described in AFH 1?","o":["Reassess whether a hostile act or hostile intent still exists","Use de-escalation when time and circumstances permit","Limit any force to what is reasonable in nature, duration, and scope for the threat","Continue using force to punish the actor and discourage future misconduct"],"a":3,"why":"AFH 1, 19.10 requires de-escalation when feasible and limits self-defense force to the amount necessary and reasonable to counter the threat, not punishment after the threat ceases."},{"id":"gen-sjt-033","ch":"sjt","type":"sjt","ref":"AFH 1, 19.4","q":"You observe two Airmen commit the same minor standards violation; one is your strongest performer. What is the MOST effective action?","o":["Apply the standard consistently, consider relevant facts fairly, and correct both in a timely manner","Correct only the weaker performer because the stronger Airman has earned flexibility","Ignore both violations to avoid appearing selective","Publicly punish the stronger performer more severely to prove impartiality"],"a":0,"why":"AFH 1, 19.4 requires standards to be uniformly known, consistently applied, and non-selectively enforced; accountability is essential to good order and discipline."},{"id":"gen-sjt-034","ch":"sjt","type":"sjt","ref":"AFH 1, 20.13","q":"A Regular Air Force member strongly supports a partisan candidate and is invited to help at a campaign rally. Which action is the LEAST effective?","o":["Vote and express a personal opinion in a manner that does not imply Air Force endorsement","Give a campaign speech at the partisan rally while off duty and out of uniform","Review the political-activity restrictions before participating in any event","Attend only in a manner permitted for a spectator and avoid active campaign management"],"a":1,"why":"AFH 1, 20.13 prohibits RegAF members from participating in partisan rallies, campaign speeches, fundraising, management, conventions, or debates even when out of uniform."},{"id":"gen-sjt-035","ch":"sjt","type":"sjt","ref":"AFH 1, 20.17","q":"A supervisor develops a close personal financial arrangement with a directly rated subordinate, and coworkers now question whether assignments are fair. What is the MOST effective action?","o":["Keep the arrangement private as long as performance ratings remain unchanged","Tell coworkers that relationships outside duty hours can never be an official concern","Address the relationship through the chain, remove actual or perceived favoritism, and restore professional boundaries","Rotate unpopular tasks among the other Airmen until concerns fade"],"a":2,"why":"AFH 1, 20.17 makes relationships an official concern when they adversely affect or reasonably could affect morale, discipline, respect for authority, cohesion, or mission accomplishment."},{"id":"gen-sjt-036","ch":"sjt","type":"sjt","ref":"AFH 1, 20.18","q":"You learn that repeated comments in the shop may constitute unlawful discriminatory harassment. What is the MOST effective supervisory action?","o":["Wait for the targeted Airman to file a formal complaint before intervening","Ask the entire shop to settle the issue informally without leadership involvement","Move the targeted Airman to another shift as the first response","Take immediate and appropriate action to address the allegation and consult the Equal Opportunity office"],"a":3,"why":"AFH 1, 20.18 charges commanders and supervisors to take immediate, appropriate action once aware of inappropriate behavior or allegations and encourages consultation with the Equal Opportunity office."},{"id":"gen-sjt-037","ch":"sjt","type":"sjt","ref":"AFH 1, 20.25","q":"A rumor alleges that an Airman committed misconduct, but the available evidence is conflicting and you have not reviewed the member's record. Which action is the LEAST effective?","o":["Issue the harshest reprimand immediately to demonstrate zero tolerance, regardless of the evidence","Determine whether the greater weight of credible evidence establishes the misconduct","Consider the nature and seriousness of the incident and the member's prior disciplinary record","Use a corrective tool intended to improve, correct, and instruct if the facts support action"],"a":0,"why":"AFH 1, 20.25 bases corrective action on the incident's nature and seriousness, prior disciplinary history, and a preponderance of credible evidence; unsupported punishment may be legally unsustainable."},{"id":"gen-sjt-038","ch":"sjt","type":"sjt","ref":"AFH 1, 22.16","q":"An Airman on flying status wants to begin a performance supplement with a proprietary blend and no listed ingredient amounts. What is the MOST effective action?","o":["Begin with half the label dose because supplements are tested before sale","Consult the flight surgeon before taking it and evaluate third-party verification and undeclared-ingredient risk","Use it only on non-flying days without informing medical personnel","Rely on online reviews from other service members who used the product"],"a":1,"why":"AFH 1, 22.16 warns that performance supplements may contain undeclared ingredients, notes that the FDA does not test them before sale, and requires Airmen on flying status to consult their flight surgeon."},{"id":"gen-sjt-039","ch":"sjt","type":"sjt","ref":"AFH 1, 22.23","q":"An Airman has several unexplained absences and behavior changes and acknowledges increasing alcohol use. What is the MOST effective supervisory action?","o":["Diagnose a substance use disorder and prescribe a recovery plan yourself","Ignore the admission unless an alcohol-related incident occurs on duty","Document specific observations, discuss them with the appropriate leadership, and facilitate professional assessment while maintaining standards","Remove all duties permanently before any professional assessment"],"a":2,"why":"AFH 1, 22.23 directs leaders to discuss documented behavior and acknowledged substance-use concerns with the supervisor, first sergeant, or commander to expedite care; ADAPT personnel, not supervisors, diagnose disorders."},{"id":"gen-sjt-040","ch":"sjt","type":"sjt","ref":"AFH 1, 22.33","q":"A capable Airman reports persistent stress symptoms and asks whether seeking mental health care will end a promising career. Which action is the LEAST effective?","o":["Treat the concern seriously and help the Airman identify an appropriate support resource","Explain that early help can improve recovery, judgment, and performance","Protect the Airman's dignity while continuing appropriate mission and supervisory support","Warn the Airman that seeking care usually damages a career and advise waiting until performance collapses"],"a":3,"why":"AFH 1, 22.33 calls help-seeking a sign of strength and good judgment and explains that early care improves recovery and can improve performance or preserve a career."},{"id":"exp-1-001","ch":1,"ref":"AFH 1, 1.4","q":"According to the ethical guidelines in AFH 1, public service is a public trust requiring employees to place loyalty to what above private gain?","o":["The Department of Defense and the President","The Constitution, the laws, and ethical principles","The chain of command and unit mission","The Secretary of Defense and Congress"],"a":1,"why":"Public service is a public trust, requiring employees to place loyalty to the Constitution, the laws, and ethical principles, above private gain."},{"id":"exp-1-002","ch":1,"ref":"AFH 1, 1.4","q":"Employees may accept a gift from subordinate personnel only when the gift is voluntary, of nominal value, and given on which type of occasion?","o":["Any occasion, as long as the gift is inexpensive","A recognized federal holiday","An occasion of special personal significance (such as marriage or the birth of a child) or one that terminates the superior-subordinate relationship","An official recognition ceremony"],"a":2,"why":"Gifts from subordinates are permitted only for voluntary gifts of nominal value (not to exceed $10) on occasions of special personal significance or occasions that terminate the superior-subordinate relationship."},{"id":"exp-1-003","ch":1,"ref":"AFH 1, 1.4","q":"Under Title 5, CFR, Part 2635, employees shall not knowingly make which of the following?","o":["Unauthorized commitments or promises of any kind purporting to bind the government","Voluntary donations to private organizations","Personal financial investments","Official travel arrangements"],"a":0,"why":"Employees shall not knowingly make unauthorized commitments or promises of any kind purporting to bind the government."},{"id":"exp-1-004","ch":1,"ref":"AFH 1, 1.4","q":"How must employees treat non-Federal entities and individuals under the ethical guidelines?","o":["Give preferential treatment to installation-recognized private organizations","Provide them access to federal property for authorized uses","Solicit gifts from them for official functions","Act impartially and not give preferential treatment"],"a":3,"why":"Employees shall act impartially and not give preferential treatment to any non-Federal entity or individual."},{"id":"exp-1-005","ch":1,"ref":"AFH 1, 1.4.1","q":"Competing values, as a source of ethical dilemmas, occur when what happens?","o":["Two regulations contradict each other","Our personal values conflict with those of our institution, subordinates, peers, or supervisors","Two commanders issue different orders","Values change over time"],"a":1,"why":"Competing values occur when our personal values conflict with those of our institution, subordinates, peers, or supervisors."},{"id":"exp-1-006","ch":1,"ref":"AFH 1, 1.4.1","q":"In AFH 1, potential harm as a source of ethical dilemmas relates to what?","o":["The intentional and unintentional short- and long-term consequences caused by our actions","Physical injury to personnel only","Damage to government property only","Legal penalties under the UCMJ"],"a":0,"why":"Potential harm relates to the intentional and unintentional short- and long-term consequences caused by our actions."},{"id":"exp-1-007","ch":1,"ref":"AFH 1, 1.4.1","q":"Who identified the three tests (the Network Test, the United States of America Test, and the Divine Test) used to check the morality of actions and decisions?","o":["General Charles Q. Brown, Jr.","General Ronald Fogleman","Dr. Robert M. Hicks, former Deputy Director of the Civil Air Patrol, Chaplain Services","CMSAF JoAnne S. Bass"],"a":2,"why":"Dr. Robert M. Hicks, former Deputy Director of the Civil Air Patrol, Chaplain Services, identified three tests used to check the morality of actions and decisions."},{"id":"exp-1-008","ch":1,"ref":"AFH 1, 1.4.1","q":"Which question is asked by the Divine Test?","o":["Is this decision good for the United States?","How would this decision look if aired on the news?","Is this decision good for my unit?","Would I feel good about the decision when I give account for my life?"],"a":3,"why":"The Divine Test asks, 'Would I feel good about the decision when I give account for my life?'"},{"id":"exp-1-009","ch":1,"ref":"AFH 1, 1.4.2","q":"How does AFH 1 define sacrifice?","o":["The ability to face danger or hardship in a determined manner","A willingness to give your time, comfort, or life to meet others' needs","The ability to overcome fear of bodily harm","Doing what is right even when risking one's career"],"a":1,"why":"Sacrifice involves a willingness to give your time, comfort, or life to meet others' needs."},{"id":"exp-1-010","ch":1,"ref":"AFH 1, 1.4.2","q":"Which type of courage is about doing what is right even when risking one's career?","o":["Personal courage","Physical courage","Moral courage","Institutional courage"],"a":0,"why":"Personal courage is about doing what's right even when risking one's career."},{"id":"exp-1-011","ch":1,"ref":"AFH 1, 1.4.2","q":"How is physical courage defined in AFH 1?","o":["Standing by the core values when it is unpopular","Admitting mistakes despite consequences","The ability to overcome fears of bodily harm to get the job done","Facing danger in a determined and resolute manner"],"a":2,"why":"Physical courage is the ability to overcome fears of bodily harm to get the job done."},{"id":"exp-1-012","ch":1,"ref":"AFH 1, 1.4.2","q":"Which three types of courage are critical in the profession of arms?","o":["Personal, physical, and institutional","Moral, ethical, and legal","Individual, team, and organizational","Personal, physical, and moral"],"a":3,"why":"Three types of courage are critical in the profession of arms: personal, physical, and moral."},{"id":"exp-1-013","ch":1,"ref":"AFH 1, 1.3.1","q":"How does AFH 1 characterize integrity?","o":["The absence of fear in the face of danger","Simply doing the right thing, all the time, whether everyone is watching, or no one is watching","Following orders without question","A commitment to continuous improvement"],"a":1,"why":"Integrity is simply doing the right thing, all the time, whether everyone is watching, or no one is watching."},{"id":"exp-1-014","ch":1,"ref":"AFH 1, 1.3.3","q":"How does AFH 1 define discipline?","o":["An individual commitment to uphold the highest of personal and professional standards","Obedience to lawful orders","Punishment for failing to meet standards","Rigid adherence to a schedule"],"a":0,"why":"Discipline is an individual commitment to uphold the highest of personal and professional standards."},{"id":"exp-1-015","ch":1,"ref":"AFH 1, 1.3.3","q":"According to AFH 1, mission focus encompasses which two elements?","o":["Leadership and followership","Training and readiness","Operations and excellence in stewardship","Strategy and tactics"],"a":2,"why":"Mission focus encompasses operations and excellence in stewardship."},{"id":"exp-1-016","ch":1,"ref":"AFH 1, 1.3.2","q":"What does loyalty to our leaders require?","o":["Publicly debating decisions we disagree with","Blind obedience without question","Reporting disagreements to the Inspector General","Trusting, following, and executing their decisions, even when we disagree"],"a":3,"why":"Loyalty to our leaders requires us to trust, follow, and execute their decisions, even when we disagree."},{"id":"exp-1-017","ch":1,"ref":"AFH 1, 1.3.2","q":"According to AFH 1, respecting others requires a commitment to do what?","o":["Maintain strict formality at all times","Recognize and root out prejudices, biases, and stereotypes","Avoid discussing differences","Enforce uniform standards of appearance"],"a":1,"why":"Respecting others requires a commitment to recognize and root out prejudices, biases, and stereotypes."},{"id":"exp-1-018","ch":1,"ref":"AFH 1, 1.3","q":"According to AFH 1, USAF core values serve as what?","o":["Universal, consistent standards used to evaluate the ethical climate of all USAF organizations","Legal requirements enforceable under the UCMJ","Optional guidelines for personal conduct","Historical traditions with no practical application"],"a":0,"why":"Core values are universal, consistent standards used to evaluate the ethical climate of all USAF organizations."},{"id":"exp-1-019","ch":1,"ref":"AFH 1, 1.2","q":"Which 15th Air Force Chief of Staff stated, 'We are not engaged in just another job; we are practitioners of the profession of arms'?","o":["General T. Michael Moseley","General Charles Q. Brown, Jr.","General Ronald Fogleman","General John P. McConnell"],"a":2,"why":"General Ronald Fogleman, the 15th Air Force Chief of Staff, made this statement about the profession of arms."},{"id":"exp-1-020","ch":1,"ref":"AFH 1, 1.1","q":"According to AFH 1, what is paramount for mission accomplishment?","o":["Rapid innovation","Individual initiative","Strict adherence to schedule","Maintaining good order and discipline"],"a":3,"why":"Maintaining good order and discipline is paramount for mission accomplishment."},{"id":"exp-1-021","ch":1,"ref":"AFH 1, 1.1","q":"Under the Mission-Focused principle, what must Airmen have the courage to do?","o":["Avoid all risk to preserve readiness","Take appropriate risks when necessary","Delegate risky decisions to commanders","Wait for perfect conditions before acting"],"a":1,"why":"As Airmen, we must have the courage to take appropriate risks when necessary."},{"id":"exp-1-022","ch":1,"ref":"AFH 1, 1.3.3","q":"Excellence In All We Do requires Airmen to constantly work hard to stay in which shape?","o":["Physical, mental, emotional, spiritual, and moral shape","Physical shape only","Technical and professional shape only","Mental and physical shape only"],"a":0,"why":"Airmen constantly work hard to stay in physical, mental, emotional, spiritual, and moral shape."},{"id":"exp-1-023","ch":1,"ref":"AFH 1, 1.5","q":"According to the Airman's Creed, an Airman's mission is to do what?","o":["Serve, protect, and defend","Lead, follow, and inspire","Fly, Fight, and Win","Train, equip, and deploy"],"a":2,"why":"The Airman's Creed states, 'My mission is to Fly, Fight, and Win.'"},{"id":"exp-1-024","ch":1,"ref":"AFH 1, 1.3.1","q":"How does AFH 1 describe the role of integrity in military endeavors?","o":["Integrity is optional in peacetime","Integrity is one of several equal values","Integrity applies only to leaders","Integrity provides the bedrock for our military endeavors and is fortified by service to country"],"a":3,"why":"Integrity provides the bedrock for our military endeavors and is fortified by service to country."},{"id":"exp-1-025","ch":1,"ref":"AFH 1, 1.4.1","q":"When making decisions, Airmen should always think through what?","o":["Second and third order effects of their actions","The financial cost to the unit","The immediate timeline for completion","The opinions of peers"],"a":0,"why":"Airmen should always think through second and third order effects of their actions."},{"id":"exp-5-001","ch":5,"ref":"AFH 1, 5.1","q":"As Commander in Chief, the U.S. President has final command authority, but as head of the executive branch is subject to what?","o":["The Unified Command Plan","The Secretary of Defense's direction","The checks and balances system of the legislative and judicial branches","The Joint Chiefs of Staff's advice"],"a":2,"why":"As Commander in Chief, the President has final command authority but is subject to the checks and balances system of the legislative and judicial branches."},{"id":"exp-5-002","ch":5,"ref":"AFH 1, 5.1","q":"Public Law 99-433, the Goldwater-Nichols Department of Defense Reorganization Act of 1986, permits the U.S. President to authorize communications through whom, placing that official in the communications chain of command?","o":["The Chairman of the Joint Chiefs of Staff","The Secretary of Defense","The Combatant Commanders","The Secretary of the Air Force"],"a":0,"why":"Goldwater-Nichols permits the President to authorize communications through the Chairman of the Joint Chiefs of Staff, placing the Chairman in the communications chain of command."},{"id":"exp-5-003","ch":5,"ref":"AFH 1, 5.2","q":"With over 1.3 million members in the Regular Forces, 826,000 in the Guard and Reserve, and 742,000 civilian personnel, the Department of Defense is what?","o":["The world's largest military force","America's largest government agency","The largest federal employer of civilians","The largest branch of the executive office"],"a":1,"why":"The Department of Defense is America's largest government agency."},{"id":"exp-5-004","ch":5,"ref":"AFH 1, 5.2","q":"Who serves as the Chairman of the Armed Forces Policy Council?","o":["The Chairman of the Joint Chiefs of Staff","The Deputy Secretary of Defense","The President","The Secretary of Defense"],"a":3,"why":"The Armed Forces Policy Council consists of the Secretary of Defense serving as the Chairman of the Council."},{"id":"exp-5-005","ch":5,"ref":"AFH 1, 5.2","q":"How many Under Secretaries of Defense assist the Secretary of Defense?","o":["Six","Three","Four","Five"],"a":0,"why":"There are six Under Secretaries of Defense who assist the Secretary of Defense."},{"id":"exp-5-006","ch":5,"ref":"AFH 1, 5.3","q":"The Vice Chairman of the Joint Chiefs of Staff serves a tour of how long, and may be reappointed for how many additional terms?","o":["Four years; one additional term","Two years; one additional term","Two years; two additional terms","Four years; two additional terms"],"a":2,"why":"The VCJCS serves a tour of two years and may be reappointed for two additional terms."},{"id":"exp-5-007","ch":5,"ref":"AFH 1, 5.3","q":"Which list correctly identifies the members of the Joint Chiefs of Staff?","o":["Chairman, Vice Chairman, and the Service Secretaries","Chairman; Vice Chairman; Chief of Staff of the Army; Chief of Naval Operations; Chief of Staff of the USAF; Chief of Space Operations; Commandant of the Marine Corps; and Chief of the National Guard Bureau","Chairman, Vice Chairman, and the Combatant Commanders","The Secretary of Defense and the Service Secretaries"],"a":1,"why":"The Joint Chiefs of Staff are the Chairman, Vice Chairman, Service Chiefs, and the Chief of the National Guard Bureau."},{"id":"exp-5-008","ch":5,"ref":"AFH 1, 5.3","q":"For the Service Chiefs, how do their Joint Chiefs of Staff duties rank relative to their other duties?","o":["They are secondary to service-specific duties","They are shared with their Vice Chiefs","They are limited to wartime","They take precedence over all other duties"],"a":3,"why":"For the Service Chiefs, their Joint Chiefs of Staff duties take precedence over all other duties."},{"id":"exp-5-009","ch":5,"ref":"AFH 1, 5.4","q":"Which list correctly identifies the military departments?","o":["The Army, the Navy (including the Marine Corps and, in wartime, the Coast Guard), and the USAF (including the Space Force)","The Army, the Navy, and the Coast Guard","The Army, the Marine Corps, and the Air Force","The Army, the Navy, and the National Guard"],"a":0,"why":"The military departments consist of the Army, Navy (including the Marine Corps and, in wartime, the Coast Guard), and the USAF (including the Space Force)."},{"id":"exp-5-010","ch":5,"ref":"AFH 1, 5.5","q":"Which is one of the three general functions of the U.S. Armed Forces stated in the Key West Agreement?","o":["To regulate international commerce","To administer federal territories","To support and defend the U.S. Constitution against all enemies, foreign and domestic","To enforce domestic federal law"],"a":2,"why":"One general function is to support and defend the U.S. Constitution against all enemies, foreign and domestic."},{"id":"exp-5-011","ch":5,"ref":"AFH 1, 5.5","q":"Which service's mission is 'To fight and win our nation's wars by providing prompt, sustained land dominance across the full range of military operations and the spectrum of conflict'?","o":["The United States Marine Corps","The United States Army","The United States Navy","The United States Air Force"],"a":1,"why":"This is the mission of the U.S. Army, the land-based branch of the U.S. Armed Forces."},{"id":"exp-5-012","ch":5,"ref":"AFH 1, 5.5","q":"Which description correctly characterizes the U.S. Navy?","o":["The largest navy in the Atlantic only","The second-largest navy in the world","The oldest branch of the U.S. Armed Forces","The largest, most capable navy in the world, with the highest combined battle fleet tonnage and the world's largest aircraft carrier fleet"],"a":3,"why":"The U.S. Navy is the largest, most capable navy in the world, with the highest combined battle fleet tonnage."},{"id":"exp-5-013","ch":5,"ref":"AFH 1, 5.5","q":"The Department of the Air Force is composed of which forces, both combat and support, not otherwise assigned?","o":["Air, space, and cyberspace forces","Air and space forces","Air and cyberspace forces","Aerospace and maritime forces"],"a":0,"why":"The Department of the Air Force is composed of air, space and cyberspace forces, both combat and support, not otherwise assigned."},{"id":"exp-5-014","ch":5,"ref":"AFH 1, 5.6","q":"Which is an example of a combined command?","o":["U.S. Central Command","U.S. Strategic Command","North American Aerospace Defense Command","U.S. Cyber Command"],"a":2,"why":"Examples of combined commands include the North American Aerospace Defense Command."},{"id":"exp-5-015","ch":5,"ref":"AFH 1, 5.7","q":"Once assigned or attached to a unified combatant command, a force cannot be transferred except by authority of whom?","o":["The combatant commander","The Secretary of Defense, or under special procedures with approval of the U.S. President","The Chairman of the Joint Chiefs of Staff","The service Secretary"],"a":1,"why":"A force cannot be transferred except by authority of the Secretary of Defense or under special procedures with approval of the U.S. President."},{"id":"exp-5-016","ch":5,"ref":"AFH 1, 5.7","q":"Who prepares the Unified Command Plan, and what type of document is it?","o":["The Secretary of Defense; an unclassified directive","The Joint Chiefs of Staff; a public regulation","The President; an executive order","The Chairman of the Joint Chiefs of Staff; a classified executive branch document"],"a":3,"why":"The Unified Command Plan is a classified executive branch document prepared by the Chairman of the Joint Chiefs of Staff."},{"id":"exp-5-017","ch":5,"ref":"AFH 1, 5.8","q":"How many unified combatant commands are there currently?","o":["11","7","9","13"],"a":0,"why":"There are currently 11 combatant commands."},{"id":"exp-5-018","ch":5,"ref":"AFH 1, 5.8","q":"Which combatant command is headquartered at Offutt Air Force Base, Nebraska, and is responsible for command of nuclear capabilities and global strike?","o":["U.S. Northern Command","U.S. Space Command","U.S. Strategic Command","U.S. Transportation Command"],"a":2,"why":"USSTRATCOM is headquartered at Offutt Air Force Base, Nebraska, and is responsible for command of nuclear capabilities and global strike."},{"id":"exp-5-019","ch":5,"ref":"AFH 1, 5.9","q":"Under the operational chain of command, the Commander, Air Force Forces is assigned to a joint force commander who typically delegates operational authority, which is also called what?","o":["Administrative control (ADCON)","Operational control (OPCON)","Tactical control (TACON)","Combatant command authority (COCOM)"],"a":1,"why":"Operational authority is also called operational control or OPCON."},{"id":"exp-5-020","ch":5,"ref":"AFH 1, 5.10","q":"The USAF Total Force serves within which three components?","o":["RegAF, the Air National Guard, and the Coast Guard","RegAF, the Army Reserve, and the Air National Guard","RegAF, the Civil Air Patrol, and the USAF Reserve","RegAF, the USAF Reserve, and the Air National Guard"],"a":3,"why":"The Total Force serves within three components: the RegAF, USAF Reserve, and Air National Guard."},{"id":"exp-5-021","ch":5,"ref":"AFH 1, 5.11","q":"Which list contains the seven Reserve Components of the U.S. Armed Forces?","o":["Army National Guard, Army Reserve, Navy Reserve, Marine Corps Reserve, Air National Guard, USAF Reserve, and Coast Guard Reserve","Army Reserve, Navy Reserve, Air National Guard, and USAF Reserve","Army National Guard, Navy Reserve, Marine Corps Reserve, and Coast Guard Reserve","Army Reserve, Air Force Reserve, and Coast Guard Reserve"],"a":0,"why":"The seven Reserve Components are Army National Guard, Army Reserve, Navy Reserve, Marine Corps Reserve, Air National Guard, USAF Reserve, and Coast Guard Reserve."},{"id":"exp-5-022","ch":5,"ref":"AFH 1, 5.11","q":"By law, what is the status of dual-status military technicians in Air National Guard units?","o":["Active duty members on temporary duty","Contractors employed by the state","Civil service employees of the federal government who must be military members of the unit that employs them","Reservists serving in a volunteer capacity"],"a":2,"why":"Dual-status military technicians are civil service employees of the federal government who must be military members of the unit that employs them."},{"id":"exp-5-023","ch":5,"ref":"AFH 1, 5.12","q":"Which list contains the four civilian auxiliaries of the U.S. Armed Forces?","o":["Civil Air Patrol, Coast Guard Auxiliary, Merchant Marine, and the National Guard","Civil Air Patrol, Coast Guard Auxiliary, Merchant Marine, and Military Auxiliary Radio System","Civil Air Patrol, Air Force Auxiliary, Merchant Marine, and Coast Guard Auxiliary","Military Auxiliary Radio System, Civil Air Patrol, and the Merchant Marine only"],"a":1,"why":"The four civilian auxiliaries are Civil Air Patrol, Coast Guard Auxiliary, Merchant Marine, and Military Auxiliary Radio System."},{"id":"exp-5-024","ch":5,"ref":"AFH 1, 5.13","q":"The AFJROTC program is open to students in which grades, and does participation incur a military service obligation?","o":["9th through 12th grade; yes, two years of service","10th through 12th grade; no obligation","9th through 11th grade; yes, four years of service","9th through 12th grade; no military service obligation"],"a":3,"why":"AFJROTC is open to 9th-12th grade students, and participants incur no military service obligation."},{"id":"exp-5-025","ch":5,"ref":"AFH 1, 5.15","q":"What is a Lead MAJCOM?","o":["The type of MAJCOM that consolidates responsibilities for a particular function in a single MAJCOM, supporting the entire USAF","The MAJCOM that serves as the USAF Component to a unified combatant command","A MAJCOM that reports directly to the Secretary of Defense","A MAJCOM organized geographically overseas"],"a":0,"why":"A Lead MAJCOM consolidates responsibilities for a particular function in a single MAJCOM, supporting the entire USAF."},{"id":"exp-7-001","ch":7,"ref":"AFH 1, 7.1","q":"Which grades make up the Company Grade Officer tier?","o":["O-4 through O-6","O-1 through O-3","O-7 through O-10","O-1 through O-6"],"a":1,"why":"The Company Grade Officer tier includes grades O-1 through O-3."},{"id":"exp-7-002","ch":7,"ref":"AFH 1, 7.1","q":"The USAF Civil Service consists of how many professional civilians, serving in how many countries?","o":["More than 100,000 in over 20 countries","More than 250,000 in over 50 countries","More than 150,000 in over 30 countries","More than 180,000 in over 35 countries"],"a":3,"why":"The USAF Civil Service consists of more than 180,000 professional civilians in over 35 countries."},{"id":"exp-7-003","ch":7,"ref":"AFH 1, 7.3","q":"How does AFH 1 describe core competencies?","o":["A key set of abilities or qualities at the heart of the organization's reason for being","Technical skills specific to a single career field","Optional qualifications for leadership positions","Standards used only for promotion testing"],"a":0,"why":"Core competencies are a key set of abilities or qualities at the heart of the organization's reason for being."},{"id":"exp-7-004","ch":7,"ref":"AFH 1, 7.5","q":"Which list contains the ranks of the junior enlisted tier?","o":["Airman, Airman First Class, Senior Airman, and Staff Sergeant","Airman Basic, Airman, Airman First Class, and Staff Sergeant","Airman Basic, Airman, Airman First Class, and Senior Airman","Airman, Airman First Class, and Senior Airman"],"a":2,"why":"The junior enlisted tier consists of Airman Basic, Airman, Airman First Class, and Senior Airman."},{"id":"exp-7-005","ch":7,"ref":"AFH 1, 7.5","q":"What is the written abbreviation for Airman Basic?","o":["Amn","AB","A1C","AB1"],"a":1,"why":"The written abbreviation for Airman Basic is 'AB'."},{"id":"exp-7-006","ch":7,"ref":"AFH 1, 7.5","q":"At which grade is the 5-skill level typically earned?","o":["Senior Airman","Airman","Staff Sergeant","Airman First Class"],"a":3,"why":"Typically, the 5-skill level is earned at the grade of Airman First Class."},{"id":"exp-7-007","ch":7,"ref":"AFH 1, 7.6","q":"Which ranks make up the Noncommissioned Officer tier?","o":["Staff Sergeant and Technical Sergeant","Senior Airman and Staff Sergeant","Technical Sergeant and Master Sergeant","Master Sergeant and Senior Master Sergeant"],"a":0,"why":"The NCO tier consists of the ranks Staff Sergeant and Technical Sergeant."},{"id":"exp-7-008","ch":7,"ref":"AFH 1, 7.6","q":"What must a Technical Sergeant complete before assuming the grade of Master Sergeant?","o":["Airman Leadership School","Senior Noncommissioned Officer Academy","The NCO Academy","The Chief Leadership Course"],"a":2,"why":"Technical Sergeants must complete the NCO Academy before assuming the grade of Master Sergeant."},{"id":"exp-7-009","ch":7,"ref":"AFH 1, 7.7","q":"Which ranks make up the Senior Noncommissioned Officer tier?","o":["Technical Sergeant, Master Sergeant, and Senior Master Sergeant","Master Sergeant, Senior Master Sergeant, and Chief Master Sergeant","Senior Master Sergeant and Chief Master Sergeant","Staff Sergeant, Technical Sergeant, and Master Sergeant"],"a":1,"why":"The SNCO tier consists of Master Sergeant, Senior Master Sergeant, and Chief Master Sergeant."},{"id":"exp-7-010","ch":7,"ref":"AFH 1, 7.7","q":"Newly selected RegAF chief master sergeants will attend which course?","o":["The SNCO Academy","The Chief Orientation Course","The NCO Academy","The Chief Leadership Course"],"a":3,"why":"All newly selected RegAF chiefs will attend the Chief Leadership Course."},{"id":"exp-7-011","ch":7,"ref":"AFH 1, 7.8","q":"Under what condition may junior enlisted Airmen hold the duty title of Supervisor?","o":["Only if they are at least an Airman Leadership School graduate and supervise the work of others","Any time they are assigned to a work center","Upon promotion to Senior Airman","When their commander approves the title"],"a":0,"why":"Junior enlisted Airmen will not have the duty title of Supervisor unless they are at least an ALS graduate and supervise the work of others."},{"id":"exp-7-012","ch":7,"ref":"AFH 1, 7.8","q":"Which duty title is used for NCOs and SNCOs who are the enlisted leaders of a flight?","o":["Section Chief","Manager","Flight Chief","Supervisor"],"a":2,"why":"The title of Flight Chief is used for NCOs and SNCOs who are the enlisted leaders of a flight."},{"id":"exp-7-013","ch":7,"ref":"AFH 1, 7.9","q":"Which program does the Chief Master Sergeant of the Air Force manage?","o":["The Developmental Special Experience Catalog","The Air Force Order of the Sword Program","The Enlisted Force Development Panel","The Weighted Airman Promotion System"],"a":1,"why":"The CMSAF manages the Air Force Order of the Sword Program."},{"id":"exp-7-014","ch":7,"ref":"AFH 1, 7.9","q":"Who became the first to wear the unique CMSAF insignia in April 1967?","o":["CMSAF James A. Roy","CMSAF JoAnne S. Bass","CMSAF Rodney J. McKinley","Chief Paul W. Airey"],"a":3,"why":"In April 1967, Chief Paul W. Airey became the first to wear the unique CMSAF insignia with the wreath around the star."},{"id":"exp-7-015","ch":7,"ref":"AFH 1, 7.9","q":"The title of Command Chief Master Sergeant traditionally applies to the senior enlisted leader at which levels?","o":["Wings, centers, numbered air forces, and major commands","Squadrons and groups only","Flight and squadron levels","Headquarters Air Force only"],"a":0,"why":"The Command Chief Master Sergeant title applies traditionally at wings, centers, numbered air forces, and major commands."},{"id":"exp-7-016","ch":7,"ref":"AFH 1, 7.10","q":"Which body is responsible for guiding enlisted force development initiatives?","o":["The Air Force Enlisted Council","The Air Force Senior Enlisted Leadership Council","The Enlisted Force Development Panel","The Occupational Analysis Program"],"a":2,"why":"The Enlisted Force Development Panel is responsible for guiding enlisted force development initiatives."},{"id":"exp-7-017","ch":7,"ref":"AFH 1, 7.10","q":"Which tool provides a mentor-matching capability and a bullet tracker to document accomplishments?","o":["The Air Force Virtual Education Center","MyVECTOR","The Community College of the Air Force","The Air Force Credentialing Opportunities On-Line program"],"a":1,"why":"MyVECTOR offers a mentor-matching capability and a bullet tracker to document accomplishments."},{"id":"exp-7-018","ch":7,"ref":"AFH 1, 7.11","q":"Which three force development tenets does the Occupational Analysis Program support?","o":["Education, training, and experience","Recruiting, retention, and readiness","Planning, programming, and budgeting","Training, utilization, and promotions"],"a":3,"why":"The three force development tenets are training, utilization, and promotions."},{"id":"exp-7-019","ch":7,"ref":"AFH 1, 7.13","q":"Technical training typically lasts how long, depending on the Airman's assigned AFSC?","o":["One month to two years","Two weeks to six months","Three months to one year","One year to three years"],"a":0,"why":"Technical training typically lasts anywhere from one month to two years, depending on the Airman's AFSC."},{"id":"exp-7-020","ch":7,"ref":"AFH 1, 7.15","q":"To be a craftsman (7-skill level), the member must be at least what?","o":["A Senior Airman","A Technical Sergeant","A Staff Sergeant Select","A Master Sergeant"],"a":2,"why":"To be a craftsman, the member must be at least a Staff Sergeant Select."},{"id":"exp-7-021","ch":7,"ref":"AFH 1, 7.16","q":"Newly assigned personnel must be interviewed within how many days to determine training status and issue CDCs?","o":["60 days (90 days for Air Reserve Component)","30 days (60 days for Air Reserve Component)","45 days (60 days for Air Reserve Component)","30 days (45 days for Air Reserve Component)"],"a":1,"why":"Newly assigned personnel are interviewed within 30 days (60 days for Air Reserve Component)."},{"id":"exp-7-022","ch":7,"ref":"AFH 1, 7.21","q":"The ALS-DL curriculum is designed to develop skills with respect to which four core attributes?","o":["Mission, leadership, problem solving, and USAF culture","Course foundation, leadership and management, and operational Airman","Self-awareness, leadership and management, and joint warfighter","Professional Airmen, expeditionary Airmen, supervisor of Airmen, and supervisory communicator"],"a":3,"why":"The ALS-DL curriculum develops skills in professional Airmen, expeditionary Airmen, supervisor of Airmen, and supervisory communicator."},{"id":"exp-7-023","ch":7,"ref":"AFH 1, 7.22","q":"EJPME I emphasizes curriculum commensurate with which grade responsibilities?","o":["E-5/E-7 joint assignment responsibilities","E-7/E-9 senior leadership roles","E-1/E-4 initial entry responsibilities","E-8/E-9 joint command responsibilities"],"a":0,"why":"EJPME I emphasizes curriculum commensurate with E-5/E-7 joint assignment responsibilities."},{"id":"exp-7-024","ch":7,"ref":"AFH 1, 7.24","q":"CCAF offers associate of applied science degree programs in which four broad career groups?","o":["Operations, intelligence, medical, and support","Operations, logistics, engineering, and support","Operations, logistics, medical, and support","Technical, administrative, medical, and support"],"a":2,"why":"CCAF offers degree programs in four broad career groups: operations, logistics, medical, and support."},{"id":"exp-7-025","ch":7,"ref":"AFH 1, 7.24","q":"Effective with the 2022-2024 CCAF General Catalog, how many semester hours must degree graduates complete?","o":["45 semester hours","60 semester hours","75 semester hours","90 semester hours"],"a":1,"why":"Degree graduates must complete the 60 semester-hour academic requirements."},{"id":"exp-8-001","ch":8,"ref":"AFH 1, 8.1","q":"During a performance feedback session, raters provide ratees information on Air Force benefits by referring them to which website?","o":["The MyAirForceBenefits website","myPay","the Air Force E-Publishing website","myFSS"],"a":0,"why":"Raters refer ratees to MyAirForceBenefits for benefits information."},{"id":"exp-8-002","ch":8,"ref":"AFH 1, 8.1","q":"For non-rated initial or advanced skills training students, which document serves in lieu of the mandatory mid-term performance feedback assessment?","o":["DAF Form 475, Education/Training Report","AETC Form 156, Student Training Report","AF Form 931, Airman Comprehensive Assessment Worksheet","DAF Form 77, Letter of Evaluation"],"a":1,"why":"Academic progress reports such as AETC Form 156 serve in lieu of the mid-term PFA."},{"id":"exp-8-003","ch":8,"ref":"AFH 1, 8.3","q":"Which Airman Comprehensive Assessment Worksheet is designated for Master Sergeant through Chief Master Sergeant?","o":["AF Form 931","AF Form 724","AF Form 932","AF Form 724-A"],"a":2,"why":"AF Form 932 covers MSgt through CMSgt."},{"id":"exp-8-004","ch":8,"ref":"AFH 1, 8.3","q":"Before the feedback session, a Master Sergeant ratee reviews which section of the worksheet?","o":["Section III","Section IX","Section X","Section VIII"],"a":3,"why":"Ratees review Section IX (AB-TSgt) or Section VIII (MSgt-CMSgt) prior to the session."},{"id":"exp-8-005","ch":8,"ref":"AFH 1, 8.3","q":"The AF Form 724-A, Airman Comprehensive Assessment Addendum, is required for which group?","o":["Officers","Senior Noncommissioned Officers","All enlisted Airmen","First-term Airmen only"],"a":0,"why":"Raters are required to use AF Form 724-A for officers; it is optional for SNCOs."},{"id":"exp-8-006","ch":8,"ref":"AFH 1, 8.4","q":"In most cases, the military personnel flight provides a computer-generated performance feedback notice within how many days of when supervision begins?","o":["60 days","30 days","45 days","90 days"],"a":1,"why":"The notice is provided within 30 days of supervision beginning."},{"id":"exp-8-007","ch":8,"ref":"AFH 1, 8.4","q":"For Chief Master Sergean
