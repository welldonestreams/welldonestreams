"o":["Empathize","Teach","Network","Respond"],"a":3,"why":"Respond treats mentoring as two-way communication and calls for active listening, recognition of subtle cues, anticipation of needs, and useful timely responses."},{"id":"gen-14-012","ch":14,"ref":"AFH 1, 14.11","q":"What does the Network element of effective mentoring require?","o":["Connecting the protégé with people who can provide guidance, support, resources, and opportunities","Teaching the protégé to use official computer networks","Assigning the protégé to a different organization","Limiting advice to the mentor's own expertise"],"a":0,"why":"A good mentor helps the protégé establish a professional network by making connections to additional sources of guidance and opportunity."},{"id":"gen-14-013","ch":14,"ref":"AFH 1, 14.13","q":"When should counseling normally be conducted for the best chance of success?","o":["At the end of the rating period","As close to the event as possible","Only after a pattern of behavior is established","At the next scheduled performance feedback session"],"a":1,"why":"AFH 1 states that the key to successful counseling is conducting it as close to the event as possible."},{"id":"gen-14-014","ch":14,"ref":"AFH 1, 14.14","q":"Which counseling approach is preferred for most sessions and has the leader help the Airman explore the situation without supplying the solution?","o":["Directive","Combined","Nondirective","Referral"],"a":2,"why":"Nondirective counseling emphasizes listening and helping the Airman clarify and decide while the leader refrains from giving solutions or opinions."},{"id":"gen-14-015","ch":14,"ref":"AFH 1, 14.14","q":"When is directive counseling most appropriate?","o":["When the Airman should independently discover a solution","When the issue is emotionally complex and time is plentiful","When several equally good solutions require group analysis","When time is short, the solution is clear, or the Airman needs guidance because of limited problem-solving skill"],"a":3,"why":"Directive counseling works best for simple problems, on-the-spot corrections, and specific performance issues when time is short or clear guidance is needed."},{"id":"gen-14-016","ch":14,"ref":"AFH 1, 14.15","q":"What are the four basic components of a counseling session, in order?","o":["State the purpose, discuss the issues, develop a plan of action, and record the plan","Gather evidence, state the standard, issue a decision, and notify the chain","Establish rapport, identify blame, impose consequences, and schedule review","Define the problem, select an approach, refer the Airman, and close the session"],"a":0,"why":"Even without formal preparation, a leader can follow the sequence: state purpose, discuss issues, develop the action plan, and record it."},{"id":"gen-14-017","ch":14,"ref":"AFH 1, 14.18","q":"How should leaders treat an organizational vision as conditions change?","o":["Replace it on a fixed annual schedule","Continually reassess it, revising when needed but affirming it when it remains effective and aligned","Preserve it unchanged to demonstrate consistency","Allow only senior leadership to communicate or evaluate it"],"a":1,"why":"Vision formation should be continual, but a working vision aligned with environmental and technological developments should not be arbitrarily changed."},{"id":"gen-14-018","ch":14,"ref":"AFH 1, 14.21","q":"How should responsibility increase when developing Airmen for leadership positions?","o":["Only after the Airman has mastered every current duty","In a single major step to test potential","Gradually, through consistent exposure to challenges over time","Only when a formal leadership billet becomes vacant"],"a":2,"why":"Developing leaders requires consistent challenge with gradual increases in responsibility, matched to each Airman's capabilities."},{"id":"gen-14-019","ch":14,"ref":"AFH 1, 14.23","q":"Which source of power comes from association with others through friendship, familiarity, cultivated relationships, or reciprocity?","o":["Position power","Knowledge power","Personal power","Relationship power"],"a":3,"why":"Relationship power derives from connections and reciprocity, though perceived favoritism can harm an organization."},{"id":"gen-14-020","ch":14,"ref":"AFH 1, 14.24","q":"What three core elements make up Full Range Leadership Development as a system?","o":["The leader, the follower, and the situation","The mission, the organization, and the environment","Authority, responsibility, and accountability","Vision, communication, and motivation"],"a":0,"why":"FRLD requires attention not only to the leader's actions but also to the follower and the situation."},{"id":"gen-14-021","ch":14,"ref":"AFH 1, 14.25","q":"Which leadership behavior waits for policies, rules, or goals to be violated before intervening?","o":["Laissez-faire","Management by exception-passive","Management by exception-active","Contingent reward"],"a":1,"why":"Management by exception-passive follows an 'if it is not broken, do not fix it' approach and acts only after standards are missed or rules are broken."},{"id":"gen-14-022","ch":14,"ref":"AFH 1, 14.25","q":"In Full Range Leadership Development, what makes a reward 'contingent'?","o":["The reward depends on available unit funds","The follower chooses the reward before accepting the task","The leader provides it after the follower performs assigned tasks to the specified expectation","The commander approves it only after an annual review"],"a":2,"why":"Contingent reward is a constructive transaction: the leader sets and supports the goal, and reinforcement follows performance to the agreed standard."},{"id":"gen-14-023","ch":14,"ref":"AFH 1, 14.25","q":"Which transformational component seeks different perspectives, considers opposing views, and encourages independent thought and creativity?","o":["Individualized consideration","Idealized influence","Inspirational motivation","Intellectual stimulation"],"a":3,"why":"Intellectual stimulation values followers' rationality, solicits different views and ideas, and encourages creativity and independent thinking."},{"id":"gen-14-024","ch":14,"ref":"AFH 1, 14.29","q":"What is the first step in leading a diverse organization?","o":["Establish common ground through shared assumptions such as the organization's vision, goals, rules, and processes","Assign members to groups based on similar backgrounds","Eliminate all differences in individual work methods","Begin with a formal assessment of every member's cultural identity"],"a":0,"why":"Common ground creates the framework for communication and direction through the organization's shared vision, goals, rules, regulations, processes, and procedures."},{"id":"gen-14-025","ch":14,"ref":"AFH 1, 14.30","q":"What are the three commitment levels in contemporary motivation, from lowest to highest?","o":["Compliance, contribution, commitment","Membership, performance, involvement","Awareness, acceptance, advocacy","Participation, proficiency, ownership"],"a":1,"why":"The model progresses from membership at the lowest level, through performance, to involvement at the highest level."},{"id":"gen-15-001","ch":15,"ref":"AFH 1, 15.1","q":"How does AFH 1 define self-efficacy?","o":["Freedom to act without supervision","The ability to suppress emotional reactions","A person's belief in the ability to address a situation based on available skills and circumstances","A willingness to accept responsibility for a team's failures"],"a":2,"why":"Self-efficacy is confidence in one's ability to address a situation based on personal skills and the circumstances faced."},{"id":"gen-15-002","ch":15,"ref":"AFH 1, 15.1","q":"In the context of personal responsibility, what does autonomy mean?","o":["Following the choice preferred by the group","Acting only within one's technical specialty","Avoiding action until formal authority is granted","Recognizing that you choose your own actions or inactions and can support the greater good despite pressure"],"a":3,"why":"Autonomy means exercising personal control over one's response rather than surrendering that choice to pressure from leaders or friends."},{"id":"gen-15-003","ch":15,"ref":"AFH 1, 15.2","q":"Which belief reflects a growth mindset?","o":["Past mistakes do not define a person's capacity to improve and change","Effort demonstrates a lack of natural ability","Intelligence and personal qualities are mostly permanent","Early failure reliably predicts future limits"],"a":0,"why":"A growth mindset recognizes the capacity for fundamental improvement and does not treat past failure as a permanent definition of ability."},{"id":"gen-15-004","ch":15,"ref":"AFH 1, 15.2","q":"How do people with a growth mindset typically respond to criticism and others' success?","o":["They avoid both to protect confidence","They seek feedback, learn from criticism, and find lessons or inspiration in others' success","They treat criticism as proof of fixed limitations","They compete to demonstrate superior natural talent"],"a":1,"why":"Growth-minded people use feedback and criticism to improve and do not feel threatened by others' achievements."},{"id":"gen-15-005","ch":15,"ref":"AFH 1, 15.3","q":"Why does AFH 1 recommend changing a situation to reduce temptation rather than relying only on willpower?","o":["Temptation cannot be resisted under any circumstances","Environmental changes permanently eliminate impulses","Self-control is limited and can be depleted by heavy use","Willpower works only for physical habits, not emotions"],"a":2,"why":"Because self-control is finite, removing triggers or temptations often prevents inappropriate behavior more reliably than repeatedly exerting internal restraint."},{"id":"gen-15-006","ch":15,"ref":"AFH 1, 15.3","q":"Which practice does AFH 1 identify as a way to strengthen self-control?","o":["Attempting one exhausting act of restraint each month","Avoiding every situation requiring restraint","Practicing only in the area where self-control is weakest","Regularly practicing small acts of restraint with rest and recording the effort"],"a":3,"why":"Small, deliberate acts of self-control, interspersed with rest and tracked through daily records, can strengthen impulse control over time."},{"id":"gen-15-007","ch":15,"ref":"AFH 1, 15.4","q":"What is positive reappraisal?","o":["Reinterpreting stressful events as nonthreatening, meaningful, or capable of contributing to growth","Denying that a negative event occurred","Replacing a difficult task with an easier one","Evaluating another person's performance positively"],"a":0,"why":"Positive reappraisal actively finds meaning and growth in adversity; it is not wishful denial of reality."},{"id":"gen-15-008","ch":15,"ref":"AFH 1, 15.4","q":"Compared with framing a stressful event as a threat, what tends to happen when it is framed as a challenge?","o":["The person reports more anxiety but performs faster","The person reports less anxiety and physiological measures return to normal more quickly","The person's heart rate remains elevated longer","The person no longer needs preparation or practice"],"a":1,"why":"Challenge framing is associated with less anxiety and faster recovery of heart rate, pulse, and blood pressure after the event."},{"id":"gen-15-009","ch":15,"ref":"AFH 1, 15.6","q":"How is strategic communication implemented in practical terms?","o":["By separating public messages from operational actions","By maximizing the number of messages sent to an audience","By aligning actions, words, and images to obtain a specific objective","By delegating all external communication to Public Affairs"],"a":2,"why":"Strategic communication synchronizes information and other elements of power by aligning what an organization does, says, and shows with its objectives."},{"id":"gen-15-010","ch":15,"ref":"AFH 1, 15.8","q":"What role does the Public Affairs representative hold for a commander?","o":["Records manager and security reviewer","Primary liaison to the inspector general","Advisor only for domestic media interviews","Principal spokesperson and advisor, serving as a member of the personal staff"],"a":3,"why":"PA is the commander's principal spokesperson and advisor and advises on how decisions, actions, and operations affect domestic and foreign perceptions."},{"id":"gen-15-011","ch":15,"ref":"AFH 1, 15.9","q":"Which information may not be posted to social networking services or sent through non-DoD e-mail without proper authority?","o":["Classified information, controlled unclassified information, and other official DoD information and documents","Only information marked Top Secret","Any personal opinion about military service","Publicly released news from official websites"],"a":0,"why":"Operations security rules prohibit posting classified, controlled unclassified, and other official DoD information or documents without proper authority."},{"id":"gen-15-012","ch":15,"ref":"AFH 1, 15.12","q":"Which five qualities must an effective organizational culture possess?","o":["Accurate, brief, clear, timely, and secure","Proactive, innovative, adaptive, leader driven, and sustainable","Formal, centralized, standardized, measured, and controlled","Focused, organized, clear, understanding, and supported"],"a":1,"why":"AFH 1 identifies proactive, innovative, adaptive, leader-driven, and sustainable as the qualities of an effective culture of engagement."},{"id":"gen-15-013","ch":15,"ref":"AFH 1, 15.14","q":"Which set correctly expands the FOCUS principles of effective communication?","o":["Formal, objective, concise, useful, secure","Focused, ordered, credible, unified, specific","Focused, organized, clear, understanding, supported","Facts, options, conclusions, urgency, suspense"],"a":2,"why":"FOCUS stands for focused, organized, clear, understanding, and supported."},{"id":"gen-15-014","ch":15,"ref":"AFH 1, 15.15","q":"Which sequence correctly gives the seven steps for effective communication?","o":["Research, analyze, outline, support, draft, approve, edit","Analyze, support, research, draft, organize, edit, approve","Analyze, research, draft, organize, support, edit, approve","Analyze purpose and audience; research; support ideas; organize and outline; draft; edit; fight for feedback and get approval"],"a":3,"why":"The first four steps lay groundwork, followed by drafting, editing, and actively seeking feedback and approval."},{"id":"gen-15-015","ch":15,"ref":"AFH 1, 15.15","q":"During the edit step, in what order should a communicator review a draft?","o":["Big picture and flow; paragraph structure and support; then sentences, words, and grammar","Grammar first; citations second; purpose and organization last","Format first; audience second; supporting evidence last","Word choice first; paragraph order second; topic selection last"],"a":0,"why":"Editing proceeds from the overall purpose, length, and flow, to paragraphs and support, and finally to sentence-level wording and mechanics."},{"id":"gen-15-016","ch":15,"ref":"AFH 1, 15.17","q":"When is a face-to-face meeting generally more appropriate than e-mail or a phone call?","o":["When a short message needs no response","When multiple people must engage in dialogue, possibly on a recurring basis","When the sender wants to avoid cross-talk","When information must be delivered without clarification"],"a":1,"why":"Meetings are suited to multi-person dialogue for sharing information, solving problems, planning, brainstorming, motivating, or making decisions."},{"id":"gen-15-017","ch":15,"ref":"AFH 1, 15.20","q":"Which guidance applies to a personal letter?","o":["Use it for routine official coordination between federal offices","Use acronyms to keep the letter within one page","Use it when warmth or sincerity is desired, keep it preferably to one page, and avoid acronyms","Use it only for correspondence with vendors and contractors"],"a":2,"why":"A personal letter suits private matters such as praise, condolence, or sponsorship and should be brief and free of acronyms."},{"id":"gen-15-018","ch":15,"ref":"AFH 1, 15.21","q":"Which paper is a single-page memory jogger using minimal bullets or phrases for a single issue, often with little or no notice?","o":["Talking paper","Background paper","Position paper","Point paper"],"a":3,"why":"The point paper is a one-page, minimal-text outline used to quickly inform or cue a speaker, including in extemporaneous situations."},{"id":"gen-15-019","ch":15,"ref":"AFH 1, 15.22","q":"What is the purpose of a staff study?","o":["To analyze a problem, draw conclusions, and make recommendations","To provide a one-page chronology in bullet format","To advocate a proposal without presenting analysis","To serve as the cover page for routed correspondence"],"a":0,"why":"A staff study is a multi-page research paper that uses detailed discussion, conclusions, and recommendations as a written problem-solving process."},{"id":"gen-15-020","ch":15,"ref":"AFH 1, 15.23","q":"What is the AF Form 1768, Staff Summary Sheet, within a staff package?","o":["The final approval memorandum","The first-page cover that condenses the package's purpose, background, discussion, views, recommendation, signatures, and contents","A routing log used only for classified correspondence","An attachment listing all source citations"],"a":1,"why":"The SSS, Triple-S, or e-SSS is the cover page and condensed summary of a staff package."},{"id":"gen-15-021","ch":15,"ref":"AFH 1, 15.25","q":"Which delivery format uses a thoroughly planned and practiced outline while allowing the actual words to sound spontaneous and natural?","o":["Impromptu","Manuscript","Prepared","Formal lecture"],"a":2,"why":"Prepared delivery uses careful planning, practice, and a thorough outline rather than a memorized script, so the wording remains natural."},{"id":"gen-15-022","ch":15,"ref":"AFH 1, 15.26","q":"Which quality most clearly distinguishes a briefing from other types of speaking?","o":["Accuracy","Clarity","Audience interaction","Brevity"],"a":3,"why":"Accuracy and clarity characterize good speaking generally, but brevity distinguishes a briefing."},{"id":"gen-15-023","ch":15,"ref":"AFH 1, 15.26","q":"What should a briefer do when unable to answer an audience question?","o":["Request time to research it and provide a later follow-up rather than improvise an answer","Offer the most likely answer and label it as an estimate","Redirect the question to another audience member","Omit the question from the record and continue"],"a":0,"why":"AFH 1 directs briefers not to answer off the cuff when they do not know; they should research and follow up."},{"id":"gen-15-024","ch":15,"ref":"AFH 1, 15.32","q":"Why should writers be especially careful with humor, irony, and sarcasm in e-mail?","o":["They are prohibited in every government message","Without body language, vocal tone, and other nonverbal cues, recipients may perceive them more harshly than intended","They prevent digital signatures from validating","They automatically make the message an official record"],"a":1,"why":"E-mail removes nonverbal context, so intended humor or sarcasm is easily misread and may appear harsher than the sender intended."},{"id":"gen-15-025","ch":15,"ref":"AFH 1, 15.34","q":"What should a user do upon noticing antivirus errors, virus alerts, unexpected file-size increases, unexpected disk access, or strange application behavior?","o":["Restart the system and report only if the issue returns","Delete the affected files before notifying anyone","Report the suspected information-system abnormality immediately to the organizational information assurance officer","Disconnect the system and attempt to remove the malware personally"],"a":2,"why":"Suspected malicious-logic symptoms must be reported immediately to the organizational information assurance officer."},{"id":"gen-17-001","ch":17,"ref":"AFH 1, 17.2","q":"Which sequence states the five mission areas in the DAF Emergency Management Program's primary mission?","o":["Detect, deter, defend, defeat, and recover","Prevent, protect, prepare for, respond to, and recover from hazards and threats","Plan, organize, equip, train, and evaluate","Warn, shelter, evacuate, account for, and restore"],"a":1,"why":"The primary mission is to prevent, protect, prepare for, respond to, and recover from hazards and threats posing the greatest risk."},{"id":"gen-17-002","ch":17,"ref":"AFH 1, 17.2","q":"In emergency management, which mission area consists of actions to avoid an incident or intervene to stop it from occurring?","o":["Recovery","Mitigation","Prevention","Response"],"a":2,"why":"Prevention consists of actions that avoid an incident or intervene to stop one from occurring."},{"id":"gen-17-003","ch":17,"ref":"AFH 1, 17.2","q":"Which emergency management mission area addresses the short-term, direct effects of an incident and includes immediate life-saving actions?","o":["Protection","Recovery","Prevention","Response"],"a":3,"why":"Response addresses short-term direct effects and includes immediate actions to save lives, protect property, and meet basic human needs."},{"id":"gen-17-004","ch":17,"ref":"AFH 1, 17.2","q":"Emergency management measures that reduce or eliminate risk and may occur before, during, or after an incident belong to which mission area?","o":["Mitigation","Protection","Response","Recovery"],"a":0,"why":"Mitigation reduces or eliminates risks or lessens incident effects and can be implemented before, during, or after an incident."},{"id":"gen-17-005","ch":17,"ref":"AFH 1, 17.2","q":"Which activity is characteristic of the recovery mission area rather than immediate response?","o":["Ordering the first units to stabilize an active incident","Developing and coordinating long-term service- and site-restoration plans","Intervening to stop an incident before it occurs","Broadcasting an attack warning signal"],"a":1,"why":"Recovery includes developing, coordinating, and executing service- and site-restoration plans and reconstituting operations and services."},{"id":"gen-17-006","ch":17,"ref":"AFH 1, 17.2, Emergency Communications Center","q":"Which Disaster Response Force element operates continuously and combines fire and emergency services, security forces, and medical dispatch functions?","o":["Crisis Action Team","Emergency Operations Center","Emergency Communications Center","Installation Control Center"],"a":2,"why":"The Emergency Communications Center is a 24/7 operation incorporating fire and emergency services, security forces, and medical dispatch."},{"id":"gen-17-007","ch":17,"ref":"AFH 1, 17.2, Incident Commander","q":"Who has overall authority and responsibility for managing incident operations at the incident site?","o":["Emergency Operations Center director","Installation commander","Command Post controller","Incident Commander"],"a":3,"why":"The Incident Commander has overall authority and responsibility for conducting and managing operations at the incident site."},{"id":"gen-17-008","ch":17,"ref":"AFH 1, 17.2, First Responders","q":"What distinguishes first responders from emergency responders in the DAF Emergency Management Program?","o":["First responders immediately act to save lives and stabilize the incident; emergency responders deploy afterward to expand Incident Commander capabilities","First responders work only at home station; emergency responders work only at deployed locations","First responders direct mission continuation; emergency responders command all on-scene operations","First responders are military personnel; emergency responders are civilian personnel"],"a":0,"why":"First responders immediately save lives, stabilize the incident, and prevent further damage; emergency responders follow to expand IC capabilities and support functions."},{"id":"gen-17-009","ch":17,"ref":"AFH 1, 17.2, Emergency Operations Center","q":"What is the installation Emergency Operations Center's primary function?","o":["Exercise tactical command over all personnel at the incident site","Address imminent or realized threats and coordinate support to incident command, on-scene personnel, or other EOCs","Replace the Command Post during routine operations","Focus exclusively on long-term mission continuation priorities"],"a":1,"why":"The EOC addresses imminent or realized threats and hazards and coordinates support to incident command, on-scene personnel, and other EOCs."},{"id":"gen-17-010","ch":17,"ref":"AFH 1, 17.2, Crisis Action Team","q":"Which statement correctly describes the installation Crisis Action Team?","o":["It is the on-scene element that develops incident tactics and releases resources","It performs only emergency dispatch and alarm monitoring","It supports the commander by assessing the situation, setting mission priorities, and directing subordinate units","It manages the incident itself rather than mission continuation"],"a":2,"why":"The CAT supports the installation commander through assessment, mission prioritization, and direction of subordinate units; it focuses on mission continuation, not incident management."},{"id":"gen-17-011","ch":17,"ref":"AFH 1, 17.4","q":"A hazardous materials release caused by malfunctioning equipment or human error in controlling technology is classified as what type of hazard?","o":["Natural disaster","Chemical warfare agent","Radiological event only","Technological hazard"],"a":3,"why":"Technological hazards are man-made events caused by a technological structure malfunction or human error in controlling technology."},{"id":"gen-17-012","ch":17,"ref":"AFH 1, 17.4, Chemical Agents","q":"Why do nerve and blister agents pose a primary chemical threat to air bases?","o":["Their persistent nature can leave a continuing hazard","They can be delivered only by aircraft","They produce only delayed psychological effects","Standard fire extinguishers spread them"],"a":0,"why":"AFH 1 identifies nerve and blister agents as a primary air-base threat because of their persistent nature."},{"id":"gen-17-013","ch":17,"ref":"AFH 1, 17.4, Biological Agents","q":"Which feature can make recognition of a biological attack difficult immediately after exposure?","o":["Biological agents exist only as dry powders","Symptoms may not appear until after an agent-specific incubation period","Biological agents affect materiel but not living organisms","All biological agents have the same exposure period"],"a":1,"why":"Symptoms may not be experienced immediately, and each biological agent has a different incubation period before infection."},{"id":"gen-17-014","ch":17,"ref":"AFH 1, 17.4, Radiological and Nuclear","q":"How does ionizing radiation differ from nonionizing radiation?","o":["Ionizing radiation produces heat but cannot alter matter","Ionizing radiation occurs only after a nuclear detonation","Ionizing radiation has enough energy to produce ions when interacting with matter","Ionizing radiation cannot affect human cells"],"a":2,"why":"Ionizing radiation has sufficient energy to produce ions when it interacts with matter, including the human body."},{"id":"gen-17-015","ch":17,"ref":"AFH 1, 17.4, Toxic Industrial Material","q":"What is the most important immediate action during a toxic industrial material incident, when feasible?","o":["Put on the military protective mask and remain at the release point","Approach the source from downwind to identify it","Wait for symptoms before acting","Evacuate to an area outside the hazard's path"],"a":3,"why":"The text directs immediate evacuation outside the hazard's path when feasible; if evacuation is impractical, personnel shelter in place."},{"id":"gen-17-016","ch":17,"ref":"AFH 1, 17.4, Toxic Industrial Material","q":"Which limitation must personnel remember when responding to toxic industrial materials?","o":["The protective mask, ensemble, and standard collective-protection filters are not designed to protect against toxic industrial materials","Shelter-in-place is prohibited for all toxic industrial material incidents","Toxic industrial materials present only skin-contact hazards","Evacuation is permitted only after the material is identified"],"a":0,"why":"Military protective masks, ensembles, and standard collective-protection filters are not designed for protection from toxic industrial materials."},{"id":"gen-17-017","ch":17,"ref":"AFH 1, 17.6","q":"What does a three-to-five-minute steady tone indicate?","o":["An attack or hostile act is imminent or in progress","A disaster or incident is imminent or in progress","An active shooter has been neutralized","The installation has returned to normal readiness"],"a":1,"why":"A three-to-five-minute steady tone signals that a disaster or incident is imminent or in progress."},{"id":"gen-17-018","ch":17,"ref":"AFH 1, 17.6","q":"What does a three-to-five-minute wavering tone direct personnel to recognize?","o":["A natural disaster has ended","Recovery operations are complete","An attack or hostile act is imminent or in progress","Only a communications test is underway"],"a":2,"why":"The wavering tone signals an imminent or ongoing attack or hostile act; personnel execute security measures and follow instructions."},{"id":"gen-17-019","ch":17,"ref":"AFH 1, 17.6","q":"Personnel hear the announcement, “Lockdown, lockdown, lockdown.” What should they do?","o":["Evacuate by the nearest exterior route regardless of conditions","Report to the Emergency Operations Center","Resume operations under normal wartime conditions","Remain calm and implement lockdown procedures"],"a":3,"why":"The repeated lockdown announcement indicates an active shooter incident; personnel remain calm and implement lockdown procedures."},{"id":"gen-17-020","ch":17,"ref":"AFH 1, 17.6","q":"During a shelter-in-place order for a technological disaster, which action may be required?","o":["Move to a predesignated room, shut off HVAC, and cover vents and doors with plastic","Open windows to equalize air pressure","Assemble outdoors for accountability","Enter the nearest vehicle and start its ventilation system"],"a":0,"why":"Technological-disaster sheltering may require a predesignated room, shutting off HVAC, and covering vents and doors with plastic."},{"id":"gen-17-021","ch":17,"ref":"AFH 1, 17.18","q":"What is the purpose of risk management as a decision-making process?","o":["To eliminate every possible risk before any mission begins","To evaluate courses of action, identify risks and benefits, and choose the best course for the situation","To transfer all risk decisions to safety professionals","To document mishaps only after they occur"],"a":1,"why":"Risk management systematically evaluates courses of action, identifies risks and benefits, and determines the best course for a given situation."},{"id":"gen-17-022","ch":17,"ref":"AFH 1, 17.19","q":"Which risk management principle provides the greatest opportunity to make informed decisions and establish effective controls?","o":["Avoid every high-risk mission","Delegate risk acceptance to the lowest rank","Integrate risk management into operations and planning at all levels as early as possible","Apply risk management only after execution begins"],"a":2,"why":"Early integration into planning at every level gives the greatest opportunity for informed decisions and effective controls."},{"id":"gen-17-023","ch":17,"ref":"AFH 1, 17.20","q":"At what point are deliberate and real-time risk management separated?","o":["When a risk rises above the low category","When a supervisor delegates control implementation","When an after-action review begins","When planning transitions to execution of the mission or activity"],"a":3,"why":"The two levels are interrelated and separate only when planning transitions to mission or activity execution."},{"id":"gen-17-024","ch":17,"ref":"AFH 1, 17.22","q":"Which three stages form a complete situational-awareness assessment in real-time risk management?","o":["Perception of events, integration of information and goals, and projection into the future","Hazard reporting, commander approval, and formal testing","Detection, warning, and recovery","Planning, budgeting, and inspection"],"a":0,"why":"Real-time assessment uses perception of what is happening, integration of information and goals, and projection into the future."},{"id":"gen-17-025","ch":17,"ref":"AFH 1, 17.22, Knock-it-off and Timeout Concepts","q":"What must occur when any Airman or Guardian calls “Knock-it-off” or “Timeout” during an activity?","o":["Only the caller stops while the rest of the team continues","Current actions immediately halt and the situation is stabilized so the concern can be evaluated","The call takes effect only after command approval","The activity is permanently terminated without reassessment"],"a":1,"why":"Either call immediately halts current actions and requires stabilization to a safe position for evaluation; command authority cannot override it."},{"id":"gen-18-001","ch":18,"ref":"AFH 1, 18.2","q":"What is the goal of integrated defense?","o":["To eliminate every natural hazard within the installation perimeter","To transfer installation security to local authorities","To neutralize security threats within the base boundary and base security zone so USAF operations remain unhindered","To restrict defense planning to security forces personnel"],"a":2,"why":"Integrated defense seeks to neutralize threats within the base boundary and base security zone to ensure unhindered USAF operations."},{"id":"gen-18-002","ch":18,"ref":"AFH 1, 18.2, Base Boundary","q":"Which statement about a base boundary is correct?","o":["It always follows the legal property line","It is identical to the installation's fenced perimeter","It includes only terrain owned by the Department of Defense","It delineates the surface area used to coordinate and deconflict operations and need not match the fenced perimeter or legal boundary"],"a":3,"why":"The base boundary facilitates coordination and deconfliction and may differ from fenced perimeters, property lines, and legal boundaries."},{"id":"gen-18-003","ch":18,"ref":"AFH 1, 18.2, Base Security Zone","q":"What area does the USAF planning term “base security zone” describe?","o":["The area outside the base perimeter from which standoff weapons or waterborne threats could make the base vulnerable","Only the controlled areas located inside the installation fence","The airspace directly above the installation runway","The legal property contained within the base boundary"],"a":0,"why":"The base security zone is the area outside the perimeter from which standoff weapons and waterborne threats may endanger the base."},{"id":"gen-18-004","ch":18,"ref":"AFH 1, 18.3","q":"Which integrated defense effect uses barriers, obstacles, technology, physical security measures, and forces to slow an adversary?","o":["Assess","Delay","Warn","Recover"],"a":1,"why":"Delay uses layered barriers, obstacles, technology, security measures, and forces—defense in depth—to slow adversaries."},{"id":"gen-18-005","ch":18,"ref":"AFH 1, 18.3","q":"In the example progression of integrated defense effects, what follows detection of a threat?","o":["Immediate recovery","Automatic mission termination","Assessment by friendly forces","Removal of all barriers"],"a":2,"why":"The example progression moves from deterrence to detection, then assessment, warning, defeat, delay, defense, and recovery as needed."},{"id":"gen-18-006","ch":18,"ref":"AFH 1, 18.4","q":"What is the Base Defense Operations Center?","o":["The installation office responsible only for security-clearance adjudication","A temporary dispatch function used only during deployments","The center that publishes antiterrorism travel advisories","The command-and-control center for integrated defense during routine and emergency operations"],"a":3,"why":"The BDOC is the integrated defense command-and-control center in both routine and emergency operations."},{"id":"gen-18-007","ch":18,"ref":"AFH 1, 18.6","q":"Loss or compromise of which protection-level resource would cause significant degradation to U.S. warfighting capability?","o":["Protection Level 2","Protection Level 1","Protection Level 3","Protection Level 4"],"a":0,"why":"PL2 covers resources whose loss or compromise would significantly degrade U.S. warfighting capability."},{"id":"gen-18-008","ch":18,"ref":"AFH 1, 18.6","q":"How are Protection Level 4 resources principally secured?","o":["By assigning them the maximum deterrence required for nuclear weapons","By placing them in controlled areas under owner or user security, with security forces responding to threats","By maintaining a dedicated armed escort at all times","By treating every PL4 resource as a one-of-a-kind strategic system"],"a":1,"why":"PL4 resources are contained in controlled areas, owners or users are responsible for security, and security forces respond to threats."},{"id":"gen-18-009","ch":18,"ref":"AFH 1, 18.7","q":"What is the correct order of the operations security cycle?","o":["Assess risk, identify critical information, apply countermeasures, analyze vulnerabilities, analyze threats","Analyze threats, assess risk, identify critical information, apply countermeasures, analyze vulnerabilities","Identify critical information, analyze threats, analyze vulnerabilities, assess risk, apply countermeasures","Identify vulnerabilities, apply countermeasures, analyze threats, assess risk, identify critical information"],"a":2,"why":"The OPSEC cycle is identify critical information, analyze threats, analyze vulnerabilities, assess risk, and apply countermeasures."},{"id":"gen-18-010","ch":18,"ref":"AFH 1, 18.8","q":"Which operations security indicator characteristic is the sum of an activity's signatures and associations?","o":["Contrast","Exposure","Signature","Profile"],"a":3,"why":"An activity's profile is the combined set of its signatures and associations."},{"id":"gen-18-011","ch":18,"ref":"AFH 1, 18.8","q":"An observable difference between an activity's standard profile and its current actions is what type of OPSEC indicator characteristic?","o":["Contrast","Association","Exposure","Signature"],"a":0,"why":"A contrast is a difference between an activity's standard profile and its recent or current actions."},{"id":"gen-18-012","ch":18,"ref":"AFH 1, 18.10","q":"Unauthorized disclosure reasonably expected to cause damage—not serious or exceptionally grave damage—to national security corresponds to which classification?","o":["Secret","Confidential","Top Secret","Controlled Unclassified Information"],"a":1,"why":"Confidential applies when unauthorized disclosure could reasonably be expected to cause damage to national security."},{"id":"gen-18-013","ch":18,"ref":"AFH 1, 18.11, Original Classification","q":"Who may make an original classification decision?","o":["Any cleared member with annual refresher training","Any supervisor with a need to know","Only an official designated in writing","Only the author of the information"],"a":2,"why":"Only officials designated in writing may make original classification decisions."},{"id":"gen-18-014","ch":18,"ref":"AFH 1, 18.11, End-of-Day Security Checks","q":"Which form records end-of-day security checks in an area where classified information is used or stored?","o":["SF 312","SF 703","SF 705","SF 701"],"a":3,"why":"SF 701, Activity Security Checklist, records required end-of-day checks in areas using or storing classified information."},{"id":"gen-18-015","ch":18,"ref":"AFH 1, 18.12","q":"What must a person do upon finding classified material out of proper control?","o":["Take custody, safeguard it, and immediately notify the commander, supervisor, or security manager","Leave it untouched and notify coworkers at the end of the duty day","Destroy it immediately without documenting the event","Post a public notice asking its owner to retrieve it"],"a":0,"why":"Anyone finding uncontrolled classified material must take custody, safeguard it, and immediately notify appropriate leadership or security personnel."},{"id":"gen-18-016","ch":18,"ref":"AFH 1, 18.12, Data Spills","q":"How is a classified data spill handled before an inquiry determines whether unauthorized disclosure occurred?","o":["As an infraction requiring no inquiry","As a possible compromise of classified information","As a routine computer malfunction","As a loss only if the source file cannot be found"],"a":1,"why":"A classified data spill is treated as a possible compromise until an inquiry determines whether unauthorized disclosure occurred."},{"id":"gen-18-017","ch":18,"ref":"AFH 1, 18.15","q":"When must a Privacy Act statement be provided?","o":["Whenever an employee views any federal record","Only when classified information is collected","When individuals are asked to provide personal information about themselves for a system of records","Only after a personally identifiable information breach"],"a":2,"why":"A Privacy Act statement is required when individuals provide personal information about themselves for collection in a system of records."},{"id":"gen-18-018","ch":18,"ref":"AFH 1, 18.16","q":"What is the standard Freedom of Information Act time limit to deny a request or release the requested records?","o":["10 calendar days","15 workdays","30 calendar days","20 workdays"],"a":3,"why":"FOIA imposes a 20-workday limit to deny or release records, with a possible 10-workday extension for specified unusual circumstances."},{"id":"gen-18-019","ch":18,"ref":"AFH 1, 18.17","q":"Which sequence lists the five functions of the USAF Cybersecurity Program?","o":["Identify, protect, detect, respond, recover","Prevent, classify, encrypt, transmit, destroy","Assess, authorize, monitor, inspect, report","Plan, acquire, operate, defend, retire"],"a":0,"why":"The five cybersecurity functions are Identify, Protect, Detect, Respond, and Recover."},{"id":"gen-18-020","ch":18,"ref":"AFH 1, 18.19","q":"What is the required reaction after notification of a virus or malware detection?","o":["Attempt to remove it without reporting the event","Immediately notify the information system security officer and follow local procedures","Continue operating until the system fails","Report it only if classified information was stored on the system"],"a":1,"why":"The reaction step requires immediate notification of the information system security officer and compliance with local procedures."},{"id":"gen-18-021","ch":18,"ref":"AFH 1, 18.21","q":"What is the consequence of using public computing facilities to access web-based government services?","o":["It is permitted if no files are downloaded","It is limited authorized personal use","It constitutes compromise of login credentials and must be reported as a security incident","It is allowed when multifactor authentication is used"],"a":2,"why":"Accessing web-based government services through public computing facilities compromises login credentials and must be reported."},{"id":"gen-18-022","ch":18,"ref":"AFH 1, 18.23","q":"What is the objective of TEMPEST?","o":["To detect malicious software by behavioral analysis","To secure classified material during registered-mail transport","To control physical entry into all installation facilities","To deny access to information that could be derived from compromising emanations within an inspectable space"],"a":3,"why":"TEMPEST measures deny unauthorized access to information obtainable by intercepting and analyzing compromising emanations."},{"id":"gen-18-023","ch":18,"ref":"AFH 1, 18.24","q":"What is AFOSI's antiterrorism and force-protection role?","o":["It is the lead USAF agency for collection, investigation, analysis, and response to terrorist, criminal, foreign-intelligence, and security-service threats","It establishes every installation's base boundary","It approves all mobile computing devices","It serves only as the local liaison for natural disasters"],"a":0,"why":"AFOSI leads USAF collection, investigation, analysis, and response for terrorist, criminal, foreign-intelligence, and security-service threats."},{"id":"gen-18-024","ch":18,"ref":"AFH 1, 18.24, Random Antiterrorism Measures Program","q":"Why are the times, locations, and durations of random antiterrorism measures regularly changed?","o":["To eliminate the need for installation antiterrorism plans","To introduce uncertainty, defeat surveillance, and prevent terrorists from predicting actions","To restrict participation to security forces","To apply the measures only during FPCON Charlie"],"a":1,"why":"Changing random measures creates uncertainty, frustrates surveillance, and makes installation actions difficult to predict."},{"id":"gen-18-025","ch":18,"ref":"AFH 1, 18.31","q":"By when must an individual report a reportable contact or reportable information to AFOSI?","o":["At the next annual counterintelligence briefing","Within 90 days after returning to home station","Immediately, defined as within 30 days of the contact","Only after confirming foreign-intelligence involvement"],"a":2,"why":"AFI 71-101, Volume 4 requires immediate reporting—within 30 days of contact—verbally or in writing to AFOSI."},{"id":"gen-19-001","ch":19,"ref":"AFH 1, 19.2","q":"What do DAF Instructions, Air Force Instructions, and Space Force Instructions generally tell readers?","o":["Why a historical event occurred","How to perform specialized technical procedures step by step","Which optional reference aids may be ignored","What to do by directing action and standardizing compliance across the DAF"],"a":3,"why":"DAFIs, AFIs, and SPFIs generally direct what to do and standardize compliant actions across the Department."},{"id":"gen-19-002","ch":19,"ref":"AFH 1, 19.2","q":"What do DAF, Air Force, and Space Force manuals generally provide?","o":["How-to procedures and detailed technical guidance for standard tasks or education and training","Only nonmandatory historical background","Policy statements that may never contain procedures","Rules issued exclusively by combatant commanders"],"a":0,"why":"Manuals generally provide how-to detail, technical procedures, or support for education and training programs."},{"id":"gen-19-003","ch":19,"ref":"AFH 1, 19.2, Nondirective Publications","q":"How should Airmen treat guidance in a nondirective publication?","o":["It is legally binding in every circumstance","Compliance is expected but not mandatory, and guidance may be adapted to circumstances","It may be used only by publication managers","It supersedes all directive publications"],"a":1,"why":"Nondirective publications are reference aids whose guidance may be modified; compliance is expected but not mandatory."},{"id":"gen-19-004","ch":19,"ref":"AFH 1, 19.3","q":"When may a competent authority require an Airman to report for duty?","o":["Only during the published duty day","Only after leave has formally ended","At any time and location, including weekends, holidays, and while on leave, for as long as necessary","Only at the Airman's permanent duty station"],"a":2,"why":"Airmen are always subject to duty and, when properly directed, must report at any time and location for as long as necessary."},{"id":"gen-19-005","ch":19,"ref":"AFH 1, 19.3, General Orders","q":"What consequences may follow failure to comply with a General Order?","o":["Only verbal counseling","Automatic discharge without proceedings","Civil liability but no military action","Adverse administrative action, nonjudicial punishment, or UCMJ criminal prosecution"],"a":3,"why":"Failure to obey General Orders can lead to administrative action, nonjudicial punishment, or criminal prosecution under the UCMJ."},{"id":"gen-19-006","ch":19,"ref":"AFH 1, 19.5","q":"What is a central humanitarian purpose of the law of war?","o":["To lessen conflict's effects, prevent unnecessary suffering, and protect combatants and noncombatants","To prohibit every use of military force","To replace commanders' operational judgment with civilian courts","To protect only military prisoners of war"],"a":0,"why":"The law of war seeks to lessen conflict's effects, protect combatants and noncombatants, and prevent unnecessary suffering."},{"id":"gen-19-007","ch":19,"ref":"AFH 1, 19.5, Law of War Training","q":"How is law-of-war training assigned to USAF personnel?","o":["Every member receives an identical course regardless of duties","Training is commensurate with duties and responsibilities, with specialized training for groups facing unique situations","Only aircrews, medical personnel, and security forces receive training","Training is required only before deployment to international armed conflict"],"a":1,"why":"Training matches members' duties and responsibilities; groups such as aircrews, medics, and security forces receive specialized instruction."},{"id":"gen-19-008","ch":19,"ref":"AFH 1, 19.6, Military Necessity","q":"What does the law-of-war principle of military necessity permit?","o":["Any action that shortens a conflict","Attacks on civilians when they may influence enemy morale","Measures needed to defeat the enemy efficiently that are not prohibited by the law of war","Reprisals against all protected persons"],"a":2,"why":"Military necessity allows measures needed for efficient defeat of the enemy only when those measures are not prohibited by the law of war."},{"id":"gen-19-009","ch":19,"ref":"AFH 1, 19.6, Humanity","q":"Which principle forbids suffering, injury, or destruction unnecessary to achieve a legitimate military purpose?","o":["Distinction","Honor","Proportionality","Humanity"],"a":3,"why":"Humanity prohibits suffering, injury, or destruction beyond what is necessary for a legitimate military purpose."},{"id":"gen-19-010","ch":19,"ref":"AFH 1, 19.6, Distinction","q":"A civilian school is being used to make an effective contribution to military action. What may happen to its status under the principle of distinction?","o":["It may lose its protected civilian-object status","It remains absolutely immune from attack in every circumstance","It automatically becomes a prisoner-of-war facility","It may be attacked without considering proportionality"],"a":0,"why":"A civilian object can lose protected status if used to make an effective contribution to military action, though other law-of-war rules still apply."},{"id":"gen-19-011","ch":19,"ref":"AFH 1, 19.6, Proportionality","q":"What does proportionality require when planning an otherwise justified attack?","o":["That an attack cause no incidental civilian harm whatsoever","That expected incidental harm not be excessive relative to the anticipated concrete and direct military advantage","That civilian harm equal the value of the target","That only weapons producing no blast effect be used"],"a":1,"why":"Proportionality bars attacks with expected incidental harm excessive in relation to the concrete and direct military advantage anticipated."},{"id":"gen-19-012","ch":19,"ref":"AFH 1, 19.6, Honor","q":"Which conduct is prohibited by the law-of-war principle of honor?","o":["A lawful ruse intended to mislead the enemy","Camouflage used to conceal a military position","Killing or wounding an enemy through perfidy or treachery","Withholding operational plans from the enemy"],"a":2,"why":"Honor prohibits breaches of trust such as killing or wounding through perfidy, while lawful ruses remain permitted."},{"id":"gen-19-013","ch":19,"ref":"AFH 1, 19.7","q":"How must a captured person be treated while doubt remains about whether the person is a lawful combatant, noncombatant, or unprivileged belligerent?","o":["As a civilian criminal with no law-of-war protection","According to the captor's preferred classification","As an unprivileged belligerent until the person proves otherwise","With Geneva Prisoner of War Convention protections until status is determined"],"a":3,"why":"A captured individual of uncertain status receives Geneva POW Convention protections until actual status is determined."},{"id":"gen-19-014","ch":19,"ref":"AFH 1, 19.7, Noncombatants","q":"Which military personnel are examples of noncombatants who may not be made the object of attack?","o":["Permanent medical and religious personnel not authorized to engage in combatant activities","All military intelligence personnel","Every member assigned to a headquarters","Combatants who temporarily remove their uniforms"],"a":0,"why":"Permanent medical and religious personnel are military noncombatants who must be respected and protected from attack."},{"id":"gen-19-015","ch":19,"ref":"AFH 1, 19.7, Civilians","q":"What happens to civilians who take an active or direct part in hostilities?","o":["They automatically gain lawful combatant immunity","They forfeit protection from being made the object of attack while participating","They must be treated as permanent medical personnel","They retain absolute protection from direct attack"],"a":1,"why":"Civilians directly participating in hostilities forfeit their protection from being made the object of attack."},{"id":"gen-19-016","ch":19,"ref":"AFH 1, 19.8, Enemy Aircraft and Aircrew","q":"When may an airman parachuting from a disabled enemy aircraft be attacked?","o":["Whenever the parachute is visible","Only before leaving the aircraft","If the airman resists while descending or lands behind friendly lines and continues fighting","Never, even if the airman continues hostile acts"],"a":2,"why":"An airman offering no resistance during descent may not be attacked, but resistance in descent or continued fighting after landing can make the person subject to attack."},{"id":"gen-19-017","ch":19,"ref":"AFH 1, 19.9","q":"What duty accompanies every service member's obligation to comply with the law of war?","o":["Obey every order without evaluating its legality","Report suspected violations only after obtaining proof beyond doubt","Refer every targeting decision directly to an international tribunal","Refuse clearly illegal orders to commit law-of-war violations"],"a":3,"why":"The duty to comply includes refusing clearly illegal orders to commit law-of-war violations."},{"id":"gen-19-018","ch":19,"ref":"AFH 1, 19.9, Reporting Violations","q":"If a suspected law-of-war violation may involve a U.S. commander, where should the report be made?","o":["To the next higher U.S. command authority","Only to the commander named in the allegation","Directly to the foreign government involved","Only to civilian law enforcement"],"a":0,"why":"When an allegation involves or may involve a U.S. commander, it should be reported to the next higher U.S. command authority."},{"id":"gen-19-019","ch":19,"ref":"AFH 1, 19.10","q":"What do rules of engagement generally establish?","o":["The standards for granting security clearances","Parameters for when, where, how, why, and against whom force may be used","The order of succession among prisoners of war","The publication process for military manuals"],"a":1,"why":"ROE set the parameters governing when, where, how, why, and against whom commanders and Airmen may use force."},{"id":"gen-19-020","ch":19,"ref":"AFH 1, 19.10, De-escalation","q":"When should forces committing hostile acts or demonstrating hostile intent be warned and allowed to withdraw or cease?","o":["Only after force has already been used","Whenever the opposing force requests negotiations","When time and circumstances permit","Only when ordered by the President"],"a":2,"why":"De-escalation calls for warning and an opportunity to withdraw or cease threatening actions when time and circumstances permit."},{"id":"gen-19-021","ch":19,"ref":"AFH 1, 19.10, Proportionality in Self-Defense","q":"Under rules of engagement, what limits force used in self-defense?","o":["It must always be less than the force threatened","It may continue until every potential threat is removed","It is limited to nonlethal measures","It must be necessary and reasonable in nature, duration, and scope compared with the threat"],"a":3,"why":"Self-defense force must be necessary to counter the threat and reasonable in nature, duration, and scope based on facts known at the time."},{"id":"gen-19-022","ch":19,"ref":"AFH 1, 19.11, Code of Conduct Training","q":"Who receives Level A Code of Conduct training?","o":["All members of the U.S. Armed Forces during entry training","Only members at moderate risk of capture","Only aircrews and special mission forces","Only personnel exposed to classified information"],"a":0,"why":"Level A is the minimum understanding required for all Armed Forces members and is given during entry training."},{"id":"gen-19-023","ch":19,"ref":"AFH 1, 19.11, Code of Conduct Training","q":"Which members require Level C Code of Conduct training?","o":["Members whose duties carry no meaningful capture risk","Members at significant or high risk of capture who are especially vulnerable to exploitation because of position, rank, or seniority","All civilian employees during initial orientation","Only prisoners after repatriation"],"a":1,"why":"Level C applies to high- or significant-capture-risk members whose position, rank, or seniority creates greater-than-average exploitation risk."},{"id":"gen-19-024","ch":19,"ref":"AFH 1, 19.12, Article III","q":"Under Code of Conduct Article III, how should a prisoner of war treat parole or special favors from the enemy?","o":["Accept them if they improve personal survival odds","Accept parole but refuse material favors","Accept neither parole nor special favors","Accept them only with another prisoner's approval"],"a":2,"why":"Article III requires continued resistance and expressly states that prisoners will accept neither parole nor special favors from the enemy."},{"id":"gen-19-025","ch":19,"ref":"AFH 1, 19.13, Terrorist Hostage","q":"During a rescue attempt in a terrorist-hostage situation, what should a hostage do?","o":["Run toward rescuers and identify the captors","Attempt to disarm a captor while rescuers enter","Argue with captors to distract them","Take cover, remain stationary when practicable, and do not try to help rescuers"],"a":3,"why":"During rescue, hostages should take cover, remain stationary when practicable, and avoid attempting to help the rescuers."},{"id":"gen-20-001","ch":20,"ref":"AFH 1, 20.1","q":"Which statement best describes the Air Force Inspection System (AFIS)?","o":["A disciplinary process used only after a unit fails an inspection","A credible, independent assessment process commanders use to measure assigned-force capabilities","A self-assessment database used exclusively by shop-level personnel","A scheduling system for eliminating all external inspections"],"a":1,"why":"AFIS gives commanders a credible, independent process for assessing the capabilities of assigned forces."},{"id":"gen-20-002","ch":20,"ref":"AFH 1, 20.2","q":"To whom does The Inspector General communicate directly on Department of the Air Force IG matters?","o":["Only the Secretary of Defense","Only MAJCOM commanders and wing inspectors general","The SecAF, Chief of Staff of the Air Force, Chief of Space Operations, and other USAF and USSF command elements","Congressional committees and state governors"],"a":2,"why":"TIG communicates directly with the SecAF, CSAF, CSO, and all other USAF and USSF command elements on IG matters."},{"id":"gen-20-003","ch":20,"ref":"AFH 1, 20.3","q":"Which task belongs to Wing, Delta, and equivalent inspectors general?","o":["Approve all unit disciplinary actions","Command the units being inspected","Replace commanders' responsibility for readiness evaluations","Execute the commander's inspection program and validate unit self-assessments"],"a":3,"why":"Wing, Delta, and equivalent IGs execute the CCIP, validate and verify self-assessments, and independently assess unit effectiveness."},{"id":"gen-20-004","ch":20,"ref":"AFH 1, 20.5","q":"What authority do inspection Gatekeepers exercise on behalf of their commanders?","o":["They may approve, disapprove, schedule, deconflict, and eliminate duplication among inspection-type activities","They may waive compliance requirements identified during inspections","They may replace a Unit Effectiveness Inspection with a self-assessment","They may direct non-mission-essential activities to take precedence over commander priorities"],"a":0,"why":"Gatekeepers synchronize inspection activity and may approve, disapprove, schedule, deconflict, and eliminate duplication."},{"id":"gen-20-005","ch":20,"ref":"AFH 1, 20.6","q":"What is the purpose of the Commander's Inspection Program at the Wing level?","o":["To certify every nuclear-capable unit","To improve readiness, efficiency, discipline, effectiveness, compliance, and surety","To replace all MAJCOM external evaluations","To determine individual promotion eligibility"],"a":1,"why":"The CCIP improves readiness, efficiency, discipline, effectiveness, compliance, and surety at the Wing level."},{"id":"gen-20-006","ch":20,"ref":"AFH 1, 20.6","q":"A Nuclear Surety Inspection evaluates whether a certified nuclear-capable unit can do what?","o":["Schedule non-Air Force inspection requirements","Eliminate all risk associated with nuclear operations","Manage assigned nuclear resources and execute nuclear missions safely, securely, and reliably","Conduct a multi-year evaluation of all four Major Graded Areas"],"a":2,"why":"An NSI evaluates safe, secure, and reliable management of nuclear resources and execution of nuclear missions."},{"id":"gen-20-007","ch":20,"ref":"AFH 1, 20.6","q":"Which list contains the four Major Graded Areas used in a Unit Effectiveness Inspection?","o":["Policy, training, manpower, and facilities","Readiness, compliance, discipline, and surety","Planning, organizing, directing, and controlling","Managing resources, leading people, improving the unit, and executing the mission"],"a":3,"why":"The UEI's four MGAs are managing resources, leading people, improving the unit, and executing the mission."},{"id":"gen-20-008","ch":20,"ref":"AFH 1, 20.7","q":"What is the primary purpose of the Unit Self-Assessment Program?","o":["To accurately identify and report issues so Airmen can safely report what is true","To prepare units to conceal deficiencies before an external inspection","To transfer compliance responsibility from commanders to inspectors","To score individual Airmen against Major Graded Areas"],"a":0,"why":"The USAP is intended to identify and report issues accurately in a climate where Airmen can safely report the truth."},{"id":"gen-20-009","ch":20,"ref":"AFH 1, 20.7","q":"What is the Management Internal Control Toolset (MICT)?","o":["The system used to schedule nuclear inspections","A USAF program of record and tool for managing Unit Self-Assessment Programs","A complaint channel available only to commanders","The database used solely for final inspection reports"],"a":1,"why":"MICT is a USAF program of record used to manage USAPs."},{"id":"gen-20-010","ch":20,"ref":"AFH 1, 20.8","q":"After an inspection, validated report data must be categorized in which three ways?","o":["Open, pending, or closed","Minor, major, or critical","Strengths, deficiencies, or recommended improvement areas","Compliant, noncompliant, or exempt"],"a":2,"why":"Inspection reports categorize validated data as strengths, deficiencies, or recommended improvement areas."},{"id":"gen-20-011","ch":20,"ref":"AFH 1, 20.9","q":"Which statement about communicating with an Inspector General or member of Congress is correct?","o":["A supervisor may restrict the communication until local remedies are exhausted","The communication must be submitted only in writing","Only complaints involving fraud, waste, or abuse may bypass the chain of command","No person may restrict a military member from making a lawful communication to an IG or member of Congress"],"a":3,"why":"Public law prohibits restricting a military member's lawful communication to an IG or member of Congress."},{"id":"gen-20-012","ch":20,"ref":"AFH 1, 20.9","q":"Who may investigate allegations of reprisal and restriction under the Military Whistleblower's Protection Act?","o":["Only the Inspector General","Any commander in the complainant's chain","The Equal Opportunity office","The Staff Judge Advocate without an IG referral"],"a":0,"why":"Only the IG may investigate reprisal and restriction allegations under the Military Whistleblower's Protection Act."},{"id":"gen-20-013","ch":20,"ref":"AFH 1, 20.12","q":"What must an Airman requesting a religious accommodation do while the request is pending?","o":["Suspend compliance with the affected directive","Continue complying with directives, instructions, and lawful orders until approval","Treat submission of the request as temporary approval","Comply only if the commander issues a separate written order"],"a":1,"why":"Requesters must continue to comply with directives, instructions, and lawful orders until the accommodation is approved."},{"id":"gen-20-014","ch":20,"ref":"AFH 1, 20.12","q":"If a religious accommodation is denied, what standard must the decision satisfy?","o":["It must be based solely on local custom","It must show that any restriction is administratively convenient","It must directly relate to a compelling government interest and use the least restrictive means necessary","It must establish that the belief is shared by a recognized religious organization"],"a":2,"why":"A denial must be fact-based, tied to a compelling military interest, and use the least restrictive means necessary."},{"id":"gen-20-015","ch":20,"ref":"AFH 1, 20.13","q":"Which political activity is prohibited for a USAF member, whether in uniform or not?","o":["Voting in an election","Privately expressing a political opinion","Attending a rally solely as a spectator while out of uniform","Participating in partisan fundraising, campaign management, rallies, conventions, or debates"],"a":3,"why":"Members may not participate in specified partisan activities, regardless of uniform wear or apparent official endorsement."},{"id":"gen-20-016","ch":20,"ref":"AFH 1, 20.13","q":"After receiving an allegation of activity prohibited by DoDI 1325.06, when must military organizations normally report it to the servicing IG?","o":["Within 30 calendar days; Reserve Component officials have 60 calendar days","Within 15 duty days for every component","Within 60 calendar days; Reserve Component officials have 30 calendar days","Only after an investigation substantiates the allegation"],"a":0,"why":"The normal deadline is 30 calendar days; Reserve Component officials must transmit within 60 calendar days."},{"id":"gen-20-017","ch":20,"ref":"AFH 1, 20.14","q":"How does AFH 1 distinguish the two blood alcohol concentration thresholds discussed for impairment?","o":["A BAC of 0.05 is conclusive impairment, while 0.08 requires other evidence","Above 0.08 is considered impaired; 0.05 to less than 0.08 may support a presumption of impairment","Only a BAC above 0.10 can establish impairment","Both thresholds automatically require permanent loss of installation driving privileges"],"a":1,"why":"A BAC greater than .08 is considered impaired; from .05 to less than .08, impairment may be presumed with other competent evidence."},{"id":"gen-20-018","ch":20,"ref":"AFH 1, 20.16","q":"Why should commander-directed drug testing be used only as a last resort?","o":["It requires approval from a military judge","It can test only officers","Its results may not be used for UCMJ discipline or to characterize an administrative discharge","It is valid only when the member voluntarily consents"],"a":2,"why":"Commander-directed test results cannot support UCMJ discipline or characterize an administrative discharge."},{"id":"gen-20-019","ch":20,"ref":"AFH 1, 20.16","q":"Which statement describes a probable-cause urine search under Military Rule of Evidence 315?","o":["It may be ordered without authorization whenever a unit inspection is announced","It may be based only on a member's refusal to consent","Its results may be used only for medical referral","It requires authorization from competent search authority and a reasonable belief that evidence of illegal drug use will be found"],"a":3,"why":"A probable-cause search requires proper authorization and a reasonable belief that evidence of illegal drug use will be found."},{"id":"gen-20-020","ch":20,"ref":"AFH 1, 20.16","q":"How may a commander use a qualifying member's voluntary self-identification of a substance-use problem?","o":["It may not be used against the member under the UCMJ or to characterize service in an administrative discharge","It automatically requires an under other than honorable discharge","It may be used as proof of misconduct without corroboration","It bars the member from receiving an ADAPT assessment"],"a":0,"why":"Qualifying voluntary self-identification is protected from use in UCMJ action and discharge characterization decisions."},{"id":"gen-20-021","ch":20,"ref":"AFH 1, 20.19","q":"Which list contains all six forms of harassment covered by the Air Force Equal Opportunity Program?","o":["Verbal, written, physical, electronic, visual, and social","Discriminatory, sexual, bullying, hazing, retaliation, and reprisal","Coercion, intimidation, favoritism, reprisal, assault, and neglect","Bullying, hazing, fraternization, reprisal, misconduct, and discrimination"],"a":1,"why":"The six forms are discriminatory harassment, sexual harassment, bullying, hazing, retaliation, and reprisal."},{"id":"gen-20-022","ch":20,"ref":"AFH 1, 20.19","q":"Can a service member be responsible for bullying or hazing if the victim actually or implicitly consented?","o":["No; consent is a complete defense","Only when the victim is junior in rank","Yes; consent does not prevent responsibility, regardless of the victim's grade, status, or service","Yes, but only at official unit functions"],"a":2,"why":"A member may be responsible despite actual or implied consent and regardless of the victim's grade, rank, status, or service."},{"id":"gen-20-023","ch":20,"ref":"AFH 1, 20.20","q":"Which rule applies to military Equal Opportunity complaints?","o":["Any coworker may file on behalf of the affected member","Only commanders may initiate a complaint","The EO office accepts complaints arising from off-base civilian employment","The filer must be the subject of the alleged discrimination or sexual harassment; third parties cannot file for another person"],"a":3,"why":"Military EO complaints must be filed by the affected individual; third parties are referred to their chain of command."},{"id":"gen-20-024","ch":20,"ref":"AFH 1, 20.24","q":"What is the normal initial duration of placement on a control roster?","o":["Six months, with possible early removal at the commander's discretion","One year with no early-removal authority","Three duty days beginning when the member acknowledges the action","Ninety days beginning when the commander assumes command"],"a":0,"why":"Control-roster placement initially lasts six months, although the commander may remove it early."},{"id":"gen-20-025","ch":20,"ref":"AFH 1, 20.29","q":"Which former USAF member may request Air Force Discharge Review Board review within 15 years of separation?","o":["A member dismissed by general court-martial","A member with an administrative discharge, but not one with a bad-conduct discharge, dishonorable discharge, or general court-martial dismissal","Only a retiree seeking to change a reenlistment code","Any former member, with no exception for the type of discharge"],"a":1,"why":"The board reviews eligible discharges within 15 years, excluding bad-conduct and dishonorable discharges and dismissal by general court-martial."},{"id":"gen-22-001","ch":22,"ref":"AFH 1, 22.1","q":"What is the goal of the Physical Fitness Program?","o":["To prepare Airmen only during the month before an assessment","To measure body composition without considering conditioning","To motivate year-round conditioning emphasizing aerobic conditioning, muscular fitness, and healthy eating","To establish one identical fitness score standard for every age and gender"],"a":2,"why":"The PFP promotes year-round physical conditioning built around aerobic conditioning, muscular fitness, and healthy eating."},{"id":"gen-22-002","ch":22,"ref":"AFH 1, 22.3","q":"How does the Body Composition Program assess Air Force members?","o":["It uses body weight alone during each fitness assessment","It uses abdominal circumference as a scored fitness component","It calculates body-fat percentage from age and weight","It requires an annual assessment in the member's birth month and uses waist circumference divided by height"],"a":3,"why":"The annual BCA occurs in the birth month and calculates waist-to-height ratio by dividing waist circumference by height."},{"id":"gen-22-003","ch":22,"ref":"AFH 1, 22.4","q":"Which waist-to-height ratio is classified as meeting the Body Composition Program standard?","o":["A ratio below 0.55","A ratio of 0.55 or higher","Any ratio below 0.75","A ratio above 0.55 when the fitness score is satisfactory"],"a":0,"why":"A WHtR below 0.55 meets the standard and is categorized as low-moderate risk."},{"id":"gen-22-004","ch":22,"ref":"AFH 1, 22.6","q":"What is the required sequence for fitness assessment components?","o":["Cardiorespiratory, core endurance, muscular strength, then height and weight","Height and weight, muscular strength, core endurance, then cardiorespiratory fitness","Muscular strength, cardiorespiratory fitness, height and weight, then core endurance","Core endurance, height and weight, cardiorespiratory fitness, then muscular strength"],"a":1,"why":"The sequence is height and weight first, followed by muscular strength, core endurance, and cardiorespiratory fitness."},{"id":"gen-22-005","ch":22,"ref":"AFH 1, 22.6","q":"Which timing rule applies to a fitness assessment?","o":["Components may be spread over two duty days","The assessment must finish within one hour with no required rest","All components must be completed the same day within three hours, with at least five minutes between components","Only the aerobic and muscular components must occur on the same day"],"a":2,"why":"All components occur within a three-hour window on one day, with a minimum five-minute rest between components."},{"id":"gen-22-006","ch":22,"ref":"AFH 1, 22.7","q":"How are the 100 possible fitness assessment points allocated?","o":["40 aerobic, 30 muscular, and 30 core endurance","50 aerobic, 25 muscular, and 25 core endurance","60 aerobic and 40 body composition","60 aerobic, 20 muscular, and 20 core endurance"],"a":3,"why":"The maximums are 60 points for aerobic fitness, 20 for muscular fitness, and 20 for core endurance."},{"id":"gen-22-007","ch":22,"ref":"AFH 1, 22.7","q":"Why does meeting every minimum component score not necessarily produce a passing assessment?","o":["The minimum values together do not generate the required composite score of 75 or greater","A member must score excellent in at least one component","Body composition must add at least 10 points","Each component must independently earn 75 percent"],"a":0,"why":"Minimum performance in every component still may total less than the passing composite score of 75."},{"id":"gen-22-008","ch":22,"ref":"AFH 1, 22.8","q":"How do medical component exemptions affect fitness testing?","o":["Any exemption cancels the entire assessment","Airmen still test on every component not specifically exempted by the medical profile","Only the aerobic component may be exempted","An exemption may be granted without a medical-provider recommendation"],"a":1,"why":"A medical profile exempts only specified components; the Airman must complete all non-exempt components."},{"id":"gen-22-009","ch":22,"ref":"AFH 1, 22.9","q":"What is muscular endurance?","o":["The maximum force produced in one effort","The ability to sustain large-muscle aerobic exercise","The ability of a muscle group to repeat contractions long enough to cause muscular fatigue","The maximum range through which a joint can move"],"a":2,"why":"Muscular endurance is repeated muscle-group contraction over sufficient time to cause fatigue."},{"id":"gen-22-010","ch":22,"ref":"AFH 1, 22.9","q":"How does AFH 1 define aerobic fitness?","o":["The force generated by a muscle group in one contraction","The ability to recover after resistance training","The ability to maintain flexibility under load","The ability to perform large-muscle, dynamic, moderate-to-high intensity exercise for prolonged periods"],"a":3,"why":"Aerobic fitness is cardiorespiratory endurance during prolonged, dynamic, large-muscle exercise at moderate-to-high intensity."},{"id":"gen-22-011","ch":22,"ref":"AFH 1, 22.10","q":"What is the recommended duration of a dynamic warm-up before vigorous exercise?","o":["Five to seven minutes","One to two minutes","Ten to fifteen minutes of static stretching only","At least thirty minutes"],"a":0,"why":"A five-to-seven-minute dynamic warm-up increases blood flow and range of motion while reducing injury risk."},{"id":"gen-22-012","ch":22,"ref":"AFH 1, 22.10","q":"What is a principal purpose of a post-workout cool-down?","o":["To immediately stop circulation to active muscles","To reduce activity gradually, prevent blood pooling, hasten recovery, and avoid injury","To raise the heart rate before stretching","To replace the need for rehydration"],"a":1,"why":"A cool-down gradually reduces activity to prevent blood pooling, aid recovery, and reduce injury risk."},{"id":"gen-22-013","ch":22,"ref":"AFH 1, 22.11","q":"In nutrition and fitness planning, what does SMART stand for?","o":["Simple, Motivating, Active, Realistic, Trackable","Specific, Managed, Accurate, Repeatable, Timed","Specific, Measurable, Attainable, Relevant, and Timely","Sustainable, Measured, Achievable, Resilient, and Tested"],"a":2,"why":"SMART goals are Specific, Measurable, Attainable, Relevant, and Timely."},{"id":"gen-22-014","ch":22,"ref":"AFH 1, 22.12","q":"What carbohydrate-to-protein ratio is identified as optimal for a post-recovery beverage or snack?","o":["One-to-one","Two-to-one","Three-to-one","Four-to-one"],"a":3,"why":"The recommended post-recovery ratio is four grams of carbohydrate for every gram of protein."},{"id":"gen-22-015","ch":22,"ref":"AFH 1, 22.14","q":"What proportion of total daily caloric intake is generally recommended from carbohydrates?","o":["45 to 65 percent","10 to 20 percent","20 to 35 percent","70 to 85 percent"],"a":0,"why":"The general recommendation is for carbohydrates to provide 45 to 65 percent of daily calories."},{"id":"gen-22-016","ch":22,"ref":"AFH 1, 22.14","q":"How does recommended daily fiber intake compare with average American intake?","o":["Both are about 12 to 15 grams","The recommendation is 20 to 35 grams, compared with an average intake of 12 to 15 grams","The recommendation is 45 to 65 grams, compared with an average of 20 to 35 grams","The recommendation is lower than average intake"],"a":1,"why":"Average intake is 12-15 grams per day, while 20-35 grams is recommended."},{"id":"gen-22-017","ch":22,"ref":"AFH 1, 22.15","q":"What daily sodium limit do the Dietary Guidelines for Americans recommend for most adults?","o":["1,000 milligrams","1,500 milligrams for every adult","2,300 milligrams, about one teaspoon of table salt","3,400 milligrams, matching average consumption"],"a":2,"why":"Most adults should limit sodium to 2,300 milligrams per day, roughly one teaspoon of table salt."},{"id":"gen-22-018","ch":22,"ref":"AFH 1, 22.16","q":"Why should Airmen look for third-party verification when buying dietary supplements?","o":["Third parties guarantee the supplement will improve performance","Military policy prohibits every supplement without third-party approval","Verification makes consultation with a flight surgeon unnecessary","The FDA does not test supplements before sale, so third-party labels can indicate testing for purity or quality"],"a":3,"why":"Because the FDA does not test supplements before sale, third-party certification can provide evidence of purity or quality test
