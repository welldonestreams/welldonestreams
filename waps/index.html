, 1.3.2","q":"What does Service Before Self require when professional duties conflict with personal desires?","o":["Balance both interests equally","Defer the choice to the supervisor","Choose the option with the least personal risk","Give professional duties precedence"],"a":3,"why":"Service Before Self means professional duties take precedence over personal desires."},{"id":"gen-1-013","ch":1,"ref":"AFH 1, 1.3.2, Duty","q":"How does AFH 1 define duty?","o":["The obligation to perform what is required for the mission","Voluntary service beyond one's assigned responsibilities","Compliance with a supervisor's personal preferences","The willingness to accept any risk without question"],"a":0,"why":"Duty is the obligation to perform what is required for the mission."},{"id":"gen-1-014","ch":1,"ref":"AFH 1, 1.3.2, Loyalty","q":"In what order does AFH 1 place an Airman's loyalties?","o":["Fellow Airmen, USAF values, then the nation","The nation, USAF values and commitments, then the people with whom one serves","USAF leaders, the unit, then the nation","The mission, personal values, then the chain of command"],"a":1,"why":"Loyalty is owed first to the nation, second to USAF values and commitments, and finally to fellow service members."},{"id":"gen-1-015","ch":1,"ref":"AFH 1, 1.3.2, Loyalty","q":"How should Airmen most effectively offer alternative solutions and innovative ideas when they disagree with leaders?","o":["Through public debate after the decision","By delaying execution until concerns are resolved","Through the chain of command","Only in anonymous feedback"],"a":2,"why":"AFH 1 directs Airmen to offer alternatives and innovative ideas most effectively through the chain of command."},{"id":"gen-1-016","ch":1,"ref":"AFH 1, 1.3.2, Respect","q":"Which three dimensions make up respect?","o":["Personal, professional, and institutional respect","Earned, positional, and mutual respect","Individual, team, and mission respect","Self-respect, mutual respect, and organizational respect"],"a":3,"why":"Respect encompasses self-respect, mutual respect, and organizational respect."},{"id":"gen-1-017","ch":1,"ref":"AFH 1, 1.3.3","q":"What does Excellence In All We Do mean instead of demanding perfection?","o":["Continuously advancing the craft and increasing knowledge","Meeting only the minimum standard consistently","Eliminating every possibility of failure","Prioritizing innovation over readiness"],"a":0,"why":"Excellence means continuously advancing one's craft and knowledge, not demanding perfection from everyone."},{"id":"gen-1-018","ch":1,"ref":"AFH 1, 1.3.3","q":"Which set contains the virtues of Excellence In All We Do?","o":["Honesty, courage, and accountability","Mission, discipline, and teamwork","Duty, loyalty, and respect","Innovation, readiness, and resilience"],"a":1,"why":"Mission, discipline, and teamwork are the virtues of Excellence In All We Do."},{"id":"gen-1-019","ch":1,"ref":"AFH 1, 1.3.3, Teamwork","q":"Which action reflects teamwork as described in AFH 1?","o":["Focusing only on one's assigned share of the mission","Waiting for leaders to resolve a teammate's workload problem","Carrying one's own weight and helping wingmen carry theirs when necessary","Competing with peers to establish individual credibility"],"a":2,"why":"Teamwork requires giving one's best, carrying one's weight, and helping wingmen when necessary."},{"id":"gen-1-020","ch":1,"ref":"AFH 1, 1.4","q":"Why is merely following the law insufficient under the USAF code of ethics?","o":["Laws apply only to conduct performed on duty","Commanders may disregard laws for mission needs","Ethics replaces legal requirements in military service","Law states what can or cannot be done, while ethics addresses what should or should not be done"],"a":3,"why":"Law defines what is permitted or prohibited; ethics provides the broader standard of what one should or should not do."},{"id":"gen-1-021","ch":1,"ref":"AFH 1, 1.4, Principles and Guidelines","q":"Which action is consistent with the ethical rules governing federal property?","o":["Protecting and conserving federal property and using it only for authorized activities","Using federal property for personal purposes when no cost is incurred","Allowing a non-Federal organization preferential access for a worthy cause","Making an unofficial promise that commits government resources"],"a":0,"why":"Employees must protect and conserve federal property and use it only for authorized activities."},{"id":"gen-1-022","ch":1,"ref":"AFH 1, 1.4.1, Decisions and Actions","q":"Which morality test asks how a decision would look if aired on the news or social media?","o":["The Divine Test","The Network Test","The United States of America Test","The Public Trust Test"],"a":1,"why":"The Network Test asks whether one would be proud or ashamed if the action were broadcast publicly."},{"id":"gen-1-023","ch":1,"ref":"AFH 1, 1.4.1, Decisions and Actions","q":"Which sequence correctly reflects the priorities examined by the United States of America Test?","o":["Self, unit, USAF, United States","Unit, self, USAF, United States","United States, USAF, unit, self","USAF, United States, self, unit"],"a":2,"why":"The test asks in order whether the decision is good for the United States, the USAF, the unit, and oneself."},{"id":"gen-1-024","ch":1,"ref":"AFH 1, 1.4.2, Courage","q":"Which type of courage is the ability to stand by the core values when doing so may be unpopular?","o":["Personal courage","Physical courage","Professional courage","Moral courage"],"a":3,"why":"Moral courage is standing by the core values even when that position may be unpopular."},{"id":"gen-1-025","ch":1,"ref":"AFH 1, 1.4.2, Valor","q":"How does AFH 1 define valor?","o":["The ability to face danger or hardship in a determined and resolute manner","The absence of fear during combat","The willingness to sacrifice only in wartime","The authority to accept risk on behalf of others"],"a":0,"why":"Valor is the ability to face danger or hardship with determination and resolve."},{"id":"gen-5-001","ch":5,"ref":"AFH 1, 5.1","q":"What is command authority?","o":["The personal influence a commander exercises over assigned members","Established levels of responsibility for command, control, and communication throughout a chain of command","The authority military departments retain over combatant operations","The statutory power of the Joint Chiefs to command forces"],"a":1,"why":"Command authority consists of established responsibility levels for command, control, and communication throughout the chain."},{"id":"gen-5-002","ch":5,"ref":"AFH 1, 5.1, Chain of Command","q":"For forces assigned to combatant commanders, what typically remains with the respective service branch?","o":["Operational control","Combatant command authority","Administrative control","Authority to transfer the force"],"a":2,"why":"Although assigned forces fall under the combatant command chain, administrative control typically flows through the service branch."},{"id":"gen-5-003","ch":5,"ref":"AFH 1, 5.2","q":"What is the Department of Defense mission?","o":["Develop joint doctrine and coordinate military education","Formulate national policy and supervise Congress","Provide homeland civil support to state governments","Provide military forces to deter war and protect the security of the country"],"a":3,"why":"The Department of Defense provides military forces to deter war and protect national security."},{"id":"gen-5-004","ch":5,"ref":"AFH 1, 5.2, Secretary of Defense","q":"Who serves as the U.S. President's principal defense policy advisor?","o":["The Secretary of Defense","The Chairman of the Joint Chiefs of Staff","The National Security Advisor","The Secretary of the Air Force"],"a":0,"why":"The Secretary of Defense is the President's principal defense policy advisor."},{"id":"gen-5-005","ch":5,"ref":"AFH 1, 5.3","q":"By law, who has exclusive direction of the Joint Staff?","o":["The Secretary of Defense","The Chairman of the Joint Chiefs of Staff","The Director of the Joint Staff","The Vice Chairman of the Joint Chiefs of Staff"],"a":1,"why":"Direction of the Joint Staff rests exclusively with the Chairman, who normally manages it through the Director."},{"id":"gen-5-006","ch":5,"ref":"AFH 1, 5.3, Chairman, Joint Chiefs of Staff","q":"Which statement correctly describes the Chairman of the Joint Chiefs of Staff's command authority?","o":["The Chairman commands all combatant commanders","The Chairman commands the Joint Chiefs but not service forces","The Chairman outranks all other officers but may not exercise military command over the Joint Chiefs or Armed Forces","The Chairman commands forces only when acting for the Secretary of Defense"],"a":2,"why":"Although the senior-ranking officer, the Chairman may not exercise military command over the Joint Chiefs or Armed Forces."},{"id":"gen-5-007","ch":5,"ref":"AFH 1, 5.3, Vice Chairman, Joint Chiefs of Staff","q":"Which restriction applies to the Vice Chairman of the Joint Chiefs of Staff?","o":["The Vice Chairman may serve only one two-year term","The Vice Chairman must be from the same service as the Chairman","The Vice Chairman cannot act for the Chairman","The Vice Chairman cannot be from the same service branch as the Chairman"],"a":3,"why":"The Vice Chairman cannot be from the Chairman's branch and serves as Acting Chairman when required."},{"id":"gen-5-008","ch":5,"ref":"AFH 1, 5.3, Senior Enlisted Advisor to the Chairman","q":"What is the Senior Enlisted Advisor to the Chairman designated as?","o":["The highest senior enlisted position in the U.S. Armed Forces","The senior enlisted commander of all joint forces","The enlisted member of the Joint Chiefs of Staff","The Department of Defense career field manager"],"a":0,"why":"The SEAC is designated as the highest senior enlisted position in the U.S. Armed Forces."},{"id":"gen-5-009","ch":5,"ref":"AFH 1, 5.5","q":"What agreement established the general and specific functions of each branch of the U.S. Armed Forces?","o":["The Unified Command Plan","The Key West Agreement of 1948","The Goldwater-Nichols Act","The National Security Act of 1947"],"a":1,"why":"The Secretary of Defense and Joint Chiefs established service roles and missions in the 1948 Key West Agreement."},{"id":"gen-5-010","ch":5,"ref":"AFH 1, 5.5, Functions of the United States Coast Guard","q":"When does the Coast Guard operate as part of the Navy rather than as a Department of Homeland Security service?","o":["Whenever it performs maritime law enforcement","Whenever it operates outside U.S. waters","Upon a declaration of war or when directed by the President","Only during a national emergency declared by Congress"],"a":2,"why":"The Coast Guard is in the Department of Homeland Security except when operating as part of the Navy upon declaration of war or presidential direction."},{"id":"gen-5-011","ch":5,"ref":"AFH 1, 5.5, Functions of the United States Space Force","q":"Which is a specific Space Force function listed in AFH 1?","o":["Control all military cyberspace operations","Provide strategic airlift to joint forces","Administer civilian space agencies","Provide freedom of operation for the United States in, from, and to space"],"a":3,"why":"A stated Space Force function is providing U.S. freedom of operation in, from, and to space."},{"id":"gen-5-012","ch":5,"ref":"AFH 1, 5.6","q":"What makes a command a combined command?","o":["It includes two or more forces or agencies from two or more allied nations operating together","It includes forces from two or more U.S. military departments","It combines operational and administrative control","It operates across more than one geographic region"],"a":0,"why":"Combined commands consist of forces or agencies of at least two allies operating together under multinational arrangements."},{"id":"gen-5-013","ch":5,"ref":"AFH 1, 5.7","q":"Which feature defines a unified combatant command?","o":["A temporary mission limited to one military department","A broad, continuing mission composed of forces from two or more military departments","A multinational mission established only by treaty","A global functional mission with no assigned forces"],"a":1,"why":"A unified combatant command has a broad, continuing mission and forces from two or more military departments."},{"id":"gen-5-014","ch":5,"ref":"AFH 1, 5.7, Unified Command Plan","q":"How often is the Unified Command Plan reviewed and updated?","o":["Annually","Every four years","Every two years","Only when combatant command boundaries change"],"a":2,"why":"The classified Unified Command Plan is reviewed and updated every two years."},{"id":"gen-5-015","ch":5,"ref":"AFH 1, 5.8","q":"How do functional combatant commands differ from geographic combatant commands?","o":["They exercise administrative control instead of operational authority","They consist of only one military department","They are temporary commands activated for contingencies","They operate globally across geographic boundaries based on military function"],"a":3,"why":"Functional combatant commands operate globally across geographic boundaries and provide unique capabilities."},{"id":"gen-5-016","ch":5,"ref":"AFH 1, 5.8, United States Northern Command","q":"What are U.S. Northern Command's primary responsibilities?","o":["Civil support and homeland security","Strategic deterrence and global strike","Special operations and counterterrorism","Global mobility and distribution"],"a":0,"why":"USNORTHCOM is primarily responsible for civil support and homeland security."},{"id":"gen-5-017","ch":5,"ref":"AFH 1, 5.8, United States Cyber Command","q":"What is U.S. Cyber Command responsible for achieving and maintaining?","o":["Information dominance","Cyberspace superiority","Electromagnetic spectrum control","Global communications readiness"],"a":1,"why":"USCYBERCOM is responsible for achieving and maintaining cyberspace superiority."},{"id":"gen-5-018","ch":5,"ref":"AFH 1, 5.10","q":"In a classic Total Force association, which organization is the host and retains weapon-system responsibility?","o":["The Reserve unit","The Guard unit","The Regular Component","The combatant command"],"a":2,"why":"In a classic association, the Regular Component hosts and retains weapon-system responsibility while sharing the mission."},{"id":"gen-5-019","ch":5,"ref":"AFH 1, 5.10","q":"In an active Total Force association, which unit serves as the host?","o":["The Regular Component unit","The MAJCOM headquarters","The active-duty service component","The Reserve or Guard unit"],"a":3,"why":"In an active association, the Reserve or Guard unit hosts and the Regular Component is the tenant."},{"id":"gen-5-020","ch":5,"ref":"AFH 1, 5.11","q":"Which two components form the Air Reserve Component?","o":["The Air National Guard and USAF Reserve","The USAF Reserve and Civil Air Patrol","The Air National Guard and Regular Air Force","The Civil Air Patrol and Air National Guard"],"a":0,"why":"The Air National Guard and USAF Reserve together form the Air Reserve Component."},{"id":"gen-5-021","ch":5,"ref":"AFH 1, 5.11, Dual Federal and State Mission","q":"Who has command jurisdiction over an Air National Guard unit when it is not mobilized or under federal control?","o":["The Secretary of the Air Force","The governor of the state, commonwealth, or possession","The Chief of the National Guard Bureau","The commander of the gaining MAJCOM"],"a":1,"why":"Unless mobilized or federalized, ANG command jurisdiction rests with the relevant governor."},{"id":"gen-5-022","ch":5,"ref":"AFH 1, 5.12","q":"When is the Civil Air Patrol designated the volunteer civilian auxiliary of the USAF?","o":["Whenever it conducts a state emergency mission","At all times under its congressional charter","When a federal department or agency uses CAP services","Only when placed under combatant command authority"],"a":2,"why":"CAP is the USAF volunteer civilian auxiliary when its services are used by a federal department or agency."},{"id":"gen-5-023","ch":5,"ref":"AFH 1, 5.12","q":"Which list contains the Civil Air Patrol's three primary programs?","o":["Homeland defense, flight training, and recruiting","Search and rescue, pilot certification, and youth outreach","Civil defense, airlift support, and aerospace research","Emergency services and civil support, aerospace education, and cadet programs"],"a":3,"why":"CAP's three primary programs are emergency services and civil support, aerospace education, and cadet programs."},{"id":"gen-5-024","ch":5,"ref":"AFH 1, 5.15, Field Operating Agencies and Direct Reporting Units","q":"What is the key organizational difference between a Field Operating Agency and a Direct Reporting Unit?","o":["An FOA is directly subordinate to a HAF functional manager; a DRU is directly subordinate to the Chief of Staff of the Air Force","An FOA reports to the SecAF; a DRU reports to a MAJCOM","An FOA performs combat missions; a DRU performs support missions","An FOA is temporary; a DRU is permanent"],"a":0,"why":"FOAs report to HAF functional managers, whereas DRUs report directly to the CSAF."},{"id":"gen-5-025","ch":5,"ref":"AFH 1, 5.16, Squadron","q":"How does AFH 1 characterize the squadron within USAF organization?","o":["The lowest administrative echelon with a complete functional staff","The basic unit, nucleus, and basic building block of the USAF","A tactical echelon composed of at least two groups","An internal subdivision used only when a flight is too large"],"a":1,"why":"The squadron is identified as the basic unit, nucleus, and basic building block of the USAF."},{"id":"gen-7-001","ch":7,"ref":"AFH 1, 7.1, Officer Responsibilities","q":"Which officer tier includes grades O-4 through O-6?","o":["Company Grade Officer","General Officer","Field Grade Officer","Senior Officer"],"a":2,"why":"The Field Grade Officer tier consists of grades O-4 through O-6."},{"id":"gen-7-002","ch":7,"ref":"AFH 1, 7.1, Enlisted Responsibilities","q":"What makes enlisted career progression and development effective?","o":["Completing every available special-duty assignment","Allowing career field managers to set individual goals","Focusing development exclusively on technical qualifications","Deliberate supervisor-subordinate conversations about requirements, qualifications, and goals"],"a":3,"why":"Effective development depends on deliberate conversations about career-field and USAF requirements, personal qualifications, and goals."},{"id":"gen-7-003","ch":7,"ref":"AFH 1, 7.2","q":"Which three leadership-skill levels are associated with the continuum of learning?","o":["Tactical expertise, operational competence, and strategic vision","Technical proficiency, supervisory competence, and executive leadership","Individual, organizational, and institutional leadership","Followership, management, and command"],"a":0,"why":"The three levels are tactical expertise, operational competence, and strategic vision."},{"id":"gen-7-004","ch":7,"ref":"AFH 1, 7.2, Tactical Expertise","q":"What is a central developmental focus at the tactical expertise level?","o":["Directing exceptionally complex, multi-tiered organizations","Mastering core duty skills and gaining experience applying them","Negotiating coalitions outside the organization","Developing an enterprise-wide strategic perspective"],"a":1,"why":"At the tactical level, Airmen master core duties, apply them, and develop followership and initial leadership skills."},{"id":"gen-7-005","ch":7,"ref":"AFH 1, 7.2, Operational Competence","q":"Which transition characterizes development at the operational competence level?","o":["From leaders to institutional strategists","From generalists to technical specialists","From specialists to leaders who understand organizational and team dynamics","From supervisors to commanders with statutory authority"],"a":2,"why":"Operational competence involves transitioning from specialist to leader while applying organizational and team dynamics."},{"id":"gen-7-006","ch":7,"ref":"AFH 1, 7.2, Strategic Vision","q":"At which level does development focus on effects an Airman can have across the USAF and Department of Defense?","o":["Tactical expertise","Occupational proficiency","Operational competence","Strategic vision"],"a":3,"why":"Strategic vision emphasizes enterprise effects across the USAF and Department of Defense."},{"id":"gen-7-007","ch":7,"ref":"AFH 1, 7.3, Occupational Competencies","q":"What do occupational competencies describe?","o":["Technical or functional knowledge, skills, abilities, and other characteristics required in a specific workforce category or specialty","Universal leadership behaviors required of every Airman","Strategic abilities unique to general officers and senior enlisted leaders","Institutional values that distinguish the USAF from other services"],"a":0,"why":"Occupational competencies are specialty-specific technical or functional knowledge, skills, abilities, and characteristics."},{"id":"gen-7-008","ch":7,"ref":"AFH 1, 7.3, Airman's Foundational Competencies","q":"Which set lists the four categories of Airman's Foundational Competencies?","o":["Leading, managing, training, and executing","Developing Self, Developing Others, Developing Ideas, and Developing Organizations","Tactical, operational, strategic, and institutional","Knowledge, skills, abilities, and experience"],"a":1,"why":"The categories are Developing Self, Developing Others, Developing Ideas, and Developing Organizations."},{"id":"gen-7-009","ch":7,"ref":"AFH 1, 7.5","q":"What is the correct sequence of the early-career Airmanship Continuum?","o":["100 Technical Training, 200 BMT, 300 First-Term Airmen Center","100 BMT, 200 First-Term Airmen Center, 300 Technical Training","100 BMT, 200 Technical Training, 300 First-Term Airmen Center","100 First-Term Airmen Center, 200 BMT, 300 Technical Training"],"a":2,"why":"Junior Airmen progress through 100 (BMT), 200 (Technical Training), and 300 (First-Term Airmen Center)."},{"id":"gen-7-010","ch":7,"ref":"AFH 1, 7.5, Senior Airman","q":"What must a Senior Airman complete before assuming the grade of Staff Sergeant?","o":["The NCO Academy","A 7-skill-level course","The SNCO Academy","Airman Leadership School"],"a":3,"why":"Senior Airmen must complete Airman Leadership School before assuming the Staff Sergeant grade."},{"id":"gen-7-011","ch":7,"ref":"AFH 1, 7.6, Staff Sergeant","q":"Which skill level is typically earned at the rank of Staff Sergeant?","o":["7-skill level","5-skill level","9-skill level","3-skill level"],"a":0,"why":"AFH 1 states that the 7-skill level is typically earned at Staff Sergeant."},{"id":"gen-7-012","ch":7,"ref":"AFH 1, 7.7, Master Sergeant","q":"What professional transition is associated with Master Sergeants?","o":["From apprentice to skilled technician","From first-line supervisor to leader of operational competence","From operational leader to strategic advisor","From trainer to technical specialist"],"a":1,"why":"Master Sergeants are technical experts transitioning from first-line supervisors to operationally competent leaders."},{"id":"gen-7-013","ch":7,"ref":"AFH 1, 7.8, Noncommissioned Officer in Charge","q":"When may an NCO or SNCO hold the duty title NCOIC without directly supervising personnel?","o":["When serving as the senior person on a shift","When performing duties normally assigned to a section chief","When the primary duty is a unit-wide program or management function","When appointed by a command chief"],"a":2,"why":"NCOIC is authorized for a unit-wide program or management function even without direct supervision."},{"id":"gen-7-014","ch":7,"ref":"AFH 1, 7.8, Section Chief","q":"What organizational condition supports use of the duty title Section Chief?","o":["Responsibility for one work center with several shifts","Leadership of any section at squadron level","Management of a unit-wide program without personnel","Charge of a section with at least two subordinate work centers or elements"],"a":3,"why":"A Section Chief leads a section containing at least two subordinate work centers or elements."},{"id":"gen-7-015","ch":7,"ref":"AFH 1, 7.9, Chief Master Sergeant of the Air Force","q":"What precedence does the Chief Master Sergeant of the Air Force hold?","o":["The CMSAF takes precedence over all USAF enlisted members","The CMSAF takes precedence over all U.S. Armed Forces enlisted members","The CMSAF shares precedence with MAJCOM command chiefs","The CMSAF's precedence applies only at HAF"],"a":0,"why":"The CMSAF is the USAF senior enlisted leader and takes precedence over all USAF enlisted members."},{"id":"gen-7-016","ch":7,"ref":"AFH 1, 7.9, Senior Enlisted Leader","q":"At which organizational levels is the Senior Enlisted Leader title used for SNCOs in charge?","o":["Flight, squadron, and wing","Squadron, group, and headquarters","Group, wing, and numbered air force only","Work center, section, and flight"],"a":1,"why":"The SEL title is used for SNCOs in charge at squadron, group, and headquarters levels."},{"id":"gen-7-017","ch":7,"ref":"AFH 1, 7.9, Air Force Career Field Manager","q":"Where are enlisted Air Force Career Field Managers normally located, and what rank typically holds the title?","o":["At MAJCOM headquarters; Senior Master Sergeants","At the Air Force Personnel Center; Master Sergeants","At HAF; Chief Master Sergeants","At wing headquarters; Chief Master Sergeants"],"a":2,"why":"Enlisted AFCFMs are typically Chief Master Sergeants located at HAF."},{"id":"gen-7-018","ch":7,"ref":"AFH 1, 7.10, Enlisted Development Teams","q":"What is the central placement objective of enlisted development teams?","o":["Fill every vacancy with the most senior eligible Airman","Place Airmen according to personal preference before mission need","Reserve developmental positions for Airmen already selected for promotion","Put the right people in the right place at the right time based on defined requirements"],"a":3,"why":"Development teams support progression and succession planning so the right people fill key positions at the right time."},{"id":"gen-7-019","ch":7,"ref":"AFH 1, 7.10, Air Force Enlisted Council","q":"Who comprises the Air Force Enlisted Council?","o":["The current 12 Outstanding Airmen of the Year","MAJCOM command chiefs and selected advisors","Career field managers and Air Force Personnel Center representatives","The CMSAF and all former CMSAFs"],"a":0,"why":"The Air Force Enlisted Council consists of the current 12 Outstanding Airmen of the Year."},{"id":"gen-7-020","ch":7,"ref":"AFH 1, 7.10, MyVECTOR","q":"How do Developmental Special Experiences in MyVECTOR differ from formal assignment systems?","o":["They list only experiences with immediate vacancies","They list experiences regardless of vacancies or application windows to show requirements and prerequisites","They are limited to experiences within an Airman's AFSC","They automatically match and assign qualified Airmen"],"a":1,"why":"The DSE Catalog lists all experiences regardless of vacancies or windows so users can see requirements and prerequisites."},{"id":"gen-7-021","ch":7,"ref":"AFH 1, 7.11, Occupational Analysis Process","q":"How often are occupational studies of enlisted USAF specialties typically conducted?","o":["Every year","Every two years","On a three- to four-year cycle, or upon request when out of cycle","Only when a career field changes its CFETP"],"a":2,"why":"Enlisted specialty studies normally follow a three- to four-year cycle and can occur out of cycle upon request."},{"id":"gen-7-022","ch":7,"ref":"AFH 1, 7.14","q":"Which three components make up the USAF on-the-job training program?","o":["Study, practice, and evaluation","Knowledge, certification, and upgrade","Training, education, and experience","Job knowledge, job proficiency, and job experience"],"a":3,"why":"The OJT program consists of job knowledge, job proficiency, and job experience."},{"id":"gen-7-023","ch":7,"ref":"AFH 1, 7.15, Superintendent","q":"What is the minimum rank requirement for award of the 9-skill level?","o":["Senior Master Sergeant","Master Sergeant","Chief Master Sergeant select","Technical Sergeant select"],"a":0,"why":"A member must be at least a Senior Master Sergeant, meet AFECD requirements, and receive supervisor recommendation and commander approval."},{"id":"gen-7-024","ch":7,"ref":"AFH 1, 7.16, Task Certifiers","q":"What minimum grade and skill qualification must a military task certifier have?","o":["Technical Sergeant with a 7-skill level","Staff Sergeant with a 5-skill level","Senior Airman with a 5-skill level","Staff Sergeant with a 7-skill level"],"a":1,"why":"A task certifier must be at least a Staff Sergeant with a 5-skill level, or civilian equivalent, and meet the other stated requirements."},{"id":"gen-7-025","ch":7,"ref":"AFH 1, 7.17, Department of the Air Force Form 623A","q":"What is documented on DAF Form 623A, On-the-Job Training Record Continuation Sheet?","o":["Locally assigned duty-position requirements omitted from the CFETP","Recurring special-task certifications and evaluations","An individual's training progress, including status, counseling, and breaks in training","Task evaluations performed during staff assistance visits"],"a":2,"why":"DAF Form 623A records training progress, status, counseling, and breaks in training."},{"id":"gen-8-001","ch":8,"ref":"AFH 1, 8.1","q":"What is a performance feedback assessment?","o":["A one-way written notice of an evaluation rating","A formal two-way communication between a rater and ratee about standards, responsibilities, expectations, and goals","An informal discussion used only when performance is deficient","A commander-led review of an Airman's permanent record"],"a":1,"why":"It is formal two-way communication between the rater and ratee concerning standards, responsibilities, expectations, and goals."},{"id":"gen-8-002","ch":8,"ref":"AFH 1, 8.1","q":"After completing a performance feedback assessment, what must the rater give the ratee?","o":["A copy of the ratee's entire personnel record","Only the unsigned worksheet","The original completed and signed worksheet","The original worksheet after the evaluation closes out"],"a":2,"why":"The rater gives the original completed and signed worksheet to the ratee and maintains the required copies."},{"id":"gen-8-003","ch":8,"ref":"AFH 1, 8.1","q":"Who is responsible for developing a mechanism to track performance feedback assessments and ensuring they are properly conducted?","o":["The military personnel flight","The ratee","The forced distributor","The unit commander"],"a":3,"why":"Unit commanders develop the tracking mechanism and ensure assessments are conducted properly."},{"id":"gen-8-004","ch":8,"ref":"AFH 1, 8.1","q":"If a required performance feedback assessment does not occur, what is the ratee expected to do?","o":["Notify the rater and, if necessary, the rater's rater","Wait for the military personnel flight to reschedule it","File an evaluation appeal immediately","Ask the unit commander to conduct the session"],"a":0,"why":"Ratees must know when sessions are due and notify the rater, then the rater's rater if necessary, when one does not occur."},{"id":"gen-8-005","ch":8,"ref":"AFH 1, 8.2","q":"When may a rater conduct a performance feedback session by telephone?","o":["Whenever either participant prefers it","Only in unusual circumstances when a face-to-face session is impractical","Only for follow-up feedback","Whenever the ratee is assigned to another work center"],"a":1,"why":"Telephone sessions are limited to unusual circumstances in which face-to-face feedback is impractical."},{"id":"gen-8-006","ch":8,"ref":"AFH 1, 8.3","q":"Which performance feedback assessment worksheet is designated for an Airman Basic through Technical Sergeant?","o":["AF Form 724","AF Form 932","AF Form 931","DAF Form 475"],"a":2,"why":"AF Form 931 is the Airman Comprehensive Assessment Worksheet for grades AB through TSgt."},{"id":"gen-8-007","ch":8,"ref":"AFH 1, 8.3","q":"Before a feedback session, which portion of the worksheet does the ratee complete independently?","o":["Section I","Section II","The final performance category","Section III"],"a":3,"why":"The ratee completes Section III independently; the areas following Section III are completed by the rater."},{"id":"gen-8-008","ch":8,"ref":"AFH 1, 8.4","q":"When must an initial performance feedback assessment normally be conducted after supervision begins?","o":["Within the first 60 days","Within the first 30 days","At the midpoint of the rating period","Within 60 days after the evaluation closes"],"a":0,"why":"All initial performance feedback assessment sessions must occur within the first 60 days of supervision."},{"id":"gen-8-009","ch":8,"ref":"AFH 1, 8.4","q":"When may a ratee request another feedback session?","o":["Only after an evaluation closes","After at least 60 days have passed since the last session","After 30 days have passed since the last session","Only when the rater initiates the request"],"a":1,"why":"A ratee may request feedback as long as 60 days have elapsed since the previous session."},{"id":"gen-8-010","ch":8,"ref":"AFH 1, 8.5","q":"How must classified information that would otherwise appear in a performance evaluation be handled?","o":["Include it in a classified attachment","Omit the entire evaluation section","Replace the entry with the words 'Data Masked'","Summarize it at the Controlled Unclassified Information level"],"a":2,"why":"Classified information is not entered in evaluations; 'Data Masked' replaces an entry that would release it."},{"id":"gen-8-011","ch":8,"ref":"AFH 1, 8.8","q":"What does a ratee's signature on a completed performance evaluation signify?","o":["Agreement with every comment and rating","Waiver of the right to appeal","Approval of the evaluator's recommendations","Receipt of the evaluation and review for administrative errors"],"a":3,"why":"The signature acknowledges receipt and certifies review for administrative errors; it does not signify concurrence with the content."},{"id":"gen-8-012","ch":8,"ref":"AFH 1, 8.9","q":"Which two elements must a performance statement contain?","o":["The Airman's behavior or action and its impact, result, or outcome","A duty title and a numerical rating","A supervisor's expectation and the Airman's response","A mission description and a list of resources used"],"a":0,"why":"A performance statement is a standalone sentence containing the behavior or action and the resulting impact or outcome."},{"id":"gen-8-013","ch":8,"ref":"AFH 1, 8.10","q":"When do first-term Airmen receive Selective Reenlistment Program consideration?","o":["Within 13 months of their expiration of term of service","Within 15 months of their expiration of term of service","At exactly 12 months of total active service","Only after completing their first enlistment"],"a":1,"why":"First-term Airmen are considered when they are within 15 months of their expiration of term of service."},{"id":"gen-8-014","ch":8,"ref":"AFH 1, 8.11","q":"An Airman denied reenlistment has how long to state an intent to appeal?","o":["One duty day","Ten calendar days","Three calendar days","Thirty calendar days"],"a":2,"why":"The Airman has up to three calendar days to render appeal intent and then 10 calendar days from that date to submit the appeal."},{"id":"gen-8-015","ch":8,"ref":"AFH 1, 8.12","q":"Under the NCO Career Status Program, which RegAF Airmen are reenlisted for an unspecified period?","o":["All career Airmen after their second enlistment","Airmen with 20 years of service who decline retirement","Only Airmen serving in constrained specialties","Airmen selected for continued service who have at least 12 years of TAFMS on the date of discharge"],"a":3,"why":"Selected Airmen with at least 12 years of TAFMS on the day before reenlistment enter an unspecified reenlistment period."},{"id":"gen-8-016","ch":8,"ref":"AFH 1, 8.13","q":"What is the purpose of the Career Job Reservation Program?","o":["To manage first-term Airman reenlistments by AFSC and prevent surpluses and shortages","To reserve promotion vacancies for retraining graduates","To guarantee reenlistment for Airmen in critical skills","To assign career Airmen to shortage specialties"],"a":0,"why":"The CJR Program manages first-term reenlistments by AFSC to help prevent career-field surpluses and shortages."},{"id":"gen-8-017","ch":8,"ref":"AFH 1, 8.14","q":"An Airman needs 15.5 months of retainability for an assignment. What extension must be requested?","o":["15 months","16 months","18 months","24 months"],"a":1,"why":"Extensions are granted in whole-month increments, so 15.5 months of needed retainability requires a 16-month extension."},{"id":"gen-8-018","ch":8,"ref":"AFH 1, 8.15","q":"What is the minimum additional active-duty obligated service for an otherwise eligible Airman to receive a Selective Retention Bonus by reenlisting or extending?","o":["One year","Two years","Three years","Four years"],"a":2,"why":"An eligible Airman in an SRB skill must reenlist or extend for at least three years of additional obligated service."},{"id":"gen-8-019","ch":8,"ref":"AFH 1, 8.16","q":"What is the objective of Phase I of the NCO Retraining Program?","o":["Select mandatory retraining candidates from the master vulnerability list","Return every Airman with a secondary shortage AFSC to that skill","Eliminate all overage AFSCs during one fiscal year","Obtain volunteers from overage AFSCs to fill shortage-specialty requirements"],"a":3,"why":"Phase I seeks volunteer applicants from identified overage AFSCs for requirements in shortage specialties."},{"id":"gen-8-020","ch":8,"ref":"AFH 1, 8.19","q":"What service normally qualifies a member for the Armed Forces Expeditionary Medal when not serving for the full operation?","o":["30 consecutive or 60 nonconsecutive days in the area of operations","45 consecutive or 90 nonconsecutive deployed days","90 continuous days in direct support of combat","One year of honorable service during a national crisis"],"a":0,"why":"The normal duration criterion is 30 consecutive or 60 nonconsecutive days, with listed exceptions for combat, evacuation, and aircrew service."},{"id":"gen-8-021","ch":8,"ref":"AFH 1, 8.20","q":"Who may share in an organization's unit award?","o":["Its higher headquarters only","Designated subordinate units, except foreign units; higher organizations may not share","Every unit in the same numbered Air Force","Only units with an identical mission and composition"],"a":1,"why":"Designated subordinate units other than foreign units may share the award, but higher organizations may not."},{"id":"gen-8-022","ch":8,"ref":"AFH 1, 8.20","q":"Which unit award requires exceptionally meritorious conduct in direct support of combat operations for at least 90 continuous days?","o":["Gallant Unit Citation","Air Force Outstanding Unit Award","Meritorious Unit Award","Air Force Organizational Excellence Award"],"a":2,"why":"The Meritorious Unit Award requires outstanding achievement or service directly supporting combat operations for at least 90 continuous days."},{"id":"gen-8-023","ch":8,"ref":"AFH 1, 8.21","q":"Which condition distinguishes the Remote Combat Effects Campaign Medal from medals requiring exposure to hostile action?","o":["The member must deploy into the combat zone","The member must complete 24 months of combat readiness","The member must serve as an aircraft crewmember","The member must not be physically exposed, or at risk of exposure, to hostile action"],"a":3,"why":"A qualifying member directly affects a combat operation through specified remote career fields without physical exposure or risk of exposure to hostile action."},{"id":"gen-8-024","ch":8,"ref":"AFH 1, 8.22","q":"Who may initiate or contribute to a decoration recommendation based on firsthand knowledge?","o":["Any person other than the individual being recommended","Only the immediate supervisor","Only a commander in the nominee's chain","Only a military member senior to the nominee"],"a":0,"why":"Although the immediate supervisor normally submits it, any person other than the nominee who has firsthand knowledge may recommend or contribute evidence."},{"id":"gen-8-025","ch":8,"ref":"AFH 1, 8.22","q":"Which decoration recognizes heroism involving voluntary risk of life under conditions other than conflict with an armed enemy?","o":["Bronze Star Medal","Airman's Medal","Air Medal","Distinguished Flying Cross"],"a":1,"why":"The Airman's Medal recognizes heroism involving voluntary risk of life outside conflict with an armed enemy."},{"id":"gen-9-001","ch":9,"ref":"AFH 1, 9.3","q":"What happens to the effective promotion date when an Airman First Class is selected for Senior Airman below the zone?","o":["It is three months before the fully qualified date","It is the date the selection board convenes","It is six months before the fully qualified date","It remains the fully qualified date"],"a":2,"why":"A below-the-zone promotion to Senior Airman becomes effective six months before the fully qualified date."},{"id":"gen-9-002","ch":9,"ref":"AFH 1, 9.3","q":"Which statement describes the intended basis for a STEP promotion?","o":["A single achievement that can be precisely quantified","The highest WAPS score below the cutoff","Completion of all PME ahead of schedule","Compelling, perhaps not quantifiable, reasons showing exemplary performance and exceptional potential"],"a":3,"why":"STEP addresses unique, compelling circumstances; isolated acts or specific achievements should not be its sole basis."},{"id":"gen-9-003","ch":9,"ref":"AFH 1, 9.3","q":"Under WAPS, with whom does an eligible NCO compete for promotion?","o":["Other eligible members in the same AFSC, within quota limits","All eligible NCOs across the USAF","Only members assigned to the same major command","Only members holding the same duty title"],"a":0,"why":"WAPS selections are made within each AFSC rather than across all AFSCs."},{"id":"gen-9-004","ch":9,"ref":"AFH 1, 9.3","q":"If multiple Airmen have the same total WAPS score at the promotion cutoff, what does the USAF do?","o":["Uses time in grade to select one Airman","Promotes everyone with that score","Orders a supplemental board","Uses the PFE score as the sole tiebreaker"],"a":1,"why":"Every individual tied at the cutoff total score is promoted."},{"id":"gen-9-005","ch":9,"ref":"AFH 1, 9.3","q":"How often are SNCO supplemental evaluation boards conducted?","o":["Monthly","Quarterly","Semiannually","Annually"],"a":2,"why":"Supplemental boards for promotion-eligible MSgt, SMSgt, and CMSgt candidates occur semiannually."},{"id":"gen-9-006","ch":9,"ref":"AFH 1, 9.4","q":"Which factor may be used to determine enlisted promotion eligibility?","o":["The member's preferred assignment location","The number of decorations earned in the current unit","The supervisor's time in grade","Completion of required enlisted professional military education"],"a":3,"why":"PME completion is among the listed eligibility factors, along with skill level, time requirements, recommendations, and other criteria."},{"id":"gen-9-007","ch":9,"ref":"AFH 1, 9.5","q":"When may an Airman Basic become eligible for promotion to Airman?","o":["At six months time in grade","At ten months time in grade","At twelve months time in service","After completing upgrade training"],"a":0,"why":"An Airman Basic may be eligible for promotion to Airman after six months time in grade."},{"id":"gen-9-008","ch":9,"ref":"AFH 1, 9.5","q":"What is the required primary-AFSC skill level for promotion to Senior Airman?","o":["1-level","3-level","5-level","7-level"],"a":1,"why":"Promotion to Senior Airman requires a 3-level in the primary AFSC."},{"id":"gen-9-009","ch":9,"ref":"AFH 1, 9.5","q":"Which combination states the minimum time requirements for a Senior Airman to be eligible for Staff Sergeant?","o":["Five years time in service and 23 months time in grade","Three years time in service and 20 months time in grade","Three years time in service and six months time in grade","Six years time in service and one year time in grade"],"a":2,"why":"Staff Sergeant eligibility requires three years time in service and six months time in grade."},{"id":"gen-9-010","ch":9,"ref":"AFH 1, 9.5","q":"What are the PECD and testing cycle for promotion to Technical Sergeant?","o":["31 March; May through June","30 November; January through February","30 September; October through November","31 January; February through March"],"a":3,"why":"Technical Sergeant promotion has a 31 January PECD and a February-March testing cycle."},{"id":"gen-9-011","ch":9,"ref":"AFH 1, 9.5","q":"Which requirements apply to promotion eligibility for Chief Master Sergeant?","o":["14 years time in service, 21 months time in grade, and a 9-level","11 years time in service, 20 months time in grade, and a 7-level","14 years time in service, 24 months time in grade, and a 7-level","20 years time in service, 12 months time in grade, and a 9-level"],"a":0,"why":"Chief Master Sergeant eligibility requires 14 years TIS, 21 months TIG, and a 9-level in the primary AFSC."},{"id":"gen-9-012","ch":9,"ref":"AFH 1, 9.6","q":"What retainability and active-duty service commitment must a Chief Master Sergeant-select acknowledge?","o":["Two years of each","Three years of each","Two years retainability and three years ADSC","Three years retainability and two years ADSC"],"a":1,"why":"Every CMSgt-select must obtain three years of retainability and incur a three-year ADSC from the promotion effective date."},{"id":"gen-9-013","ch":9,"ref":"AFH 1, 9.7","q":"Which factors does AFPC use to assign promotion sequence numbers?","o":["WAPS score, date of rank, and age","Time in grade, time in service, and board score","Date of rank, TAFMS, and date of birth","Promotion cycle, AFSC, and duty location"],"a":2,"why":"Sequence numbers for SSgt through CMSgt selectees are based on date of rank, TAFMS, and date of birth."},{"id":"gen-9-014","ch":9,"ref":"AFH 1, 9.8","q":"What must an Airman understand when declining a promotion in writing?","o":["The declination is effective only for the current cycle","The commander may reverse it within 30 days","The member may reapply through a supplemental board","Reinstatement will not be authorized"],"a":3,"why":"The written declination must include the Airman's acknowledgment that reinstatement is not authorized."},{"id":"gen-9-015","ch":9,"ref":"AFH 1, 9.9","q":"What is the effect of promotion ineligibility on an Airman who has already been selected?","o":["The projected promotion is canceled","The promotion is delayed for one cycle","The Airman retains the sequence number pending review","The promotion occurs but without back pay"],"a":0,"why":"An ineligible Airman cannot test or receive consideration, and an already projected promotion is canceled."},{"id":"gen-9-016","ch":9,"ref":"AFH 1, 9.11","q":"Which training is permissible under the promotion-test compromise rules?","o":["A group review focused on likely PFE questions","Training in general study habits or test-taking skills that does not focus on promotion-test preparation","Sharing personal highlighted references within a work center","Discussing recalled test content with a supervisor"],"a":1,"why":"General study-habit or test-taking-skills training is allowed when it does not focus on preparing for promotion tests."},{"id":"gen-9-017","ch":9,"ref":"AFH 1, 9.14","q":"Within PRDA, what do the Selection Folder and Board categories represent?","o":["Selection Folder is 'As Met'; Board is 'As Is'","Both categories show the same current record","Selection Folder is 'As Is'; Board is 'As Met'","Selection Folder shows evaluations; Board shows test scores"],"a":2,"why":"The Selection Folder category is the 'As Is' record, while the Board category is the 'As Met' record."},{"id":"gen-9-018","ch":9,"ref":"AFH 1, 9.15","q":"What do Promotion Fitness Examinations measure?","o":["Technical knowledge unique to one AFSC","Aptitude for retraining into a shortage specialty","Leadership potential for SNCO central boards","Military and supervisory knowledge required of Staff Sergeants and Technical Sergeants"],"a":3,"why":"PFEs measure military and supervisory knowledge required at the SSgt and TSgt levels."},{"id":"gen-9-019","ch":9,"ref":"AFH 1, 9.16","q":"When is the Enlisted Promotions References and Requirements Catalog published each year?","o":["1 October","1 January","31 March","30 September"],"a":0,"why":"The EPRRC is published annually on 1 October."},{"id":"gen-9-020","ch":9,"ref":"AFH 1, 9.17","q":"An Airman taking both the PFE and SKT scores 40 on the PFE. What minimum SKT score is needed to satisfy the combined-score rule?","o":["40","50","45","60"],"a":1,"why":"Each test requires at least 40 and the combined minimum is 90, so a score of 40 requires at least 50 on the other test."},{"id":"gen-9-021","ch":9,"ref":"AFH 1, 9.19","q":"How is a promotion evaluation board panel composed?","o":["One general officer and two colonels","Three Chief Master Sergeants","One colonel and two Chief Master Sergeants","One colonel, one Chief Master Sergeant, and one career-field manager"],"a":2,"why":"Each panel has one colonel and two Chief Master Sergeants; a general officer serves as board president."},{"id":"gen-9-022","ch":9,"ref":"AFH 1, 9.20","q":"What information is unavailable to promotion board members while they evaluate records?","o":["The Airman's performance history","The Airman's education and achievements","The Airman's breadth of experience","The weighted scores of individuals competing for promotion"],"a":3,"why":"Board members do not see competitors' weighted scores and do not know who was selected when the board disbands."},{"id":"gen-9-023","ch":9,"ref":"AFH 1, 9.20","q":"What range of total board scores can result after a three-member panel's composite score is multiplied by 15?","o":["270 to 450","180 to 300","90 to 150","300 to 500"],"a":0,"why":"Composite scores range from 18 to 30; multiplying by 15 produces total board scores from 270 to 450."},{"id":"gen-9-024","ch":9,"ref":"AFH 1, 9.20","q":"When is a promotion-board record considered a split vote?","o":["When all three panel members use different scores","When any panel members' scores differ by more than one point","When the composite score is below 21 points","When one member uses a half-point increment"],"a":1,"why":"A difference greater than one point between any panel members makes the record a split vote requiring resolution."},{"id":"gen-9-025","ch":9,"ref":"AFH 1, 9.21","q":"Who is authorized to receive and use an Airman's promotion score notice without the Airman's written consent?","o":["The first sergeant and supervisor","The commander and commander's support staff","The Airman and the Airman's commander","Any member of the Airman's rating chain"],"a":2,"why":"Score notices are restricted to the individual and commander; further disclosure requires the Airman's written consent."},{"id":"gen-11-001","ch":11,"ref":"AFH 1, 11.2","q":"What is required to access the Air Force Portal from an internet-connected computer?","o":["A separate username and password for every portal application","A connection from a government network","A commander's written authorization","A valid DoD public key infrastructure certificate, such as a common access card"],"a":3,"why":"Portal access is available from any internet-connected computer with a valid DoD PKI certificate such as a CAC."},{"id":"gen-11-002","ch":11,"ref":"AFH 1, 11.3","q":"What is the purpose of the Commander's Key Support Program?","o":["To enhance unit readiness and establish a sense of community through partnerships","To provide confidential clinical counseling to dependents","To administer emergency financial loans","To manage unit voting assistance"],"a":0,"why":"The CKSP is an official unit family-readiness program that builds readiness and community through unit, M&FRC, and agency partnerships."},{"id":"gen-11-003","ch":11,"ref":"AFH 1, 11.3","q":"By what deadline must a transitioning service member complete TAP Individualized Initial Counseling and Pre-separation Counseling?","o":["No later than 90 days before transition","No later than 365 days before separation, retirement, or release from active duty","Within 30 days after receiving separation orders","Before beginning terminal leave, with no fixed lead time"],"a":1,"why":"Both Individualized Initial Counseling and Pre-separation Counseling are required no later than 365 days before transition."},{"id":"gen-11-004","ch":11,"ref":"AFH 1, 11.3","q":"What are the three support components of the Exceptional Family Member Program?","o":["Education, housing, and finance","Medical, legal, and employment","Medical, assignments, and family","Assignments, voting, and relocation"],"a":2,"why":"EFMP support consists of medical, assignment, and family components."},{"id":"gen-11-005","ch":11,"ref":"AFH 1, 11.3","q":"For which deployment tasking are personnel and family readiness pre-deployment briefings mandatory?","o":["Any tasking outside the local area","A tasking of at least 15 days","Only an unaccompanied tasking overseas","A firm tasking of 30 or more days"],"a":3,"why":"The briefings are mandatory for individuals who have a firm deployment tasking lasting 30 or more days."},{"id":"gen-11-006","ch":11,"ref":"AFH 1, 11.3","q":"How often should Airmen review and certify their Record of Emergency Data and SOES information?","o":["At least annually and whenever beneficiary information changes","Only before a deployment","Every three years","Only after marriage, divorce, or birth"],"a":0,"why":"Both records should be reviewed, verified, and certified at least once each year and when beneficiary information changes."},{"id":"gen-11-007","ch":11,"ref":"AFH 1, 11.3","q":"What authority does the Person Authorized to Direct Disposition receive through the Record of Emergency Data?","o":["Authority to distribute the member's estate","Authority to make decisions about disposition of the member's remains","Authority to change life-insurance beneficiaries","Authority to approve survivor-benefit payments"],"a":1,"why":"The PADD makes decisions concerning disposition of remains, such as embalming, funeral services, cremation, or burial."},{"id":"gen-11-008","ch":11,"ref":"AFH 1, 11.4","q":"Who may refer a seriously wounded, ill, or injured Airman or Guardian to the Air Force Wounded Warrior Program?","o":["Only the member's commander","Only a medical provider or caregiver","Anyone","Only the member or immediate family"],"a":2,"why":"Anyone may submit a referral through the AFW2 website."},{"id":"gen-11-009","ch":11,"ref":"AFH 1, 11.5","q":"Which member is required to maintain a family care plan?","o":["Any married member, regardless of dependents","Only a single parent with sole custody","Only a dual-military couple assigned to different bases","A member solely responsible for an adult dependent's financial, medical, or logistical support"],"a":3,"why":"The requirement includes members solely responsible for a spouse, elderly relative, or disabled adult dependent needing such support."},{"id":"gen-11-010","ch":11,"ref":"AFH 1, 11.6","q":"When may a veteran with dependents receive an additional allowance with VA disability compensation?","o":["When the combined disability rating is 30 percent or greater","At any compensable disability rating","Only when the rating reaches 100 percent","When the veteran has at least two dependents"],"a":0,"why":"An additional dependent allowance may be added when the combined disability rating is at least 30 percent."},{"id":"gen-11-011","ch":11,"ref":"AFH 1, 11.6","q":"How does the VA home loan guaranty benefit help an eligible borrower?","o":["The VA directly lends the full purchase price","The VA guarantees part of a private lender's loan, enabling more favorable terms","The VA pays the borrower's down payment as a grant","The VA limits the loan to newly built homes"],"a":1,"why":"Private lenders provide VA home loans, while the VA guarantee of a portion helps lenders offer favorable terms."},{"id":"gen-11-012","ch":11,"ref":"AFH 1, 11.7","q":"What role does TRICARE play as a force multiplier for the military health system?","o":["It replaces military treatment facilities with VA hospitals","It provides health care only to deployed members","It fills military-health-care gaps through civilian provider, facility, pharmacy, and supplier networks","It standardizes all VA and DoD eligibility rules"],"a":2,"why":"TRICARE's civilian networks fill care gaps and preserve access while uniformed medical personnel support contingency operations."},{"id":"gen-11-013","ch":11,"ref":"AFH 1, 11.8","q":"What normally determines which military retirement pay plan applies to a member?","o":["The member's retirement application date","The date the member entered the current component","The member's high year of tenure","The Date Initially Entered Uniformed Service"],"a":3,"why":"DIEUS normally determines the plan and is not adjusted because of a break in service."},{"id":"gen-11-014","ch":11,"ref":"AFH 1, 11.8","q":"When does DoD begin the automatic one-percent base-pay contribution for a member enrolled in BRS?","o":["After 60 days of service","Immediately upon accession","After two years of service","After completion of the first enlistment"],"a":0,"why":"The automatic one-percent contribution begins after 60 days; matching contributions begin after two years."},{"id":"gen-11-015","ch":11,"ref":"AFH 1, 11.9","q":"What percentage of applicable retired pay does the Survivor Benefit Plan annuity provide in the death cases described in AFH 1?","o":["50 percent","55 percent","60 percent","75 percent"],"a":1,"why":"The described annuity is 55 percent of the retired pay the member would have been entitled to receive under the applicable calculation."},{"id":"gen-11-016","ch":11,"ref":"AFH 1, 11.9","q":"When does the Survivor Benefit Plan's paid-up feature allow a participant to stop paying premiums while retaining coverage?","o":["At age 65 after 240 monthly premiums","At age 70 regardless of payment history","At age 70 after paying premiums for 360 months","After 30 years of military service"],"a":2,"why":"Paid-up status requires both attainment of age 70 and payment of SBP premiums for 360 months."},{"id":"gen-11-017","ch":11,"ref":"AFH 1, 11.11","q":"What status may the WEAR program grant for participation in an event that directly enhances recruiting?","o":["Non-chargeable leave","Funded temporary duty","A four-day special pass","Permissive temporary duty"],"a":3,"why":"WEAR may authorize permissive TDY for approved events that directly support the recruiting mission."},{"id":"gen-11-018","ch":11,"ref":"AFH 1, 11.13","q":"For leave purposes, what is the member's local area?","o":["The place of residence from which the member commutes daily to the duty station","Any location within the state of assignment","Any location within one day's driving distance","The area inside the installation's official boundaries"],"a":0,"why":"Leave must begin and end in the local area, defined as the residence from which the member normally commutes to duty."},{"id":"gen-11-019","ch":11,"ref":"AFH 1, 11.14","q":"How much leave does a member accrue for each month of RegAF status?","o":["Two days","Two and one-half days","Three days","Three and one-half days"],"a":1,"why":"Members accrue 2.5 days of leave for each month in RegAF status."},{"id":"gen-11-020","ch":11,"ref":"AFH 1, 11.15","q":"Which statement correctly describes emergency leave?","o":["It is always non-chargeable and limited to 14 days","It is ordinary leave available only for a member's own illness","It is chargeable leave for immediate-family emergencies, usually initially limited to 30 days","It is permissive TDY approved only by the installation commander"],"a":2,"why":"Emergency leave is chargeable, concerns immediate-family emergencies, and normally begins with no more than 30 days."},{"id":"gen-11-021","ch":11,"ref":"AFH 1, 11.15","q":"How often may Emergency Leave of Absence be granted during a service member's career?","o":["Once per enlistment","Once per qualifying family member","Once every five years","Once during the entire career"],"a":3,"why":"This non-chargeable absence of up to 14 days may be used once in an entire career to prevent advance or excess leave."},{"id":"gen-11-022","ch":11,"ref":"AFH 1, 11.15","q":"How much non-chargeable leave does the Military Parental Leave Program authorize after a qualifying event?","o":["12 weeks","6 weeks","14 days","30 days"],"a":0,"why":"Covered service members receive 12 weeks after a qualifying birth, adoption, or placement for adoption or long-term foster care."},{"id":"gen-11-023","ch":11,"ref":"AFH 1, 11.16","q":"Which rule applies to permissive temporary duty?","o":["It may replace annual leave when a member lacks a leave balance","It may not be authorized in place of leave or a special pass, or in conjunction with special passes","It must always involve travel outside the local area","It is limited to house-hunting near a new duty station"],"a":1,"why":"Permissive TDY is an administrative absence and cannot substitute for leave or a special pass or be combined with special passes."},{"id":"gen-11-024","ch":11,"ref":"AFH 1, 11.23","q":"What are the three primary sources of civilian employee training?","o":["On-the-job, classroom, and distance learning","Local, major-command, and Headquarters Air Force","Agency, interagency, and nongovernment","Mandatory, voluntary, and developmental"],"a":2,"why":"AFH 1 groups civilian training sources as agency, interagency, and nongovernment."},{"id":"gen-11-025","ch":11,"ref":"AFH 1, 11.28","q":"What are the normal annual-leave accumulation caps for most civilian employees and for employees working overseas?","o":["20 days and 30 days, respectively","30 days for both groups","45 days and 60 days, respectively","30 days and 45 days, respectively"],"a":3,"why":"Most civilian employees may accumulate 30 days of annual leave; employees overseas may accumulate 45 days."},{"id":"gen-12-001","ch":12,"ref":"AFH 1, 12.2","q":"What does a member's military pay date determine?","o":["Length of service for pay purposes","Date of eligibility for retirement","Date annual leave begins to accrue","Length of service for promotion testing"],"a":0,"why":"The military pay date determines length of service for pay purposes and may be adjusted for creditable prior service or certain absences."},{"id":"gen-12-002","ch":12,"ref":"AFH 1, 12.3","q":"After an electronic funds transfer, how is a partial pay payment normally recovered?","o":["In equal installments over the next 12 months","In full on the next available payday","Only after the member submits a repayment agreement","From the member's next travel settlement"],"a":1,"why":"Partial payments are limited to accrued pay and allowances and are recouped in full on the next available payday."},{"id":"gen-12-003","ch":12,"ref":"AFH 1, 12.4","q":"Which statement correctly describes overseas housing allowance?","o":["It is a flat taxable payment unrelated to actual rent","It is paid only during temporary duty outside the United States","It reimburses actual rent up to the locality, grade, and dependency-status maximum","It replaces all utility and maintenance reimbursements with basic allowance for housing"],"a":2,"why":"Overseas housing allowance is cost-reimbursement based; actual rent is reimbursed up to the applicable maximum, with a utility/recurring-maintenance allowance included monthly."},{"id":"gen-12-004","ch":12,"ref":"AFH 1, 12.5","q":"When does the standard clothing replacement allowance normally replace the basic clothing replacement allowance?","o":["After 12 months of RegAF status","Upon promotion to staff sergeant","At the member's first permanent change of station","After 36 months of RegAF status"],"a":3,"why":"The basic allowance is paid annually between months 6 and 36 of RegAF status; the standard allowance automatically replaces it after 36 months."},{"id":"gen-12-005","ch":12,"ref":"AFH 1, 12.6","q":"When can family separation allowance-temporary apply?","o":["When a member is continuously TDY away from the permanent duty station for more than 30 days and dependents are not at or near the TDY location","Whenever dependents remain behind during any TDY of at least 14 days","Only when dependent transportation is prohibited during a PCS","Whenever a member occupies government quarters without dependents"],"a":0,"why":"Family separation allowance-temporary applies to continuous TDY exceeding 30 days when dependents do not reside at or near the TDY station."},{"id":"gen-12-006","ch":12,"ref":"AFH 1, 12.8","q":"Which member may qualify for the Basic Needs Allowance described in AFH 1?","o":["Any member whose basic pay is below the national median income","An Airman or Guardian who voluntarily applies and whose gross household income and household size fall below 150 percent of the applicable federal poverty guideline","Only an enlisted member assigned to government quarters with dependents","Any member receiving food assistance from a state program"],"a":1,"why":"The taxable monthly Basic Needs Allowance is for Airmen and Guardians who voluntarily apply and fall below 150 percent of the federal poverty guideline for their household size and location."},{"id":"gen-12-007","ch":12,"ref":"AFH 1, 12.13","q":"How are Traditional and Roth TSP contributions treated for income-tax purposes?","o":["Both are contributed after taxes and withdrawn tax-free","Both reduce current taxable income and are taxed at withdrawal","Traditional contributions may be made before taxes, while Roth contributions are made after taxes and their contributions are tax-free when withdrawn","Traditional contributions are tax-free only for deployed members, while Roth contributions are always taxable at withdrawal"],"a":2,"why":"Traditional TSP contributions can reduce current taxable income; Roth contributions are taxed before contribution, so those contributions are tax-free upon withdrawal."},{"id":"gen-12-008","ch":12,"ref":"AFH 1, 12.14","q":"Who rules on all requests to waive U.S. claims for erroneous payments of pay and allowances?","o":["The member's immediate commander","The local financial services office","The Secretary of the Air Force","The Defense Finance and Accounting Service"],"a":3,"why":"A waiver may be available absent fraud, misrepresentation, fault, or lack of good faith, but DFAS rules on all waivers."},{"id":"gen-12-009","ch":12,"ref":"AFH 1, 12.16","q":"Which PCS advance-pay request requires the Airman's immediate commander's approval?","o":["A request by an E-3 or below, a request for more than one month's basic pay, or a repayment period longer than 12 months","Every PCS advance-pay request, regardless of grade or amount","Only a request exceeding three months of basic pay","Only a request from an Airman without dependents"],"a":0,"why":"Commander approval is required for E-3 and below and for any request exceeding one month's basic pay or a 12-month repayment period."},{"id":"gen-12-010","ch":12,"ref":"AFH 1, 12.16","q":"What is the maximum net weight of unaccompanied baggage that may be moved by commercial air as an expedited PCS shipment?","o":["500 pounds","1,000 pounds","1,500 pounds","2,000 pounds"],"a":1,"why":"When commercial air is used as the expedited mode, no more than 1,000 pounds net of unaccompanied baggage may be transported."},{"id":"gen-12-011","ch":12,"ref":"AFH 1, 12.16","q":"How do temporary lodging expense and temporary lodging allowance differ during a PCS?","o":["Both apply only outside CONUS, but one covers meals and the other lodging","Temporary lodging expense is paid through military pay, while temporary lodging allowance is paid on a travel voucher","Temporary lodging expense applies within CONUS and is paid on a travel voucher; temporary lodging allowance applies outside CONUS and appears in military pay","Temporary lodging expense is for members with dependents, while temporary lodging allowance is for members without dependents"],"a":2,"why":"TLE helps with temporary lodging during a CONUS PCS and is voucher-paid; TLA applies outside CONUS and is paid through military pay and shown on the LES."},{"id":"gen-12-012","ch":12,"ref":"AFH 1, 12.17","q":"A traveler returns from official travel. By when should the traveler file the DTS voucher or DD Form 1351-2?","o":["Within 24 hours","Within three calendar days","Within ten business days","Within five business days after returning to the permanent duty station"],"a":3,"why":"Travelers are responsible for filing electronically in DTS or preparing DD Form 1351-2 within five business days after return to their permanent duty station."},{"id":"gen-12-013","ch":12,"ref":"AFH 1, 12.17","q":"What voucher arrangement is required in DTS for a TDY lasting 45 days or more?","o":["An interim voucher or scheduled partial payments every 30 days, using split disbursement","One final voucher filed within 45 days of return","Weekly vouchers paid entirely to the traveler","A cash advance in place of all vouchers"],"a":0,"why":"For TDY of 45 days or more, DTS must establish an interim voucher or scheduled partial payments every 30 days and use split disbursement for timely GTCC payment."},{"id":"gen-12-014","ch":12,"ref":"AFH 1, 12.19","q":"How early may a traveler normally obtain a GTCC automated teller machine advance?","o":["No earlier than seven calendar days before travel","No earlier than three working days before scheduled travel","Only after arriving at the TDY location","At any time after travel orders are published"],"a":1,"why":"GTCC ATM advances may not be obtained earlier than three working days before scheduled travel and are limited to authorized expenses exempt from mandatory card use."},{"id":"gen-12-015","ch":12,"ref":"AFH 1, 12.19","q":"What happens when a GTCC account reaches 31 days past due?","o":["DFAS immediately begins salary offset","The account is permanently charged off","The account is suspended, and the cardholder must contact the agency program coordinator","The vendor automatically places the member on a reduced payment plan"],"a":2,"why":"At 31 days past due the account is suspended, and the cardholder must work with the APC to resolve the delinquency."},{"id":"gen-12-016","ch":12,"ref":"AFH 1, 12.21","q":"Which three types of manpower are used to conduct the USAF mission?","o":["Active duty, Air Force Reserve, and Air National Guard","Officers, enlisted members, and civilians","Permanent, temporary, and seasonal personnel","Military personnel, in-service civilian employees, and contracted services"],"a":3,"why":"AFH 1 identifies military personnel, in-service civilian employees, and contracted services as the three manpower types used for the USAF mission."},{"id":"gen-12-017","ch":12,"ref":"AFH 1, 12.22","q":"What is the Unit Manpower Document?","o":["The primary, computer-generated document listing a unit's funded and unfunded manpower requirements","A quarterly roster of personnel actually assigned to a unit","A budget document listing only civilian authorizations","A deployment document identifying wartime taskings"],"a":0,"why":"The UMD is the primary document reflecting manpower required for the unit mission and lists both funded and unfunded requirements."},{"id":"gen-12-018","ch":12,"ref":"AFH 1, 12.24","q":"Which function is excluded from Commercial Services Management actions?","o":["A function currently performed by contractors","A military-essential skill or inherently governmental function","A function that could be evaluated through competitive sourcing","A support activity with measurable costs"],"a":1,"why":"Commercial Services Management will not affect military-essential skills or functions that are inherently governmental."},{"id":"gen-12-019","ch":12,"ref":"AFH 1, 12.25","q":"What does a competitive sourcing study compare?","o":["Two private contractors' technical proposals only","Military and civilian promotion systems","The total cost of an in-house government operation with the total cost of private-sector performance of the same activity","Current mission output with the prior year's output"],"a":2,"why":"Competitive sourcing is a public-private competition that determines whether government or private-sector performance is the more economical or efficient approach."},{"id":"gen-12-020","ch":12,"ref":"AFH 1, 12.27","q":"Who appoints a resource advisor in writing?","o":["The installation commander","The comptroller","The financial management board","The responsibility center manager"],"a":3,"why":"Resource advisors are appointed in writing by the responsibility center manager and serve as the primary resource-management contact for that responsibility center."},{"id":"gen-12-021","ch":12,"ref":"AFH 1, 12.27","q":"What is the relationship between the Financial Working Group and the Financial Management Board?","o":["The working group develops financial-plan requirements and recommendations; the board reviews them and gives final approval or disapproval","The board prepares cost-center estimates; the working group audits them","The working group allocates funds without board review","The board handles only nonappropriated funds, while the working group handles appropriated funds"],"a":0,"why":"The FWG develops and revises plans and recommends priorities or target adjustments; the FMB reviews those recommendations and approves or disapproves them."},{"id":"gen-12-022","ch":12,"ref":"AFH 1, 12.28","q":"During which PPBE phase does the USAF match fiscal, manpower, and materiel resources against validated requirements to develop the Program Objective Memorandum?","o":["Planning","Programming","Budgeting","Execution"],"a":1,"why":"Programming matches available resources to validated requirements, with the key objective of developing a balanced, capabilities-based Air Force POM."},{"id":"gen-12-023","ch":12,"ref":"AFH 1, 12.29","q":"When is the Future Years Defense Program normally updated during a PPBE cycle?","o":["Monthly throughout execution","Only when Congress passes an appropriation","At POM submission, usually July or August, and again at the President's budget submission in early February","At the start and end of every fiscal quarter"],"a":2,"why":"The FYDP is updated twice: upon POM submission, normally July/August, and upon the President's budget submission in early February of the following year."},{"id":"gen-12-024","ch":12,"ref":"AFH 1, 12.31","q":"Which description best distinguishes waste from fraud?","o":["Waste requires theft, while fraud does not","Waste is always prosecutable, while fraud is only administrative","Waste is any intentional misuse of rank, while fraud is an accounting error","Waste is extravagant, careless, or needless expenditure arising from deficient practices or decisions; fraud involves intentional deception or diversion for an unauthorized benefit"],"a":3,"why":"Waste may result from deficient practices and need not involve prosecutable fraud; fraud requires intentional deception or diversion to deprive the USAF or secure an unauthorized benefit."},{"id":"gen-12-025","ch":12,"ref":"AFH 1, 12.34","q":"What is the correct sequence of the four Environmental Management System phases?","o":["Plan, Do, Check, Act","Assess, Plan, Execute, Review","Identify, Reduce, Monitor, Report","Plan, Fund, Implement, Audit"],"a":0,"why":"The four EMS phases are Plan, Do, Check, and Act; they move from defining scope and objectives through implementation, monitoring, and management review."},{"id":"gen-14-001","ch":14,"ref":"AFH 1, 14.1","q":"What does AFH 1 identify as the core of all healthy team interaction?","o":["Competition","Trust","Technical expertise","Formal authority"],"a":1,"why":"Healthy teams rest on trust, communication, and cooperation, with trust at the core of healthy team interaction."},{"id":"gen-14-002","ch":14,"ref":"AFH 1, 14.2","q":"A team is cautiously testing acceptable behavior and transitioning from individual to member status. Which stage is it experiencing?","o":["Storming","Norming","Forming","Performing"],"a":2,"why":"Forming is the initial period of uncertainty when members explore boundaries, determine their places, and accept team procedures and rules."},{"id":"gen-14-003","ch":14,"ref":"AFH 1, 14.2","q":"During which team-development stage do members reconcile competing loyalties, accept team roles and norms, and become more cooperative?","o":["Forming","Storming","Performing","Norming"],"a":3,"why":"During norming, members establish cohesion, accept the team and its rules and roles, and shift from competitive to cooperative relationships."},{"id":"gen-14-004","ch":14,"ref":"AFH 1, 14.3","q":"When does conflict become destructive?","o":["When it creates barriers to cooperation and communication, degrades morale, and diverts attention from tasks","Whenever two members openly disagree","When it produces several possible alternatives","Whenever a leader becomes involved in resolving it"],"a":0,"why":"Conflict is destructive when it obstructs cooperation and communication, lowers morale, and pulls attention away from the work."},{"id":"gen-14-005","ch":14,"ref":"AFH 1, 14.4","q":"Which is a structural factor that can generate organizational conflict?","o":["A member's personal values","Scarce or heavily demanded resources","An individual's personality","A misunderstood message"],"a":1,"why":"Structural sources include organizational size, resource scarcity or high demand, interaction among more people, and line-staff distinctions."},{"id":"gen-14-006","ch":14,"ref":"AFH 1, 14.5","q":"Which conflict-management style combines high assertiveness with high cooperativeness and seeks a win for both sides?","o":["Competing","Accommodating","Collaborating","Avoiding"],"a":2,"why":"Collaborating uses honest discussion to satisfy both sides and requires trust and openness from all participants."},{"id":"gen-14-007","ch":14,"ref":"AFH 1, 14.5","q":"Which conflict-management style uses some assertiveness and some cooperativeness, with both parties giving something up?","o":["Competing","Avoiding","Accommodating","Compromising"],"a":3,"why":"Compromising partially satisfies both parties and requires each to change, adjust, or surrender something."},{"id":"gen-14-008","ch":14,"ref":"AFH 1, 14.7","q":"Which three behavioral characteristics did Warren Bennis associate with managers?","o":["Administrators, maintainers, and controllers","Motivators, developers, and inspirers","Planners, organizers, and mentors","Innovators, collaborators, and coaches"],"a":0,"why":"Bennis characterized managers as administrators, maintainers, and controllers; he associated motivating, developing, and inspiring with leaders."},{"id":"gen-14-009","ch":14,"ref":"AFH 1, 14.9","q":"At a minimum, what must a supervisor's mentoring include?","o":["A quarterly written career-development plan","Discussion of performance, potential, and professional-development plans during performance feedback sessions","Assignment of a mentor outside the chain of command","Annual review by the command chief"],"a":1,"why":"The minimum mentoring obligation is a performance-feedback discussion covering performance, potential, and professional-development plans."},{"id":"gen-14-010","ch":14,"ref":"AFH 1, 14.10","q":"Who is the primary mentor, coach, counselor, guide, or role model under the Air Force Mentoring Program?","o":["The first sergeant","The command chief","The immediate supervisor or rater","The career field manager"],"a":2,"why":"The immediate supervisor or rater is the primary mentor, although Airmen may seek advice from additional mentors."},{"id":"gen-14-011","ch":14,"ref":"AFH 1, 14.11","q":"In the M-E-N-T-O-R-I-N-G model, which element requires active listening, attention to nonverbal cues, and timely answers?",
