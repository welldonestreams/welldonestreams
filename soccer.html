<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer — Jersey Poll + Roster</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#e0e0e0;min-height:100dvh;padding:16px 16px 80px}
h1{font-size:1.4rem;text-align:center;margin-bottom:2px;color:#fff}
.subhead{text-align:center;color:#999;font-size:.8rem;margin-bottom:8px}
.countdown{text-align:center;padding:10px 0;font-size:.85rem;font-weight:600}
.countdown.submissions{color:#f9e2af}
.countdown.voting{color:#a6e3a1}
.phase-badge{display:inline-block;padding:3px 12px;border-radius:10px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.phase-badge.submissions{background:#f9e2af20;color:#f9e2af;border:1px solid #f9e2af40}
.phase-badge.voting{background:#a6e3a120;color:#a6e3a1;border:1px solid #a6e3a140}
.tabs{display:flex;gap:0;margin-bottom:12px;border-radius:10px;overflow:hidden;background:#1a1a1a}
.tab-btn{flex:1;padding:10px 8px;border:none;background:transparent;color:#888;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s}
.tab-btn.active{background:#2a2a3a;color:#fff;box-shadow:inset 0 -3px 0 #7aa2f7}
.panel{display:none}
.panel.active{display:block}
.poll-header{text-align:center;margin-bottom:10px;color:#aaa;font-size:.8rem}
.color-list{display:flex;flex-direction:column;gap:8px}
.color-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#1a1a1a;border-radius:10px;cursor:pointer;transition:all .15s;border:2px solid transparent;position:relative;overflow:hidden}
.color-card:hover{border-color:#444}
.color-card.voted{border-color:#4caf50;background:#1a2a1a}
.color-card.lead{border-color:#ffd700;background:#1a1a0a}
.color-card.disabled{cursor:not-allowed;opacity:.7}
.swatch{width:36px;height:36px;border-radius:8px;flex-shrink:0;border:2px solid #333;background-size:cover;background-position:center}
.swatch.has-img{border-color:#555}
.color-info{flex:1;min-width:0}
.color-name{font-weight:600;font-size:.95rem;margin-bottom:1px}
.color-meta{font-size:.7rem;color:#777}
.color-meta .img-tag{color:#7aa2f7;font-weight:600}
.vote-bar-wrap{width:100%;height:5px;background:#2a2a2a;border-radius:3px;margin-top:3px;overflow:hidden}
.vote-bar{height:100%;background:#7aa2f7;border-radius:3px;transition:width .3s}
.vote-count{font-weight:700;font-size:1rem;color:#7aa2f7;min-width:26px;text-align:center}
.lead-badge{position:absolute;top:-8px;right:12px;background:#ffd700;color:#000;font-size:.6rem;padding:2px 8px;border-radius:10px;font-weight:700;z-index:1}
.thumb-preview{width:28px;height:28px;border-radius:4px;background-size:cover;background-position:center;flex-shrink:0;border:1px solid #333;cursor:zoom-in;margin-left:-4px}
.thumb-preview:hover{transform:scale(2.5);z-index:10;position:relative;border-color:#7aa2f7}
.suggest-box{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.suggest-box input,.suggest-box label{flex:1;min-width:100px;padding:10px 12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:.85rem}
.suggest-box input[type=color]{flex:0 0 44px;padding:4px;height:44px;border:none;cursor:pointer}
.suggest-box button{padding:10px 16px;background:#7aa2f7;color:#000;border:none;border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.suggest-box button:disabled{opacity:.4;cursor:default}
.suggest-box label.file-label{display:flex;align-items:center;gap:4px;cursor:pointer;background:#1a2a2a;border-color:#2a4a2a;color:#a6e3a1;font-size:.8rem;white-space:nowrap;text-align:center;justify-content:center}
.suggest-box label.file-label.has-file{background:#1a2a3a;border-color:#2a4a7a;color:#7aa2f7}
.suggest-box label.file-label input[type=file]{display:none}
.file-remove{font-size:1.2rem;line-height:1;margin-left:2px;cursor:pointer;color:#f38ba8;display:none}
.has-file .file-remove{display:inline}
.voter-line{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.voter-line input{flex:1;min-width:120px;padding:10px 12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:.85rem}
.voter-line .hint{font-size:.7rem;color:#777}
.msg{text-align:center;font-size:.75rem;margin-top:6px;min-height:18px;color:#f7768e}
.msg.ok{color:#a6e3a1}
.roster-table{width:100%;border-collapse:collapse;margin-bottom:12px}
.roster-table th,.roster-table td{padding:8px 6px;text-align:left;border-bottom:1px solid #222}
.roster-table th{font-size:.7rem;text-transform:uppercase;color:#777;font-weight:600}
.roster-table td{font-size:.85rem}
.roster-table tr:hover{background:#1a1a1a}
.num{font-weight:700;color:#7aa2f7}
.size-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.7rem;font-weight:600;background:#2a2a2a;color:#aaa}
.size-badge:empty{display:none}
.roster-form{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.roster-form input,.roster-form select{padding:10px 12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:.85rem}
.roster-form select{flex:0 0 auto}
.roster-form input[name=name]{flex:2;min-width:90px}
.roster-form input[name=number]{flex:1;min-width:50px;max-width:70px}
.roster-form button{padding:10px 16px;background:#7aa2f7;color:#000;border:none;border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.deploy-note{position:fixed;bottom:8px;right:8px;background:#1a1a1a;padding:4px 10px;border-radius:6px;font-size:.65rem;color:#555;z-index:10}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#a6e3a1;margin-right:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<h1>Soccer Team</h1>
<div class="countdown" id="countdown">--</div>
<p class="subhead"><span class="phase-badge" id="phase-badge">--</span></p>
<div class="tabs">
  <button class="tab-btn active" data-tab="poll">Jersey Poll</button>
  <button class="tab-btn" data-tab="roster">Roster</button>
</div>
<div class="panel active" id="panel-poll">
  <div class="poll-header" id="poll-header">Suggest a jersey color with a reference image. Voting opens when submissions close.</div>
  <div class="voter-line">
    <input type="text" id="voter-name" placeholder="Your name (to vote)" maxlength="60">
    <span class="hint">required to suggest/vote</span>
  </div>
  <div class="color-list" id="color-list"></div>
  <div class="suggest-box" id="suggest-box">
    <input type="text" id="new-color" placeholder="Describe the color..." maxlength="60">
    <input type="color" id="new-hex" value="#7aa2f7">
    <label class="file-label" id="file-label" title="Attach a reference image">
      <input type="file" id="file-input" accept="image/*">
      Add image
      <span class="file-remove" id="file-remove" title="Remove image">X</span>
    </label>
    <button id="add-color">Suggest</button>
  </div>
  <div class="msg" id="poll-msg"></div>
</div>
<div class="panel" id="panel-roster">
  <table class="roster-table">
    <thead><tr><th>Player</th><th>#</th><th>Size</th></tr></thead>
    <tbody id="roster-tbody"></tbody>
  </table>
  <div class="roster-form">
    <input type="text" name="name" placeholder="Your name" maxlength="60">
    <input type="text" name="number" placeholder="#" maxlength="10" inputmode="numeric">
    <select name="size"><option value="">Size?</option><option>XS</option><option>Small</option><option>Medium</option><option>Large</option><option>XL</option><option>XXL</option></select>
    <button id="roster-add">Add / Update</button>
  </div>
  <div class="msg" id="roster-msg"></div>
</div>
<div class="deploy-note">live - auto-updates</div>
<script>
var API='https://welldonestreams.com/api/soccer';
var pollData={colors:[]},roster=[],config={phase:'submissions',submissionDeadline:0};
var selectedFileDataUrl=null;
var pollInterval=null,countdownInterval=null;

document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.tab-btn,.panel').forEach(function(e){e.classList.remove('active')});
  b.classList.add('active');
  document.getElementById('panel-'+b.dataset.tab).classList.add('active');
  if(b.dataset.tab==='poll')renderAll();else renderRoster();
})});

var fi=document.getElementById('file-input');
var fl=document.getElementById('file-label');
var fr=document.getElementById('file-remove');
function clearFile(){selectedFileDataUrl=null;fi.value='';fl.classList.remove('has-file')}
fi.addEventListener('change',function(){
  var f=fi.files[0];if(!f)return;
  fl.classList.add('has-file');
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var maxW=1024,maxH=1024;
      var w=img.width,h=img.height;
      if(w>maxW||h>maxH){var ratio=Math.min(maxW/w,maxH/h);w=Math.round(w*ratio);h=Math.round(h*ratio)}
      var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
      selectedFileDataUrl=canvas.toDataURL('image/jpeg',0.75);
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f)
});
fr.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();clearFile()});

async function refreshConfig(){
  try{var r=await fetch(API+'/config');config=await r.json();if(config.submissionDeadline)updatePhaseUI()}catch(e){}
}
function updatePhaseUI(){
  var b=document.getElementById('phase-badge');
  var c=document.getElementById('countdown');
  var s=document.getElementById('suggest-box');
  var h=document.getElementById('poll-header');
  var n=Date.now(),d=config.submissionDeadline,p=config.phase;
  var rem=Math.max(0,d-n);
  b.className='phase-badge '+p;
  b.textContent=p==='submissions'?'Submissions Open':'Voting Open';
  if(p==='submissions'&&rem>0){
    c.className='countdown submissions';
    var H=Math.floor(rem/3600000),M=Math.floor((rem%3600000)/60000),S=Math.floor((rem%60000)/1000);
    c.textContent='Submissions close in '+H+'h '+M+'m '+S+'s';
    s.style.display='';
    h.textContent='Suggest a jersey color with a reference image. Voting opens when submissions close.';
  }else if(p==='voting'){
    c.className='countdown voting';
    c.textContent='Voting is OPEN! Tap a color to vote.';
    s.style.display='none';
    h.textContent='Submissions are closed. Vote for your favorite jersey color!';
  }else{c.className='countdown ended';c.textContent='Poll ended'}
}

function renderPoll(){
  var co=pollData.colors;
  var list=document.getElementById('color-list');
  if(!co.length){list.innerHTML='<p style="text-align:center;color:#555;padding:20px">No colors yet</p>';return}
  var maxV=Math.max(1,co.reduce(function(a,c){return Math.max(a,c.votes.length)},0));
  var lead=co.reduce(function(a,b){return a.votes.length>=b.votes.length?a:b},co[0]);
  var voter=(document.getElementById('voter-name').value.trim()||'').toLowerCase();
  var canVote=config.phase==='voting';
  list.innerHTML=co.map(function(c){
    var pct=Math.round(c.votes.length/maxV*100);
    var isLead=c===lead&&c.votes.length>0;
    var hasImg=!!c.image;
    var voted=c.votes.some(function(v){return v.toLowerCase()===voter});
    var sw=hasImg?'background-image:url('+ea(c.image)+');background-size:cover':'background:'+c.hex;
    var th=hasImg?'<div class="thumb-preview" style="background-image:url('+ea(c.image)+')" title="Click to enlarge"></div>':'';
    return '<div class="color-card'+(voted?' voted':'')+(isLead?' lead':'')+(!canVote?' disabled':'')+'" data-color="'+ea(c.name)+'" '+(canVote?'title="Tap to vote"':'')+'>'+
      (isLead?'<span class="lead-badge">#1</span>':'')+
      '<div class="swatch'+(hasImg?' has-img':'')+'" style="'+sw+'"></div>'+th+
      '<div class="color-info"><div class="color-name">'+e(c.name)+'</div><div class="color-meta">by '+e(c.suggestedBy)+(hasImg?' <span class="img-tag">ref img</span>':'')+'</div>'+
      '<div class="vote-bar-wrap"><div class="vote-bar" style="width:'+pct+'%"></div></div></div>'+
      '<div class="vote-count">'+c.votes.length+'</div></div>';
  }).join('');
  list.querySelectorAll('.thumb-preview').forEach(function(t){
    t.addEventListener('click',function(ev){ev.stopPropagation();
      var img=new Image();img.src=t.style.backgroundImage.slice(5,-2);
      img.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100dvh;object-fit:contain;z-index:9999;background:#000;cursor:pointer';
      img.addEventListener('click',function(){img.remove()});document.body.appendChild(img)
    })
  })
}

function msg(panel,text,isErr){
  var el=document.getElementById((panel==='poll'?'poll':'roster')+'-msg');
  el.textContent=text;el.className='msg'+(isErr?'':' ok');
  if(text)setTimeout(function(){if(el.textContent===text){el.textContent='';el.className='msg'}},4000)
}

async function pollAction(body){
  msg('poll','',0);
  try{
    var r=await fetch(API+'/poll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();
    if(!r.ok){msg('poll',d.error||'Error',1);return}
    pollData=d;renderPoll();msg('poll','Done!',0)
  }catch(e){msg('poll','Network error.',1)}
}

document.getElementById('color-list').addEventListener('click',function(ev){
  var card=ev.target.closest('.color-card');
  if(!card||card.classList.contains('disabled'))return;
  if(config.phase!=='voting'){msg('poll','Voting opens after submissions close.',1);return}
  var voter=document.getElementById('voter-name').value.trim();
  if(!voter){msg('poll','Enter your name first.',1);return}
  pollAction({action:'vote',color:card.dataset.color,voter:voter})
});

document.getElementById('add-color').addEventListener('click',function(){
  if(config.phase!=='submissions'){msg('poll','Submissions are closed.',1);return}
  var color=document.getElementById('new-color').value.trim();
  var hex=document.getElementById('new-hex').value;
  if(!color){msg('poll','Enter a color name.',1);return}
  var sg=document.getElementById('voter-name').value.trim()||'Anon';
  var body={action:'add',color:color,hex:hex,suggester:sg};
  if(selectedFileDataUrl)body.image=selectedFileDataUrl;
  pollAction(body);
  document.getElementById('new-color').value='';clearFile()
});

async function refreshPoll(){
  try{var r=await fetch(API+'/poll');pollData=await r.json();if(!pollData.colors)pollData.colors=[];renderPoll()}catch(e){}
}

function renderRoster(){
  var tb=document.getElementById('roster-tbody');
  if(!roster.length){tb.innerHTML='<tr><td colspan="3" style="text-align:center;color:#555;padding:16px">No players yet</td></tr>';return}
  tb.innerHTML=roster.map(function(p){return '<tr><td>'+e(p.name)+'</td><td class="num">'+e(p.number)+'</td><td><span class="size-badge">'+e(p.size||'')+'</span></td></tr>'}).join('')
}
async function refreshRoster(){
  try{var r=await fetch(API+'/roster');roster=await r.json();if(!Array.isArray(roster))roster=[];roster.sort(function(a,b){return a.name.localeCompare(b.name)});renderRoster()}catch(e){}
}
document.getElementById('roster-add').addEventListener('click',async function(){
  var form=document.querySelector('.roster-form');
  var n=form.querySelector('[name=name]').value.trim();
  var nu=form.querySelector('[name=number]').value.trim();
  var si=form.querySelector('[name=size]').value;
  if(!n||!nu){msg('roster','Name and number required.',1);return}
  try{
    var r=await fetch(API+'/roster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,number:nu,size:si})});
    var d=await r.json();
    if(!r.ok){msg('roster',d.error||'Error',1);return}
    roster=d;roster.sort(function(a,b){return a.name.localeCompare(b.name)});renderRoster();
    form.querySelector('[name=name]').value='';form.querySelector('[name=number]').value='';form.querySelector('[name=size]').value='';
    msg('roster','Saved!',0)
  }catch(e){msg('roster','Network error.',1)}
});

function e(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function ea(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderAll(){renderPoll();updatePhaseUI()}

async function tick(){await Promise.all([refreshConfig(),refreshPoll(),refreshRoster()])}
tick().then(function(){
  pollInterval=setInterval(function(){refreshPoll();refreshRoster()},5000);
  countdownInterval=setInterval(refreshConfig,1000)
});
</script>
</body>
</html>
