<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WellDoneBets | Well Done Streams</title>
  <link rel="stylesheet" href="css/main.css?v=3.5">
  <link rel="stylesheet" href="css/games.css?v=3.5">
  <style>
    /* Mobile-first topbar: never overflow, wrap cleanly */
    .topbar { flex-wrap: wrap; gap: 10px; padding: 12px 14px; }
    .brand { font-size: 1.15rem; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .balance-badge { white-space: nowrap; }
    .game-nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .nav-btn { min-width: 0; }
    @media (max-width: 720px) {
      .topbar { justify-content: center; text-align: center; }
      .brand { width: 100%; justify-content: center; font-size: 1.25rem; }
      .brand img { width: 30px !important; height: 30px !important; }
      .controls { width: 100%; justify-content: center; }
      .balance-badge { font-size: .95rem; padding: 7px 14px; }
      .pill { padding: 9px 14px; font-size: .82rem; }
      .casino-layout { padding: 14px 10px; gap: 14px; }
      .game-nav { grid-template-columns: repeat(2, 1fr); }
      .nav-btn { padding: 12px 6px; font-size: .9rem; }
      .table-felt { padding: 16px 10px; border-width: 8px; }
    }
  </style>
</head>
<body data-mode="dark" data-palette="gold">

  <div class="topbar">
    <div class="brand" style="display:inline-flex; align-items:center; gap:10px;"><img src="pokerchipnew.svg" alt="" style="width:34px; height:34px; border-radius:50%; object-fit:contain;" onerror="this.style.display='none';">WellDone<span>Bets</span></div>
    <div class="controls">
      <div class="balance-badge">
        <span id="global-balance">---</span> <span class="chip-icon">🪙</span>
      </div>
      <button class="pill" id="dailyClaimBtn">Claim Daily</button>
      <a href="/" class="pill secondary">Exit</a>
    </div>
  </div>
  <div class="casino-layout">
    <aside class="sidebar">
      <nav class="game-nav" id="gameNav">
        <button class="nav-btn active" data-game="slots">🎰 Slots</button>
        <button class="nav-btn" data-game="roulette">🎡 Roulette</button>
        <button class="nav-btn" data-game="blackjack">🃏 Blackjack</button>
        <button class="nav-btn" data-game="coinflip">🪙 Coin Flip</button>
        <button class="nav-btn" data-game="craps">🎲 Craps</button>
        <button class="nav-btn" data-game="baccarat">🃏 Baccarat</button>
        <button class="nav-btn" data-game="trivia">🧠 Trivia</button>
      </nav>
    </aside>
    <main class="main-content">
      <section id="game-stage">
        <div class="welcome-message">
          <h2>Loading engine...</h2>
        </div>
      </section>
    </main>
  </div>

  <!-- ORDER MATTERS: shared first (defines window.Games), games in the middle, ui last -->
  <script src="js/shared.js?v=3.5"></script>
  <script src="js/api.js?v=3.5"></script>
  <script src="js/games/slots.js?v=3.5"></script>
  <script src="js/games/roulette.js?v=3.5"></script>
  <script src="js/games/blackjack.js?v=3.5"></script>
  <script src="js/games/coinflip.js?v=3.5"></script>
  <script src="js/games/craps.js?v=3.5"></script>
  <script src="js/games/baccarat.js?v=3.5"></script>
  <script src="js/games/trivia.js?v=3.5"></script>
  <script src="js/ui.js?v=3.5"></script>
</body>
</html>
